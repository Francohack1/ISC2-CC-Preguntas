ción, lo que requiere precaución al estudiarlos.","porque_incorrectas":["NIST sí reconoce categorías más allá de lo técnico, el problema es la falta de mapeo directo.","NIST no desaconseja controles físicos, el punto es la diferencia terminológica.","El capítulo aborda los tres tipos (físicos, técnicos y administrativos), no solo los administrativos."],"refuerzo":"En ciberseguridad, diferentes organismos crean sus propios diccionarios. El NIST tiene uno, y el temario tiene otro. No intentes forzar que el término 'operacional' del NIST signifique exactamente lo mismo que 'administrativo' aquí; son convenciones distintas y cada una tiene su lógica interna.","concepto":"Estandarización de controles","seccion":"3 Understanding Security Controls","dom":"Security Principles","obj":"1.4","area":"Tipos de control","dificultad":"media","tipo":"analisis","cita_pdf":"While there is a direct correlation for the technical controls, there is no direct mapping between NIST's categories and those discussed in this chapter","pagina":47,"fig":47},{"id":"q0042","pregunta":"Al instalar un generador eléctrico para asegurar que los sistemas sigan funcionando ante cortes de energía, ¿estás aplicando un control?","opciones":["Correctivo.","Compensatorio.","Disuasorio.","Preventivo."],"correcta":1,"porque_correcta":"El generador se implementa para asegurar la continuidad operativa cuando el suministro eléctrico normal (control primario) falla, actuando así como una medida compensatoria.","porque_incorrectas":["Un control correctivo restauraría tras el apagón, pero el generador busca evitar la interrupción, por lo que es más preventivo/compensatorio.","Un control disuasorio busca alejar al atacante, lo cual no es el objetivo del generador.","Aunque previene la caída del sistema, la literatura técnica del capítulo lo clasifica específicamente como compensatorio en el contexto de redundancia operativa."],"refuerzo":"Pensá en el generador como un 'plan B'. Si el suministro eléctrico principal falla, el generador compensa esa ausencia para que el negocio no se detenga. Es una forma de cubrir la falla de una infraestructura crítica sin necesidad de reparar la red eléctrica en ese mismo instante.","concepto":"Controles compensatorios","seccion":"3 Understanding Security Controls","dom":"Security Principles","obj":"1.4","area":"Tipos de control","dificultad":"dificil","tipo":"aplicacion","cita_pdf":"Compensating | Power generator | Implement a jump server for","pagina":53},{"id":"q0043","pregunta":"Las políticas de contraseñas complejas funcionan como un control disuasorio porque:","opciones":["Impiden técnicamente que el sistema sea hackeado por fuerza bruta.","Hacen que el proceso de ataque sea más difícil y costoso para el atacante.","Son fáciles de implementar para los usuarios finales sin fricción.","Detectan automáticamente a los atacantes cuando intentan adivinar claves."],"correcta":1,"porque_correcta":"Al aumentar la complejidad requerida, el atacante debe invertir más tiempo y recursos computacionales para romper la contraseña, lo cual desmotiva el intento (disuasión).","porque_incorrectas":["Ninguna contraseña impide 'técnicamente' el hackeo al 100%, solo aumenta la dificultad, y su función principal no es solo técnica sino disuasoria.","Las políticas de contraseñas suelen ser muy resistidas por los usuarios, generando fricción.","El control que detecta intentos de adivinación sería un control de tipo 'detective', no la política de complejidad en sí."],"refuerzo":"La disuasión trata de convencer al atacante de que no vale la pena el esfuerzo. Si una contraseña es '123', el atacante tarda un segundo. Si requiere 20 caracteres con símbolos, tardaría años. Ese cambio en el esfuerzo hace que el atacante busque objetivos más fáciles.","concepto":"Controles disuasorios","seccion":"3 Understanding Security Controls","dom":"Security Principles","obj":"1.4","area":"Tipos de control","dificultad":"media","tipo":"analisis","cita_pdf":"Deterrent | Barbed wire fences | Honeypots | Complex password policies","pagina":53},{"id":"q0044","pregunta":"Un sistema de extinción de incendios en un centro de datos es un ejemplo de:","opciones":["Control técnico detectivo.","Control administrativo correctivo.","Control físico correctivo.","Control físico preventivo."],"correcta":2,"porque_correcta":"El sistema actúa en un entorno físico y su objetivo principal es corregir la situación de peligro (incendio) una vez que este ha sido detectado.","porque_incorrectas":["No es técnico, pues el sistema opera sobre el entorno físico del centro de datos.","No es administrativo, ya que no es una política o directriz.","No es preventivo, ya que el sistema no evita que el fuego se inicie, sino que actúa cuando ya existe."],"refuerzo":"Los sistemas de extinción son correctivos porque están ahí para eliminar una amenaza (el fuego) y detener el daño en curso. No impiden que el fuego comience (como lo haría una política de no fumar), sino que corrigen el entorno una vez que la amenaza se materializa.","concepto":"Controles físicos","seccion":"3 Understanding Security Controls","dom":"Security Principles","obj":"1.4","area":"Tipos de control","dificultad":"facil","tipo":"concepto","cita_pdf":"Corrective | Fire suppression systems | Automated system restores points | Disaster Recovery Plan","pagina":53},{"id":"q0045","pregunta":"Al momento de elegir entre diferentes controles de seguridad, ¿cuál debe ser el criterio principal de la organización?","opciones":["La elección debe basarse exclusivamente en la tecnología más moderna del mercado.","La selección debe priorizar las auditorías sobre los controles técnicos.","La decisión debe responder estratégicamente a los recursos y vulnerabilidades.","La elección debe seguir un estándar único para todos los tipos de industria."],"correcta":2,"porque_correcta":"El documento establece que la elección de controles no es arbitraria, sino que debe ser estratégica, considerando los activos, las vulnerabilidades específicas y los recursos disponibles.","porque_incorrectas":["La tecnología moderna no es sinónimo de efectividad ni de adecuación a las necesidades de la empresa.","Priorizar una herramienta (auditoría) sobre otra no es estratégico si no se analizan primero los riesgos.","Cada industria tiene perfiles de riesgo distintos, por lo que aplicar un estándar único sin adaptación es una práctica insegura."],"refuerzo":"No existe una 'solución mágica' para todos. Una empresa pequeña tiene necesidades distintas a un banco. Por eso, el diseño de seguridad consiste en mirar *tus* vulnerabilidades y *tus* recursos, y decidir dónde invertir estratégicamente, en lugar de comprar todo lo que brilla.","concepto":"Estrategia de seguridad","seccion":"3 Understanding Security Controls","dom":"Security Principles","obj":"1.4","area":"Tipos de control","dificultad":"media","tipo":"analisis","cita_pdf":"Security controls can be physical, technical, or administrative, and must be chosen strategically based on an organization's vulnerabilities and resources.","pagina":55},{"id":"q0046","pregunta":"Como profesional de ciberseguridad, tenés que diferenciar la naturaleza de los elementos de gobernanza en tu organización. Si necesitás documentar un conjunto de pasos obligatorios que un administrador debe seguir ante un incidente de phishing, ¿qué elemento estás redactando?","opciones":["Un estándar de seguridad","Una guía técnica","Un procedimiento interno","Una política estratégica"],"correcta":2,"porque_correcta":"Los procedimientos detallan los pasos específicos y obligatorios para ejecutar tareas operativas, como la respuesta ante incidentes.","porque_incorrectas":["Los estándares establecen medidas requeridas pero no detallan pasos operativos de respuesta.","Las guías son recomendaciones flexibles y no obligatorias.","Las políticas definen la estrategia global y expectativas, no la ejecución paso a paso."],"refuerzo":"Imaginate un manual de primeros auxilios. Las políticas dicen 'debemos mantener la salud', los estándares dicen 'el equipo debe estar esterilizado', pero el procedimiento es la lista de pasos exactos (lavarse las manos, abrir el kit, aplicar vendaje) para tratar una herida. En ciberseguridad, el procedimiento es esa 'receta' que evita que el personal improvise ante una crisis.","concepto":"Diferencia elementos gobernanza","seccion":"4 Understanding Governance Processes and Elements","dom":"Security Principles","obj":"1.3","area":"Gobernanza: leyes, marcos y políticas","dificultad":"media","tipo":"aplicacion","cita_pdf":"Procedures outline the specific steps needed to implement these policies in day-to-day operations.","pagina":65},{"id":"q0047","pregunta":"Tu empresa decide adoptar un marco de trabajo de ciberseguridad reconocido internacionalmente para mejorar su postura de seguridad, aunque no hay una ley que obligue a hacerlo. ¿En qué categoría de elementos de gobernanza encaja esta implementación?","opciones":["Regulación externa","Estándar interno","Procedimiento obligatorio","Guía de mejores prácticas"],"correcta":1,"porque_correcta":"Los estándares proporcionan marcos de trabajo (a menudo externos pero adoptados internamente) que no son obligatorios legalmente a menos que la ley lo exija.","porque_incorrectas":["Las regulaciones son impuestas por entes externos y suelen ser mandatorias.","Los procedimientos son pasos operativos internos de ejecución diaria.","Las guías son recomendaciones voluntarias sin el peso de un marco de referencia de seguridad."],"refuerzo":"Pensá en los estándares como en el 'ISO 9001' de la seguridad. No nacen de una ley que te obliga a instalarlos en tu empresa, sino de la decisión estratégica de seguir un 'molde' reconocido para que todos trabajen igual. A diferencia de una guía que te sugiere qué hacer, el estándar te dice cómo debe ser el resultado final que tenés que alcanzar.","concepto":"Naturaleza de estándares","seccion":"4 Understanding Governance Processes and Elements","dom":"Security Principles","obj":"1.3","area":"Gobernanza: leyes, marcos y políticas","dificultad":"media","tipo":"aplicacion","cita_pdf":"Standards establish required security measures, while guidelines provide best practices for compliance and risk management.","pagina":65},{"id":"q0048","pregunta":"¿Qué característica define fundamentalmente a las 'Guías' (Guidelines) dentro de un marco de gobernanza de seguridad?","opciones":["Son documentos que obligan a realizar auditorías","Representan mandatos legales de cumplimiento externo","Ofrecen recomendaciones flexibles para tareas específicas","Establecen las sanciones por el incumplimiento de normas"],"correcta":2,"porque_correcta":"Las guías son advisory (consultivas), no imponen penalizaciones y permiten adaptarse a las necesidades de la organización.","porque_incorrectas":["Las guías no son documentos de auditoría ni imponen requisitos de este tipo.","Los mandatos legales son regulaciones, no guías.","Las guías no definen sanciones, ya que no son obligatorias."],"refuerzo":"Las guías son como los consejos de un experto experimentado. Podés elegir seguirlos, ignorarlos o adaptarlos a tu situación particular sin temor a una sanción. Su valor radica en la flexibilidad: te ayudan a entender qué se hace comúnmente, permitiéndote decidir si eso le sirve a tu empresa o si necesitás algo distinto.","concepto":"Definición de guías","seccion":"4 Understanding Governance Processes and Elements","dom":"Security Principles","obj":"1.3","area":"Gobernanza: leyes, marcos y políticas","dificultad":"facil","tipo":"concepto","cita_pdf":"Guidelines are advisory documents that provide flexible recommendations on best practices for a specific task, technology, or concept. They are not enforceable and do not impose penalties for non-compliance","pagina":65},{"id":"q0049","pregunta":"Si analizás la estructura de gobernanza de una organización, ¿por qué es crítico distinguir entre elementos 'mandatorios' y 'no mandatorios'?","opciones":["Para clasificar si el documento es de alcance interno o externo","Para determinar las consecuencias legales o disciplinarias","Para organizar el almacenamiento de los archivos digitales","Para definir quién debe redactar cada tipo de documento"],"correcta":1,"porque_correcta":"La obligatoriedad (enforceability) es el factor clave que determina si el incumplimiento acarrea multas, sanciones o penalizaciones.","porque_incorrectas":["El alcance (interno/externo) es una clasificación separada de la obligatoriedad.","La ubicación de los archivos no guarda relación con la gobernanza de riesgos.","Quién redacta no determina la jerarquía o el impacto de la norma."],"refuerzo":"Imaginá una señal de tránsito. 'Prohibido estacionar' es un mandato: si lo ignorás, pagás una multa. Un cartel que dice 'se recomienda manejar con cuidado' no te multará si vas rápido, aunque sea imprudente. En gobernanza, distinguir esto te evita gastar recursos en 'cumplir' lo que no es obligatorio y, más importante, te evita sanciones graves al confundir un mandato con una sugerencia.","concepto":"Enforceability","seccion":"4 Understanding Governance Processes and Elements","dom":"Security Principles","obj":"1.3","area":"Gobernanza: leyes, marcos y políticas","dificultad":"media","tipo":"analisis","cita_pdf":"As a cybersecurity professional, it is important to understand the role of these elements and whether they are enforceable.","pagina":66},{"id":"q0050","pregunta":"Analizando la relación entre gobernanza y negocios, ¿cuál es el objetivo principal de integrar requisitos externos e internos en la gobernanza de ciberseguridad?","opciones":["Garantizar que solo los procesos técnicos cumplan las leyes","Asegurar que la seguridad esté alineada con los objetivos de negocio","Reducir el presupuesto asignado a la infraestructura de red","Eliminar la necesidad de auditorías externas periódicas"],"correcta":1,"porque_correcta":"El propósito es asegurar que la organización actúe coherentemente para cumplir sus objetivos estratégicos respetando las normas y gestionando riesgos.","porque_incorrectas":["La gobernanza no se limita a procesos técnicos, incluye estrategia y personas.","La gobernanza busca gestionar riesgos y proteger activos, no reducir presupuesto necesariamente.","La gobernanza suele aumentar la necesidad de auditorías para demostrar cumplimiento."],"refuerzo":"La gobernanza es el 'timón' del barco. Si el barco (tu empresa) quiere ir a un puerto (objetivo de negocio), el timón (la gobernanza) asegura que no te choques con rocas (riesgos) ni infrinjas las leyes del mar (regulaciones) en el camino. No sirve de nada que el motor sea potente si no tenés un timón que alinee todo ese esfuerzo hacia donde necesitás ir.","concepto":"Alineación gobernanza-negocio","seccion":"4 Understanding Governance Processes and Elements","dom":"Security Principles","obj":"1.3","area":"Gobernanza: leyes, marcos y políticas","dificultad":"media","tipo":"analisis","cita_pdf":"Governance must ensure that security practices are aligned with business goals and missions, comply with regulatory requirements, while effectively mitigating security risks.","pagina":58},{"id":"q0051","pregunta":"En una auditoría de gobernanza, te piden clasificar los documentos según su alcance. ¿Cuál es el alcance correcto de las 'Políticas' dentro de la organización?","opciones":["Tienen un alcance legal externo","Tienen un alcance interno","Tienen un alcance interorganizacional","Tienen un alcance gubernamental"],"correcta":1,"porque_correcta":"Las políticas de seguridad definen la estrategia y expectativas dentro de la organización, siendo por lo tanto elementos de gobernanza de alcance interno.","porque_incorrectas":["No son leyes ni regulaciones externas.","El alcance es interno, no se extiende a otras organizaciones.","No son dictadas por el gobierno."],"refuerzo":"Las políticas son las 'reglas de la casa'. Nadie de afuera te obliga a escribir tu política de contraseñas de una forma específica, pero vos decidís internamente qué se espera de tus empleados. Son documentos que definen la cultura y la postura de seguridad dentro de tus propias paredes.","concepto":"Alcance gobernanza","seccion":"4 Understanding Governance Processes and Elements","dom":"Security Principles","obj":"1.3","area":"Gobernanza: leyes, marcos y políticas","dificultad":"facil","tipo":"concepto","cita_pdf":"Policies | Mandatory | Internal"},{"id":"q0052","pregunta":"Si un empleado ignora una guía técnica de la empresa, pero esto no genera un impacto en la seguridad ni viola una política, ¿qué implicancia tiene según los elementos de gobernanza?","opciones":["El empleado debe ser sancionado legalmente","La empresa está en violación de un estándar externo","No hay una penalización por incumplimiento","Se debe actualizar el procedimiento de emergencia"],"correcta":2,"porque_correcta":"Las guías no son obligatorias (enforceable) y no imponen penalidades, por lo que su no cumplimiento no conlleva sanciones disciplinarias.","porque_incorrectas":["No hay base legal para sancionar por ignorar una guía.","Las guías no son estándares, que suelen ser medidas más rigurosas.","Actualizar un procedimiento es una acción de mejora, no una consecuencia del incumplimiento de la guía."],"refuerzo":"Si alguien ignora un 'consejo' (guía), no ha roto una regla de oro. La gobernanza distingue entre lo mandatorio y lo sugerido. Si la organización castigara a alguien por no seguir una guía, estaría convirtiendo implícitamente esa guía en un procedimiento, lo cual es un error de diseño de gobernanza.","concepto":"No obligatoriedad guías","seccion":"4 Understanding Governance Processes and Elements","dom":"Security Principles","obj":"1.3","area":"Gobernanza: leyes, marcos y políticas","dificultad":"media","tipo":"analisis","cita_pdf":"They are not enforceable and do not impose penalties for non-compliance, so organizations can adapt them based on their unique systems or conditions.","pagina":65},{"id":"q0053","pregunta":"Al diseñar una estructura de gobernanza, ¿por qué los 'procedimientos' se consideran mandatorios aunque sean de alcance interno?","opciones":["Porque están validados por entes reguladores externos","Porque garantizan la implementación de las políticas","Porque son la base de los estándares de la industria","Porque sirven como documentos de consulta flexible"],"correcta":1,"porque_correcta":"Los procedimientos son el mecanismo de implementación de las políticas; para que una política de seguridad funcione, los pasos operativos deben seguirse rigurosamente, por lo que son obligatorios.","porque_incorrectas":["No todos los procedimientos están validados externamente.","Los procedimientos no son la base de los estándares, son la ejecución operativa.","Los procedimientos no son flexibles; las guías sí."],"refuerzo":"Pensá en un procedimiento como en una instrucción de montaje de un mueble. Si te saltás un paso, el mueble se cae. En la empresa, la 'política' dice que debemos cifrar los datos; el 'procedimiento' te dice qué botones tocar para hacerlo. Si no fuera obligatorio, la política sería un deseo vacío, no una realidad operativa.","concepto":"Mandato en procedimientos","seccion":"4 Understanding Governance Processes and Elements","dom":"Security Principles","obj":"1.3","area":"Gobernanza: leyes, marcos y políticas","dificultad":"dificil","tipo":"analisis","cita_pdf":"Within an organization, policies and procedures can also be enforced and penalties can be applied for non-compliance.","pagina":59,"fig":59},{"id":"q0054","pregunta":"De acuerdo con el modelo de gobernanza, ¿en qué circunstancia un 'estándar' (que normalmente no es mandatorio) pasa a ser de cumplimiento obligatorio?","opciones":["Cuando la gerencia decide que es una buena práctica","Cuando el estándar es adoptado por una ley","Cuando se convierte en un procedimiento operativo","Cuando es publicado en el sitio web de la organización"],"correcta":1,"porque_correcta":"Los estándares son voluntarios por naturaleza, salvo que sean incorporados dentro del marco legal o regulatorio de una jurisdicción.","porque_incorrectas":["La decisión gerencial no hace mandatorio el estándar legalmente.","Convertir un estándar en procedimiento es una decisión interna, no una adopción por ley.","La visibilidad pública no tiene injerencia en la obligatoriedad legal."],"refuerzo":"Imaginate que existe un estándar de seguridad de datos. Es un consejo técnico genial hasta que el gobierno dicta una ley que dice 'todas las empresas deben seguir el estándar X'. En ese momento, lo que era un consejo técnico se convierte en una obligación legal ineludible.","concepto":"Estatus legal estándares","seccion":"4 Understanding Governance Processes and Elements","dom":"Security Principles","obj":"1.3","area":"Gobernanza: leyes, marcos y políticas","dificultad":"dificil","tipo":"aplicacion","cita_pdf":"Standards | Not mandatory (unless adopted by law)","pagina":60},{"id":"q0055","pregunta":"¿Qué aspecto de la gobernanza garantiza la protección de la información sensible ante las exigencias de entes externos?","opciones":["El cumplimiento de las regulaciones y leyes","La implementación de guías voluntarias","La redacción de documentos de ética corporativa","La adopción de estándares de comunicación interna"],"correcta":0,"porque_correcta":"Las regulaciones y leyes son las herramientas externas que mandan proteger la información sensible, imponiendo obligaciones a las organizaciones.","porque_incorrectas":["Las guías no garantizan protección ante exigencias externas.","El código de ética trata obligaciones morales, no es la principal herramienta contra exigencias externas de cumplimiento.","Los estándares internos no garantizan el cumplimiento de normativas externas por sí mismos."],"refuerzo":"Las regulaciones (como HIPAA o GDPR) son el escudo y la espada de los entes externos. No son opcionales y están diseñadas específicamente para asegurarse de que, independientemente de lo que la empresa quiera, proteja la información sensible porque la ley se lo exige.","concepto":"Protección datos externos","seccion":"4 Understanding Governance Processes and Elements","dom":"Security Principles","obj":"1.3","area":"Gobernanza: leyes, marcos y políticas","dificultad":"media","tipo":"analisis","cita_pdf":"Regulations and laws mandate the protection of sensitive information.","pagina":66},{"id":"q0056","pregunta":"¿Qué papel desempeña el 'Código de Ética' en el marco de gobernanza descrito en el documento?","opciones":["Detalla los pasos para configurar los servidores","Establece las expectativas y obligaciones éticas de los empleados","Define los estándares de seguridad de red internacionales","Proporciona una guía flexible sobre mejores prácticas de software"],"correcta":1,"porque_correcta":"El código de ética es un documento formal que clarifica las obligaciones éticas que deben seguir todos los empleados dentro de la organización.","porque_incorrectas":["No es un documento técnico para configurar hardware.","No son estándares de red, son normas de comportamiento.","No son guías de software, se enfocan en la integridad y el comportamiento."],"refuerzo":"El código de ética es el 'acuerdo moral'. Mientras que el procedimiento te dice cómo bloquear un puerto, el código de ética te dice por qué no deberías usar tus privilegios para husmear en datos de compañeros. Es el marco que guía el comportamiento cuando no hay una regla técnica específica que seguir.","concepto":"Código ética","seccion":"4 Understanding Governance Processes and Elements","dom":"Security Principles","obj":"1.3","area":"Gobernanza: leyes, marcos y políticas","dificultad":"facil","tipo":"concepto","cita_pdf":"An important element also shown in the diagram is the corporate code of ethics, which is a formal document that sets out the ethical obligations and expectations for all employees within the organization.","pagina":59,"fig":59},{"id":"q0057","pregunta":"Si un experto en ciberseguridad debe alinear la seguridad con los objetivos de negocio y además cumplir con las leyes de privacidad vigentes, ¿qué proceso está llevando a cabo?","opciones":["Gobernanza de la seguridad","Administración de la red local","Programación de parches críticos","Configuración de firewalls perimetrales"],"correcta":0,"porque_correcta":"La gobernanza es el marco estructurado para gestionar operaciones y estrategia asegurando que se cumplan las metas y las leyes.","porque_incorrectas":["La administración de red es técnica y operativa, no estratégica.","La programación de parches es una tarea técnica específica.","La configuración de firewalls es una implementación técnica puntual."],"refuerzo":"La gobernanza es la gran orquestadora. No se ocupa de instalar un firewall (eso es operativo), se ocupa de que exista una política que diga 'necesitamos un firewall' y que esa política respete la ley. Es mirar el panorama completo del negocio, no solo la pantalla del monitor.","concepto":"Gobernanza de seguridad","seccion":"4 Understanding Governance Processes and Elements","dom":"Security Principles","obj":"1.3","area":"Gobernanza: leyes, marcos y políticas","dificultad":"dificil","tipo":"aplicacion","cita_pdf":"Governance is a structured framework through which an organization manages its operations and strategic planning. This framework includes compliance with laws, regulations, standards, policies, procedures, and guidelines to ensure that the organization's objectives are effectively met.","pagina":58},{"id":"q0058","pregunta":"Al analizar la diferencia entre elementos, ¿por qué es importante el concepto de 'scope' (alcance) en la tabla de gobernanza?","opciones":["Para saber si se aplica dentro de la empresa o fuera de ella","Para definir la cantidad de empleados que deben leer el documento","Para calcular el costo de implementación de cada elemento","Para determinar cuántas horas de capacitación requiere"],"correcta":0,"porque_correcta":"El alcance determina el dominio de aplicación: si el elemento es algo externo impuesto (leyes) o algo interno de la organización (políticas).","porque_incorrectas":["La cantidad de empleados no depende del alcance legal, sino de la estructura interna.","El costo no es la finalidad de la clasificación por alcance.","Las horas de capacitación son independientes de la categorización legal o estratégica del documento."],"refuerzo":"El alcance es la frontera. Las leyes tienen alcance externo (te llegan desde afuera), mientras que tus políticas tienen alcance interno (tú las generas para tu propio equipo). Confundir el alcance sería como creer que las leyes de tránsito del país vecino aplican en tu casa, o que las reglas de tu casa obligan al vecino.","concepto":"Alcance gobernanza","seccion":"4 Understanding Governance Processes and Elements","dom":"Security Principles","obj":"1.3","area":"Gobernanza: leyes, marcos y políticas","dificultad":"media","tipo":"analisis","cita_pdf":"The table below summarizes the key differences between governance elements based on their enforceability and scope","pagina":59,"fig":59},{"id":"q0059","pregunta":"Como profesional certificado por ISC2, te enterás de que un colega está reportando sistemáticamente datos falsos a los clientes para ocultar brechas de seguridad menores. Según el Canon IV, ¿qué acción debés tomar?","opciones":["Ignorar la situación para mantener la armonía laboral en el equipo de seguridad.","Documentar la evidencia y reportar el comportamiento poco ético a la organización.","Aconsejar al colega en privado para que corrija los informes en el futuro.","Limitarte a asegurar que tus propios informes sean precisos y profesionales."],"correcta":1,"porque_correcta":"El Canon IV exige explícitamente a los miembros reportar comportamientos poco éticos y posibles violaciones del código por parte de otros miembros para proteger la integridad de la profesión.","porque_incorrectas":["El silencio ante una falta ética contraviene el deber de proteger la reputación y estándares de la profesión.","Aunque el consejo privado es amable, no cumple con la obligación de reportar las violaciones al código.","La responsabilidad ética profesional va más allá del autocontrol; requiere una participación activa en la vigilancia de la ética grupal."],"refuerzo":"El Canon IV no es solo una guía pasiva, sino un compromiso activo. Imaginate que sos parte de un cuerpo médico: si ves a un colega cometiendo mala praxis, tu silencio te hace cómplice. En ciberseguridad, reportar no es 'delatar', es asegurar que la confianza pública en nuestra profesión no se vea erosionada por individuos que no cumplen los estándares.","concepto":"Responsabilidad del Canon IV","seccion":"5 ISC2 Code of Ethics","dom":"Security Principles","obj":"1.5","area":"Ética profesional","dificultad":"media","tipo":"aplicacion","cita_pdf":"Members shall take responsibility for advancing and protecting the cybersecurity profession. This is done by seeking continuing education and improvement, contributing to the community and advancing the body of knowledge, and reporting unethical behavior and possible violations of the Code of Ethics by other members.","pagina":72,"fig":72},{"id":"q0060","pregunta":"El Preamble del Código de Ética de ISC2 establece que la adhesión al código es una condición para la certificación. ¿Qué implica esto para el profesional en su práctica diaria?","opciones":["Que debe priorizar las demandas del cliente sobre cualquier otra consideración ética.","Que el comportamiento ético debe ser visible y mantenido incluso sin supervisión.","Que la certificación es un proceso académico que termina al obtener el título.","Que puede adaptar el cumplimiento del código según las leyes locales del país."],"correcta":1,"porque_correcta":"El preámbulo enfatiza que la seguridad y el bienestar de la sociedad requieren que el profesional se adhiera, y sea visto adhiriéndose, a los estándares éticos, independientemente de la vigilancia.","porque_incorrectas":["El código es superior a las demandas del cliente si estas contravienen el bien común o la ley.","La certificación es un compromiso continuo, no un hecho aislado al aprobar el examen.","El código establece un estándar global que no se negocia ni se adapta según conveniencias legales locales inferiores."],"refuerzo":"La ética es lo que hacés cuando nadie mira. Si sos un profesional de ISC2, el código no es un papel que firmaste una vez; es tu brújula constante. Por ejemplo, aunque un cliente te pida 'saltarte' un paso de seguridad para ahorrar tiempo, tu compromiso con el código te obliga a mantener el estándar, porque tu certificación depende de tu conducta íntegra.","concepto":"Naturaleza de la certificación","seccion":"5 ISC2 Code of Ethics","dom":"Security Principles","obj":"1.5","area":"Ética profesional","dificultad":"facil","tipo":"concepto","cita_pdf":"\"The security and welfare of society, the common good, and our duty to our clients and each other require that we adhere to, and be seen to adhere to, the highest ethical standards of behavior.\" And further that: \"Strict adherence to this Code is a condition of certification.\"","pagina":71},{"id":"q0061","pregunta":"Un profesional de ciberseguridad es presionado por un gerente para lanzar un producto con vulnerabilidades conocidas para ganar mercado. ¿Qué Canon debería guiar principalmente su rechazo?","opciones":["Canon I: Proteger a la sociedad y el bien común.","Canon II: Actuar de manera honorable, honesta y legal.","Canon III: Proporcionar un servicio diligente y competente.","Canon IV: Avanzar y proteger la profesión."],"correcta":0,"porque_correcta":"El Canon I pone por encima de todo la protección de la sociedad, la infraestructura y el bien común, lo que implica evitar el despliegue de tecnología que comprometa la confianza pública.","porque_incorrectas":["Aunque actuar honestamente (Canon II) es relevante, la prioridad inmediata del daño social recae en el primer canon.","El Canon III se refiere a la competencia técnica hacia el cliente, pero el riesgo social es de orden superior.","El Canon IV se enfoca en la reputación del gremio, no directamente en el daño al usuario final."],"refuerzo":"Imaginate que sos ingeniero civil y te piden construir un puente que sabés que va a colapsar, solo para inaugurarlo rápido. Tu deber ético principal es con la gente que usará el puente, no con el inversor. En ciberseguridad, el Canon I es tu escudo: si algo daña la seguridad pública, tu obligación es proteger a la comunidad primero.","concepto":"Prioridad de los cánones","seccion":"5 ISC2 Code of Ethics","dom":"Security Principles","obj":"1.5","area":"Ética profesional","dificultad":"media","tipo":"aplicacion","cita_pdf":"Protect society, the common good, necessary public trust and confidence, and the infrastructure","pagina":72,"fig":72},{"id":"q0062","pregunta":"¿Qué aspecto determina principalmente si el uso de un perfil falso en redes sociales es una violación del Código de Ética de ISC2?","opciones":["El hecho de que el profesional oculte su identidad real en internet.","La cantidad de tiempo invertido en gestionar cuentas alternativas.","La intención y las consecuencias negativas del uso de la cuenta.","La plataforma específica donde se encuentra alojada la cuenta falsa."],"correcta":2,"porque_correcta":"El documento especifica que la falta ética surge cuando la intención es maliciosa, como engañar a clientes o realizar actividades dañinas, no por el simple hecho de ser anónimo.","porque_incorrectas":["El anonimato por sí solo no es una violación ética bajo los estándares del ISC2.","El esfuerzo dedicado a una actividad no es el criterio ético, sino el impacto y el propósito.","El código no discrimina por plataformas, sino por el comportamiento y el impacto en la integridad profesional."],"refuerzo":"El juicio ético en el ISC2 se basa en el impacto. Si tenés una cuenta falsa para ver contenido sin ser rastreado, es un tema personal. Si la usás para suplantar a un ejecutivo y engañar a un cliente, pasaste de la privacidad al daño directo. La ética evalúa tu propósito y el daño que causás a otros.","concepto":"Evaluación de intención ética","seccion":"5 ISC2 Code of Ethics","dom":"Security Principles","obj":"1.5","area":"Ética profesional","dificultad":"media","tipo":"analisis","cita_pdf":"The ethical line shifts when such accounts are used for malicious purposes, such as misleading customers, impersonating individuals, or conducting harmful activities such as phishing schemes. In these cases, the behavior becomes clearly unethical according to the ISC2 Code of Ethics.","pagina":73},{"id":"q0063","pregunta":"Como profesional, te piden asesorar sobre una compra de software. El proveedor te ofrece un 'regalo' personal a cambio de que recomiendes su producto. ¿Bajo qué principio deberías rechazar este beneficio?","opciones":["Debés evitar conflictos de interés para mantener la integridad (Canon II).","Debés priorizar el avance de la profesión sobre cualquier beneficio personal (Canon IV).","Debés ser diligente con el presupuesto del cliente (Canon III).","Debés proteger la infraestructura de ataques externos (Canon I)."],"correcta":0,"porque_correcta":"El Canon II exige actuar de forma honorable, justa y legal, lo que prohíbe aceptar favores especiales o beneficios personales que comprometan la objetividad del asesoramiento.","porque_incorrectas":["El Canon IV se refiere a la protección del gremio, no es la base principal para rechazar un soborno o beneficio personal.","Aunque ser diligente (Canon III) es importante, la cuestión central es la deshonestidad y la falta de integridad personal.","El Canon I es sobre el impacto social amplio, mientras que el soborno es un fallo directo en la integridad del profesional."],"refuerzo":"Un profesional ético debe ser como un juez: imparcial. Si aceptás un regalo, tu recomendación ya no se basa en cuál producto es mejor para tu cliente, sino en qué proveedor te 'premió'. Romper esa imparcialidad es una falta grave a la conducta honorable que espera ISC2.","concepto":"Integridad y conflicto interés","seccion":"5 ISC2 Code of Ethics","dom":"Security Principles","obj":"1.5","area":"Ética profesional","dificultad":"media","tipo":"aplicacion","cita_pdf":"Members shall not grant special favors in exchange for any kind of benefit. They shall consider the consequences of their advice and always act in accordance with the law.","pagina":72,"fig":72},{"id":"q0064","pregunta":"Según el Canon III, ¿qué significa realmente proporcionar un 'servicio diligente y competente' a los clientes?","opciones":["Garantizar que el cliente siempre obtenga el software más barato disponible.","Realizar el trabajo con alta destreza, profesionalismo y asesoramiento relevante.","Priorizar la satisfacción total del cliente por encima de los estándares de seguridad.","Implementar únicamente las soluciones que el cliente comprende y acepta plenamente."],"correcta":1,"porque_correcta":"La diligencia y competencia implican el uso de altos niveles de habilidad y la entrega de consejos precisos y económicos, respetando la relación contractual.","porque_incorrectas":["La economía es un factor, pero el Canon prioriza la competencia técnica y el profesionalismo por encima del costo mínimo.","El profesional debe mantener estándares éticos incluso si el cliente no los entiende; no se trata de complacer a toda costa.","Aunque la comunicación es clave, el profesional debe actuar con pericia técnica, no solo ajustarse a la voluntad del cliente."],"refuerzo":"Imaginá un médico: un servicio competente no es darle al paciente lo que pide (ej. antibióticos para un virus), sino lo que técnicamente necesita para sanar con profesionalismo. De igual forma, en seguridad, tu diligencia significa dar la solución técnica correcta y honesta, no la que el cliente cree querer.","concepto":"Diligencia y competencia profesional","seccion":"5 ISC2 Code of Ethics","dom":"Security Principles","obj":"1.5","area":"Ética profesional","dificultad":"facil","tipo":"concepto","cita_pdf":"Members shall ensure that their work is performed with a high degree of skill and professionalism. In so doing, they shall honor those who have engaged their services by providing accurate and relevant advice and by seeking economical means of performing the same tasks.","pagina":72,"fig":72},{"id":"q0065","pregunta":"¿Qué acción es fundamental para un miembro de ISC2 que desea contribuir al avance y protección de la profesión según el Canon IV?","opciones":["Participar exclusivamente en proyectos de consultoría de alto nivel.","Buscar educación continua y contribuir a la comunidad profesional.","Promocionar los servicios de ISC2 en redes sociales para atraer nuevos miembros.","Evitar la difusión de conocimientos técnicos para proteger la ventaja competitiva."],"correcta":1,"porque_correcta":"El Canon IV establece que el avance de la profesión se logra mediante la mejora continua, el aprendizaje permanente y la contribución al conocimiento colectivo.","porque_incorrectas":["El prestigio del proyecto es irrelevante; lo que importa es la contribución activa al conocimiento y la ética.","La promoción comercial no sustituye la responsabilidad ética de aportar al cuerpo de conocimiento.","Ocultar conocimiento va en contra de 'avanzar la profesión', que depende de compartir hallazgos y lecciones aprendidas."],"refuerzo":"La ciberseguridad avanza tan rápido que un profesional que no estudia o no enseña a otros se vuelve obsoleto. Avanzar la profesión significa que hoy sabés más que ayer, y que lo que aprendiste lo compartís (a través de mentorías, blogs o conferencias) para que el nivel de todo el grupo suba.","concepto":"Contribución a la profesión","seccion":"5 ISC2 Code of Ethics","dom":"Security Principles","obj":"1.5","area":"Ética profesional","dificultad":"facil","tipo":"aplicacion","cita_pdf":"Members shall take responsibility for advancing and protecting the cybersecurity profession. This is done by seeking continuing education and improvement, contributing to the community and advancing the body of knowledge","pagina":72,"fig":72},{"id":"q0066","pregunta":"Un jefe de seguridad prioriza la 'reputación de la empresa' sobre la notificación de una brecha que afecta los datos de los usuarios. ¿Qué canon está vulnerando primordialmente?","opciones":["Canon IV, al fallar en reportar comportamiento poco ético dentro de la organización.","Canon III, al no ser competente en la gestión del incidente de seguridad.","Canon I, al sacrificar el bien común y la confianza pública por intereses corporativos.","Canon II, al no ser legal ni honorable en su gestión de crisis."],"correcta":2,"porque_correcta":"El Canon I es claro: la seguridad y el bienestar de la sociedad y la confianza pública son la máxima prioridad, incluso por encima de los intereses de la empresa.","porque_incorrectas":["Aunque es un comportamiento poco ético, la falla raíz es la priorización incorrecta sobre el bien público (Canon I).","La competencia técnica no es la cuestión aquí; es una decisión de valores éticos ante la crisis.","La deshonestidad es una consecuencia, pero el Canon I es el marco que establece que la confianza pública es el bien superior a proteger."],"refuerzo":"La confianza pública es el capital más valioso de nuestra profesión. Si la gente pierde la fe en los sistemas, la sociedad entera se vuelve insegura. Cuando ponés el nombre de tu empresa por encima de los datos de los usuarios, estás traicionando el pacto social que el Canon I te exige proteger.","concepto":"Prioridad de la confianza pública","seccion":"5 ISC2 Code of Ethics","dom":"Security Principles","obj":"1.5","area":"Ética profesional","dificultad":"dificil","tipo":"analisis","cita_pdf":"The security and welfare of society, the common good, and our duty to our clients and each other require that we adhere to, and be seen to adhere to, the highest ethical standards of behavior.","pagina":71},{"id":"q0067","pregunta":"Si un profesional de ciberseguridad es testigo de una práctica ineficiente pero legal dentro de su empresa que aumenta innecesariamente los costos del cliente, ¿qué debería hacer bajo el Canon III?","opciones":["Nada, ya que si la práctica es legal, no constituye una violación al código.","Buscar maneras más económicas y eficientes de realizar las tareas para el cliente.","Reportar a la empresa ante las autoridades regulatorias por ineficiencia.","Ignorar la situación para no dañar la relación con sus empleadores."],"correcta":1,"porque_correcta":"El Canon III obliga a los miembros a honrar a quienes han contratado sus servicios proporcionando asesoramiento relevante y buscando medios económicos para realizar las tareas.","porque_incorrectas":["El código exige proactividad; la legalidad no es la única vara para medir el profesionalismo y la ética de servicio.","El reporte ante autoridades es una medida extrema y suele aplicarse a faltas éticas graves o ilegales, no a la ineficiencia.","La relación con el empleador es importante, pero el compromiso de servicio diligente con el cliente debe prevalecer conforme al Canon III."],"refuerzo":"La eficiencia no es solo un tema de negocios; es una forma de honestidad. Si sabés que hay un camino más barato y seguro para el cliente, tu deber ético bajo el Canon III es proponerlo. No te limites a hacer lo que te dicen; tu valor como profesional es aportar tu pericia para optimizar el servicio.","concepto":"Diligencia y servicio eficiente","seccion":"5 ISC2 Code of Ethics","dom":"Security Principles","obj":"1.5","area":"Ética profesional","dificultad":"media","tipo":"aplicacion","cita_pdf":"Members shall honor those who have engaged their services by providing accurate and relevant advice and by seeking economical means of performing the same tasks.","pagina":72,"fig":72},{"id":"q0068","pregunta":"Al analizar un dilema ético, ¿cómo ayuda la estructura de 'cánones' del ISC2 al profesional según la sección 5.2?","opciones":["Estableciendo reglas rígidas que eliminan la necesidad de juicio personal.","Proveyendo una jerarquía de valores para navegar situaciones complejas.","Listando sanciones específicas para cada posible falta profesional.","Definiendo los límites legales exactos de la práctica de ciberseguridad."],"correcta":1,"porque_correcta":"Los códigos de conducta, organizados en cánones, actúan como una guía que ayuda a los profesionales a navegar situaciones complejas proporcionando una jerarquía de prioridades.","porque_incorrectas":["El código es una guía de conducta, no un manual de procedimientos rígidos; el juicio profesional es siempre necesario.","Las sanciones están implícitas en la condición de certificación, pero el código en sí no es un manual de penas.","La ley es externa al código; el código establece estándares profesionales, no fronteras legales técnicas."],"refuerzo":"No existe un manual de instrucciones para cada dilema posible. Los cánones funcionan como los puntos cardinales en un mapa: no te dicen cada paso del camino, pero te aseguran de que no te desvíes del norte. Cuando tengas dudas, usá la jerarquía de los cánones para decidir qué prioridad tiene más peso.","concepto":"Propósito de los cánones","seccion":"5 ISC2 Code of Ethics","dom":"Security Principles","obj":"1.5","area":"Ética profesional","dificultad":"facil","tipo":"concepto","cita_pdf":"Are often organized into canons or priorities to help professionals navigate complex situations by providing a hierarchy of values.","pagina":70},{"id":"q0069","pregunta":"Un profesional certificado descubre una vulnerabilidad crítica pero su empresa se niega a corregirla por razones presupuestarias. ¿Cuál es el paso ético más coherente con los cánones?","opciones":["Aceptar la decisión gerencial ya que, como empleado, debe lealtad a la empresa.","Documentar los riesgos, informar a la dirección sobre las posibles consecuencias y buscar soluciones alternativas.","Publicar la vulnerabilidad en internet para forzar a la empresa a corregirla por presión pública.","Renunciar inmediatamente sin informar a los superiores sobre los riesgos técnicos."],"correcta":1,"porque_correcta":"El profesional debe ser diligente (Canon III) y actuar honestamente, comunicando los riesgos para proteger la seguridad y el bien común (Canon I), evitando decisiones impulsivas.","porque_incorrectas":["La lealtad al empleador no puede invalidar la responsabilidad ética de comunicar riesgos críticos para la seguridad.","La divulgación pública de vulnerabilidades sin cauces legales o éticos previos es imprudente y poco profesional.","La renuncia sin comunicación no cumple con el deber de asesoramiento profesional y diligencia exigido por el código."],"refuerzo":"Tu rol es ser el asesor de riesgos. Si la empresa no hace caso, tu deber ético no es callarte ni tampoco actuar de forma destructiva (como hackearlos), sino documentar formalmente el riesgo. Eso te protege profesionalmente y cumple con tu deber de dar asesoría precisa y honesta sobre el impacto real de no corregir el problema.","concepto":"Gestión de dilemas éticos","seccion":"5 ISC2 Code of Ethics","dom":"Security Principles","obj":"1.5","area":"Ética profesional","dificultad":"dificil","tipo":"analisis","cita_pdf":"Members shall ensure that their work is performed with a high degree of skill and professionalism. In so doing, they shall honor those who have engaged their services by providing accurate and relevant advice","pagina":72,"fig":72},{"id":"q0070","pregunta":"El Canon II exige actuar 'honorablemente, honestamente, justamente, responsablemente y legalmente'. ¿Qué comportamiento constituiría una violación clara de este principio?","opciones":["Trabajar horas extras sin remuneración extra para cumplir con un proyecto difícil.","Ocultar activamente un error propio que no tuvo impacto significativo en la seguridad.","Solicitar una aclaración legal antes de implementar una política de seguridad en otro país.","Cuestionar la eficacia de un control de seguridad propuesto por un colega senior."],"correcta":1,"porque_correcta":"La honestidad exige transparencia, especialmente en la admisión de errores; ocultarlos activamente rompe el principio de honestidad y responsabilidad del profesional.","porque_incorrectas":["Trabajar más horas es una decisión laboral personal, no un tema que afecte la conducta ética del código.","Consultar la legalidad antes de actuar es una muestra de profesionalismo y cumplimiento legal, no una falta.","El cuestionamiento técnico respetuoso es parte fundamental de la competencia profesional y del avance del conocimiento."],"refuerzo":"La honestidad profesional no es solo decir la verdad cuando te preguntan, es ser proactivo en admitir cuándo las cosas no salieron bien. Si ocultás un error, estás impidiendo que se tomen medidas de mitigación necesarias. En ciberseguridad, un error oculto puede convertirse en la puerta de entrada de un atacante.","concepto":"Integridad y honestidad","seccion":"5 ISC2 Code of Ethics","dom":"Security Principles","obj":"1.5","area":"Ética profesional","dificultad":"media","tipo":"aplicacion","cita_pdf":"Act honorably, honestly, justly, responsibly, and legally","pagina":72,"fig":72},{"id":"q0071","pregunta":"¿Por qué el Código de Ética de ISC2 comienza con un preámbulo antes de detallar los cánones?","opciones":["Para definir la misión de alto nivel de los profesionales de la ciberseguridad.","Porque es un requisito legal de las certificaciones internacionales de TI.","Para facilitar la memorización de los cuatro cánones principales.","Para separar las responsabilidades técnicas de las obligaciones sociales."],"correcta":0,"porque_correcta":"El preámbulo funciona como la declaración de misión que enmarca el propósito supremo de los profesionales antes de introducir los cuatro cánones de conducta.","porque_incorrectas":["La estructura no responde a una normativa técnica internacional, sino a la metodología pedagógica y ética de ISC2.","La memorización es una estrategia de estudio, no la razón de ser de la estructura del documento.","El código integra lo técnico y lo social, no busca separarlos; al contrario, los vincula bajo un mismo estándar ético."],"refuerzo":"El preámbulo es tu 'norte'. Antes de entender qué debés hacer (los cánones), necesitás entender por qué lo hacés. La misión de un profesional de ciberseguridad no es solo configurar firewalls, sino salvaguardar la confianza pública. El preámbulo te recuerda que tu trabajo técnico tiene un impacto humano y social profundo.","concepto":"Misión y propósito ético","seccion":"5 ISC2 Code of Ethics","dom":"Security Principles","obj":"1.5","area":"Ética profesional","dificultad":"facil","tipo":"concepto","cita_pdf":"ethics starts with a preamble that defines the high-level mission statement for cybersecurity professionals and then the four cannons for ethical of conduct for professionals.","pagina":71},{"id":"q0072","pregunta":"Tenés un incidente de seguridad en curso y necesitás determinar si el evento debe clasificarse como un incidente de seguridad o solo como un evento operativo. Según el ciclo de vida, ¿qué fase estás ejecutando?","opciones":["Fase de Preparación","Fase de Detección y Análisis","Fase de Contención y Erradicación","Fase de Actividad Post-Incidente"],"correcta":1,"porque_correcta":"La identificación, investigación y clasificación de los incidentes son tareas fundamentales de la fase de detección y análisis.","porque_incorrectas":["La preparación se enfoca en planes y entrenamiento previo, no en evaluar un evento en curso.","La contención ocurre después de que el incidente ya fue identificado y clasificado.","La fase post-incidente se centra en aprender de los eventos ya resueltos."],"refuerzo":"Imaginá que suena una alarma de incendio. Antes de intentar apagar el fuego, tenés que confirmar si es un incendio real o una falsa alarma causada por vapor de agua. Ese proceso de verificar, investigar y clasificar es exactamente lo que hace la fase de Detección y Análisis en ciberseguridad.","concepto":"Fases ciclo incidente","seccion":"6 Incident Response","dom":"Security Operations and Incident Response","obj":"5.3","area":"Respuesta a incidentes","dificultad":"facil","tipo":"aplicacion","cita_pdf":"Detection & Analysis: Identify, investigate, and classify security incidents.","pagina":90},{"id":"q0073","pregunta":"Tu equipo está analizando logs para identificar accesos no autorizados. ¿Qué clase de herramienta es la más adecuada para automatizar esta tarea específica según el documento?","opciones":["Sistemas de detección de intrusos (IDPS)","Escaneo de logs automatizado","Herramientas de anti-malware","Protocolos de comunicación externa"],"correcta":1,"porque_correcta":"El documento especifica que el escaneo de logs automatizado se utiliza precisamente para detectar eventos predefinidos, como la elevación de privilegios.","porque_incorrectas":["Los IDPS monitorean el tráfico de red, no los logs de acceso al sistema.","El anti-malware busca amenazas en archivos o sistemas, no analiza logs de auditoría.","Los protocolos de comunicación son para el plan de comunicación, no para el análisis técnico."],"refuerzo":"Pensá en los logs como un libro de visitas de un edificio. Revisar manualmente cada entrada es imposible. Un escaneo de logs automatizado es como tener un bibliotecario robótico que busca automáticamente nombres sospechosos en el registro, ahorrándote horas de lectura manual.","concepto":"Herramientas detección","seccion":"6 Incident Response","dom":"Security Operations and Incident Response","obj":"5.3","area":"Respuesta a incidentes","dificultad":"media","tipo":"aplicacion","cita_pdf":"Automated Log Scanning scans access logs for predefined events, such as unauthorized elevation of privileges, and generates alerts.","pagina":83},{"id":"q0074","pregunta":"Un incidente complejo requiere conocimientos avanzados que el equipo de primera línea no posee. ¿Por qué el SOC utiliza una estructura jerárquica?","opciones":["Para reducir el costo operativo de los analistas junior","Para cumplir con los estándares legales de evidencia","Para optimizar la respuesta según la complejidad","Para separar las tareas de preparación de la respuesta"],"correcta":2,"porque_correcta":"La estructura de niveles permite que los incidentes más frecuentes y sencillos se resuelvan rápido, mientras que los complejos llegan a manos de expertos.","porque_incorrectas":["Aunque puede ser más barato, el objetivo principal del SOC es la eficiencia en la gestión del incidente, no solo el ahorro.","La jerarquía está orientada a la capacidad técnica, no directamente a los requisitos legales de evidencia.","La estructura del SOC es para la ejecución operativa, no para separar la preparación de la respuesta."],"refuerzo":"Imaginalo como un hospital: no todos los pacientes ven al cirujano jefe. Los casos menores son atendidos por enfermeros, mientras que los cirujanos se reservan para las operaciones críticas. Esta especialización asegura que los recursos más escasos (expertos) se usen donde más importan.","concepto":"Estructura SOC","seccion":"6 Incident Response","dom":"Security Operations and Incident Response","obj":"5.3","area":"Respuesta a incidentes","dificultad":"media","tipo":"analisis","cita_pdf":"A SOC operates with a tiered structure that streamlines the handling of incidents based on their complexity and required expertise.","pagina":88,"fig":88},{"id":"q0075","pregunta":"Estás redactando el IRP (Incident Response Plan) y tenés que incluir la sección de 'Roles y Responsabilidades'. ¿Cuál es el propósito principal de esta sección?","opciones":["Asegurar una cadena de mando clara","Definir el presupuesto para nuevas herramientas","Establecer la política de retención de datos","Detallar los procedimientos técnicos de recuperación"],"correcta":0,"porque_correcta":"El documento enfatiza que definir roles evita confusiones y establece una cadena de mando clara durante un incidente.","porque_incorrectas":["El IRP no trata sobre la gestión financiera o presupuestaria del departamento.","La retención de datos es una consideración de almacenamiento, no una responsabilidad de los integrantes del equipo de respuesta.","Los procedimientos técnicos son otra sección del IRP, no los roles y responsabilidades de las personas."],"refuerzo":"En una emergencia, si todos intentan dar órdenes a la vez, nadie hace nada. Asignar roles es como definir quién es el capitán en un barco: cuando pasa algo, todos saben a quién escuchar y qué área específica tienen que cubrir para que no haya caos.","concepto":"Plan respuesta incidentes","seccion":"6 Incident Response","dom":"Security Operations and Incident Response","obj":"5.3","area":"Respuesta a incidentes","dificultad":"facil","tipo":"concepto","cita_pdf":"The IRP defines specific roles within the Incident Response Team (IRT) and outlines each member's responsibilities. This ensures a clear chain of command and avoids confusion during an incident.","pagina":87},{"id":"q0076","pregunta":"Después de contener una brecha de datos, el equipo se reúne para revisar qué falló y cómo mejorar. ¿En qué fase del ciclo de vida se encuentra el equipo?","opciones":["Fase de Preparación","Fase de Detección y Análisis","Fase de Contención y Erradicación","Fase de Actividad Post-Incidente"],"correcta":3,"porque_correcta":"La revisión de lecciones aprendidas y la mejora de procesos ocurre exclusivamente en la fase de actividad post-incidente.","porque_incorrectas":["La preparación ocurre antes de que el incidente se haya cerrado completamente.","La detección ocurre al principio del incidente.","La contención y erradicación son fases previas que ya fueron superadas."],"refuerzo":"Después de un accidente deportivo, los jugadores miran la grabación para ver qué hicieron mal y mejorar para el próximo partido. En ciberseguridad, esa fase de 'ver la grabación' es la actividad post-incidente; sin ella, cometerías los mismos errores una y otra vez.","concepto":"Fases ciclo incidente","seccion":"6 Incident Response","dom":"Security Operations and Incident Response","obj":"5.3","area":"Respuesta a incidentes","dificultad":"facil","tipo":"aplicacion","cita_pdf":"Post-Incident Activity: Review, learn, and improve incident response processes.","pagina":90},{"id":"q0077","pregunta":"Un analista de nivel 1 sospecha de un ataque, pero el volumen de datos es demasiado alto. ¿Cómo contribuye el ciclo de vida a mejorar esta situación de cara al futuro?","opciones":["La fase de post-incidente alimenta a la fase de preparación","El SOC automatiza la creación de leyes de cumplimiento","La fase de contención redefine los roles del equipo","El IRP reduce la necesidad de analistas de alto nivel"],"correcta":0,"porque_correcta":"El documento explica que la información obtenida en la fase post-incidente mejora la preparación, incluyendo entrenamiento y procesos futuros.","porque_incorrectas":["El SOC no crea leyes; eso es responsabilidad del equipo legal mencionado en el documento.","La contención se ocupa de frenar el daño, no de reorganizar al personal.","El IRP no elimina la necesidad de expertos, solo organiza mejor el trabajo de todos los niveles."],"refuerzo":"El conocimiento es acumulativo. Si hoy no pudiste manejar un ataque por falta de herramientas, el informe que hacés al final permite que la próxima vez la empresa compre lo necesario. Ese círculo (aprender de un error para estar listo antes del siguiente) es la clave de la resiliencia.","concepto":"Mejora continua","seccion":"6 Incident Response","dom":"Security Operations and Incident Response","obj":"5.3","area":"Respuesta a incidentes","dificultad":"media","tipo":"analisis","cita_pdf":"Post-Incident Activity (4) gathers valuable information that feeds back into Preparation Phase (1) to improve procedures and training to strengthen preparedness for future incidents.","pagina":81,"fig":81},{"id":"q0078","pregunta":"En un incidente legalmente complejo, ¿cuál es el papel principal del equipo legal según lo expuesto?","opciones":["Realizar el análisis técnico de los logs","Garantizar la admisibilidad de la evidencia en la corte","Coordinar la contención de malware con el SOC","Entrenar a los analistas sobre nuevas amenazas"],"correcta":1,"porque_correcta":"El documento señala que el área legal asegura el cumplimiento de regulaciones y apoya el manejo de evidencia para que sea válida en un juicio.","porque_incorrectas":["El análisis técnico es tarea de los analistas del SOC, no del equipo legal.","La contención es un proceso técnico-operativo que realiza el equipo de respuesta, no legal.","El entrenamiento es parte de la fase de preparación, coordinada internamente, no una función legal primaria."],"refuerzo":"Si tenés una prueba en la mano pero la tocaste sin guantes y la contaminaste, no sirve en el juicio. El equipo legal es como el experto forense que se asegura de que todo lo que recojan los técnicos cumpla las reglas para que el criminal realmente pueda ser juzgado.","concepto":"Roles respuesta incidentes","seccion":"6 Incident Response","dom":"Security Operations and Incident Response","obj":"5.3","area":"Respuesta a incidentes","dificultad":"media","tipo":"concepto","cita_pdf":"Legal ensures compliance with relevant laws and regulations, advises on legal risks, and supports the proper handling of evidence to ensure it is admissible in court.","pagina":82},{"id":"q0079","pregunta":"Estás analizando por qué un incidente fue mal gestionado. Si el problema fue que los empleados no sabían a quién reportar el evento, ¿qué parte del IRP probablemente falló?","opciones":["La falta de herramientas de escaneo de logs","La ausencia de un plan de comunicación claro","La falta de analistas de nivel 3 en el SOC","El diseño incorrecto de la estructura del SOC"],"correcta":1,"porque_correcta":"El documento define el plan de comunicación como la pieza que define cómo se comparte la información interna y externamente, algo crítico para el reporte.","porque_incorrectas":["La falta de herramientas afecta la detección técnica, no el reporte humano.","Un analista de nivel 3 es para casos complejos, no para resolver problemas básicos de reporte.","La estructura del SOC es para la gestión interna de las alertas, no para la comunicación externa hacia los empleados."],"refuerzo":"El plan de comunicación es como el manual de '¿A quién llamo si pasa algo?'. Si nadie sabe quién es el contacto, el incidente se queda estancado en un correo perdido o en un escritorio, incluso si tenés los mejores técnicos del mundo.","concepto":"Plan respuesta incidentes","seccion":"6 Incident Response","dom":"Security Operations and Incident Response","obj":"5.3","area":"Respuesta a incidentes","dificultad":"media","tipo":"analisis","cita_pdf":"Communication Plan A crucial part of the IRP, this plan defines how information will be shared internally and externally during an incident","pagina":88,"fig":88},{"id":"q0080","pregunta":"Considerando la distribución del impacto de los incidentes, ¿por qué la mayoría son manejados por analistas junior?","opciones":["Porque los incidentes simples son mucho más frecuentes","Para liberar a los expertos de tareas administrativas","Porque los analistas junior tienen más herramientas de log","Porque la mayoría de los incidentes son críticos"],"correcta":0,"porque_correcta":"El texto indica que el impacto de los incidentes sigue una distribución exponencial: la mayoría son eventos sencillos que pueden resolverse rápidamente con menos experiencia.","porque_incorrectas":["El foco del SOC no es aliviar carga administrativa, sino eficacia técnica.","Los analistas junior tienen menos experiencia, no necesariamente más herramientas.","Es falso; el texto indica que solo un pequeño porcentaje son incidentes de alta complejidad o amenaza significativa."],"refuerzo":"En la vida diaria, la mayoría de los problemas de TI son 'se me olvidó la contraseña' o 'no anda la impresora'. Es lógico que el personal junior los resuelva, dejando al 'arquitecto' o especialista para cuando se cae toda la red o hay un hackeo masivo.","concepto":"Estructura SOC","seccion":"6 Incident Response","dom":"Security Operations and Incident Response","obj":"5.3","area":"Respuesta a incidentes","dificultad":"dificil","tipo":"analisis","cita_pdf":"most frequent ones are simple and can be handled quickly by less experienced analysts, while only a small percent involve a significant threat,","pagina":88,"fig":88},{"id":"q0081","pregunta":"Si un reporte de un usuario final indica irregularidades en el acceso, ¿qué acción inicial debería activarse en el marco del ciclo de vida?","opciones":["Post-incidente para documentar el reporte","Preparación para actualizar los manuales","Detección y análisis para investigar","Contención inmediata sin previa verificación"],"correcta":2,"porque_correcta":"El reporte de un usuario es una forma de detección que debe ser procesada en la fase de detección y análisis para confirmar si es un incidente.","porque_incorrectas":["El post-incidente es para revisar algo ya finalizado.","La preparación se hace antes, no durante la recepción del reporte.","La contención sin verificar puede causar una interrupción innecesaria del servicio si el reporte era una falsa alarma."],"refuerzo":"Imaginalo como alguien que llama a la policía diciendo 'vi algo raro'. La policía no llega a los tiros (contención); primero mandan una patrulla a ver qué pasó (detección y análisis). Eso es lo que debe pasar cuando un usuario informa algo extraño.","concepto":"Fases ciclo incidente","seccion":"6 Incident Response","dom":"Security Operations and Incident Response","obj":"5.3","area":"Respuesta a incidentes","dificultad":"media","tipo":"aplicacion","cita_pdf":"End-user Reporting allows users to report irregularities, like difficulty accessing resources or abnormal","pagina":83},{"id":"q0082","pregunta":"El documento menciona que los incidentes de seguridad son una subcategoría de los incidentes. ¿Cuál es la distinción clave?","opciones":["Los incidentes de seguridad comprometen principios de seguridad","Los incidentes de seguridad solo ocurren por desastres naturales","Los incidentes de seguridad no requieren respuesta del SOC","Los incidentes de seguridad solo afectan a los servidores"],"correcta":0,"porque_correcta":"El texto define los incidentes de seguridad como eventos que comprometen específicamente los principios de seguridad, diferenciándolos de otros problemas operativos.","porque_incorrectas":["Los desastres naturales son eventos que impactan a la organización, pero no siempre comprometen principios de seguridad.","Los incidentes de seguridad son el núcleo del trabajo del SOC.","Los incidentes de seguridad pueden afectar cualquier activo, no solo servidores."],"refuerzo":"Un corte de luz es un incidente (te deja sin trabajar), pero no es un 'incidente de seguridad' a menos que ese corte haya sido causado por un atacante para desactivar las cámaras. La diferencia radica en si se violaron los principios de confidencialidad, integridad o disponibilidad intencionalmente.","concepto":"Definiciones básicas","seccion":"6 Incident Response","dom":"Security Operations and Incident Response","obj":"5.3","area":"Respuesta a incidentes","dificultad":"facil","tipo":"concepto","cita_pdf":"Security Incidents are events that compromise security principles (e.g., data breaches, malware infections)","pagina":90},{"id":"q0083","pregunta":"Para alguien que está aprendiendo sobre el SOC, ¿por qué es importante la fase de 'Contención, Erradicación y Recuperación'?","opciones":["Porque elimina la necesidad de monitoreo","Porque es la única fase que incluye la recuperación","Porque permite identificar al atacante legalmente","Porque limita el daño y restaura el servicio"],"correcta":3,"porque_correcta":"El objetivo de esta fase es triple: limitar el impacto, eliminar la amenaza y volver a la normalidad, protegiendo así los activos.","porque_incorrectas":["El monitoreo sigue siendo necesario incluso después de la recuperación.","Aunque incluye la recuperación, su fin principal es la gestión técnica del daño, no solo la restauración.","Identificar al atacante es parte del análisis, no de la contención/erradicación."],"refuerzo":"Pensalo como un filtro: la fase anterior detectó el veneno, esta fase lo saca de la sangre (erradicación), evita que se propague (contención) y te da el antídoto para que el cuerpo vuelva a funcionar (recuperación). Es la fase de 'acción sobre el problema'.","concepto":"Fases ciclo incidente","seccion":"6 Incident Response","dom":"Security Operations and Incident Response","obj":"5.3","area":"Respuesta a incidentes","dificultad":"media","tipo":"analisis","cita_pdf":"Containment, Eradication & Recovery: Limit damage, remove threats, and restore systems.","pagina":90},{"id":"q0084","pregunta":"Si tenés que justificar la importancia de la 'Fase de Preparación' ante la gerencia, ¿qué argumento basado en el texto usarías?","opciones":["Reduce la probabilidad de cometer errores y agiliza la respuesta","Es la fase que más presupuesto requiere del SOC","Es el proceso principal para detectar ataques en tiempo real","Elimina completamente la necesidad de una estructura SOC"],"correcta":0,"porque_correcta":"El documento establece que la preparación ayuda a mantenerse organizado, reduce pasos olvidados y facilita una respuesta más rápida y estructurada.","porque_incorrectas":["El texto no habla del presupuesto necesario en esta fase, sino de su valor operativo.","La detección ocurre en otra fase; la preparación facilita que esa detección sea efectiva.","El SOC es parte de la organización que ejecuta el plan; la preparación no lo hace innecesario."],"refuerzo":"La preparación es como el entrenamiento de un equipo de rescate. No salvan vidas durante el entrenamiento, pero entrenar hace que, cuando llega la emergencia, sepan exactamente qué hacer sin perder tiempo discutiendo o buscando herramientas.","concepto":"Plan respuesta incidentes","seccion":"6 Incident Response","dom":"Security Operations and Incident Response","obj":"5.3","area":"Respuesta a incidentes","dificultad":"dificil","tipo":"analisis","cita_pdf":"the IRP is a core component of the preparation phase that helps an organization stay organized when facing a security incident by reducing the likelihood of missed steps and facilitating a faster, more structured response.","pagina":87},{"id":"q0085","pregunta":"Un analista sostiene que 'todo evento es un incidente'. Según el documento, ¿por qué esta afirmación es incorrecta?","opciones":["Porque los eventos son ocurrencias observables, mientras que los incidentes tienen un impacto negativo","Porque los eventos solo pueden ser incidentes de seguridad","Porque los incidentes son causados siempre por desastres naturales","Porque los eventos son lo mismo que el ciclo de vida del incidente"],"correcta":0,"porque_correcta":"El documento diferencia claramente eventos (observables) de incidentes (eventos con impacto negativo), estableciendo una distinción técnica fundamental.","porque_incorrectas":["Los eventos pueden ser positivos o neutrales (como un login exitoso), no solo de seguridad.","El texto da ejemplos de incidentes como cortes de luz, que no son necesariamente desastres naturales.","Los eventos son una categoría amplia, no una parte del ciclo de vida, que es la estructura de respuesta."],"refuerzo":"Un evento es que alguien abra una puerta (se registra). Un incidente es que alguien abra una puerta usando una llave robada. El primero es solo una observación, el segundo ya tiene un impacto negativo en la seguridad.","concepto":"Definiciones básicas","seccion":"6 Incident Response","dom":"Security Operations and Incident Response","obj":"5.3","area":"Respuesta a incidentes","dificultad":"media","tipo":"analisis","cita_pdf":"Events are observable occurrences (e.g., system errors, logins), Incidents are events that negatively impact the organization (e.g., natural disasters, server outages)","pagina":90},{"id":"q0086","pregunta":"Al diseñar un IRP, se menciona que el costo es una consideración importante. ¿Qué aspecto del almacenamiento de evidencia afecta este costo?","opciones":["El costo de la electricidad para los servidores","La necesidad de hardware y espacio logístico para almacenar datos","El salario de los analistas que revisan los archivos","El costo legal de las regulaciones de cumplimiento"],"correcta":1,"porque_correcta":"El texto aclara que almacenar grandes volúmenes de evidencia (como discos rígidos o soportes físicos) genera costos crecientes debido a la complejidad logística.","porque_incorrectas":["Aunque la electricidad cuesta, el texto pone el foco en el hardware de almacenamiento y la logística de mantenerlo.","El salario es un costo operativo, pero no está ligado directamente al costo de almacenar evidencia física.","Las regulaciones de cumplimiento dictan los tiempos de retención, pero no son la causa del costo físico directo del almacenamiento de discos."],"refuerzo":"Si tenés que guardar cada disco duro de cada incidente por 5 años, vas a necesitar un almacén, estanterías, sistemas contra incendios y mucho espacio. Ese 'almacenamiento' es un costo que a menudo olvidamos, pero que impacta directamente en cómo manejamos la evidencia.","concepto":"Retención de evidencia","seccion":"6 Incident Response","dom":"Security Operations and Incident Response","obj":"5.3","area":"Respuesta a incidentes","dificultad":"media","tipo":"concepto","cita_pdf":"storing that data along with evidence, especially in the case of storage media hardware (e.g., disk drives or removable media), can become expensive over time as more disks are needed to store that data adding layers of logistical complexity.","pagina":87},{"id":"q0087","pregunta":"Como responsable de seguridad, tenés que asegurar que el plan de continuidad (BCP) se mantenga efectivo ante cambios organizacionales. ¿Cuál es la práctica fundamental para lograr esto según el ciclo de vida del BCP?","opciones":["Realizar una auditoría externa semestral para verificar el cumplimiento de normativas.","Integrar el BCP en las operaciones diarias y actualizarlo ante nuevos procesos críticos.","Ejecutar pruebas de escritorio mensuales para ajustar los roles de los empleados.","Documentar todos los incidentes ocurridos para crear un registro histórico de fallas."],"correcta":1,"porque_correcta":"La actualización continua y la integración operativa permiten que el plan evolucione junto con la empresa, abordando nuevas dependencias que surgen con el crecimiento.","porque_incorrectas":["Las auditorías externas miden cumplimiento, pero no garantizan la adaptabilidad funcional ante cambios operativos específicos.","Aunque las pruebas de escritorio son útiles, la actualización efectiva requiere integrar el plan en la rutina diaria, no solo simular cambios de roles.","Registrar incidentes es reactivo; el BCP requiere un mantenimiento proactivo y dinámico del plan mismo."],"refuerzo":"Imaginate que construís un mapa para llegar a tu casa, pero cambian las calles de tu barrio. Si no actualizás el mapa con los nuevos caminos, el documento queda obsoleto. Del mismo modo, si tu empresa lanza una nueva línea de productos, tenés que ajustar el BCP para proteger esos procesos, integrando esta revisión en la gestión cotidiana para no trabajar con información vieja.","concepto":"Mantenimiento y actualización BCP","seccion":"7 Business Continuity Planning","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"media","tipo":"aplicacion","cita_pdf":"An important aspect to keep in mind while developing a BCP is that the document must be continually updated to accommodate new or critical functions added to the organization as a result of growth or even to address new disruptions that arise in the evolving environment in which the organization operates.","pagina":96},{"id":"q0088","pregunta":"Durante una crisis, los métodos normales de autenticación fallan. ¿Qué tipo de estrategia debería implementar el BCP para mantener el acceso crítico?","opciones":["Un sistema de tokens físicos compartidos entre todos los administradores del sistema.","La creación de una cuenta de emergencia con acceso permanente sin supervisión.","Un proceso de 'break-glass' mediante una cuenta monitoreada y segura.","La desactivación de todas las políticas de contraseñas durante el periodo de crisis."],"correcta":2,"porque_correcta":"El uso de un proceso de 'break-glass' proporciona acceso de emergencia controlado, permitiendo la continuidad sin comprometer la seguridad a largo plazo.","porque_incorrectas":["Los tokens compartidos violan el principio de responsabilidad individual y no resuelven el fallo del sistema de autenticación.","Una cuenta sin supervisión es un riesgo crítico de seguridad que va en contra de la integridad del sistema.","Desactivar políticas de contraseñas deja los sistemas vulnerables a intrusos justo cuando la seguridad es más necesaria."],"refuerzo":"Imaginá una caja de vidrio que contiene una llave de emergencia. Solo podés romperla si es estrictamente necesario, y alguien está mirando. En sistemas, esto es el 'break-glass': una cuenta que permite entrar si lo normal falla, pero que deja rastro y está monitoreada para evitar usos indebidos fuera de la emergencia.","concepto":"Estrategias de recuperación","seccion":"7 Business Continuity Planning","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"media","tipo":"aplicacion","cita_pdf":"An example of a strategy might be a break-glass process that provides emergency access to critical systems through a secure, monitored account when normal authentication methods fail during a crisis.","pagina":97},{"id":"q0089","pregunta":"Si tuvieras que validar la efectividad de un BCP, ¿cuál es la ventaja principal de realizar un 'Full-Scale Exercise' sobre otras pruebas?","opciones":["Reduce los costos operativos al involucrar a todo el personal simultáneamente.","Permite identificar vulnerabilidades en un escenario que replica el mundo real.","Es la única forma de garantizar la recuperación total de los sistemas en el BCP.","Simplifica la documentación al concentrar todas las fallas en un solo informe."],"correcta":1,"porque_correcta":"Los ejercicios a escala completa son los más efectivos porque obligan a múltiples departamentos a interactuar bajo presión, revelando debilidades que las pruebas aisladas no detectan.","porque_incorrectas":["Estos ejercicios suelen ser costosos y complejos, no reducen los costos operativos inmediatos.","Ninguna prueba garantiza la recuperación al 100%, solo valida la preparación y resiliencia del plan.","La simplificación documental es una consecuencia administrativa, pero no el valor estratégico de la prueba."],"refuerzo":"Pensá en esto como un simulacro de incendio real versus leer el manual de evacuación. Leer el manual es útil, pero el simulacro te muestra si las puertas se traban o si la gente entra en pánico en las escaleras. El ejercicio a gran escala expone problemas reales de coordinación que nunca verías solo revisando papeles.","concepto":"Pruebas y validación BCP","seccion":"7 Business Continuity Planning","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"dificil","tipo":"analisis","cita_pdf":"Full-Scale Exercises replicate real-world disruptions as closely as possible, engaging multiple departments and testing the BCP on all fronts. This is the most effective type of testing because it puts the BCP through a real-world scenario.","pagina":99},{"id":"q0090","pregunta":"Al diseñar una lista de miembros para el equipo del BCP, ¿por qué es insuficiente listar solo un nombre con su número de contacto?","opciones":["Porque se requiere que todos los miembros residan en la misma ubicación geográfica.","Porque el plan debe incluir métodos de contacto compensatorios y miembros de respaldo.","Porque el estándar exige que el BCP sea ejecuta
