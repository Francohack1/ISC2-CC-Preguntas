y standard that systems must meet, and change management ensures that patches, updates, and configuration changes do not introduce security vulnerabilities as systems evolve.","pagina":330},{"id":"q0229","pregunta":"¿Qué ocurre si una organización ignora el hardening y se apoya solo en las 'buenas intenciones' de sus usuarios?","opciones":["Los sistemas se vuelven más inestables ante actualizaciones del vendedor.","La superficie de ataque aumenta al depender de configuraciones inseguras.","Se reduce la capacidad de los usuarios para ejecutar aplicaciones legítimas.","Los costos de mantenimiento de TI aumentan innecesariamente."],"correcta":1,"porque_correcta":"El documento advierte que sin hardening, los sistemas quedan expuestos con sus configuraciones por defecto, lo cual aumenta el riesgo independientemente del comportamiento humano.","porque_incorrectas":["La inestabilidad no es la consecuencia directa de confiar en el usuario, sino la exposición a vulnerabilidades.","Ignorar el hardening hace que los usuarios tengan acceso a más cosas, no que tengan menos capacidades.","Los costos podrían subir tras un ataque, pero el problema central es la superficie de ataque."],"refuerzo":"Confiar en que el usuario no cometa errores es como confiar en que nadie va a entrar a tu casa porque 'la gente es buena'. Es una estrategia débil. El hardening es poner cerraduras y alarmas; no importa si el usuario es descuidado, la casa sigue estando protegida por el diseño.","concepto":"Necesidad técnica vs intención","seccion":"16 System Hardening","dom":"Security Operations and Incident Response","obj":"5.4","area":"Protección de activos","dificultad":"dificil","tipo":"analisis","cita_pdf":"Without policies that lead to system hardening, organizations must rely largely on user behavior and good intentions to maintain security. However, as discussed earlier, policies alone do not secure systems; they must be translated into concrete technical actions that reduce the attack surface.","pagina":324},{"id":"q0230","pregunta":"Un auditor pregunta por qué el proceso de cambio es un componente vital del hardening. ¿Cuál es tu respuesta técnica?","opciones":["Porque asegura que todos los sistemas tengan las mismas versiones de software.","Porque garantiza que las modificaciones no introduzcan nuevas vulnerabilidades.","Porque permite delegar la seguridad en proveedores externos.","Porque reduce el tiempo necesario para desplegar nuevas funciones al usuario."],"correcta":1,"porque_correcta":"El proceso de gestión de cambios evalúa y evalúa cada modificación para asegurar que el sistema no pierda su estado de seguridad o se vuelva vulnerable.","porque_incorrectas":["La gestión de cambios no busca la homogeneidad de versiones, sino la seguridad del cambio.","La gestión de cambios no delega la seguridad, al contrario, la centraliza en el control.","El objetivo no es la velocidad de despliegue, sino la seguridad del sistema."],"refuerzo":"Cada vez que cambiás algo en un sistema endurecido, podés romper accidentalmente una medida de seguridad (por ejemplo, al actualizar un software, se re-habilita un puerto que habías cerrado). La gestión de cambios es el filtro que evita que eso pase sin que te des cuenta.","concepto":"Gestión cambios y seguridad","seccion":"16 System Hardening","dom":"Security Operations and Incident Response","obj":"5.4","area":"Protección de activos","dificultad":"media","tipo":"concepto","cita_pdf":"Change management ensures that patches, updates, and configuration changes do not introduce security vulnerabilities as systems evolve.","pagina":330},{"id":"q0231","pregunta":"¿Por qué es fundamental que una política de seguridad defina claramente su alcance y aplicabilidad según la sección 17 Security Policy Best Practices?","opciones":["Para limitar la responsabilidad legal de los administradores ante posibles incidentes de seguridad.","Para asegurar que los requisitos de seguridad se apliquen de manera consistente en toda la organización.","Para permitir que los departamentos técnicos elijan qué controles implementar según sus necesidades.","Para justificar el presupuesto asignado a la implementación de nuevas herramientas tecnológicas."],"correcta":1,"porque_correcta":"La definición precisa del alcance evita confusiones y garantiza que los controles de seguridad se apliquen uniformemente a las personas, roles o ubicaciones correspondientes.","porque_incorrectas":["El alcance busca la consistencia operativa, no eximir de responsabilidad a los administradores.","La flexibilidad excesiva para los departamentos técnicos contradice el objetivo de estandarización de las políticas.","La justificación presupuestaria no es la función principal de la definición de alcance en una política."],"refuerzo":"Imaginá una política que dice 'proteger los servidores' pero no aclara si incluye a los servidores de desarrollo o solo a los de producción. Sin un alcance definido, un equipo podría dejar los servidores de desarrollo expuestos. Definir el alcance es como poner un cerco claro: sabés exactamente dónde empieza y termina tu responsabilidad.","concepto":"Alcance y aplicabilidad","seccion":"17 Security Policy Best Practices","dom":"Security Governance","obj":"2.1","area":"GRC: gobierno, riesgo y cumplimiento","dificultad":"facil","tipo":"aplicacion","cita_pdf":"Defining whether a policy covers specific roles, departments, contractors, or locations prevents confusion and ensures that security requirements are applied consistently in practice.","pagina":336},{"id":"q0232","pregunta":"Tenés un equipo que no puede cumplir con un requisito técnico de una política debido a una limitación del sistema actual. Según la sección 17, ¿cuál es el procedimiento correcto?","opciones":["Implementar un 'workaround' informal documentado por el equipo técnico para evitar riesgos.","Solicitar una exención formal que sea evaluada y documentada como una decisión de aceptación de riesgo.","Ignorar el requisito hasta que el sistema sea actualizado para cumplir con los estándares actuales.","Modificar el requisito en el texto de la política para que todos los sistemas estén en cumplimiento."],"correcta":1,"porque_correcta":"El proceso formal de exenciones permite manejar las desviaciones de manera controlada, transformándolas en decisiones conscientes de riesgo en lugar de acciones informales.","porque_incorrectas":["Los workarounds informales evitan la supervisión y no constituyen una gestión adecuada del riesgo.","Ignorar requisitos incumple el propósito de la política de seguridad y crea riesgos no gestionados.","Modificar una política por una limitación técnica local invalida la obligatoriedad global del documento."],"refuerzo":"Pensá en esto como una excepción médica. Si un paciente no puede tomar un medicamento específico, el médico no cambia la receta estándar para todos, sino que autoriza una excepción específica para ese caso tras evaluar los riesgos. El proceso formal de exención hace exactamente eso: asegura que el riesgo sea conocido y autorizado.","concepto":"Gestión de excepciones","seccion":"17 Security Policy Best Practices","dom":"Security Governance","obj":"2.1","area":"GRC: gobierno, riesgo y cumplimiento","dificultad":"media","tipo":"aplicacion","cita_pdf":"A formal exception process allows the organization to approve and document deviations in a controlled manner, treating them as risk acceptance decisions rather than informal workarounds.","pagina":336},{"id":"q0233","pregunta":"Un directivo sugiere que, para que las políticas sean más efectivas, deben redactarse con un lenguaje altamente técnico y preciso para los ingenieros. ¿Qué dice el documento al respecto?","opciones":["Es correcto, ya que el personal técnico es el responsable final de la ejecución de los controles.","Es incorrecto, el lenguaje debe ser sencillo para asegurar la comprensión de toda la organización.","Es solo parcialmente cierto, el lenguaje debe ser técnico pero incluir un glosario de términos.","Es irrelevante, el éxito de la política depende exclusivamente de su capacidad de ser auditada."],"correcta":1,"porque_correcta":"La política está dirigida a toda la organización, no solo al personal técnico, por lo que el uso de un lenguaje claro y directo es vital para que todos comprendan sus responsabilidades.","porque_incorrectas":["La audiencia de una política trasciende al personal técnico; todos deben entenderla para cumplirla.","Un lenguaje técnico, aunque se defina, no elimina la barrera de comunicación para personal no técnico.","La claridad del lenguaje es un factor crítico de efectividad, no una cuestión menor frente a la auditoría."],"refuerzo":"Si escribís un manual de convivencia en jerga legal profunda, nadie lo va a entender. Lo mismo ocurre aquí: una política de seguridad es un acuerdo. Si usás un lenguaje que excluye al empleado de marketing o administración, no podés esperar que sigan las reglas porque, simplemente, no entenderán qué se les pide.","concepto":"Lenguaje y claridad","seccion":"17 Security Policy Best Practices","dom":"Security Governance","obj":"2.1","area":"GRC: gobierno, riesgo y cumplimiento","dificultad":"facil","tipo":"analisis","cita_pdf":"Security policies are written for the entire organization, not only technical staff. Using clear, straightforward language and defining technical terms helps ensure that employees understand their responsibilities and can apply the policy correctly in day-to-day work.","pagina":336},{"id":"q0234","pregunta":"Al diseñar una nueva política de seguridad, se argumenta que debe ser un documento estático para garantizar consistencia. Según el texto, ¿qué error conceptual tiene este enfoque?","opciones":["Que las políticas deben ser dinámicas para reflejar los cambios en amenazas y tecnología.","Que la consistencia solo se logra cuando las políticas son auditadas por terceros.","Que el documento debe ser reescrito cada vez que cambia el personal clave de la empresa.","Que la rigidez es necesaria, pero el mantenimiento debe realizarse mediante estándares."],"correcta":0,"porque_correcta":"Las políticas no pueden permanecer estáticas debido a que el entorno de amenazas, las tecnologías y las prácticas comerciales evolucionan continuamente.","porque_incorrectas":["La auditoría externa verifica la eficacia, pero no sustituye la necesidad de actualización de la política.","La rotación de personal no es el motor principal del cambio, sino la evolución de los riesgos y la tecnología.","El mantenimiento de la política en sí misma es necesario, no solo de los estándares derivados."],"refuerzo":"Imaginate un manual de navegación marítima impreso hace 50 años. Aunque el barco sea el mismo, el entorno cambió: los arrecifes se movieron, las tormentas son distintas y el radar es nuevo. Una política estática es como ese manual viejo: te guía con información que ya no protege tu realidad actual.","concepto":"Revisión y mantenimiento","seccion":"17 Security Policy Best Practices","dom":"Security Governance","obj":"2.1","area":"GRC: gobierno, riesgo y cumplimiento","dificultad":"media","tipo":"analisis","cita_pdf":"Security policies cannot remain static. Regular review ensures that policies continue to reflect current threats, technologies, and business practices, maintaining alignment with the organization's risk posture.","pagina":336},{"id":"q0235","pregunta":"En una reunión, un colega sostiene que las políticas son lo mismo que los estándares. Basándote en la sección 17, ¿qué le responderías sobre la relación entre ambos?","opciones":["Son intercambiables, ya que ambos definen qué acciones deben tomar los empleados.","Las políticas establecen la intención, mientras que los estándares dictan la implementación técnica.","Los estándares son obligatorios, mientras que las políticas son guías de buenas prácticas.","Las políticas dictan la implementación, mientras que los estándares definen la intención."],"correcta":1,"porque_correcta":"Existe una distinción clara: la política marca el objetivo y la intención, mientras que el estándar detalla el cómo (la implementación) para cumplir esa meta.","porque_incorrectas":["No son intercambiables; tienen roles de gobernanza y técnicos muy diferenciados.","Es al revés: las políticas son mandatorias para la organización, no solo guías.","La relación es inversa a lo que sugiere esta opción; la política no detalla el cómo técnico."],"refuerzo":"Pensá en la diferencia entre una ley de tránsito (política: 'debe conducir a una velocidad segura') y una señal de velocidad máxima (estándar: 'máximo 60 km/h'). La política es la norma general que busca proteger a todos; el estándar es la medida concreta que te permite verificar si cumpliste.","concepto":"Políticas vs Estándares","seccion":"17 Security Policy Best Practices","dom":"Security Governance","obj":"2.1","area":"GRC: gobierno, riesgo y cumplimiento","dificultad":"dificil","tipo":"analisis","cita_pdf":"For instance, a security policy may stipulate that customer data must be safeguarded against unauthorized access. This requirement demonstrates intent. The corresponding standard would then define how to fulfill this requirement.","pagina":334},{"id":"q0236","pregunta":"¿Qué ocurre si una organización carece de políticas de seguridad claramente definidas?","opciones":["Los empleados tienen más autonomía, lo cual mejora la agilidad y la innovación.","Las decisiones se basan en el juicio individual, generando inconsistencia y riesgos no gestionados.","La organización ahorra recursos al no tener que mantener documentación compleja.","La responsabilidad legal disminuye al no haber reglas específicas que puedan ser incumplidas."],"correcta":1,"porque_correcta":"Sin políticas, la organización depende de las decisiones individuales, lo que lleva a prácticas inconsistentes, riesgos fuera de control y dificultades para demostrar cumplimiento.","porque_incorrectas":["La autonomía sin marco de referencia genera riesgo, no necesariamente innovación segura.","La falta de políticas suele aumentar los costos a largo plazo debido a incidentes y riesgos mal gestionados.","No tener reglas específicas aumenta la vulnerabilidad legal en lugar de disminuirla, al no haber gobernanza clara."],"refuerzo":"Sin una política, es como jugar al fútbol sin reglas escritas: cada jugador decidiría si se puede tocar la pelota con la mano o no según su criterio personal. El resultado no es un juego más ágil, sino un caos donde nadie sabe cómo proteger el arco propio.","concepto":"Gobernanza de seguridad","seccion":"17 Security Policy Best Practices","dom":"Security Governance","obj":"2.1","area":"GRC: gobierno, riesgo y cumplimiento","dificultad":"facil","tipo":"aplicacion","cita_pdf":"Without clear policies, decisions tend to be based on individual judgment rather than established rules. This can lead to inconsistent practices, unmanaged risks, and difficulty demonstrating compliance with regulatory or contractual requirements.","pagina":334},{"id":"q0237","pregunta":"Según la sección 17, ¿por qué es importante que los empleados formalicen su conocimiento de las políticas de seguridad?","opciones":["Para que la empresa tenga evidencia legal ante una auditoría laboral de que el empleado fue notificado.","Para asegurar la rendición de cuentas y reforzar su papel en la gestión del riesgo organizacional.","Para que el departamento de recursos humanos pueda aplicar sanciones sin necesidad de una investigación.","Para obligar al empleado a participar en programas de capacitación adicionales si fuera necesario."],"correcta":1,"porque_correcta":"La formalización asegura la rendición de cuentas (accountability) y refuerza el rol individual en la gestión de riesgos de la empresa.","porque_incorrectas":["Si bien la evidencia es útil, el objetivo principal descrito es la rendición de cuentas y el rol del empleado.","Las sanciones requieren un debido proceso, no solo la firma de una política.","La firma es un acto de compromiso y conocimiento, no un mecanismo de inscripción forzosa a capacitación."],"refuerzo":"Firmar no es solo un trámite administrativo; es un recordatorio de que la seguridad es responsabilidad de todos. Es como un contrato de responsabilidad: al firmarlo, pasás de ser un espectador a ser un participante activo en la protección de los activos de la empresa.","concepto":"Rendición de cuentas","seccion":"17 Security Policy Best Practices","dom":"Security Governance","obj":"2.1","area":"GRC: gobierno, riesgo y cumplimiento","dificultad":"media","tipo":"aplicacion","cita_pdf":"Employees are typically required to formally acknowledge these policies, ensuring accountability and reinforcing their role in managing organizational risk.","pagina":333},{"id":"q0238","pregunta":"¿Por qué el preámbulo es un elemento clave en una política de seguridad, según la sección 17.2?","opciones":["Porque detalla los pasos técnicos específicos para la configuración de los firewalls.","Porque establece el apoyo de la alta dirección y explica el propósito y alcance.","Porque enumera todas las sanciones posibles ante un incumplimiento de la normativa.","Porque define el cronograma de revisiones anuales exigido por la gerencia."],"correcta":1,"porque_correcta":"El preámbulo es fundamental porque obtiene el respaldo de los niveles superiores y contextualiza la existencia y los objetivos de la política.","porque_incorrectas":["El preámbulo trata de propósito y apoyo, no de configuraciones técnicas detalladas.","Las sanciones suelen ir en una sección dedicada a la aplicación y consecuencias, no en el preámbulo.","El cronograma de revisiones no es el componente central del preámbulo según el documento."],"refuerzo":"El preámbulo es como la declaración de principios de un contrato. Sin él, la política carece de 'pedigrí' o respaldo oficial, y el empleado no entiende por qué existe la regla. Es lo que le otorga autoridad y razón de ser a lo que viene después.","concepto":"Estructura de la política","seccion":"17 Security Policy Best Practices","dom":"Security Governance","obj":"2.1","area":"GRC: gobierno, riesgo y cumplimiento","dificultad":"media","tipo":"concepto","cita_pdf":"The preamble section establishes senior management support and explain the policy's purpose, objectives, and scope.","pagina":334},{"id":"q0239","pregunta":"Si un empleado entiende los objetivos detrás de una política, como la protección de activos o la reducción de riesgos, ¿cómo suele cambiar su actitud frente a ella?","opciones":["Es más probable que la sigan, en lugar de verla como un obstáculo innecesario.","Comienzan a cuestionar la política, lo cual es útil para la mejora continua.","Es menos probable que la sigan, porque sienten que la política es un control autoritario.","Se enfocan únicamente en la parte técnica, descuidando el cumplimiento administrativo."],"correcta":0,"porque_correcta":"Cuando los empleados comprenden que la política apoya objetivos valiosos, es más probable que la adopten voluntariamente en lugar de percibirla como una traba.","porque_incorrectas":["Comprender el objetivo suele reducir la resistencia, no alentar el cuestionamiento ciego.","Ocurre lo opuesto: la comprensión mejora la disposición a cumplir.","La comprensión del objetivo ayuda a integrar la seguridad en el día a día, no a descuidar el cumplimiento."],"refuerzo":"Nadie quiere seguir reglas que parecen caprichosas. Si entendés que la política de bloqueo de pantalla protege tu trabajo y el de tu equipo, no es una molestia, es una red de seguridad. Comprender el 'por qué' transforma un 'tengo que' en un 'entiendo que debo'.","concepto":"Adopción de políticas","seccion":"17 Security Policy Best Practices","dom":"Security Governance","obj":"2.1","area":"GRC: gobierno, riesgo y cumplimiento","dificultad":"facil","tipo":"aplicacion","cita_pdf":"When employees understand that a policy supports goals such as reducing risk, protecting assets, or meeting regulatory obligations, they are more likely to follow it rather than view it as an unnecessary obstacle.","pagina":336},{"id":"q0240","pregunta":"¿Qué rol juegan las consecuencias en una política de seguridad efectiva?","opciones":["Son opcionales, ya que la concientización es suficiente para evitar violaciones.","Sirven como un mecanismo para asegurar que las reglas sean respetadas y se mantenga la responsabilidad.","Deben ser siempre severas, incluyendo el despido, para demostrar la seriedad de la organización.","Son solo para el personal administrativo, ya que el técnico tiene su propio régimen disciplinario."],"correcta":1,"porque_correcta":"La efectividad de las políticas depende de su cumplimiento consistente, y entender que existen consecuencias es vital para la rendición de cuentas.","porque_incorrectas":["La concientización es necesaria, pero no suficiente; la política necesita dientes para ser efectiva.","Las consecuencias deben ser graduadas (reentrenamiento, advertencias, despido), no siempre severas.","Las políticas y sus consecuencias se aplican de manera uniforme a toda la organización, sin distinciones de rol técnico o administrativo."],"refuerzo":"Las consecuencias son como los árbitros en un deporte: si no hay penalizaciones por una falta, la regla pierde su valor. Sin consecuencias, la política es una sugerencia; con ellas, es un marco de conducta que define qué es aceptable y qué no.","concepto":"Enforcement y consecuencias","seccion":"17 Security Policy Best Practices","dom":"Security Governance","obj":"2.1","area":"GRC: gobierno, riesgo y cumplimiento","dificultad":"media","tipo":"concepto","cita_pdf":"Policies are effective only when consistently enforced. Employees must understand that violations carry consequences, ranging from retraining or formal warnings to suspension","pagina":336},{"id":"q0241","pregunta":"Un auditor observa que una empresa tiene 20 políticas diferentes. Según la sección 17, ¿cuál de estas se considera una de las cinco 'fundacionales'?","opciones":["Política de gestión de proyectos técnicos.","Política de gestión de contraseñas.","Política de uso de servicios de cafetería.","Política de evaluación de desempeño anual."],"correcta":1,"porque_correcta":"La gestión de contraseñas es una de las cinco políticas consideradas fundacionales para reducir el riesgo organizacional.","porque_incorrectas":["La gestión de proyectos no se menciona como una de las cinco políticas fundacionales de seguridad.","El uso de servicios de cafetería es una política administrativa, ajena al ámbito de seguridad aquí expuesto.","La evaluación de desempeño es un proceso de recursos humanos, no una política de seguridad fundamental."],"refuerzo":"Imaginá las políticas fundacionales como los cimientos de una casa. Sin cimientos (como la gestión de contraseñas, BYOD, AUP, etc.), cualquier estructura que construyas arriba (como políticas específicas de aplicaciones) no tiene donde sostenerse y es vulnerable.","concepto":"Políticas fundacionales","seccion":"17 Security Policy Best Practices","dom":"Security Governance","obj":"2.1","area":"GRC: gobierno, riesgo y cumplimiento","dificultad":"facil","tipo":"concepto","cita_pdf":"Organizations may maintain many security policies; however, five are considered foundational and are the focus of this chapter: data handling, password management, acceptable use (AUP), bring your own device (BYOD), and privacy policies.","pagina":333},{"id":"q0242","pregunta":"Al implementar una política de BYOD (Bring Your Own Device), ¿cuál es el equilibrio principal que busca la organización?","opciones":["Eliminar la necesidad de dispositivos corporativos para reducir costos operativos a cero.","Poner toda la responsabilidad de seguridad en manos del usuario, liberando a IT.","Balancear los beneficios de la flexibilidad del dispositivo personal con requisitos de seguridad definidos.","Bloquear todas las aplicaciones no corporativas para asegurar la integridad total del dato."],"correcta":2,"porque_correcta":"El objetivo de la política de BYOD es permitir el uso de dispositivos personales aprovechando sus beneficios, pero siempre bajo requisitos de seguridad que protejan la información corporativa.","porque_incorrectas":["El objetivo no es la eliminación de equipos corporativos, sino la gestión segura de los personales.","La responsabilidad de la seguridad nunca se transfiere totalmente al usuario; la empresa debe mantener control.","El bloqueo total de aplicaciones desvirtúa el concepto de BYOD y su beneficio de flexibilidad."],"refuerzo":"El BYOD es como permitir que un empleado traiga su propia herramienta a una obra en construcción: le das libertad para trabajar con algo que ya conoce, pero le imponés reglas de seguridad para que esa herramienta sea tan segura como la que proveería la empresa.","concepto":"BYOD","seccion":"17 Security Policy Best Practices","dom":"Security Governance","obj":"2.1","area":"GRC: gobierno, riesgo y cumplimiento","dificultad":"media","tipo":"analisis","cita_pdf":"Furthermore, the Bring Your Own Device (BYOD) policy balances the benefits of personal device usage with defined security requirements.","pagina":342},{"id":"q0243","pregunta":"¿Por qué es un error común que las organizaciones basen su toma de decisiones en el juicio individual en lugar de en políticas?","opciones":["Porque el juicio individual es más lento y requiere más tiempo de supervisión.","Porque el juicio individual genera inconsistencias y es difícil de auditar para el cumplimiento.","Porque las personas rara vez tienen el conocimiento suficiente para tomar decisiones de seguridad.","Porque el juicio individual suele ser excesivamente estricto y bloquea la productividad."],"correcta":1,"porque_correcta":"El juicio individual es subjetivo y varía por persona; al basarse en esto, la organización pierde consistencia y se vuelve imposible demostrar el cumplimiento ante normativas.","porque_incorrectas":["El problema no es la velocidad, sino la falta de estandarización y previsibilidad.","El juicio individual puede ser experto, pero sigue siendo un riesgo no documentado y variable.","El juicio individual suele ser más laxo que la política, no necesariamente estricto."],"refuerzo":"Si tenés cinco personas tomando decisiones de seguridad según su 'mejor criterio', tenés cinco niveles de seguridad distintos. Es como tener cinco cajeros que deciden por su cuenta cuánto pedir de identificación: un cliente tendrá seguridad máxima y otro ninguna. La política iguala ese estándar.","concepto":"Gobernanza de seguridad","seccion":"17 Security Policy Best Practices","dom":"Security Governance","obj":"2.1","area":"GRC: gobierno, riesgo y cumplimiento","dificultad":"dificil","tipo":"analisis","cita_pdf":"Without clear policies, decisions tend to be based on individual judgment rather than established rules. This can lead to inconsistent practices, unmanaged risks, and difficulty demonstrating compliance with regulatory or contractual requirements.","pagina":334},{"id":"q0244","pregunta":"¿Cuál es la función del ciclo de vida de la política (autorización, definición de requisitos, aplicación, revisión)?","opciones":["Reducir la carga de trabajo de los administradores al automatizar todas las decisiones.","Asegurar que la política sea un documento formal, estructurado y gobernado.","Eliminar la necesidad de revisiones periódicas al enfocarse en requisitos definidos.","Priorizar el desarrollo de tecnología sobre la creación de documentos de gobernanza."],"correcta":1,"porque_correcta":"La estructura del ciclo de vida garantiza que la política sea tratada como una parte formal de la gobernanza, asegurando su calidad desde la creación hasta la revisión.","porque_incorrectas":["La automatización es técnica, no el objetivo del proceso de ciclo de vida de la política.","El ciclo de vida incluye explícitamente la revisión; no la elimina.","La gobernanza y los documentos de política son fundamentales y no deben ser subordinados al desarrollo tecnológico."],"refuerzo":"El ciclo de vida es la garantía de calidad de la política. No podés escribir una regla y olvidarla. Igual que una receta, primero la autorizás, definís los ingredientes, la cocinás (aplicación) y luego probás qué tal salió para ver si necesitás ajustarla (revisión).","concepto":"Ciclo de vida de políticas","seccion":"17 Security Policy Best Practices","dom":"Security Governance","obj":"2.1","area":"GRC: gobierno, riesgo y cumplimiento","dificultad":"dificil","tipo":"concepto","cita_pdf":"The structure reflects the key stages of the policy lifecycle: authorization, requirements definition, enforcement, and ongoing review.","pagina":334},{"id":"q0245","pregunta":"Si una empresa necesita clasificar, almacenar y disponer de datos de forma segura, ¿qué política debería aplicar principalmente?","opciones":["Política de gestión de contraseñas.","Política de manejo de datos.","Política de uso aceptable (AUP).","Política de Bring Your Own Device (BYOD)."],"correcta":1,"porque_correcta":"La política de manejo de datos (data handling) es la que proporciona las directrices específicas para la clasificación, almacenamiento y disposición de la información.","porque_incorrectas":["La gestión de contraseñas se ocupa del acceso, no del ciclo de vida de los datos.","La AUP define el uso aceptable de recursos, no el tratamiento detallado de los datos.","La política BYOD se centra en el dispositivo, no directamente en el ciclo de vida del dato per se."],"refuerzo":"Pensa en la política de manejo de datos como una guía de reciclaje y gestión de archivos. Te dice dónde poner cada cosa (clasificación), cómo guardarla (almacenamiento) y cuándo y cómo destruirla (disposición), asegurando que nada se pierda ni se maneje mal.","concepto":"Políticas fundacionales","seccion":"17 Security Policy Best Practices","dom":"Security Governance","obj":"2.1","area":"GRC: gobierno, riesgo y cumplimiento","dificultad":"facil","tipo":"aplicacion","cita_pdf":"A data handling policy provides detailed guidelines for the classification, storage, processing, and disposal of data. It incorporates legal compliance and protective measures, such as encryption.","pagina":342},{"id":"q0246","pregunta":"Tenés que diseñar una actividad para que tus compañeros mantengan presentes los riesgos de ciberseguridad en su día a día. Según la distinción de actividades, ¿qué deberías priorizar?","opciones":["Desarrollar un taller práctico para enseñar cómo configurar firewalls","Implementar una campaña de afiches y boletines informativos frecuentes","Dictar un curso conceptual profundo sobre los fundamentos de la criptografía","Organizar una charla magistral sobre la historia y evolución del malware"],"correcta":1,"porque_correcta":"La conciencia (awareness) busca mantener la seguridad en la mente de los empleados mediante recordatorios continuos, a diferencia de la formación técnica o la educación conceptual.","porque_incorrectas":["Este taller práctico se clasifica como entrenamiento (training), orientado a habilidades prácticas, no a la recordación constante.","Esto corresponde a la educación (education), que se enfoca en el 'por qué' y el conocimiento profundo, no en la visibilidad diaria.","Esto es educación teórica, la cual busca fundamentos académicos y no el refuerzo conductual necesario para mantener la seguridad visible."],"refuerzo":"Imaginá que necesitás que todos se acuerden de apagar la luz al salir. No les das una clase de física sobre electricidad (educación) ni un taller técnico de cableado (entrenamiento), sino que ponés un cartel en la puerta. Eso es 'awareness': un recordatorio constante que hace que el comportamiento sea instintivo y no requiera un esfuerzo consciente.","concepto":"Diferenciación Awareness vs Training","seccion":"18 Security Awareness Training","dom":"Security Governance","obj":"2.3","area":"Concienciación e ingeniería social","dificultad":"media","tipo":"aplicacion","cita_pdf":"Awareness focuses on behavioral reinforcement-using ongoing reminders such as posters, campaigns, and newsletters to keep security top of mind.","pagina":357},{"id":"q0247","pregunta":"Tu empresa quiere implementar un programa de seguridad para cumplir con normativas legales. ¿Qué enfoque motiva principalmente a este programa?","opciones":["La motivación por Cumplimiento (Compliance)","La motivación por Reacción (Reaction)","La motivación por Cultura (Culture)","La motivación por Eficiencia (Efficiency)"],"correcta":0,"porque_correcta":"El documento establece explícitamente que los programas se impulsan por tres motivaciones, siendo el cumplimiento legal una de las principales.","porque_incorrectas":["La reacción se refiere a responder a incidentes ocurridos, no a requisitos regulatorios preestablecidos.","La cultura se basa en los valores organizacionales y el comportamiento cotidiano, no en una imposición normativa.","La eficiencia es una mejora operativa, pero no es una de las tres categorías definitorias mencionadas para los programas de seguridad."],"refuerzo":"Las motivaciones son los 'motores' del programa. Si te obligan por ley, es Compliance. Si acabás de sufrir un hackeo grave, es Reaction. Si querés que la seguridad sea parte del ADN de la empresa, es Culture. Cada una requiere un enfoque distinto para ganar apoyo ejecutivo.","concepto":"Motivadores de programas","seccion":"18 Security Awareness Training","dom":"Security Governance","obj":"2.3","area":"Concienciación e ingeniería social","dificultad":"facil","tipo":"concepto","cita_pdf":"Security Awareness Programs are typically driven by one of three motivations: Compliance (regulatory requirements), Culture (organizational values), or Reaction (response to security incidents).","pagina":357},{"id":"q0248","pregunta":"Al diseñar una simulación de phishing, ¿cuál es el objetivo primordial según el texto?","opciones":["Evaluar la pericia técnica de los empleados en redes","Identificar la susceptibilidad de los usuarios a ataques","Reducir la necesidad de futuras capacitaciones formales","Medir la velocidad de respuesta del equipo de TI"],"correcta":1,"porque_correcta":"Las simulaciones se utilizan para exponer a los usuarios a escenarios realistas y así evaluar y reforzar su capacidad de reconocer amenazas reales en un entorno seguro.","porque_incorrectas":["El phishing es sobre ingeniería social y engaño al usuario, no sobre evaluar su capacidad técnica en redes.","Las simulaciones no eliminan la capacitación, son solo un componente que refuerza la práctica.","El objetivo no es medir la velocidad de TI, sino la capacidad de identificación de amenazas por parte del usuario final."],"refuerzo":"La simulación es como un simulacro de incendio. No querés que el edificio se queme, querés que la gente sepa qué hacer si suena la alarma. En phishing, buscás ver si el usuario hace clic o reporta, para que cuando llegue un ataque real, tengan 'memoria muscular' de la respuesta correcta.","concepto":"Objetivo de simulaciones","seccion":"18 Security Awareness Training","dom":"Security Governance","obj":"2.3","area":"Concienciación e ingeniería social","dificultad":"media","tipo":"concepto","cita_pdf":"Phishing simulations are activities that expose users to realistic phishing scenarios in a controlled environment to reinforce secure behavior. These simulations help organizations assess users' susceptibility to","pagina":355},{"id":"q0249","pregunta":"Un directivo de tu empresa sostiene la puerta para alguien que no tiene su tarjeta de acceso, solo por cortesía. ¿Qué principio fundamental de seguridad se ve afectado?","opciones":["La ineficiencia de los controles físicos de acceso","La explotación de cualidades humanas como la amabilidad","La falta de un sistema robusto de autenticación","La ausencia de un entrenamiento sobre el uso de tarjetas"],"correcta":1,"porque_correcta":"El texto explica que cualidades positivas como la ayuda y la cortesía son a menudo explotadas por atacantes para evadir medidas de seguridad técnicas robustas.","porque_incorrectas":["El control físico funciona, es el comportamiento humano el que lo elude, no el control en sí mismo.","El problema no es que el sistema sea débil, sino que el atacante usa una conducta socialmente esperada (ser amable) contra el sistema.","Aunque el entrenamiento podría ayudar, el ejemplo resalta cómo el atacante instrumentaliza la conducta humana para vulnerar incluso sistemas que ya existen."],"refuerzo":"La seguridad a menudo falla no porque el código sea malo, sino porque somos humanos. Somos sociales, amables y confiados. Un atacante sabe que si actúa con urgencia o parece un colega amable, es más probable que le abras la puerta que si lo cuestionás. Ese es el núcleo de la ingeniería social.","concepto":"Ingeniería social","seccion":"18 Security Awareness Training","dom":"Security Governance","obj":"2.3","area":"Concienciación e ingeniería social","dificultad":"media","tipo":"analisis","cita_pdf":"Qualities such as trust, helpfulness, and a sense of urgency-that are generally encouraged in the workplace-are routinely exploited by attackers. A typical example is physical access control: Even the most secure door lock becomes ineffective if an employee holds the door open for an unauthorized person out of courtesy.","pagina":346},{"id":"q0250","pregunta":"Tenés que explicar a un nuevo empleado la diferencia entre 'Education' y 'Training'. ¿Qué dirías?","opciones":["Education enseña el cómo y Training el porqué","Education construye fundamentos y Training desarrolla habilidades prácticas","Education es para directivos y Training para el personal técnico","Education se hace en el aula y Training mediante simulaciones únicamente"],"correcta":1,"porque_correcta":"El texto define claramente que la educación se enfoca en el conocimiento conceptual (el 'por qué'), mientras que el entrenamiento se enfoca en las habilidades prácticas (el 'cómo').","porque_incorrectas":["Esta opción invierte los roles definidos en el documento.","La distinción no se basa en el nivel jerárquico sino en el objetivo pedagógico.","Aunque el lugar y el método pueden variar, no es la definición fundamental basada en el 'por qué' frente al 'cómo'."],"refuerzo":"Pensá en aprender a manejar: la educación es entender cómo funciona el motor y las leyes de tránsito (conceptual), mientras que el entrenamiento es sentarte con un instructor a practicar el cambio de marchas y el estacionamiento (habilidades prácticas). Necesitás ambas para ser un buen conductor.","concepto":"Diferencia Educación vs Training","seccion":"18 Security Awareness Training","dom":"Security Governance","obj":"2.3","area":"Concienciación e ingeniería social","dificultad":"media","tipo":"concepto","cita_pdf":"Education focuses on the \"why\"-building foundational knowledge and conceptual understanding. Training focuses on the \"how\"-developing practical skills through hands-on exercises and simulations.","pagina":357},{"id":"q0251","pregunta":"Si un programa de seguridad no está alineado con los objetivos de negocio, ¿qué riesgo principal corre?","opciones":["Perder el apoyo ejecutivo y la asignación de recursos","Incrementar innecesariamente el costo de las licencias","Disminuir la complejidad técnica de los sistemas","Fomentar una cultura donde el empleado es el enemigo"],"correcta":0,"porque_correcta":"Para ganar el apoyo necesario de la dirección y los recursos, el programa debe estar alineado con lo que la empresa intenta lograr, tal como indica el texto.","porque_incorrectas":["El costo de las licencias es una variable técnica, no el impacto directo de la falta de alineación estratégica.","La alineación estratégica busca eficiencia, no necesariamente afecta la complejidad técnica de los sistemas.","Si bien es un riesgo cultural, el texto enfatiza la necesidad de alineación para obtener recursos y soporte gerencial como prioridad crítica."],"refuerzo":"Si intentás vender seguridad como un 'gasto' sin explicar cómo protege el negocio, los ejecutivos te van a cerrar la puerta. Si explicás cómo tu programa ayuda a que el negocio siga operando sin interrupciones, el apoyo llega solo. El alineamiento estratégico es el lenguaje que habla el liderazgo.","concepto":"Alineación estratégica","seccion":"18 Security Awareness Training","dom":"Security Governance","obj":"2.3","area":"Concienciación e ingeniería social","dificultad":"media","tipo":"analisis","cita_pdf":"Effective Security Awareness Programs must align with organizational objectives to gain executive support and secure necessary resources.","pagina":357},{"id":"q0252","pregunta":"Al final de un ciclo de concientización, querés que el comportamiento seguro sea algo 'instintivo'. ¿Qué implica esto?","opciones":["Que el empleado ya no necesita seguir las políticas de seguridad","Que el proceso requiere menos esfuerzo consciente con el tiempo","Que la seguridad ha sido automatizada por el departamento de TI","Que los empleados ya no requieren más entrenamiento ni educación"],"correcta":1,"porque_correcta":"El documento explica que, a través de la práctica constante, acciones que antes requerían esfuerzo consciente se vuelven instintivas, convirtiéndose en hábitos.","porque_incorrectas":["Al contrario, ser instintivo significa que las políticas se siguen sin que sea una carga pesada.","La automatización es técnica, esto habla de la conducta del usuario, son cosas distintas.","Siempre se requiere mantenimiento, aunque el grado de esfuerzo consciente disminuya."],"refuerzo":"Al principio, ponerte el cinturón de seguridad en el auto te tomaba un segundo extra y pensabas en ello. Hoy, te lo ponés sin darte cuenta. Esa es la meta: convertir las prácticas de seguridad en hábitos automáticos donde el empleado no tiene que 'hacer el esfuerzo' de recordar.","concepto":"Hábitos seguros","seccion":"18 Security Awareness Training","dom":"Security Governance","obj":"2.3","area":"Concienciación e ingeniería social","dificultad":"media","tipo":"concepto","cita_pdf":"A strong security culture requires consistent, long-term commitment to security awareness initiatives until secure behavior transitions from a conscious effort to an instinctive habit.","pagina":348},{"id":"q0253","pregunta":"Un jefe de área modela comportamientos seguros constantemente. Según el texto, ¿qué impacto directo tiene esto?","opciones":["Reduce la necesidad de implementar controles técnicos","Refuerza la cultura de seguridad en toda la organización","Elimina la posibilidad de errores humanos en su equipo","Aumenta la velocidad de ejecución de las tareas diarias"],"correcta":1,"porque_correcta":"El liderazgo que modela comportamientos seguros es un pilar fundamental para construir una cultura de seguridad fuerte, donde los pares también refuerzan estas normas.","porque_incorrectas":["El liderazgo nunca elimina la necesidad de controles técnicos, los complementa.","Aunque mejora la calidad, nunca se pueden eliminar totalmente los errores humanos.","Modelar seguridad no garantiza rapidez; de hecho, a veces hacer las cosas bien puede requerir más tiempo inicialmente."],"refuerzo":"Si el jefe hace una excepción a la regla de seguridad, todos van a copiar esa excepción. Si el jefe sigue la regla, todos saben que la regla es seria. Los líderes no solo dirigen, 'marcan la cancha' con su propio ejemplo, lo cual es el motor principal de la cultura.","concepto":"Liderazgo y cultura","seccion":"18 Security Awareness Training","dom":"Security Governance","obj":"2.3","area":"Concienciación e ingeniería social","dificultad":"media","tipo":"analisis","cita_pdf":"A strong security culture is evident when leadership models secure behavior and employees actively reinforce those practices among peers.","pagina":357},{"id":"q0254","pregunta":"El documento menciona que los programas de seguridad deben ajustarse al contexto de cada organización. ¿Qué factores influyen en este ajuste?","opciones":["El presupuesto disponible, el tamaño de la oficina y el sistema operativo usado","El perfil de riesgo, la industria, el entorno operativo y la cultura","La ubicación geográfica, la cantidad de empleados y los proveedores","El tipo de hardware utilizado, las leyes laborales y los horarios"],"correcta":1,"porque_correcta":"Los programas deben adaptarse considerando el perfil de riesgo, el entorno operativo, la industria y la cultura interna, entre otros factores estratégicos.","porque_incorrectas":["Estos son aspectos tácticos (presupuesto, tamaño), pero ignoran los factores estratégicos clave como el perfil de riesgo.","La ubicación y el número de empleados son menos críticos que los riesgos inherentes y la industria para el éxito del programa.","Aunque el hardware es relevante, no es el factor determinante central para el diseño del programa de concientización."],"refuerzo":"No podés usar el mismo programa de seguridad para un hospital que para una empresa de diseño gráfico. Sus riesgos, sus datos críticos y su cultura de trabajo son totalmente diferentes. Tenés que adaptar el contenido a la realidad específica de tu 'ecosistema' empresarial.","concepto":"Personalización del programa","seccion":"18 Security Awareness Training","dom":"Security Governance","obj":"2.3","area":"Concienciación e ingeniería social","dificultad":"facil","tipo":"concepto","cita_pdf":"Security awareness programs must be tailored to fit each organization's unique context, risk profile, industry, and operating environment.","pagina":358},{"id":"q0255","pregunta":"En el contexto de la seguridad, ¿por qué son efectivos los afiches como herramienta de concientización?","opciones":["Porque reemplazan la necesidad de entrenamiento formal en su totalidad","Porque son herramientas económicas para educar conceptos complejos","Porque mantienen la visibilidad del mensaje en el lugar de trabajo","Porque permiten medir con precisión la atención de los empleados"],"correcta":2,"porque_correcta":"Los afiches actúan como recordatorios visuales constantes, manteniendo la seguridad visible y reforzando mensajes clave sin pretender reemplazar una formación profunda.","porque_incorrectas":["El documento es claro en que los afiches apoyan la retención, pero no reemplazan la necesidad de formación en aspectos técnicos.","No son ideales para conceptos complejos, sino para mensajes simples y directos.","Los afiches no sirven para medir la atención, su objetivo es el refuerzo constante a través de la exposición visual."],"refuerzo":"El afiche es como un 'nudge' o empujoncito. No te enseña a hackear, pero te recuerda: '¿bloqueaste tu pantalla hoy?'. Esa pequeña visibilidad constante es lo que ayuda a que el concepto no se pierda entre las mil otras tareas que tenés en el día.","concepto":"Herramientas de awareness","seccion":"18 Security Awareness Training","dom":"Security Governance","obj":"2.3","area":"Concienciación e ingeniería social","dificultad":"facil","tipo":"aplicacion","cita_pdf":"As constant visual reminders, posters reinforce expected behaviors and support long-term retention of security practices, thus eliminating the need for formal training sessions.","pagina":355},{"id":"q0256","pregunta":"Un empleado recibe un mensaje con un número de factura extraño y un link. Si tuvieras que categorizar esta amenaza, ¿cuál es la más probable?","opciones":["Vishing","Whaling","Phishing","Smishing"],"correcta":3,"porque_correcta":"El Smishing (SMS phishing) se refiere específicamente a ataques de phishing enviados a través de mensajes de texto, los cuales suelen incluir enlaces maliciosos como el descrito.","porque_incorrectas":["El vishing se realiza por voz (llamadas telefónicas), no por mensajes de texto con hipervínculos.","El whaling es una variante de phishing dirigida a altos ejecutivos (ballenas), algo que no está implícito en la descripción general del ataque.","Aunque es phishing, el término específico para mensajes de texto es Smishing, siendo esta la opción más técnica y precisa según el ejercicio planteado."],"refuerzo":"El phishing es el paraguas. Si te llega por mail es phishing tradicional; si te llega por voz es vishing; si te llega por SMS es smishing. Identificar el canal es clave para entender cómo los atacantes adaptan sus métodos para que el link parezca legítimo.","concepto":"Tipos de ataques","seccion":"18 Security Awareness Training","dom":"Security Governance","obj":"2.3","area":"Concienciación e ingeniería social","dificultad":"dificil","tipo":"analisis","cita_pdf":"An employee received a suspicious text message with an unfamiliar invoice number and a hyperlink for more information. Which of the following attacks is MOST likely being described?","pagina":358},{"id":"q0257","pregunta":"Al diseñar el programa, reconocés que las personas pueden eludir medidas técnicas robustas. ¿Cuál es la implicación estratégica de esto?","opciones":["Debemos reemplazar las medidas técnicas por concientización","Debemos enfocar los recursos solo en fortalecer la tecnología","Debemos tratar el comportamiento humano como una vulnerabilidad crítica","Debemos limitar el acceso de los empleados a información crítica"],"correcta":2,"porque_correcta":"El texto enfatiza que el factor humano es una fuente común de vulnerabilidad, ya que los atacantes prefieren explotar a las personas antes que a los sistemas técnicos.","porque_incorrectas":["No se deben reemplazar, ambas son necesarias; la seguridad es un equilibrio.","El texto indica que fortalecer la tecnología no es suficiente si el factor humano es vulnerable.","Aunque a veces se restringe el acceso, la estrategia de concientización busca empoderar al usuario para que sea una línea de defensa, no simplemente restringirle el acceso."],"refuerzo":"El atacante siempre busca el camino de menor resistencia. Si tenés un firewall de última generación, pero tu empleado entrega su contraseña por teléfono porque alguien le habló con urgencia, tu firewall no sirvió de nada. El usuario debe dejar de ser el eslabón débil y pasar a ser un sensor de amenazas.","concepto":"El factor humano","seccion":"18 Security Awareness Training","dom":"Security Governance","obj":"2.3","area":"Concienciación e ingeniería social","dificultad":"media","tipo":"analisis","cita_pdf":"In any organization, human behavior can circumvent even the most robust technical security measures. Attackers are well aware of this and often target people instead of systems.","pagina":346},{"id":"q0258","pregunta":"En las preguntas de revisión, ¿qué se entiende por una sesión de 'tabletop exercise'?","opciones":["Una simulación paso a paso de un incidente para validar reacciones","Un curso teórico de aula sobre los tipos de ataques posibles","Una prueba técnica de penetración realizada por expertos externos","Una auditoría de seguridad sobre las políticas de la empresa"],"correcta":0,"porque_correcta":"Es un ejercicio donde se discute un incidente paso a paso para validar y coordinar cómo reaccionará cada persona, sin necesidad de ejecutarlo en sistemas reales.","porque_incorrectas":["Los cursos teóricos de aula son educación, no ejercicios de validación de incidentes.","Las pruebas de penetración son evaluaciones técnicas, no ejercicios de coordinación de equipos.","Las auditorías evalúan el cumplimiento documental, no la respuesta ante un incidente simulado."],"refuerzo":"Imaginá una mesa redonda donde todos tienen un papel: IT, RRHH, Legal. Se plantea: 'tenemos un ransomware'. Cada uno dice qué haría. Ahí descubrís que el de legal no sabe a quién llamar o que IT no tiene el proceso claro. No hay sistemas, hay solo comunicación y estrategia.","concepto":"Ejercicios de simulación","seccion":"18 Security Awareness Training","dom":"Security Governance","obj":"2.3","area":"Concienciación e ingeniería social","dificultad":"media","tipo":"concepto","cita_pdf":"Which of these exercises goes through a sample of an incident step-by-step, validating what each person will do? ... A tabletop exercise","pagina":358},{"id":"x1_001","pregunta":"What is the difference between SFA and MFA?","opciones":["SFA uses one authentication method, while MFA uses two or more authentication methods","SFA uses two authentication methods, while MFA uses only one authentication method","SFA uses two or more authentication methods, while MFA uses only one authentication method","SFA uses one or more authentication methods, while MFA uses two methods"],"correcta":0,"concepto":"Examen 1 del libro","seccion":"Examen 1 del libro","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"media","oficial":true},{"id":"x1_002","pregunta":"When implementing authentication, which of the following is considered a best practice?","opciones":["Use only one method of authentication","Use two authentication methods, such as username and password","Use three authentication methods such as username, a password, and biometrics","Use two or more authentication methods, such as password, biometrics, and a pin code"],"correcta":3,"concepto":"Examen 1 del libro","seccion":"Examen 1 del libro","dom":"Security Principles","obj":"1.1","area":"Conceptos de ciberseguridad","dificultad":"media","oficial":true},{"id":"x1_003","pregunta":"Non-repudiation is ...:","opciones":["... the protection against an individual falsely denying having performed a particular action","... the right of an individual to control the distribution of information about themselves","... ensuring that protective security measures are in place","... a law with multinational implications"],"correcta":0,"concepto":"Two-Person Control","seccion":"Examen 1 del libro","dom":"Security Principles","obj":"1.1","area":"Conceptos de ciberseguridad","dificultad":"media","oficial":true},{"id":"x1_004","pregunta":"What is the purpose of non-repudiation? 355","opciones":["Protect personal and sensitive data","Ensure people are held responsible for transactions they conducted","Protect a company from incurring penalties from misuse of private information","Interpret privacy regulations and laws"],"correcta":1,"concepto":"Examen 1 del libro","seccion":"Examen 1 del libro","dom":"Security Principl nto believing that a communication is legitimate.","Each type exploits the trust of the recipient by masquerading as a legitimate source. Below are some common types of spoofing: Email spoofing allows an attacker to forge the sender's email address, making a fraudulent email appear to"],"Estrategias de defensa":["Instead, it should be strong, with many layers of protection. Indeed, the main goal is to make any possible attack so hard, expensive, and slow that enemies are stopped or found long before they can do what they want.","To effectively counter these threats, cybersecurity professionals must understand the mechanics of network systems and the tactics that attackers use to exploit them.","It becomes clear also that network security is not a destination, but a process that is always changing and ongoing."],"Estrategias de ataque":["Attackers typically exploit the weakest link in a network's defenses to bypass stronger protections. For instance, rather than targeting a well-protected server directly, they might compromise an employee's device with a weak password and use it as a springboard to escalate privileges and infiltrate deeper into the network.","Scripting Attacks exploit programming flaws, such as Cross-Site Scripting (XSS) and SQL Injection (SQLi), to gain unauthorized access.","These initial footholds often go undetected, enabling attackers to expand their reach undetected, which makes containment and remediation significantly challenging."],"Modelos de despliegue":["To help you understand this concept, consider traditional infrastructure like owning a car. You buy it, fuel it, and maintain it yourself, while cloud infrastructure is like renting a car; you pay only for what you use and the provider handles maintenance and upgrades."],"Responsabilidad compartida":["In traditional on-premises environments, organizations have full control over their systems and are therefore completely responsible for securing them. In contrast, cloud computing introduces a shared responsibility model between customers and providers."],"Beneficios de la nube":["A convenient alternative is to access computing power, storage, and even applications over the cloud, without having to maintain physical servers."],"Infraestructura dedicada":["This allows for full customization to meet specific availability, performance, and regulatory requirements. Dedicated infrastructure is often essential in industries like healthcare, finance, and government, where data protection, compliance, and operational control are critical."],"Naturaleza física de la nube":["While many think of \"the cloud' as purely intangible, it's important to clarify that this is a common misconception. The cloud consists of physical datacenters managed by entities known as the cloud service providers."],"Desafíos de on-premises":["In the past, organizations built and managed their own computer systems within offices, requiring significant upfront investments in hardware, licensed software, and skilled personnel."],"Acuerdos (MOU/MOA)":["In contrast, a Memorandum of Agreement (MOA) is a legally binding document that specifies the detailed terms, conditions, and responsibilities of all parties involved."],"Infraestructura cloud dedicada":["In the following sections, we will see that it is also possible to achieve dedicated computing resources within a cloud infrastructure, where the computing resources are provided externally. However, this option typically comes with higher costs and increased administrative requirements."],"Fundamentos del datacenter":["Regardless of whether infrastructure is on-premises or in the cloud, every digital service relies on a data center, a facility that houses computing and storage resources."],"Escalabilidad en la nube":["Cloud providers supply on-demand access to a shared pool of configurable computing resources (such as"],"Seguridad on-premises":["In traditional on-premises environments, organizations have full control over their systems and are therefore completely responsible for securing them."],"Riesgos de infraestructura externa":["It also eliminates many of the risks and performance variability associated with relying on external infrastructure providers."],"Adopción de la nube":["In fact, organizations and will promptly forego the significant investment and maintenance costs involved if given an alternative. A convenient alternative is to access computing power, storage, and even applications over the cloud, without having to maintain physical servers."],"Distinción on-premises vs nube":["The key difference lies in who owns and manages this data center. This distinction marks more than just a change of location; it represents a fundamental shift in how organizations approach technology, cost, and control."],"Estados de los datos":["Data at rest refers to stored or archived data including information in a database or any data stored on a hard drive of a server or personal device."],"Protección de datos":["Two hospitals use multi-party computation to engage in a medical research study without revealing detail about each other's patients."],"Limitaciones del DLP":["Inaccurate or incomplete labeling can result in false positives or undetected threats, which undermines the system's effectiveness in preventing data exfiltration."],"Cifrado asimétrico":["Asymmetric encryption leverages a public-private key pair, eliminating the need for key sharing, though it is computationally slower than symmetric methods.","The public key is used in asymmetric encryption and cannot be a secret, as it is meant to be shared"],"Firmas digitales":["Digital signatures combine hashing and asymmetric encryption to verify data integrity, authenticity, and non-repudiation, securely binding the message to the sender's identity."],"Datos en uso":["When data is actively processed, it often needs to be decrypted into memory, making it vulnerable to various security threats in the processing environment itself, such as application vulnerabilities and memory attacks."],"Hashing y salting":["Hashing is a one-way cryptographic process that converts data into a fixed-length output (hash) to verify data integrity, ensuring any alteration is detectable and enhancing password security with techniques like salting."],"Ciclo de vida de los datos":["The data lifecycle encompasses the stages of creation, storage, usage, sharing, archiving, and destruction, each with specific security measures to ensure proper management and compliance."],"Hashing":["Hashing is also important for ensuring data integrity. It can detect changes and"],"Cifrado simétrico":["Symmetric encryption uses a single shared key for encryption and decryption, ensuring efficiency but posing challenges in secure key distribution and scalability."],"Logging y seguridad":["Finally, we address the critical role of logging and monitoring in identifying and mitigating potential security incidents."],"PKI":["PKI ensures the authenticity of public keys in asymmetric encryption through digital certificates issued by trusted Certificate Authorities, enabling secure communication."],"Reducción superficie ataque":["Operating system hardening involves reducing a system to only what is necessary for it to function. In practice, this means removing unused software and device drivers (e.g., game and printer drivers) and disabling unnecessary and operating system features.","Operating system hardening involves reducing a system to only what is necessary for it to function. In practice, this means removing unused software and device drivers (e.g., game and printer drivers) and disabling unnecessary and operating system features."],"Implementación técnica políticas":["Security policies serve as blueprints for hardening; however, administrative controls only become effective when enforced through technical controls."],"Baselines de seguridad":["A security baseline is a set of standards, guidelines, and procedures that ensure a system or network meets a minimum level of security.","Security baselines establish the minimum-security standard that systems must meet, and change management ensures that patches, updates, and configuration changes do not introduce security vulnerabilities as systems evolve."],"Riesgo valores defecto":["As a result, they often include unnecessary services, exposed network ports, and default credentials that create predictable attack paths for attackers."],"Gestión cambios y rollback":["When the review phase identifies critical failures or unexpected disruptions, the rollback plan is activated to restore the system to its previous, known-good state and quickly reestablish normal operations."],"Hardening y autenticación":["Password policies define what constitutes a strong password, and system hardening enforces these requirements through technical controls such as password complexity rules and account lockout settings."],"Políticas gestión vulnerabilidades":["Vulnerability management policies require that identified vulnerabilities be remediated within a defined timeframe. System hardening implements these requirements through patching and updates, and secure configuration baselines."],"Principio menor privilegio":["Access control policies restrict system and data access to authorized users. System hardening enforces these policies through permissions, authentication mechanisms, and role-based access controls. These controls minimize excessive privileges and limit access pathways, reducing the attack surface and decreasing the potential impact and reach of a successful compromise."],"Hardening como proceso continuo":["Finally, the chapter emphasized that system hardening is an ongoing responsibility rather than a one-time task. Security baselines establish the minimum-security standard that systems must meet, and change management ensures that patches, updates, and configuration changes do not introduce security vulnerabilities as systems evolve."],"Gestión cambios y documentación":["If the change does not proceed as planned, this step serves as the ultimate safety mechanism. When the review phase identifies critical failures or unexpected disruptions, the rollback plan is activated to restore the system to its previous, known-good state and quickly reestablish normal operations."],"Diseño proveedores":["Most operating systems, applications, and network devices are designed by vendors to prioritize functionality and ease of deployment over security."],"Necesidad técnica vs intención":["Without policies that lead to system hardening, organizations must rely largely on user behavior and good intentions to maintain security. However, as discussed earlier, policies alone do not secure systems; they must be translated into concrete technical actions that reduce the attack surface."],"Gestión cambios y seguridad":["Change management ensures that patches, updates, and configuration changes do not introduce security vulnerabilities as systems evolve."],"Alcance y aplicabilidad":["Defining whether a policy covers specific roles, departments, contractors, or locations prevents confusion and ensures that security requirements are applied consistently in practice."],"Gestión de excepciones":["A formal exception process allows the organization to approve and document deviations in a controlled manner, treating them as risk acceptance decisions rather than informal workarounds."],"Lenguaje y claridad":["Security policies are written for the entire organization, not only technical staff. Using clear, straightforward language and defining technical terms helps ensure that employees understand their responsibilities and can apply the policy correctly in day-to-day work."],"Revisión y mantenimiento":["Security policies cannot remain static. Regular review ensures that policies continue to reflect current threats, technologies, and business practices, maintaining alignment with the organization's risk posture."],"Políticas vs Estándares":["For instance, a security policy may stipulate that customer data must be safeguarded against unauthorized access. This requirement demonstrates intent. The corresponding standard would then define how to fulfill this requirement."],"Rendición de cuentas":["Employees are typically required to formally acknowledge these policies, ensuring accountability and reinforcing their role in managing organizational risk."],"Estructura de la política":["The preamble section establishes senior management support and explain the policy's purpose, objectives, and scope."],"Adopción de políticas":["When employees understand that a policy supports goals such as reducing risk, protecting assets, or meeting regulatory obligations, they are more likely to follow it rather than view it as an unnecessary obstacle."],"Enforcement y consecuencias":["Policies are effective only when consistently enforced. Employees must understand that violations carry consequences, ranging from retraining or formal warnings to suspension"],"Políticas fundacionales":["Organizations may maintain many security policies; however, five are considered foundational and are the focus of this chapter: data handling, password management, acceptable use (AUP), bring your own device (BYOD), and privacy policies.","A data handling policy provides detailed guidelines for the classification, storage, processing, and disposal of data. It incorporates legal compliance and protective measures, such as encryption."],"BYOD":["Furthermore, the Bring Your Own Device (BYOD) policy balances the benefits of personal device usage with defined security requirements."],"Ciclo de vida de políticas":["The structure reflects the key stages of the policy lifecycle: authorization, requirements definition, enforcement, and ongoing review."],"Diferenciación Awareness vs Training":["Awareness focuses on behavioral reinforcement-using ongoing reminders such as posters, campaigns, and newsletters to keep security top of mind."],"Motivadores de programas":["Security Awareness Programs are typically driven by one of three motivations: Compliance (regulatory requirements), Culture (organizational values), or Reaction (response to security incidents)."],"Objetivo de simulaciones":["Phishing simulations are activities that expose users to realistic phishing scenarios in a controlled environment to reinforce secure behavior. These simulations help organizations assess users' susceptibility to"],"Diferencia Educación vs Training":["Education focuses on the \"why\"-building foundational knowledge and conceptual understanding. Training focuses on the \"how\"-developing practical skills through hands-on exercises and simulations."],"Alineación estratégica":["Effective Security Awareness Programs must align with organizational objectives to gain executive support and secure necessary resources."],"Hábitos seguros":["A strong security culture requires consistent, long-term commitment to security awareness initiatives until secure behavior transitions from a conscious effort to an instinctive habit."],"Liderazgo y cultura":["A strong security culture is evident when leadership models secure behavior and employees actively reinforce those practices among peers."],"Personalización del programa":["Security awareness programs must be tailored to fit each organization's unique context, risk profile, industry, and operating environment."],"Herramientas de awareness":["As constant visual reminders, posters reinforce expected behaviors and support long-term retention of security practices, thus eliminating the need for formal training sessions."],"Tipos de ataques":["An employee received a suspicious text message with an unfamiliar invoice number and a hyperlink for more information. Which of the following attacks is MOST likely being described?"],"El factor humano":["In any organization, human behavior can circumvent even the most robust technical security measures. Attackers are well aware of this and often target people instead of systems."],"Ejercicios de simulación":["Which of these exercises goes through a sample of an incident step-by-step, validating what each person will do? ... A tabletop exercise"]}</script>

<script id="odata" type="application/json">{"1.1":{"dom":"Security Principles","area":"Conceptos de ciberseguridad","texto":"Understand cybersecurity concepts — confidencialidad, integridad y disponibilidad (tríada CIA), AAA (autenticación, autorización y accounting), no repudio y privacidad."},"1.2":{"dom":"Security Principles","area":"Gestión de riesgo","texto":"Understand risk management concepts — ciclo de vida del riesgo, identificación, evaluación y tratamiento (evitar, mitigar, transferir, aceptar); amenaza, vulnerabilidad, probabilidad e impacto; riesgo residual y tolerancia."},"1.3":{"dom":"Security Principles","area":"Gobernanza: leyes, marcos y políticas","texto":"Understand governance concepts — regulaciones y leyes, marcos de referencia, políticas, estándares, procedimientos y guías, y en qué se diferencian."},"1.4":{"dom":"Security Principles","area":"Tipos de control","texto":"Understand cybersecurity controls — controles técnicos, administrativos y físicos, y sus funciones: preventivo, detectivo, correctivo, disuasorio y compensatorio."},"1.5":{"dom":"Security Principles","area":"Ética profesional","texto":"Maintain professional and ethical conduct — el Código de Ética de ISC2, sus cánones y su orden de prioridad, y el código de conducta de la organización."},"2.1":{"dom":"Security Governance","area":"GRC: gobierno, riesgo y cumplimiento","texto":"Plan Governance, Risk, and Compliance (GRC) — propósito e importancia del GRC, marcos de gobierno, cumplimiento regulatorio y auditoría."},"2.2":{"dom":"Security Governance","area":"Redundancia, continuidad y recuperación","texto":"Understand redundancy — continuidad del negocio (BC) y recuperación ante desastres (DR), alta disponibilidad, RTO y RPO, sitios alternativos y copias de respaldo."},"2.3":{"dom":"Security Governance","area":"Concienciación e ingeniería social","texto":"Understand security awareness — cultura organizacional, programas de concienciación, capacitación, ingeniería social, phishing y sus variantes."},"2.4":{"dom":"Security Governance","area":"Métricas de efectividad","texto":"Measure cybersecurity effectiveness — métricas, indicadores clave de riesgo (KRI) y de desempeño (KPI), tableros y reportes a la dirección."},"3.1":{"dom":"Identity and Access Management","area":"Ciclo de vida de identidades","texto":"Understand identity life cycle management — roles, alta (provisioning), revisión periódica de accesos y baja (deprovisioning); identificación, autenticación, factores y MFA."},"3.2":{"dom":"Identity and Access Management","area":"Control de acceso lógico","texto":"Understand logical access controls — privilegio mínimo, separación de funciones, necesidad de saber, y los modelos DAC, MAC, RBAC y ABAC."},"4.1":{"dom":"Networking and Cloud Security","area":"Seguridad de red","texto":"Understand network security — modelos OSI y TCP/IP, puertos y protocolos, VPN, firewalls, IDS/IPS, redes inalámbricas, sistemas embebidos e IoT, y ataques de red comunes."},"4.2":{"dom":"Networking and Cloud Security","area":"Arquitectura de red","texto":"Understand network security architecture — segmentación, DMZ, VLAN, microsegmentación, defensa en profundidad y Zero Trust."},"4.3":{"dom":"Networking and Cloud Security","area":"Seguridad en la nube","texto":"Understand cloud security — características esenciales de la nube, modelos de servicio (IaaS, PaaS, SaaS), modelos de despliegue, responsabilidad compartida y MSP."},"5.1":{"dom":"Security Operations and Incident Response","area":"Seguridad de datos","texto":"Understand data security — manejo y clasificación de datos, estados de los datos, retención y destrucción, cifrado simétrico y asimétrico, hashing, firma digital y PKI."},"5.2":{"dom":"Security Operations and Incident Response","area":"Operaciones y monitoreo","texto":"Understand security operations — registro (logging), monitoreo, SIEM, actores de amenaza y sus motivaciones, inteligencia de amenazas y políticas operativas."},"5.3":{"dom":"Security Operations and Incident Response","area":"Respuesta a incidentes","texto":"Understand Incident Response (IR) — plan y equipo de respuesta, fases (preparación, detección, contención, erradicación, recuperación, lecciones aprendidas) y ejercicios."},"5.4":{"dom":"Security Operations and Incident Response","area":"Protección de activos","texto":"Understand asset protection — inventario y ciclo de vida de activos, gestión de configuración, parches y cambios, y seguridad física del entorno."},"5.5":{"dom":"Security Operations and Incident Response","area":"Pruebas de seguridad","texto":"Understand security testing — evaluación de preparación, escaneo de vulnerabilidades, pruebas de aplicaciones y pruebas de penetración."}}</script>
