il), por lo que un ataque on-path no es obligatorio."],"refuerzo":"Pensá en el spoofing como el 'disfraz'. Para hacer un ataque 'on-path' (donde te metés en medio de una comunicación), a veces necesitás convencer al servidor o al cliente de que vos sos la otra parte. Ahí usás el spoofing (disfraz) para engañar a ambos extremos y que tu dispositivo se convierta en el puente que ellos creen que es legítimo.","concepto":"Ataques on-path","seccion":"13 Network Threats and Attacks","dom":"Security Operations and Incident Response","obj":"5.2","area":"Operaciones y monitoreo","dificultad":"dificil","tipo":"concepto","cita_pdf":"On-path attacks are often the result of a successful spoofing attack. In this case, the attacker could use IP spoofing to impersonate the bank web server or the IP address of other trusted devices in the network.","pagina":239,"fig":239},{"id":"q0182","pregunta":"Si un empleado conecta su equipo a una red Wi-Fi pública y no verificada, ¿qué riesgo principal está introduciendo según las recomendaciones de defensa?","opciones":["La posibilidad de comprometer la integridad de la red corporativa por ataques on-path","La exposición a técnicas de ingeniería social mediante elicitación","El aumento de la superficie de ataque para infecciones por malware","La pérdida total de disponibilidad del servicio de red"],"correcta":0,"porque_correcta":"El texto vincula explícitamente el uso de redes Wi-Fi públicas no seguras con el riesgo de comprometer comunicaciones, facilitando ataques de interceptación o on-path.","porque_incorrectas":["La elicitación requiere una interacción social directa, no depende de la conexión a una red Wi-Fi pública.","Aunque el malware es un riesgo general, el contexto específico de las redes Wi-Fi públicas en el texto apunta a la interceptación de tráfico.","El DoS (disponibilidad) no es el riesgo primario de usar una Wi-Fi abierta, sino la interceptación de lo que el usuario envía y recibe."],"refuerzo":"Las redes públicas son como conversar en voz alta en medio de una plaza: cualquiera que pase cerca (esté en la misma red) puede escuchar lo que decís. Si te conectás a una red Wi-Fi sin protección, alguien sentado cerca con un dispositivo puede interceptar todo tu tráfico, lo que permite ataques de tipo on-path sin que te des cuenta.","concepto":"Ataques on-path","seccion":"13 Network Threats and Attacks","dom":"Security Operations and Incident Response","obj":"5.2","area":"Operaciones y monitoreo","dificultad":"media","tipo":"analisis","cita_pdf":"Finally, educating employees about the risks of connecting to unsecured public Wi-Fi networks and the importance of verifying website legitimacy can significantly reduce the risk of compromise.","pagina":239,"fig":239},{"id":"q0183","pregunta":"Al diseñar una defensa, ¿por qué es crítico reconocer que el ataque es un 'proceso' y no un evento único?","opciones":["Porque permite identificar todas las vulnerabilidades del sistema","Porque la seguridad es una actividad cambiante y constante","Porque garantiza la detención definitiva de futuros atacantes","Porque minimiza el costo operativo de mantener los controles"],"correcta":1,"porque_correcta":"El texto subraya que la seguridad no es un destino ni un evento único, sino un proceso de adaptación continua frente a un panorama de amenazas que evoluciona.","porque_incorrectas":["No existe forma de identificar absolutamente todas las vulnerabilidades.","La seguridad no garantiza detenciones definitivas, ya que siempre aparecen nuevas tácticas.","El enfoque de proceso a menudo aumenta la complejidad y el mantenimiento, no los minimiza; es una necesidad para la efectividad."],"refuerzo":"La seguridad es como entrenar para un deporte: no alcanza con un día de gimnasio. Los atacantes siempre cambian sus tácticas (como un equipo rival que cambia su estrategia). Por eso, vos no podés dejar de monitorear, aprender y ajustar tus defensas. Es un ciclo sin fin donde la vigilancia y la mejora continua son el núcleo de la defensa.","concepto":"Estrategias de defensa","seccion":"13 Network Threats and Attacks","dom":"Security Operations and Incident Response","obj":"5.2","area":"Operaciones y monitoreo","dificultad":"facil","tipo":"concepto","cita_pdf":"It becomes clear also that network security is not a destination, but a process that is always changing and ongoing.","pagina":265},{"id":"q0184","pregunta":"Si un dispositivo es comprometido a través de una contraseña débil y luego utilizado para infiltrarse en otras partes de la red, ¿qué estrategia de ataque está utilizando el agresor?","opciones":["Movimiento lateral mediante la explotación de un eslabón débil","Ataque directo por saturación de ancho de banda","Suplantación de identidad mediante spoofing de IP","Elicitación técnica contra el personal de IT"],"correcta":0,"porque_correcta":"El texto explica que los atacantes buscan el eslabón más débil (como una contraseña) para usarlo como punto de partida para escalar privilegios y moverse por la red.","porque_incorrectas":["La saturación de ancho de banda es un ataque DoS, no un método de infiltración lateral.","El spoofing puede ser parte de la fase de infiltración, pero la descripción se centra en el salto entre sistemas (movimiento lateral).","La elicitación es para obtener información mediante el diálogo, no un método para saltar de un dispositivo a otro en una red."],"refuerzo":"Imaginá una cadena: no importa qué tan fuerte sea el hierro, si un eslabón está oxidado, ahí se romperá. Los atacantes siempre buscan ese eslabón débil (un usuario con una contraseña simple) para entrar. Una vez adentro, usan ese acceso como trampolín para ir saltando de computadora en computadora dentro de tu propia red. A esto se le llama movimiento lateral.","concepto":"Estrategias de ataque","seccion":"13 Network Threats and Attacks","dom":"Security Operations and Incident Response","obj":"5.2","area":"Operaciones y monitoreo","dificultad":"dificil","tipo":"analisis","cita_pdf":"Attackers typically exploit the weakest link in a network's defenses to bypass stronger protections. For instance, rather than targeting a well-protected server directly, they might compromise an employee's device with a weak password and use it as a springboard to escalate privileges and infiltrate deeper into the network.","pagina":213},{"id":"q0185","pregunta":"Si tenés que implementar una medida para prevenir ataques on-path activos y pasivos, ¿cuál de las siguientes opciones ofrece la protección más integral según el texto?","opciones":["Restringir el acceso físico al centro de datos","Implementar protocolos de cifrado de datos y segmentación","Bloquear todas las direcciones IP sospechosas manualmente","Educar a los empleados únicamente sobre phishing"],"correcta":1,"porque_correcta":"El documento recomienda el uso de cifrado (HTTPS, TLS, VPN) y segmentación de red como controles clave para asegurar las comunicaciones y detectar/bloquear ataques on-path.","porque_incorrectas":["El acceso físico al centro de datos no protege las comunicaciones que ocurren a través de la red (remotas).","Bloquear IPs es reactivo y poco escalable; no protege contra la naturaleza del ataque on-path en sí.","El phishing es solo una parte; no aborda la intercepción de tráfico de red que caracteriza a los ataques on-path."],"refuerzo":"Para frenar ataques que se meten en el medio de tus comunicaciones, necesitás que, aunque alguien intercepte los paquetes, no pueda leer nada ni cambiar nada. El cifrado (como un candado en la carta) hace que el contenido sea ilegible, y la segmentación (como cerrar puertas entre pasillos) evita que el atacante se mueva libremente por toda tu red.","concepto":"Ataques on-path","seccion":"13 Network Threats and Attacks","dom":"Security Operations and Incident Response","obj":"5.2","area":"Operaciones y monitoreo","dificultad":"dificil","tipo":"aplicacion","cita_pdf":"To protect against on-path attacks, cybersecurity professionals should encourage organizations to data encryption protocols, making data it unreadable even if intercepted, and prevent. Strong encryption protocols such as HTTPS, TLS, and VPNs can be used to secure communications between clients and servers. Additionally, network segmentation, intrusion","pagina":239,"fig":239},{"id":"q0186","pregunta":"¿Qué característica distingue a los ataques de tipo 'scripting' de otros tipos de ataques a redes mencionados en la sección?","opciones":["Utilizan fallas en la programación de aplicaciones web","Requieren el acceso físico al hardware del servidor","Se ejecutan siempre mediante la suplantación de IP","Tienen como único objetivo la denegación de servicio"],"correcta":0,"porque_correcta":"El documento clasifica los ataques de scripting, como SQL Injection o XSS, como exploits dirigidos específicamente a fallos en la programación de aplicaciones.","porque_incorrectas":["Los ataques de scripting se ejecutan de forma remota a través de peticiones web; no requieren acceso físico.","La suplantación de IP (spoofing) es una técnica distinta; el scripting se enfoca en el código, no en la dirección de red.","Los ataques de scripting buscan acceso no autorizado o robo de datos, no exclusivamente agotar la disponibilidad como un DoS."],"refuerzo":"El scripting es como buscar una puerta mal cerrada en el código de una página web. En lugar de romper la ventana (fuerza bruta), el atacante envía instrucciones especiales ('scripts') que la web confunde con órdenes legítimas. Así es como logran entrar a bases de datos o extraer información personal aprovechando errores en la forma en que se escribió la web.","concepto":"Estrategias de ataque","seccion":"13 Network Threats and Attacks","dom":"Security Operations and Incident Response","obj":"5.2","area":"Operaciones y monitoreo","dificultad":"media","tipo":"concepto","cita_pdf":"Scripting Attacks exploit programming flaws, such as Cross-Site Scripting (XSS) and SQL Injection (SQLi), to gain unauthorized access.","pagina":266},{"id":"q0187","pregunta":"Si un atacante logra comprometer un sistema, ¿por qué los defenders suelen tener dificultades para contenerlo?","opciones":["Porque los atacantes suelen ser más rápidos que los sistemas de defensa automática","Porque los atacantes entran mediante canales ocultos sin dejar registros","Porque a menudo las intrusiones iniciales pasan inadvertidas durante tiempo","Porque no existen herramientas de monitoreo capaces de detectar movimientos laterales"],"correcta":2,"porque_correcta":"El documento señala que los puntos de entrada iniciales (footholds) suelen pasar inadvertidos, lo que permite al atacante expandirse antes de que se detecte el incidente.","porque_incorrectas":["La velocidad no es la razón fundamental; es la invisibilidad o el sigilo del punto de entrada inicial.","Los atacantes sí dejan rastros, pero la dificultad radica en que esos rastros iniciales no son detectados a tiempo.","Existen herramientas como los NIDS y SIEM, pero la dificultad técnica es identificar la amenaza antes de que se propague el compromiso inicial."],"refuerzo":"El problema no es que no se pueda detectar, sino que los atacantes son expertos en esconderse en el ruido de la red. Si entran por una puerta pequeña que no parece sospechosa (como una contraseña de un empleado), pueden instalarse ahí y quedarse 'dormidos' sin levantar alarmas durante mucho tiempo, lo que complica enormemente limpiar el sistema después.","concepto":"Estrategias de ataque","seccion":"13 Network Threats and Attacks","dom":"Security Operations and Incident Response","obj":"5.2","area":"Operaciones y monitoreo","dificultad":"media","tipo":"analisis","cita_pdf":"These initial footholds often go undetected, enabling attackers to expand their reach undetected, which makes containment and remediation significantly challenging.","pagina":213},{"id":"q0188","pregunta":"¿Qué analogía describe mejor la diferencia fundamental entre la infraestructura on-premises y la nube?","opciones":["On-premises es como alquilar una casa; la nube es como construir una desde cero.","On-premises es como comprar un auto; la nube es como alquilarlo y que otro haga el mantenimiento.","On-premises es como usar transporte público; la nube es como comprar un vehículo propio.","On-premises es como pagar una suscripción de streaming; la nube es como comprar discos físicos."],"correcta":1,"porque_correcta":"La analogía del auto refleja la propiedad frente al servicio, donde en el modelo on-prem gestionás todo y en la nube el proveedor se encarga de los mantenimientos.","porque_incorrectas":["La relación de propiedad está invertida; el modelo local implica ser dueño, no inquilino.","El transporte público no ofrece el control que se tiene en on-premises; la analogía es incorrecta.","Los roles están invertidos: el streaming es el modelo de servicio (nube), no el físico."],"refuerzo":"Si comprás un auto, tenés que cambiarle el aceite, las gomas y pagar el seguro vos mismo; tenés control total pero también mucho trabajo. Si alquilás un auto, el dueño se encarga de que funcione, y vos solo pagás por los kilómetros que lo usás. La infraestructura propia es el auto comprado; la nube es el auto alquilado.","concepto":"Modelos de despliegue","seccion":"14 On-Premises and Cloud Infrastructure","dom":"Networking and Cloud Security","obj":"4.3","area":"Seguridad en la nube","dificultad":"facil","tipo":"concepto","cita_pdf":"To help you understand this concept, consider traditional infrastructure like owning a car. You buy it, fuel it, and maintain it yourself, while cloud infrastructure is like renting a car; you pay only for what you use and the provider handles maintenance and upgrades.","pagina":270},{"id":"q0189","pregunta":"Un cliente te consulta sobre la responsabilidad en un entorno de nube frente a uno local. ¿Qué cambio fundamental debés explicarle?","opciones":["En la nube, la responsabilidad de seguridad recae exclusivamente en el proveedor externo.","En el entorno local, la responsabilidad es compartida entre múltiples proveedores.","En la nube, existe un modelo de responsabilidad compartida entre cliente y proveedor.","En ambos modelos, la responsabilidad de la seguridad física es del usuario final."],"correcta":2,"porque_correcta":"El cambio de paradigma hacia la nube introduce la necesidad de definir los límites de quién es responsable de qué, lo cual no ocurre de forma compartida en el entorno local.","porque_incorrectas":["Es un error común pensar que la nube libera de toda responsabilidad al cliente.","En el entorno local, la organización tiene control total, no depende de terceros.","La seguridad física es responsabilidad del proveedor en la nube, no del usuario."],"refuerzo":"Pensalo como un departamento en un edificio. Si tenés una casa (on-premises), sos responsable de toda la estructura, la vereda y el techo. Si vivís en un departamento (nube), el consorcio es responsable de los cimientos y pasillos, pero vos sos responsable de lo que pasa adentro de tu unidad. Ese reparto de tareas es el modelo de responsabilidad compartida.","concepto":"Responsabilidad compartida","seccion":"14 On-Premises and Cloud Infrastructure","dom":"Networking and Cloud Security","obj":"4.3","area":"Seguridad en la nube","dificultad":"media","tipo":"analisis","cita_pdf":"In traditional on-premises environments, organizations have full control over their systems and are therefore completely responsible for securing them. In contrast, cloud computing introduces a shared responsibility model between customers and providers.","pagina":271},{"id":"q0190","pregunta":"Si una empresa decide migrar de un centro de datos local a la nube, ¿qué beneficio operativo principal debería esperar según el texto?","opciones":["Aumentar el control administrativo sobre la seguridad física del datacenter.","Eliminar la necesidad de mantener servidores físicos propios.","Incrementar la complejidad en la gestión de recursos de almacenamiento.","Reducir la dependencia de proveedores de servicios de terceros."],"correcta":1,"porque_correcta":"La principal ventaja de la nube es delegar la gestión del hardware físico, evitando que la empresa deba encargarse del mantenimiento del datacenter.","porque_incorrectas":["El control sobre la seguridad física disminuye, no aumenta.","La complejidad suele reducirse para el cliente, no aumentar.","Migrar a la nube aumenta la dependencia con el proveedor, no la reduce."],"refuerzo":"Imaginá que antes tenías que fabricar tus propias piezas de muebles para armar tu oficina. Ahora, podés pedirlas hechas a medida y solo dedicás tiempo a decorarlas. Al migrar a la nube, ya no tenés que soldar ni reparar los estantes (servidores físicos), solo los usás.","concepto":"Beneficios de la nube","seccion":"14 On-Premises and Cloud Infrastructure","dom":"Networking and Cloud Security","obj":"4.3","area":"Seguridad en la nube","dificultad":"facil","tipo":"aplicacion","cita_pdf":"A convenient alternative is to access computing power, storage, and even applications over the cloud, without having to maintain physical servers.","pagina":276},{"id":"q0191","pregunta":"Analizando la elección de una infraestructura, ¿por qué un hospital podría preferir una solución 'dedicated' en lugar de un servicio de nube pública compartido?","opciones":["Porque permite reducir drásticamente los costos mensuales de operación.","Porque garantiza la disponibilidad y el cumplimiento de requisitos regulatorios estrictos.","Porque facilita el acceso público a los datos desde cualquier parte del mundo.","Porque elimina la necesidad de contar con personal técnico especializado en sitio."],"correcta":1,"porque_correcta":"Las industrias reguladas requieren niveles de control y personalización que se logran mejor con infraestructura dedicada, permitiendo cumplir normativas específicas.","porque_incorrectas":["Las soluciones dedicadas suelen ser más costosas que las compartidas.","El objetivo es precisamente restringir el acceso, no hacerlo público.","Se sigue necesitando personal técnico, a menudo con mayores capacidades de gestión."],"refuerzo":"Si tenés que guardar muestras médicas que necesitan temperatura constante y auditoría legal, no podés ponerlas en una heladera común de un supermercado. Necesitás tu propia cámara frigorífica con tu propio termómetro y libro de registros. Eso es una infraestructura dedicada: control exclusivo para cumplir normas.","concepto":"Infraestructura dedicada","seccion":"14 On-Premises and Cloud Infrastructure","dom":"Networking and Cloud Security","obj":"4.3","area":"Seguridad en la nube","dificultad":"dificil","tipo":"analisis","cita_pdf":"This allows for full customization to meet specific availability, performance, and regulatory requirements. Dedicated infrastructure is often essential in industries like healthcare, finance, and government, where data protection, compliance, and operational control are critical.","pagina":276},{"id":"q0192","pregunta":"Un colega afirma que 'la nube es algo intangible'. Basándote en el documento, ¿por qué esta afirmación es incorrecta?","opciones":["Porque la nube depende exclusivamente de la conectividad por fibra óptica.","Porque la nube se compone de datacenters físicos gestionados por proveedores.","Porque los usuarios pueden ver y tocar sus datos directamente en el datacenter.","Porque la nube está siempre alojada en servidores dentro de la propia oficina."],"correcta":1,"porque_correcta":"La percepción de intangibilidad es un malentendido; la nube requiere una base material compuesta por centros de datos tangibles.","porque_incorrectas":["Si bien usa conectividad, no es la esencia de la definición de nube.","El usuario nunca tiene acceso físico a los datacenters del proveedor.","La nube no está en la oficina local; eso sería on-premises."],"refuerzo":"Pensá en el servicio de agua corriente. Podés pensar que el agua 'aparece' mágicamente al abrir la canilla, pero en realidad hay cañerías, bombas y represas reales. La nube es igual: el acceso es virtual, pero el hardware está ahí, físicamente, ocupando espacio y consumiendo electricidad.","concepto":"Naturaleza física de la nube","seccion":"14 On-Premises and Cloud Infrastructure","dom":"Networking and Cloud Security","obj":"4.3","area":"Seguridad en la nube","dificultad":"media","tipo":"concepto","cita_pdf":"While many think of \"the cloud' as purely intangible, it's important to clarify that this is a common misconception. The cloud consists of physical datacenters managed by entities known as the cloud service providers.","pagina":277},{"id":"q0193","pregunta":"¿Qué aspecto de la infraestructura on-premises suele representar un desafío mayor para las pequeñas y medianas empresas?","opciones":["La falta de flexibilidad al aumentar el control sobre el hardware propio.","La facilidad de delegar la seguridad física a proveedores externos.","La inversión inicial significativa y la necesidad de personal capacitado.","La dificultad para acceder a los datos cuando se encuentran en la propia oficina."],"correcta":2,"porque_correcta":"El modelo tradicional requiere un capital inicial alto y expertos para mantener el datacenter, lo cual es difícil de sostener para empresas pequeñas.","porque_incorrectas":["El modelo on-premises destaca justamente por el control, no por la falta de este.","La empresa es la que gestiona la seguridad, no la delega.","El acceso local suele ser rápido, el problema es el costo y mantenimiento."],"refuerzo":"Imaginá abrir una cafetería. Si tenés que construir el molino de café, la cafetera industrial y la red de tuberías de agua vos mismo, vas a gastar una fortuna antes de servir el primer café. Eso es on-premises. La nube es como alquilar un local que ya tiene todo instalado, pagando solo el uso mensual.","concepto":"Desafíos de on-premises","seccion":"14 On-Premises and Cloud Infrastructure","dom":"Networking and Cloud Security","obj":"4.3","area":"Seguridad en la nube","dificultad":"media","tipo":"analisis","cita_pdf":"In the past, organizations built and managed their own computer systems within offices, requiring significant upfront investments in hardware, licensed software, and skilled personnel.","pagina":270},{"id":"q0194","pregunta":"En el contexto de la gestión de acuerdos, ¿cuál es la diferencia clave entre un MOU y un MOA?","opciones":["El MOU es un acuerdo legal vinculante, mientras que el MOA es informativo.","El MOA es un documento legalmente exigible, mientras que el MOU no lo es.","El MOA se usa solo internamente, mientras que el MOU es para terceros.","El MOU especifica responsabilidades detalladas, mientras que el MOA es genérico."],"correcta":1,"porque_correcta":"La distinción central radica en la exigibilidad legal: el MOA es un contrato vinculante para situaciones críticas, mientras que el MOU es un acuerdo de entendimiento mutuo.","porque_incorrectas":["Es al revés; el MOU no es vinculante.","Ambos pueden usarse en distintos escenarios; la diferencia es la vinculación legal.","Las funciones están invertidas respecto a la precisión y exigibilidad."],"refuerzo":"Imaginá que hacés una promesa a un amigo de ir al cine (MOU: nos entendemos, pero no hay castigo si fallás). Ahora imaginá que firmás un contrato de alquiler (MOA: hay penas legales si no cumplís). Cuando necesitás planificar algo crítico, necesitás el segundo.","concepto":"Acuerdos (MOU/MOA)","seccion":"14 On-Premises and Cloud Infrastructure","dom":"Networking and Cloud Security","obj":"4.3","area":"Seguridad en la nube","dificultad":"dificil","tipo":"concepto","cita_pdf":"In contrast, a Memorandum of Agreement (MOA) is a legally binding document that specifies the detailed terms, conditions, and responsibilities of all parties involved.","pagina":291},{"id":"q0195","pregunta":"Si un proveedor ofrece 'dedicated computing resources within a cloud infrastructure', ¿qué trade-off está asumiendo el cliente?","opciones":["Mayor seguridad, pero a costa de menores costos y menos administración.","Mayor control, pero a costa de mayores costos y más administración.","Menor rendimiento, pero a costa de mayor flexibilidad de acceso.","Menor personalización, pero a costa de una escalabilidad ilimitada."],"correcta":1,"porque_correcta":"Lograr recursos dedicados dentro de la nube permite cumplir con requisitos estrictos de control, pero esto aumenta el costo y la gestión administrativa.","porque_incorrectas":["El costo es mayor, no menor.","El rendimiento suele ser igual o superior, no menor.","La personalización es mayor en recursos dedicados, no menor."],"refuerzo":"Es como contratar un asiento en un vuelo. Si querés un asiento exclusivo con más espacio y servicios premium, pagás más y tenés que pasar por más procesos de check-in y selección. La exclusividad tiene un precio económico y de gestión.","concepto":"Infraestructura cloud dedicada","seccion":"14 On-Premises and Cloud Infrastructure","dom":"Networking and Cloud Security","obj":"4.3","area":"Seguridad en la nube","dificultad":"dificil","tipo":"analisis","cita_pdf":"In the following sections, we will see that it is also possible to achieve dedicated computing resources within a cloud infrastructure, where the computing resources are provided externally. However, this option typically comes with higher costs and increased administrative requirements.","pagina":276},{"id":"q0196","pregunta":"Al diseñar un entorno de TI, ¿qué componente es fundamental tanto en la infraestructura on-premises como en la nube?","opciones":["El personal especializado en hardware local.","El datacenter, donde residen los recursos informáticos.","El contrato de arrendamiento de hardware físico.","La red física privada propiedad de la organización."],"correcta":1,"porque_correcta":"Independientemente del modelo, todo servicio digital descansa sobre un centro de datos que aloja los recursos.","porque_incorrectas":["En la nube, el personal no gestiona hardware local.","En la nube, el hardware suele ser del proveedor, no hay contrato de arrendamiento específico de hardware.","La red no tiene que ser necesariamente privada en la nube."],"refuerzo":"Da igual si ves una película en DVD (local) o por Netflix (nube): en algún lugar del mundo hay una máquina que almacena esos datos. Esa máquina es el datacenter. Es la base de toda la infraestructura, ya sea tuya o alquilada.","concepto":"Fundamentos del datacenter","seccion":"14 On-Premises and Cloud Infrastructure","dom":"Networking and Cloud Security","obj":"4.3","area":"Seguridad en la nube","dificultad":"facil","tipo":"concepto","cita_pdf":"Regardless of whether infrastructure is on-premises or in the cloud, every digital service relies on a data center, a facility that houses computing and storage resources.","pagina":270},{"id":"q0197","pregunta":"Tu empresa necesita flexibilidad total para escalar recursos rápidamente ante picos de demanda. ¿Por qué elegirías la nube?","opciones":["Porque el proveedor permite personalizar cada pieza de hardware físico.","Porque los proveedores ofrecen acceso bajo demanda a un pool compartido de recursos.","Porque on-premises garantiza el acceso exclusivo sin depender de terceros.","Porque la nube obliga a mantener servidores físicos para emergencias."],"correcta":1,"porque_correcta":"La nube destaca por la capacidad de acceder a recursos compartidos de forma escalable, lo cual es ideal para variaciones en la demanda.","porque_incorrectas":["La personalización de hardware físico es limitada en la nube.","On-premises no es escalable rápidamente, requiere comprar equipo nuevo.","La nube elimina la gestión de servidores físicos por parte del cliente."],"refuerzo":"Imaginá que necesitás más sillas para una fiesta. En on-premises, tenés que salir a comprar y almacenar más sillas (costoso, lento). En la nube, las alquilás solo por esa noche y las devolvés al día siguiente. Eso es el acceso a un pool de recursos.","concepto":"Escalabilidad en la nube","seccion":"14 On-Premises and Cloud Infrastructure","dom":"Networking and Cloud Security","obj":"4.3","area":"Seguridad en la nube","dificultad":"media","tipo":"aplicacion","cita_pdf":"Cloud providers supply on-demand access to a shared pool of configurable computing resources (such as","pagina":277},{"id":"q0198","pregunta":"¿Qué ocurre si una organización decide mantener su infraestructura on-premises en términos de seguridad?","opciones":["La responsabilidad se comparte con el proveedor de hardware.","La organización retiene la responsabilidad total de asegurar sus sistemas.","La seguridad es gestionada por un tercero para garantizar el cumplimiento.","La responsabilidad de la seguridad se minimiza debido al control directo."],"correcta":1,"porque_correcta":"Al ser dueño de toda la infraestructura, la carga de mantener la seguridad recae por completo en la propia organización.","porque_incorrectas":["En on-premises, no hay un proveedor externo que gestione la seguridad.","La organización gestiona la seguridad, pero no es un tercero.","La responsabilidad aumenta, no se minimiza, porque todo depende de la empresa."],"refuerzo":"Si sos dueño de una casa, sos responsable de contratar la empresa de alarmas, poner las cámaras y arreglar las puertas. No podés decirle a nadie más que su trabajo fue fallar. Tenés el control, pero la carga es toda tuya.","concepto":"Seguridad on-premises","seccion":"14 On-Premises and Cloud Infrastructure","dom":"Networking and Cloud Security","obj":"4.3","area":"Seguridad en la nube","dificultad":"media","tipo":"analisis","cita_pdf":"In traditional on-premises environments, organizations have full control over their systems and are therefore completely responsible for securing them.","pagina":271},{"id":"q0199","pregunta":"¿Cuál es una consecuencia de la 'variabilidad' en el rendimiento asociada a infraestructuras externas, según el texto?","opciones":["La necesidad de usar infraestructura dedicada para evitar riesgos.","La ventaja de pagar solo por lo que se utiliza realmente.","La imposibilidad de alcanzar acuerdos de nivel de servicio (SLA).","La obligación de gestionar el datacenter de forma interna."],"correcta":0,"porque_correcta":"El uso de infraestructura externa puede traer variaciones, por lo que las organizaciones optan por infraestructura dedicada para mitigar esos riesgos y asegurar un rendimiento estable.","porque_incorrectas":["El pago por uso es una ventaja, no una consecuencia de la variabilidad.","Los SLA sí existen en la nube; el problema es que el rendimiento puede variar respecto a un entorno dedicado.","La variabilidad es un motivo para buscar soluciones fuera, no para volver a gestionar el datacenter internamente."],"refuerzo":"Si todos los inquilinos de un edificio comparten la misma conexión a internet, un vecino descargando archivos pesados puede afectar tu velocidad. En una infraestructura dedicada, tenés 'caños' propios sin vecinos que molesten. Elegís dedicada para asegurar que nadie más afecte tu velocidad.","concepto":"Riesgos de infraestructura externa","seccion":"14 On-Premises and Cloud Infrastructure","dom":"Networking and Cloud Security","obj":"4.3","area":"Seguridad en la nube","dificultad":"dificil","tipo":"analisis","cita_pdf":"It also eliminates many of the risks and performance variability associated with relying on external infrastructure providers.","pagina":276},{"id":"q0200","pregunta":"¿Por qué la mayoría de las empresas prefieren la nube sobre la infraestructura on-premises en la actualidad?","opciones":["Por la imposibilidad de contratar personal técnico para gestionar datacenters.","Porque el control total de los sistemas es una prioridad absoluta para todas las empresas.","Por la conveniencia de acceder a recursos sin los costos de inversión y mantenimiento físico.","Debido a que la nube ofrece mayor seguridad física que una infraestructura dedicada."],"correcta":2,"porque_correcta":"Las organizaciones generalmente prefieren evitar los costos significativos de capital y mantenimiento que implica el modelo local.","porque_incorrectas":["El personal se puede contratar, pero es costoso y complejo.","La mayoría de las empresas no necesitan el control absoluto que exige el modelo on-premises.","La seguridad en la nube es distinta, no necesariamente 'mayor' en todos los escenarios."],"refuerzo":"Es una cuestión de prioridades. Si tu negocio es vender zapatos, no querés gastar todo tu tiempo y dinero en armar un datacenter. Preferís alquilar capacidad de computación para dedicarte a vender zapatos. Es más rentable y eficiente para el grueso de los negocios.","concepto":"Adopción de la nube","seccion":"14 On-Premises and Cloud Infrastructure","dom":"Networking and Cloud Security","obj":"4.3","area":"Seguridad en la nube","dificultad":"facil","tipo":"analisis","cita_pdf":"In fact, organizations and will promptly forego the significant investment and maintenance costs involved if given an alternative. A convenient alternative is to access computing power, storage, and even applications over the cloud, without having to maintain physical servers.","pagina":276},{"id":"q0201","pregunta":"¿Qué rol juega la ubicación del datacenter en la distinción entre on-premises y nube?","opciones":["Es irrelevante, ya que ambos dependen de instalaciones físicas.","Define quién es dueño y gestor de la instalación, marcando un cambio tecnológico y de costos.","Indica si el sistema es seguro o si debe migrarse a una solución dedicada.","Determina exclusivamente si el personal técnico puede trabajar de forma remota."],"correcta":1,"porque_correcta":"La distinción marca una diferencia fundamental en la gestión, los costos y el enfoque de control de la organización sobre sus activos tecnológicos.","porque_incorrectas":["Es relevante, ya que determina quién gestiona y mantiene el sitio.","La ubicación no define la seguridad por sí sola, la gestión lo hace.","El trabajo remoto es posible en ambos modelos, no es el factor distintivo."],"refuerzo":"Imaginá la diferencia entre tener un servidor en tu placard o en un edificio del proveedor a 500 km. Esa 'ubicación' implica que, en un caso, si se rompe algo, vos tenés que ir a repararlo, y en el otro, pagás para que alguien más lo haga. Cambia todo tu enfoque operativo.","concepto":"Distinción on-premises vs nube","seccion":"14 On-Premises and Cloud Infrastructure","dom":"Networking and Cloud Security","obj":"4.3","area":"Seguridad en la nube","dificultad":"media","tipo":"concepto","cita_pdf":"The key difference lies in who owns and manages this data center. This distinction marks more than just a change of location; it represents a fundamental shift in how organizations approach technology, cost, and control.","pagina":270},{"id":"q0202","pregunta":"Tenés una base de datos de clientes en un servidor local que rara vez se consulta. ¿Qué estrategia de protección es la más adecuada según los estados de los datos?","opciones":["Implementar un túnel VPN permanente para asegurar la conexión del servidor.","Utilizar cifrado de base de datos para proteger los datos en reposo.","Aplicar técnicas de computación multipartita para procesar consultas seguras.","Configurar protocolos TLS avanzados para cifrar el contenido del disco."],"correcta":1,"porque_correcta":"Al estar almacenada en un servidor sin estar en tránsito o en uso activo, se clasifica como 'data at rest', cuya protección principal es el cifrado de almacenamiento.","porque_incorrectas":["El uso de VPN es para datos en tránsito, no para datos almacenados en reposo.","La computación multipartita es una técnica para procesar datos en uso sin revelar información.","TLS es un protocolo de cifrado para comunicaciones en tránsito, no para proteger datos en un disco duro."],"refuerzo":"Imaginate un libro guardado en una caja fuerte. No necesitás un cartero armado (VPN/TLS) para protegerlo mientras no lo movés; lo que necesitás es que la caja fuerte esté cerrada con llave (cifrado). En informática, 'data at rest' es ese libro en la caja fuerte, y cifrar el disco o la base de datos es tu llave.","concepto":"Estados de los datos","seccion":"15 Data Security","dom":"Security Operations and Incident Response","obj":"5.1","area":"Seguridad de datos","dificultad":"facil","tipo":"aplicacion","cita_pdf":"Data at rest refers to stored or archived data including information in a database or any data stored on a hard drive of a server or personal device.","pagina":309},{"id":"q0203","pregunta":"Dos organizaciones quieren realizar un estudio estadístico conjunto sin revelar los registros médicos individuales de sus pacientes. ¿Qué tecnología sería la más apropiada?","opciones":["Implementación de cifrado simétrico para el intercambio de archivos.","Uso de firmas digitales para autenticar los conjuntos de datos.","Aplicación de computación multipartita para el análisis conjunto.","Configuración de una infraestructura PKI entre ambas entidades."],"correcta":2,"porque_correcta":"La computación multipartita permite realizar cálculos sobre datos de múltiples fuentes sin que las partes revelen los datos crudos, protegiendo así la privacidad durante el procesamiento.","porque_incorrectas":["El cifrado simétrico solo protege el almacenamiento o transporte, no permite procesar datos de forma conjunta sin descifrarlos primero.","Las firmas digitales sirven para verificar integridad y autoría, no para procesar datos de forma privada.","PKI gestiona la confianza y la autenticidad de claves, pero no provee la lógica computacional para el análisis privado de datos."],"refuerzo":"Pensá en dos amigos que quieren saber quién tiene más dinero sin decirse cuánto tiene cada uno. Usan un método donde ambos introducen sus datos en una 'caja negra' que solo devuelve el resultado final. Eso es la computación multipartita: procesar sin exponer.","concepto":"Protección de datos","seccion":"15 Data Security","dom":"Security Operations and Incident Response","obj":"5.1","area":"Seguridad de datos","dificultad":"media","tipo":"analisis","cita_pdf":"Two hospitals use multi-party computation to engage in a medical research study without revealing detail about each other's patients.","pagina":310},{"id":"q0204","pregunta":"Tu empresa implementó un sistema DLP (Data Loss Prevention) pero está bloqueando archivos legítimos erróneamente. ¿Cuál es la causa más probable de este problema?","opciones":["La falta de una infraestructura PKI para validar las firmas de los documentos.","La utilización de algoritmos de cifrado asimétrico demasiado complejos.","La dependencia de un etiquetado de datos impreciso o incompleto.","La ausencia de un hash de integridad en los archivos transferidos."],"correcta":2,"porque_correcta":"Los sistemas DLP dependen de reglas basadas en etiquetas. Si las etiquetas son incorrectas, el sistema no puede identificar correctamente qué datos deben bloquearse y cuáles permitirse.","porque_incorrectas":["PKI es para autenticación, no para clasificar el contenido de los archivos que bloquea el DLP.","El cifrado asimétrico ralentiza el proceso, pero no causa bloqueos por error en la clasificación del contenido.","El hash verifica integridad (si el archivo cambió), pero no ayuda al DLP a entender si el contenido es sensible o no."],"refuerzo":"Si le ponés etiquetas de 'peligroso' a cualquier papel en tu escritorio, tu asistente de limpieza terminará tirando cosas importantes. El DLP es igual: si clasificás mal los datos, el sistema toma decisiones de seguridad erróneas basadas en datos falsos.","concepto":"Limitaciones del DLP","seccion":"15 Data Security","dom":"Security Operations and Incident Response","obj":"5.1","area":"Seguridad de datos","dificultad":"media","tipo":"analisis","cita_pdf":"Inaccurate or incomplete labeling can result in false positives or undetected threats, which undermines the system's effectiveness in preventing data exfiltration.","pagina":318},{"id":"q0205","pregunta":"Al diseñar un sistema de comunicación segura, elegís usar cifrado asimétrico en lugar de simétrico para la transferencia inicial. ¿Qué ventaja buscás principalmente?","opciones":["Aumentar drásticamente la velocidad de procesamiento de los datos.","Eliminar la necesidad de compartir una clave secreta previamente.","Reducir el tamaño total de los archivos transmitidos mediante compresión.","Garantizar que el hash de los datos no pueda ser modificado en tránsito."],"correcta":1,"porque_correcta":"El cifrado asimétrico permite el intercambio de información sin necesidad de que ambas partes compartan una clave secreta por adelantado, gracias al uso del par de claves pública y privada.","porque_incorrectas":["El cifrado asimétrico es computacionalmente más lento que el simétrico, no más rápido.","La función de compresión no es una propiedad del cifrado asimétrico.","La integridad (evitar modificaciones) se asegura mediante hashing o firmas digitales, no por el método de cifrado en sí mismo."],"refuerzo":"Imaginate que querés recibir cartas secretas. Con el método simétrico, tendrías que entregarle una llave física a cada persona antes de que te escriban. Con el asimétrico, ponés un candado abierto (clave pública) en tu puerta: todos pueden cerrar la carta, pero solo vos podés abrirla (clave privada).","concepto":"Cifrado asimétrico","seccion":"15 Data Security","dom":"Security Operations and Incident Response","obj":"5.1","area":"Seguridad de datos","dificultad":"facil","tipo":"concepto","cita_pdf":"Asymmetric encryption leverages a public-private key pair, eliminating the need for key sharing, though it is computationally slower than symmetric methods.","pagina":319},{"id":"q0206","pregunta":"Estás analizando la seguridad de un proceso de autenticación. ¿Qué combinación utilizarías para asegurar la integridad, autenticidad y no repudio del mensaje?","opciones":["Cifrado simétrico y hashing simple.","Infraestructura PKI y cifrado simétrico.","Hashing y cifrado asimétrico (firma digital).","Cifrado asimétrico y protocolos TLS."],"correcta":2,"porque_correcta":"La firma digital combina hashing (para integridad) con cifrado asimétrico (para autenticidad y no repudio), vinculando el mensaje de forma única al emisor.","porque_incorrectas":["El cifrado simétrico no permite el no repudio, ya que ambas partes tienen la misma clave.","PKI ayuda a gestionar certificados, pero el proceso de firma técnica es la combinación de hash y asimétrico.","TLS asegura la comunicación en tránsito, pero la firma digital es lo que garantiza el no repudio del mensaje en sí."],"refuerzo":"El hash es como una huella digital única del mensaje. Si firmás esa huella con tu clave privada (asimetría), cualquiera puede verificar que fuiste vos quien la creó (autenticidad) y que el mensaje no se alteró (integridad).","concepto":"Firmas digitales","seccion":"15 Data Security","dom":"Security Operations and Incident Response","obj":"5.1","area":"Seguridad de datos","dificultad":"dificil","tipo":"aplicacion","cita_pdf":"Digital signatures combine hashing and asymmetric encryption to verify data integrity, authenticity, and non-repudiation, securely binding the message to the sender's identity.","pagina":319},{"id":"q0207","pregunta":"Tenés una aplicación que procesa datos sensibles en memoria. ¿Cuál es el riesgo principal de este estado y cómo lo mitigás?","opciones":["Riesgo de interceptación en red; mitigado mediante TLS.","Vulnerabilidades del entorno de procesamiento; mitigado mediante técnicas de preservación de privacidad.","Riesgo de acceso no autorizado al disco; mitigado mediante cifrado de base de datos.","Riesgo de pérdida de integridad por cambios; mitigado mediante hashing."],"correcta":1,"porque_correcta":"Los datos 'en uso' (en memoria) son vulnerables al entorno mismo donde se procesan, y se protegen mediante técnicas como TEE, HE o computación multipartita.","porque_incorrectas":["La red no es el riesgo principal de los datos en uso (memoria), sino el entorno de ejecución local.","El cifrado de disco protege los datos almacenados, no los datos cargados en la memoria RAM durante su ejecución.","El hashing verifica si los datos se alteraron, pero no protege los datos de ser vistos mientras el procesador los manipula."],"refuerzo":"Cuando estás trabajando con un documento, el archivo está abierto en tu pantalla (memoria). Si alguien tiene un virus que captura la pantalla, el cifrado del disco duro no lo detiene. Las 'Privacy Enhancing Techniques' actúan como una máscara que protege los datos incluso mientras los usás.","concepto":"Datos en uso","seccion":"15 Data Security","dom":"Security Operations and Incident Response","obj":"5.1","area":"Seguridad de datos","dificultad":"media","tipo":"analisis","cita_pdf":"When data is actively processed, it often needs to be decrypted into memory, making it vulnerable to various security threats in the processing environment itself, such as application vulnerabilities and memory attacks.","pagina":310},{"id":"q0208","pregunta":"La organización decide utilizar 'salting' durante el proceso de hashing de contraseñas. ¿Por qué es una mejora de seguridad?","opciones":["Asegura que el hash tenga una longitud fija para optimizar el almacenamiento.","Previene que atacantes utilicen tablas precalculadas para revertir el hash.","Permite recuperar la contraseña original si el usuario la olvida.","Garantiza que la comunicación de la contraseña esté cifrada durante la transmisión."],"correcta":1,"porque_correcta":"El 'salting' (añadir datos aleatorios al valor antes de aplicar el hash) garantiza que incluso contraseñas iguales generen hashes distintos, inutilizando ataques basados en tablas precalculadas (Rainbow Tables).","porque_incorrectas":["El hash ya tiene una longitud fija por naturaleza; el salting no busca cambiar eso.","El hash es una función unidireccional; no permite recuperar la contraseña original.","El salting ocurre en el almacenamiento; no protege la contraseña mientras viaja por la red (eso requiere TLS)."],"refuerzo":"Si dos personas usan la misma contraseña ('12345'), sin salting tendrían el mismo hash. Un atacante ve eso y sabe que son iguales. Con salting, el sistema les agrega un código único antes de calcular el hash, haciendo que cada uno sea único e impredecible.","concepto":"Hashing y salting","seccion":"15 Data Security","dom":"Security Operations and Incident Response","obj":"5.1","area":"Seguridad de datos","dificultad":"media","tipo":"analisis","cita_pdf":"Hashing is a one-way cryptographic process that converts data into a fixed-length output (hash) to verify data integrity, ensuring any alteration is detectable and enhancing password security with techniques like salting.","pagina":319},{"id":"q0209","pregunta":"Cuál es la relación entre el ciclo de vida de los datos y las políticas de seguridad?","opciones":["Las políticas de seguridad solo se aplican en la etapa de almacenamiento y archivado.","El ciclo de vida determina qué medidas de protección aplicar en cada estado o fase.","El ciclo de vida es independiente de la clasificación de datos por riesgo.","La destrucción de datos es una etapa opcional que depende del espacio en disco."],"correcta":1,"porque_correcta":"El documento establece que los datos pasan por varias etapas y que cada una requiere medidas de seguridad específicas para su gestión y cumplimiento.","porque_incorrectas":["La protección es necesaria durante todo el ciclo, desde la creación hasta la destrucción, no solo en el almacenamiento.","La clasificación de datos según riesgo es fundamental precisamente para definir el ciclo de vida.","La destrucción de datos no es opcional; es parte crítica de completar el ciclo de vida de forma segura."],"refuerzo":"Pensá en el ciclo de vida como la vida de un producto: desde su fabricación hasta su reciclaje. En seguridad, cada etapa tiene riesgos únicos: no es lo mismo proteger un dato cuando se crea que cuando ya no sirve y debe ser eliminado.","concepto":"Ciclo de vida de los datos","seccion":"15 Data Security","dom":"Security Operations and Incident Response","obj":"5.1","area":"Seguridad de datos","dificultad":"media","tipo":"analisis","cita_pdf":"The data lifecycle encompasses the stages of creation, storage, usage, sharing, archiving, and destruction, each with specific security measures to ensure proper management and compliance.","pagina":319},{"id":"q0210","pregunta":"Si tenés que garantizar que un archivo importante no haya sido modificado desde su creación, ¿qué técnica criptográfica es la más eficiente?","opciones":["Cifrado asimétrico.","Cifrado simétrico.","Hashing.","Infraestructura de claves públicas (PKI)."],"correcta":2,"porque_correcta":"El hashing es una técnica diseñada para crear una 'huella' única de los datos. Si cualquier bit cambia, el hash resultante será diferente, permitiendo detectar modificaciones de forma eficiente.","porque_incorrectas":["El cifrado se usa para confidencialidad, no para verificar la integridad de forma eficiente.","El cifrado simétrico es para ocultar información, no para verificar si fue alterada.","PKI es para gestionar la confianza en claves públicas, no para verificar la integridad del contenido de un archivo específico."],"refuerzo":"El hashing es como poner un sello de cera en un documento. Si alguien abre el sobre, el sello se rompe. Vos no necesitás leer el documento para saber que fue alterado; solo necesitás ver que el sello (hash) ya no es el mismo.","concepto":"Hashing","seccion":"15 Data Security","dom":"Security Operations and Incident Response","obj":"5.1","area":"Seguridad de datos","dificultad":"facil","tipo":"aplicacion","cita_pdf":"Hashing is also important for ensuring data integrity. It can detect changes and","pagina":318},{"id":"q0211","pregunta":"En un entorno de infraestructura PKI, ¿por qué la clave pública no es secreta?","opciones":["Porque debe ser distribuida para que otros puedan cifrar datos o verificar firmas.","Porque el algoritmo de cifrado asimétrico es tan complejo que no necesita ocultarla.","Porque los certificados digitales son documentos públicos que no requieren protección.","Porque la seguridad real recae únicamente sobre la clave privada del administrador."],"correcta":0,"porque_correcta":"En el cifrado asimétrico, la clave pública es necesaria para que otros usuarios envíen datos cifrados a un destinatario específico o verifiquen su firma, por lo que su difusión es esencial.","porque_incorrectas":["La complejidad del algoritmo no elimina la necesidad de seguridad; de hecho, la clave pública es pública por diseño funcional.","Aunque los certificados sean públicos, el motivo por el cual la clave es pública es su función de permitir el cifrado/verificación.","Si bien la clave privada es crítica, eso no explica por qué la clave pública es pública; la razón es su utilidad para terceros."],"refuerzo":"La clave pública es como tu dirección postal. No es un secreto porque querés que la gente sepa a dónde enviarte las cartas. Pero, como una dirección postal, no permite a los demás abrir las cartas que recibís; solo vos, con la clave privada, podés hacerlo.","concepto":"Cifrado asimétrico","seccion":"15 Data Security","dom":"Security Operations and Incident Response","obj":"5.1","area":"Seguridad de datos","dificultad":"media","tipo":"concepto","cita_pdf":"The public key is used in asymmetric encryption and cannot be a secret, as it is meant to be shared","pagina":296},{"id":"q0212","pregunta":"Al implementar cifrado simétrico en una red corporativa, ¿qué desafío operativo es el más crítico?","opciones":["La falta de escalabilidad del algoritmo debido a su alta carga computacional.","La necesidad de gestionar la distribución segura de la misma clave secreta.","La incompatibilidad de las claves simétricas con los protocolos de red actuales.","La imposibilidad de verificar la integridad de los datos cifrados."],"correcta":1,"porque_correcta":"En el cifrado simétrico, ambas partes necesitan la misma clave. Distribuir esa clave de manera que no sea interceptada es el principal obstáculo operativo y de seguridad.","porque_incorrectas":["El cifrado simétrico es más rápido y eficiente computacionalmente que el asimétrico.","Son totalmente compatibles con los protocolos de red actuales (como en los túneles VPN).","La integridad se gestiona con otras técnicas, pero no es el desafío central de la distribución de claves simétricas."],"refuerzo":"Si tenés un candado donde solo una llave sirve, el problema no es el candado, sino cómo le das una copia de esa llave a tu socio sin que un ladrón la robe en el camino. Ese es el reto de la gestión de claves.","concepto":"Cifrado simétrico","seccion":"15 Data Security","dom":"Security Operations and Incident Response","obj":"5.1","area":"Seguridad de datos","dificultad":"media","tipo":"analisis","cita_pdf":"Symmetric encryption uses a single shared key for encryption and decryption, ensuring efficiency but posing challenges in secure key distribution and scalability.","pagina":319},{"id":"q0213","pregunta":"Tu organización está reestructurando su política de datos. ¿Qué función cumple la clasificación de datos?","opciones":["Identifica qué datos deben ser eliminados inmediatamente tras su creación.","Establece las reglas para usar, almacenar y proteger los datos según su sensibilidad.","Determina automáticamente el algoritmo de cifrado necesario para cada base de datos.","Asegura que todos los archivos tengan un hash único para evitar duplicados."],"correcta":1,"porque_correcta":"La clasificación asigna etiquetas basadas en la sensibilidad, lo cual dicta cómo deben gestionarse los datos para mantener el cumplimiento y la seguridad.","porque_incorrectas":["La clasificación es para el manejo y protección, no para automatizar la eliminación inminente.","La clasificación orienta las políticas, pero no configura técnicamente el software de cifrado de forma automática.","El hashing sirve para integridad, no para la clasificación basada en sensibilidad de los datos."],"refuerzo":"Clasificar es como etiquetar maletas en un aeropuerto: 'frágil', 'prioridad', 'estándar'. No significa que la maleta se rompa o se arregle sola, sino que el personal sabe exactamente cómo tratarla durante todo su viaje.","concepto":"Clasificación de datos","seccion":"15 Data Security","dom":"Security Operations and Incident Response","obj":"5.1","area":"Seguridad de datos","dificultad":"facil","tipo":"concepto","cita_pdf":"Data classification establishes rules for how data is used, stored, and shared, assigning sensitivity-based labels to protect its value, ensure compliance, and streamline security measures","pagina":319},{"id":"q0214","pregunta":"Analizando la seguridad de una aplicación, notás que los desarrolladores cifran los datos en tránsito pero dejan los logs de depuración sin protección. ¿Cuál es el riesgo en este escenario?","opciones":["El tráfico en red sigue siendo vulnerable a la intercepción.","La información sensible podría quedar expuesta en archivos de logs no cifrados.","La integridad de la comunicación se verá comprometida por la falta de hashing.","El sistema no podrá cumplir con la autenticación de usuarios mediante PKI."],"correcta":1,"porque_correcta":"Los logs son un riesgo de seguridad si contienen datos sensibles (como credenciales o información privada), y si no están protegidos (cifrados o con acceso restringido), exponen la información.","porque_incorrectas":["Si el tránsito está cifrado, el tráfico no es vulnerable a la intercepción básica de red.","Los logs son una cuestión de almacenamiento y auditoría, no afectan directamente la integridad de la transmisión en red.","Los logs no tienen una relación directa con el cumplimiento de protocolos PKI de cara al usuario final."],"refuerzo":"Los logs son como el diario íntimo de una computadora. Si escribís contraseñas o datos de clientes ahí, aunque la 'puerta' (red) esté segura, dejaste los secretos escritos en un cuaderno que cualquiera puede leer si accede al servidor.","concepto":"Logging y seguridad","seccion":"15 Data Security","dom":"Security Operations and Incident Response","obj":"5.1","area":"Seguridad de datos","dificultad":"dificil","tipo":"analisis","cita_pdf":"Finally, we address the critical role of logging and monitoring in identifying and mitigating potential security incidents.","pagina":295},{"id":"q0215","pregunta":"Imaginá una infraestructura de claves públicas (PKI) que falla en la emisión de certificados. ¿Qué impacto principal tiene esto en las comunicaciones?","opciones":["Los usuarios no podrán realizar hashing de sus archivos.","El cifrado simétrico dejará de funcionar en toda la red.","La confianza en la autenticidad de las claves públicas no puede ser verificada.","El almacenamiento de datos en reposo se vuelve ilegible para el sistema."],"correcta":2,"porque_correcta":"PKI es la infraestructura que garantiza que una clave pública pertenece a quien dice ser. Sin certificados válidos, la autenticidad de estas claves no puede verificarse, rompiendo la cadena de confianza.","porque_incorrectas":["El hashing no depende de una infraestructura PKI para funcionar.","El cifrado simétrico usa claves compartidas y no requiere certificados PKI para operar.","El cifrado de datos en reposo es una función local que no depende de la emisión de certificados de una PKI."],"refuerzo":"PKI es como un sistema de pasaportes. Si el organismo emisor (la autoridad de certificación) falla, nadie puede probar que su DNI es auténtico. Sin esa prueba, no podés confiar en que estás hablando con quien creés hablar.","concepto":"PKI","seccion":"15 Data Security","dom":"Security Operations and Incident Response","obj":"5.1","area":"Seguridad de datos","dificultad":"dificil","tipo":"analisis","cita_pdf":"PKI ensures the authenticity of public keys in asymmetric encryption through digital certificates issued by trusted Certificate Authorities, enabling secure communication.","pagina":319},{"id":"q0216","pregunta":"Como administrador, notás que los servidores nuevos vienen con servicios activos que no necesitás. ¿Qué principio de hardening deberías aplicar priorizando la seguridad?","opciones":["Deshabilitar todos los puertos de red para evitar escaneos externos.","Eliminar servicios innecesarios para reducir la superficie de ataque.","Implementar un baseline que exija la actualización del sistema.","Configurar una política de contraseñas compleja por defecto."],"correcta":1,"porque_correcta":"La desactivación de servicios innecesarios es una técnica directa de reducción de superficie de ataque, que minimiza los caminos de acceso explotables.","porque_incorrectas":["Deshabilitar todos los puertos es impracticable, ya que el sistema dejaría de ser funcional.","Actualizar el sistema es mantenimiento, no es la técnica específica para servicios innecesarios activos.","La política de contraseñas es una medida de autenticación, no desactiva servicios innecesarios."],"refuerzo":"Pensá en el hardening como en una casa: si tenés diez puertas, cada una es una oportunidad para que alguien entre. Si solo necesitás una para entrar y salir, las otras nueve son riesgos innecesarios. Al igual que deshabilitar servicios, cerrar esas puertas extra no impide que vivas en la casa, pero hace que sea mucho más difícil para un intruso encontrar un punto de entrada.","concepto":"Reducción superficie ataque","seccion":"16 System Hardening","dom":"Security Operations and Incident Response","obj":"5.4","area":"Protección de activos","dificultad":"facil","tipo":"aplicacion","cita_pdf":"Operating system hardening involves reducing a system to only what is necessary for it to function. In practice, this means removing unused software and device drivers (e.g., game and printer drivers) and disabling unnecessary and operating system features.","pagina":324},{"id":"q0217","pregunta":"Evaluás la efectividad de una política de seguridad recién implementada. ¿Por qué el documento afirma que las políticas por sí solas son insuficientes?","opciones":["Porque carecen de mecanismos para obligar a los usuarios a cumplirlas.","Porque no cubren todos los posibles vectores de ataque modernos.","Porque son solo planos que deben traducirse en controles técnicos.","Porque los vendedores suelen ignorar las políticas en sus configuraciones."],"correcta":2,"porque_correcta":"Las políticas definen la intención o el 'plano', pero la seguridad efectiva depende de su implementación a través de configuraciones técnicas concretas.","porque_incorrectas":["Las políticas sí pueden incluir mecanismos de cumplimiento, pero el texto enfatiza la necesidad de traducción técnica.","Las políticas pueden ser completas, el problema es su ejecución práctica, no su alcance.","Los vendedores suelen no aplicar políticas de seguridad seguras, pero eso no es lo que hace que las políticas sean insuficientes."],"refuerzo":"Imaginá que escribís un manual de cocina muy detallado (la política) sobre cómo preparar un plato saludable. Aunque el manual sea perfecto, no vas a estar alimentado hasta que efectivamente te pongas a cocinar siguiendo esos pasos (los controles técnicos). La política es la receta; el hardening es el acto de cocinar.","concepto":"Implementación técnica políticas","seccion":"16 System Hardening","dom":"Security Operations and Incident Response","obj":"5.4","area":"Protección de activos","dificultad":"media","tipo":"analisis","cita_pdf":"Security policies serve as blueprints for hardening; however, administrative controls only become effective when enforced through technical controls.","pagina":330},{"id":"q0218","pregunta":"Tu equipo está discutiendo la implementación de un baseline de seguridad. Según el texto, ¿qué rol cumple este estándar en el ciclo de vida del sistema?","opciones":["Define el nivel mínimo de seguridad que los sistemas deben alcanzar.","Automatiza la respuesta ante incidentes detectados en el sistema.","Reemplaza la necesidad de realizar auditorías técnicas manuales.","Garantiza que todos los parches se apliquen en tiempo real."],"correcta":0,"porque_correcta":"Un baseline establece el piso técnico de configuración necesario para cumplir con los estándares mínimos de seguridad definidos.","porque_incorrectas":["Un baseline no es una herramienta de respuesta ante incidentes, es una referencia de configuración.","El baseline no elimina la auditoría, de hecho, ayuda a verificar que se cumpla el estándar.","El baseline no gestiona la velocidad de aplicación de parches, sino el estándar de configuración."],"refuerzo":"Imaginá el baseline como un 'examen de salud' estandarizado. No es un tratamiento, pero te dice cuáles son los valores mínimos (presión, colesterol) que debes tener para ser considerado saludable. Cualquier sistema que no cumpla con ese mínimo está fuera de norma y necesita ajustes, independientemente de qué tareas realice.","concepto":"Baselines de seguridad","seccion":"16 System Hardening","dom":"Security Operations and Incident Response","obj":"5.4","area":"Protección de activos","dificultad":"facil","tipo":"concepto","cita_pdf":"A security baseline is a set of standards, guidelines, and procedures that ensure a system or network meets a minimum level of security.","pagina":331},{"id":"q0219","pregunta":"Durante una auditoría, descubrís que un servidor tiene configuraciones por defecto. ¿Por qué esto representa un riesgo según el documento?","opciones":["Las configuraciones por defecto suelen optimizar el rendimiento sobre la seguridad.","La mayoría de los sistemas vienen configurados para ser inestables a propósito.","Los atacantes conocen bien los puntos débiles de las configuraciones estándar.","El hardening requiere que los usuarios cambien las contraseñas cada semana."],"correcta":2,"porque_correcta":"Los valores por defecto son predecibles y conocidos, lo que facilita que los atacantes utilicen vectores de ataque estandarizados.","porque_incorrectas":["Los vendedores priorizan la funcionalidad y facilidad de uso, no el rendimiento específicamente.","Los sistemas por defecto no están diseñados para ser inestables, sino para ser fáciles de instalar.","El hardening no implica necesariamente cambios semanales, y eso no justifica el riesgo de los valores por defecto."],"refuerzo":"Si comprás un candado y el código para abrirlo es siempre '0000', no importa cuán resistente sea el metal, cualquiera que compre ese modelo sabrá cómo abrirlo. Los valores por defecto son ese '0000': una puerta abierta que todo atacante conoce sin necesidad de investigar tu sistema en particular.","concepto":"Riesgo valores defecto","seccion":"16 System Hardening","dom":"Security Operations and Incident Response","obj":"5.4","area":"Protección de activos","dificultad":"media","tipo":"analisis","cita_pdf":"As a result, they often include unnecessary services, exposed network ports, and default credentials that create predictable attack paths for attackers.","pagina":330},{"id":"q0220","pregunta":"Implementaste un nuevo control de seguridad, pero el sistema empezó a fallar. ¿Qué fase del proceso de cambio deberías activar para minimizar el impacto?","opciones":["La fase de revisión, para documentar el error del control.","La fase de rollback, para volver al estado anterior conocido.","La fase de patching, para corregir el control rápidamente.","La fase de baseline, para redefinir el estándar de seguridad."],"correcta":1,"porque_correcta":"El rollback es el mecanismo de seguridad diseñado para revertir cambios ante fallos imprevistos y restablecer la operación normal.","porque_incorrectas":["La revisión es para identificar el fallo, pero el rollback es la acción para remediarlo.","Patching sirve para arreglar vulnerabilidades, pero no sirve para revertir un cambio fallido de forma inmediata.","El baseline es el objetivo de seguridad, no una herramienta para corregir un fallo operacional tras un cambio."],"refuerzo":"Es como el botón 'Deshacer' en un documento. Cuando probás algo complejo y el sistema se rompe, no intentás arreglarlo parte por parte sobre la marcha, porque eso puede causar más inestabilidad. Volvés a la versión anterior que funcionaba (el 'último estado conocido') para que el negocio siga operando mientras analizás qué salió mal.","concepto":"Gestión cambios y rollback","seccion":"16 System Hardening","dom":"Security Operations and Incident Response","obj":"5.4","area":"Protección de activos","dificultad":"media","tipo":"aplicacion","cita_pdf":"When the review phase identifies critical failures or unexpected disruptions, the rollback plan is activated to restore the system to its previous, known-good state and quickly reestablish normal operations.","pagina":330},{"id":"q0221","pregunta":"Al diseñar una política de contraseñas, ¿cómo contribuye el hardening a reducir la superficie de ataque?","opciones":["Exige que los sistemas se reinicien automáticamente cada noche.","Limita la exposición de puertos de red mediante el bloqueo de cuentas.","Disminuye la eficacia de ataques mediante reglas de complejidad.","Asegura que el personal tenga permisos de administrador limitados."],"correcta":2,"porque_correcta":"El hardening aplica reglas de complejidad y bloqueo para dificultar el uso de credenciales débiles o comprometidas, reduciendo la superficie de ataque en la autenticación.","porque_incorrectas":["El reinicio no tiene relación directa con la política de contraseñas.","El bloqueo de cuentas protege la autenticación, no cierra puertos de red.","Los permisos de administrador son control de acceso, no una política de contraseñas."],"refuerzo":"Pensá en esto como elevar la altura de una pared. Si la pared es baja, cualquiera salta. Al poner reglas de complejidad y bloqueo (hardening), estás subiendo la pared. El atacante ya no puede usar una escalera pequeña (contraseñas débiles); necesita una herramienta mucho más profesional, lo que lo obliga a trabajar más y le da al sistema más chances de detectarlo.","concepto":"Hardening y autenticación","seccion":"16 System Hardening","dom":"Security Operations and Incident Response","obj":"5.4","area":"Protección de activos","dificultad":"media","tipo":"analisis","cita_pdf":"Password policies define what constitutes a strong password, and system hardening enforces these requirements through technical controls such as password complexity rules and account lockout settings.","pagina":324},{"id":"q0222","pregunta":"Definiste que cada vulnerabilidad crítica debe ser remediada en 48 horas. ¿Cómo se integra esto en el proceso de hardening?","opciones":["Mediante la aplicación de políticas de gestión de vulnerabilidades.","A través de la creación de nuevos baselines de seguridad.","Mediante la reducción de permisos de usuarios finales.","A través de la desinstalación de todos los drivers de red."],"correcta":0,"porque_correcta":"Las políticas de gestión de vulnerabilidades dictan los tiempos de respuesta, los cuales el hardening ejecuta mediante parches y configuraciones.","porque_incorrectas":["El baseline es un estándar, la política de vulnerabilidades es un proceso de gestión de tiempos.","Reducir permisos es control de acceso, no soluciona parches pendientes.","Desinstalar drivers no soluciona las vulnerabilidades del software restante."],"refuerzo":"Esto es como tener una política de mantenimiento en una flota de autos: 'Todo motor con ruido extraño debe revisarse en 24 horas'. Esa es la política. El taller que hace la revisión técnica es el equipo que aplica el hardening (parches/actualizaciones). Sin la política, el taller no sabe cuándo es urgente actuar.","concepto":"Políticas gestión vulnerabilidades","seccion":"16 System Hardening","dom":"Security Operations and Incident Response","obj":"5.4","area":"Protección de activos","dificultad":"media","tipo":"aplicacion","cita_pdf":"Vulnerability management policies require that identified vulnerabilities be remediated within a defined timeframe. System hardening implements these requirements through patching and updates, and secure configuration baselines.","pagina":324},{"id":"q0223","pregunta":"Al auditar los privilegios de los usuarios, aplicás el principio de 'least privilege'. ¿Cuál es el beneficio principal de este enfoque en el hardening?","opciones":["Facilita la gestión de contraseñas de todos los usuarios.","Asegura que los parches se instalen sin permisos elevados.","Minimiza la superficie de ataque y el impacto de una brecha.","Elimina la necesidad de usar servicios de autenticación externa."],"correcta":2,"porque_correcta":"Al dar solo los permisos necesarios, limitás qué puede hacer un atacante si logra comprometer una cuenta, reduciendo así el impacto potencial.","porque_incorrectas":["El principio de menor privilegio no facilita la gestión de contraseñas.","Los parches a menudo requieren permisos elevados para instalarse.","El principio no elimina la necesidad de servicios de autenticación."],"refuerzo":"Si le das a un empleado las llaves de toda la oficina, si alguien le roba las llaves, el ladrón tiene acceso a todo. Si solo le das la llave de su escritorio, el daño está contenido. El principio de menor privilegio es eso: que si una cuenta se ve comprometida, el 'ladrón' no tenga las llaves de todo el sistema.","concepto":"Principio menor privilegio","seccion":"16 System Hardening","dom":"Security Operations and Incident Response","obj":"5.4","area":"Protección de activos","dificultad":"media","tipo":"analisis","cita_pdf":"Access control policies restrict system and data access to authorized users. System hardening enforces these policies through permissions, authentication mechanisms, and role-based access controls. These controls minimize excessive privileges and limit access pathways, reducing the attack surface and decreasing the potential impact and reach of a successful compromise.","pagina":324},{"id":"q0224","pregunta":"El documento sostiene que el hardening no es una tarea de una sola vez. ¿Qué aspecto operativo es fundamental para mantener esta postura?","opciones":["La automatización completa de la creación de usuarios.","La implementación de parches y gestión de cambios.","El bloqueo total de actualizaciones automáticas.","La auditoría externa anual de los sistemas."],"correcta":1,"porque_correcta":"Dado que las amenazas evolucionan, el hardening requiere mantenimiento continuo a través de parches y un proceso de gestión de cambios para evitar regresiones.","porque_incorrectas":["La creación de usuarios es parte de la administración, pero no el foco del mantenimiento de hardening.","Bloquear actualizaciones aumenta la vulnerabilidad, contradice el hardening.","La auditoría es un control, pero el mantenimiento operativo es lo que garantiza el estado seguro día a día."],"refuerzo":"Un sistema seguro hoy puede ser vulnerable mañana porque salen nuevas formas de ataque. Mantener el hardening es como cuidar un jardín: no basta con plantar (configurar) una vez; tenés que seguir regando y sacando malezas (parchear/actualizar) constantemente, o el jardín se vendrá abajo.","concepto":"Hardening como proceso continuo","seccion":"16 System Hardening","dom":"Security Operations and Incident Response","obj":"5.4","area":"Protección de activos","dificultad":"media","tipo":"concepto","cita_pdf":"Finally, the chapter emphasized that system hardening is an ongoing responsibility rather than a one-time task. Security baselines establish the minimum-security standard that systems must meet, and change management ensures that patches, updates, and configuration changes do not introduce security vulnerabilities as systems evolve.","pagina":330},{"id":"q0225","pregunta":"Un sistema fue configurado, pero no se documentaron los cambios. ¿Qué riesgo principal presenta esto según el framework de hardening?","opciones":["Aumenta la latencia en la comunicación de red interna.","Dificulta el proceso de rollback ante un fallo imprevisto.","Impide que el usuario final acceda a los recursos compartidos.","Provoca que las contraseñas no se sincronicen correctamente."],"correcta":1,"porque_correcta":"La gestión de cambios y su documentación son esenciales para que, si algo falla, el plan de rollback pueda restaurar el estado conocido anterior.","porque_incorrectas":["La falta de documentación no afecta la latencia de red.","La documentación es administrativa, no afecta el funcionamiento técnico del acceso.","La sincronización de contraseñas es un problema de autenticación, no de registro de cambios."],"refuerzo":"Imaginá cambiar la configuración de un motor complejo sin anotar qué tornillos moviste. Si después el motor empieza a echar humo, no vas a saber cómo volver a dejarlo como estaba. La documentación es el mapa que te permite deshacer los pasos si el camino que elegiste fue el equivocado.","concepto":"Gestión cambios y documentación","seccion":"16 System Hardening","dom":"Security Operations and Incident Response","obj":"5.4","area":"Protección de activos","dificultad":"dificil","tipo":"analisis","cita_pdf":"If the change does not proceed as planned, this step serves as the ultimate safety mechanism. When the review phase identifies critical failures or unexpected disruptions, the rollback plan is activated to restore the system to its previous, known-good state and quickly reestablish normal operations.","pagina":330},{"id":"q0226","pregunta":"Para reducir la superficie de ataque en un sistema operativo, ¿qué acción es técnicamente recomendable además de deshabilitar servicios?","opciones":["Limitar el número de sesiones remotas simultáneas.","Aumentar el tamaño del archivo de paginación del sistema.","Eliminar software y drivers que no sean necesarios.","Reinstalar el sistema operativo desde cero semanalmente."],"correcta":2,"porque_correcta":"Eliminar software y drivers innecesarios elimina código ejecutable y posibles vulnerabilidades que no se requieren para la función principal del sistema.","porque_incorrectas":["Limitar sesiones es control de acceso, no reducción de superficie de ataque por código innecesario.","El archivo de paginación es optimización de memoria, no tiene impacto en la superficie de ataque.","Reinstalar semanalmente es una sobrecarga innecesaria y no garantiza un estado seguro permanentemente."],"refuerzo":"Cada programa instalado es una caja negra con código que puede tener errores. Si tenés instalado un driver de impresora y nunca imprimís, ese código sigue ahí, ocupando espacio y potencialmente teniendo agujeros de seguridad. Sacarlo es quitarle al atacante un terreno donde esconderse.","concepto":"Reducción superficie ataque","seccion":"16 System Hardening","dom":"Security Operations and Incident Response","obj":"5.4","area":"Protección de activos","dificultad":"media","tipo":"aplicacion","cita_pdf":"Operating system hardening involves reducing a system to only what is necessary for it to function. In practice, this means removing unused software and device drivers (e.g., game and printer drivers) and disabling unnecessary and operating system features.","pagina":324},{"id":"q0227","pregunta":"¿Por qué los proveedores de software suelen lanzar sistemas con configuraciones que priorizan la funcionalidad sobre la seguridad?","opciones":["Porque es más costoso implementar seguridad desde el desarrollo.","Porque la facilidad de uso y la despliegue rápido venden más.","Porque las normativas internacionales exigen mayor funcionalidad.","Porque así es más fácil para los atacantes realizar pruebas de penetración."],"correcta":1,"porque_correcta":"El documento aclara que los vendedores optan por configuraciones que aseguren que el producto funcione de inmediato ('ease of use') para facilitar la adopción por parte del cliente.","porque_incorrectas":["El costo no es la razón citada, sino la priorización de la experiencia del usuario y despliegue.","Las normativas suelen exigir seguridad, no priorizar la funcionalidad por encima de esta.","Los atacantes no son la razón, son la consecuencia de esas decisiones de diseño."],"refuerzo":"Imaginá comprar un smartphone que viene con todas las protecciones activadas: no podrías descargar apps, no podrías conectarte a WiFi automáticamente, etc. La mayoría de la gente se quejaría de que es 'difícil de usar'. Los fabricantes prefieren que el producto se sienta 'mágico' al encenderlo, dejando que el usuario (o el admin) se encargue de la seguridad después.","concepto":"Diseño proveedores","seccion":"16 System Hardening","dom":"Security Operations and Incident Response","obj":"5.4","area":"Protección de activos","dificultad":"media","tipo":"concepto","cita_pdf":"Most operating systems, applications, and network devices are designed by vendors to prioritize functionality and ease of deployment over security.","pagina":323},{"id":"q0228","pregunta":"Tenés un servidor que debe cumplir con un estándar corporativo. ¿Qué función cumple el baselines en la verificación de este?","opciones":["Provee una lista de comprobación de configuraciones permitidas.","Genera alertas automáticamente cuando un usuario se equivoca.","Establece una política de contraseñas por tiempo.","Gestiona los parches de seguridad automáticamente."],"correcta":0,"porque_correcta":"El baseline funciona como una guía o estándar de configuraciones que deben cumplirse, permitiendo verificar que el sistema esté configurado consistentemente.","porque_incorrectas":["El baseline no es una herramienta de alertas, es una referencia de estado deseado.","Una política de contraseñas es parte del hardening, pero no es la definición global de un baseline.","La gestión de parches es una actividad de mantenimiento, no el estándar de configuración en sí."],"refuerzo":"Si tenés que armar diez computadoras iguales, el baseline es la guía que dice 'todas deben tener el puerto USB deshabilitado y el firewall activo'. Sin esa lista, cada computadora terminaría configurada de forma distinta, creando inconsistencias que son difíciles de proteger.","concepto":"Baselines de seguridad","seccion":"16 System Hardening","dom":"Security Operations and Incident Response","obj":"5.4","area":"Protección de activos","dificultad":"media","tipo":"aplicacion","cita_pdf":"Security baselines establish the minimum-securit
