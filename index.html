nfidentiality","p":50},{"q":"Which concept describes an information security strategy that integrates people, technology, and operations to establish security controls across multiple layers of the organization?","a":"Defense in depth","p":63},{"q":"Rules prescribed by the Payment Card Industry are known as what?","a":"Standards","p":74},{"q":"Which document contains the detailed steps and procedures to support organizational policies?","a":"A procedural document","p":74},{"q":"Which documents contain elements that are not mandatory?","a":"Guidelines","p":75},{"q":"Which document is usually THE LEAST formal?","a":"Guidelines","p":75},{"q":"Which regulations address data protection and privacy in Europe?","a":"GDPR","p":75},{"q":"Which technique is used to determine that the message has not been modified in transit?","a":"Hashing","p":254},{"q":"Which of the CIA elements is primarily addressed by a hash value?","a":"Integrity","p":254},{"q":"Which key is to be used when the objective of encryption is to provide integrity (i.e. message has not been altered)?","a":"Receiver's public key","p":260},{"q":"Which key is to be used when the objective of encryption is to provide confidentiality?","a":"Receiver's public key","p":260},{"q":"Which key is to be used for creating digital signatures?","a":"Sender's private key","p":260},{"q":"Which key is to be used for confirming and validating the digital signatures?","a":"Sender's public key","p":260},{"q":"What are examples of symmetric algorithms?","a":"AES, DES, Blowfish and Twofish","p":260}],"1.3":[{"q":"Which law grants legal protections to individual human privacy in European Union?","a":"The GDPR","p":50},{"q":"Which type of control is an IT policy and procedure?","a":"Administrative","p":63},{"q":"What is a policy?","a":"A policy is a high-level document created by an organization to show intent, goals, and direction.","p":74},{"q":"What is a standard?","a":"A standard is an accepted set of rules or practices that many people, companies, or countries agree to follow.","p":74},{"q":"What kind of document is the Common Body of Knowledge published by ISC2?","a":"A standard","p":74},{"q":"An organization publishes an intent to secure all the data the company possesses. What kind of document is this?","a":"A policy document","p":74},{"q":"What is the primary focus of the ISO 27002 standard?","a":"Information security management systems","p":75}],"1.2":[{"q":"In risk management, the primary objective is to protect what?","a":"Assets","p":56},{"q":"An exploitable weakness or flaw in a system or component is known as what?","a":"A vulnerability","p":56},{"q":"What is a threat?","a":"Something or someone that poses a risk to an organization","p":56},{"q":"What is impact?","a":"The magnitude of expected harm","p":57},{"q":"What is risk mitigation/risk reduction?","a":"Implementing a particular solution to reduce risk.","p":58},{"q":"Insurance is an example of what?","a":"Risk transfer","p":58},{"q":"What is risk acceptance level?","a":"Risk acceptance level is the amount of risk an organization is willing to accept to achieve its objective.","p":60},{"q":"What is risk tolerance?","a":"Risk tolerance refers to the acceptable level of variation or minor deviation from the risk acceptance level.","p":60},{"q":"Which risk assessment (quantitative or qualitative) is more suitable for intangible assets?","a":"Qualitative risk assessment","p":92},{"q":"Which risk assessment (quantitative or qualitative) is suitable for tangible as well as intangible assets?","a":"Both quantitative and qualitative risk assessment","p":92},{"q":"What is a zero-day vulnerability?","a":"A previously unknown system vulnerability","p":108}],"1.4":[{"q":"Which type of control is implemented to control vehicles inside the premises?","a":"Physical","p":63},{"q":"Bollards are an example of which type of control?","a":"Physical","p":63},{"q":"Firewalls belong to which control category: physical, technical, or administrative?","a":"Technical","p":63},{"q":"Biometric readers belong to which control category: physical, technical, or administrative?","a":"Technical","p":63},{"q":"An acceptable use policy belongs to which control category: physical, technical or administrative?","a":"Administrative","p":63},{"q":"Information security policies belong to which control: physical, technical, or administrative?","a":"Administrative","p":63},{"q":"Access control list belongs to which control category: physical, technical, or administrative?","a":"Technical","p":64},{"q":"CCTV belongs to which control category: physical, technical, or administrative?","a":"Physical","p":64},{"q":"Which control category, physical, technical, or administrative, is also referred to as soft controls?","a":"Administrative","p":64},{"q":"Movement sensors belong to which control type (preventive, detective, corrective)?","a":"Detective","p":66},{"q":"IDSs belong to which control type (preventive, detective, corrective)?","a":"Detective","p":66},{"q":"Bollards belong to which control type (preventive, detective, corrective)?","a":"Preventive","p":66}],"1.5":[{"q":"Which canons are prescribed in the ISC2 code of ethics?","a":"• Protect society, the common good, necessary public trust and confidence, and the infrastructure. • Act honorably, honestly, justly, responsibly, and legally. • Provide diligent and competent service to principals. • Advance and protect the profession.","p":70}],"2.2":[{"q":"What is BCP?","a":"The predetermined set of instructions or procedures to sustain business operations after a disaster.","p":91},{"q":"What are the objectives of BCP?","a":"To preserve health and human safety To keep critical business functions operational","p":91},{"q":"What is the primary objective of a business impact analysis?","a":"To identify and prioritize critical business processes.","p":91},{"q":"Which component of a BCP identifies critical business functions and the resources required to support them?","a":"BIA The pre  cyberattack is intended to disrupt system availability?","a":"DoS/DDoS","p":212},{"q":"Which attack works by overwhelming a server or network with excessive traffic, making it inaccessible to legitimate users?","a":"DoS/DDoS","p":212},{"q":"What is the main impact of a DoS attack on a system?","a":"The exhaustion of device resources","p":212},{"q":"Which type of attack involves secretly observing communication between two parties without their knowledge?","a":"On-path/MITM attack","p":212},{"q":"An attacker captures and listens to communication between a user and a server to obtain sensitive information. What type of attack does this describe?","a":"On-path/MITM attack","p":212},{"q":"Which type of attack involves intercepting and modifying communication between two parties?","a":"On-path/MITM attack","p":212},{"q":"Which type of malware disguises itself as legitimate software but performs harmful actions such as data theft?","a":"Trojan","p":212},{"q":"Which attack involves inserting malicious code into a trusted or legitimate application?","a":"Trojan","p":213},{"q":"Which type of attack aims to gain and maintain control of a system from a remote location?","a":"Backdoor","p":213},{"q":"Which attack method is most effective for maintaining persistent remote access to a compromised system?","a":"Rootkits","p":213},{"q":"Which type of attack conceals its presence while gaining elevated privileges on a system?","a":"Rootkits","p":213},{"q":"Which attack exploits weak input validation in web applications?","a":"XXS","p":213},{"q":"Which type of attack deceives users into revealing sensitive information through fraudulent messages?","a":"Phishing","p":213},{"q":"Which attack specifically targets executives using carefully crafted malicious emails?","a":"Whaling","p":213},{"q":"Which type of attack encrypts a victim's data and demands payment for its release?","a":"Ransomware","p":213},{"q":"Which type of attack gathers sensitive information by analyzing a device's power consumption patterns?","a":"Side channels","p":213},{"q":"What is the most effective way to prevent a replay attack?","a":"By using an IPsec VPN","p":213},{"q":"How does IPSec defend against replay attacks?","a":"By using sequence numbers Unauthorized access to network","p":213},{"q":"What impact can a replay attack have on systems protected by IPSec?","a":"resources, disruption of network communication, and modification of network traffic","p":213},{"q":"What is meant by a replay attack in the context of IPSec?","a":"An attack where an attacker attempts to inject packets into an existing session","p":213},{"q":"Which type of malware spreads automatically without requiring user action?","a":"A worm","p":214},{"q":"Which social engineering attack involves sending targeted emails to specific individuals?","a":"Spear phishing","p":214},{"q":"Which type of attack involves impersonating a trusted identity to gain unauthorized access?","a":"Spoofing","p":214},{"q":"What term is used for highly sophisticated and long-term cyber threats that may persist for months or years?","a":"APT","p":214},{"q":"Which type of attack is most commonly executed using a botnet?","a":"DDoS attack A phishing email is sent to","p":214},{"q":"What is the key difference between phishing and spear phishing attacks?","a":"random recipients; a spear phishing email is sent to specific recipients.","p":214},{"q":"Which type of attack involves injecting commands into input fields on a vulnerable web application?","a":"SQL injection","p":214},{"q":"Which attack uses precomputed hash values to match and discover a user's password?","a":"Rainbow table attack","p":214},{"q":"Which tool checks users and devices before they can access network resources to ensure they meet security policies?","a":"NAC","p":217},{"q":"Which security control helps protect data while it is being transmitted between cloud services and user devices?","a":"TLS","p":228}],"4.3":[{"q":"What is the SMTP port number?","a":"25 21"," const CONC = JSON.parse(document.getElementById("cdata").textContent);
const TOT_CONC = Object.values(CONC).reduce((n,v) => n + v.length, 0);
const objsDe = d => Object.keys(OBJS).filter(o => OBJS[o].dom === d);
const DIA = 86400000, POR_SESION = 10, NUEVAS = 3, CLAVE = "iscc-cc-v2";
const SIM_N = 100, SIM_MS = 2*60*60*1000, UMBRAL = 0.70;

/* ---------- estado ---------- */
let S = {tarjetas:{}, hist:[], hora:"09:00", pts:0, ultimoDia:null, generadas:[],
         gkey:"", simulacros:[], soloLibro:true, repoDia:null, autorepo:true};
try{
  const raw = localStorage.getItem(CLAVE) || localStorage.getItem("iscc-cc-v1");
  if(raw) S = Object.assign(S, JSON.parse(raw));
}catch(e){}
S.generadas = S.generadas || []; S.simulacros = S.simulacros || [];
if(S.soloLibro === undefined) S.soloLibro = true;

let BANCO = BASE.concat(S.generadas);
let PORID = new Map(BANCO.map(q => [q.id, q]));
function reindexar(){ BANCO = BASE.concat(S.generadas); PORID = new Map(BANCO.map(q=>[q.id,q])); }

const nueva = id => ({id, ef:2.5, reps:0, iv:0, prox:0, lapsos:0, vistas:0, aciertos:0, rota:0, reap:0});
for(const q of BANCO) if(!S.tarjetas[q.id]) S.tarjetas[q.id] = nueva(q.id);
const guardar = () => { try{ localStorage.setItem(CLAVE, JSON.stringify(S)); }catch(e){} };
const hoy = () => new Date().toLocaleDateString("sv");
const concepto = q => q.concepto || q.seccion;
/* El "area" con la que se reparte un examen es el OBJETIVO del temario oficial
   (1.1 … 5.5), no el capitulo del libro. Un examen no deberia darte tres
   preguntas de control de acceso logico solo porque el libro las repartio en
   capitulos distintos. */
const area = q => q.obj || q.seccion || q.concepto || "";

/* De donde salio cada pregunta:
   - "libro": las 198 de los dos examenes oficiales, con su clave verificada.
   - "tuya": las que la IA escribio para vos (profundizar) o corrigio.
   - "lote": las 258 que genere en bloque desde el temario.
   El ajuste "solo del libro" deja fuera SOLO el lote: las oficiales y las que
   pediste vos siguen entrando. */
const fuente = q => q.oficial ? "libro" : (q.generada || q.corregida) ? "tuya" : "lote";
const admitida = q => !S.soloLibro || fuente(q) !== "lote";

/* Azar con semilla nueva en cada carga.
   Con el progreso vacio todas las tarjetas empatan en prioridad, el orden
   queda determinístico y salen siempre las mismas diez. Mezclar ANTES de
   ordenar rompe los empates al azar sin tocar el orden de lo que si tiene
   prioridad distinta, porque el sort de JS es estable. */
const SEMILLA = (Date.now() ^ Math.floor(Math.random()*4294967296)) >>> 0;
function mezclar(arr, semilla = SEMILLA){
  const a = arr.slice(), r = _rnd(semilla);
  for(let i = a.length-1; i > 0; i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}

/* ---------- SM-2, con re-aprendizaje ----------
   Dos cosas separan esto del SM-2 de manual:

   1. El factor de facilidad se recalcula SIEMPRE, tambien al fallar. Casi todas
      las implementaciones solo lo tocan en los aciertos, y ahi las tarjetas
      dificiles nunca bajan su EF.
   2. Al fallar, la tarjeta queda vencida YA (prox = 0), no en 24 horas. Asi
      vuelve en el proximo examen, que es cuando todavia tenes fresco el error.
      Solo sale de re-aprendizaje cuando la acertas. */
function revisar(t, q, ahora = Date.now()){
  const ef = Math.max(1.3, t.ef + (0.1 - (5-q)*(0.08 + (5-q)*0.02)));
  if(q < 3) return {...t, ef, reps:0, iv:1, lapsos:t.lapsos+1, reap:1,
    vistas:t.vistas+1, prox:0};
  const reps = t.reps + 1;
  const iv = reps===1 ? 1 : reps===2 ? 6 : Math.round(Math.max(t.iv,1)*ef);
  return {...t, ef, reps, iv, reap:0, vistas:t.vistas+1,
    aciertos:t.aciertos+1, prox: ahora + iv*DIA};
}
const calidad = (ok, ms) => !ok ? 2 : ms < 8000 ? 5 : ms < 25000 ? 4 : 3;

/* ---------- puntos ----------
   Acertar suma; fallar no resta (castigar el intento desalienta justo lo que
   queres que haga). Lo que resta es NO abrir la app: 15 por dia, hasta 5 dias,
   y nunca por debajo de cero. */
const PTS = {acierto:10, recupero:15, sesion:25, castigoDia:15, maxDias:5};
const nivel = p => {
  let n = 1, req = 150, acum = 0;
  while(p >= acum + req){ acum += req; n++; req = Math.round(req*1.35); }
  return {n, desde:acum, hasta:acum+req, titulo:
    ["Arranque","En camino","Consolidando","Sólido","Afilado","Listo para el examen"][Math.min(n-1,5)]};
};
function multiplicador(){ return 1 + Math.min(racha(), 10)/20; }  // hasta 1.5x

function racha(){
  const dias = new Set(S.hist.map(e => new Date(e.f).toLocaleDateString("sv")));
  let r = 0; const c = new Date();
  if(!dias.has(c.toLocaleDateString("sv"))) c.setDate(c.getDate()-1);
  while(dias.has(c.toLocaleDateString("sv"))){ r++; c.setDate(c.getDate()-1); }
  return r;
}

/* Se cobra al abrir, una sola vez por dia. */
function cobrarInactividad(){
  if(!S.ultimoDia){ S.ultimoDia = hoy(); guardar(); return 0; }
  const d = Math.floor((new Date(hoy()) - new Date(S.ultimoDia)) / DIA);
  if(d <= 1){ S.ultimoDia = hoy(); guardar(); return 0; }
  const perdidos = Math.min(d - 1, PTS.maxDias);
  const castigo = Math.min(S.pts, perdidos * PTS.castigoDia);
  S.pts -= castigo; S.ultimoDia = hoy(); guardar();
  return castigo ? {castigo, dias: d-1} : 0;
}

function debilidad(){
  const acc = new Map();
  for(const e of S.hist){
    const q = PORID.get(e.id); if(!q) continue;
    const k = concepto(q), a = acc.get(k) || {i:0, e:0};
    a.i++; if(!e.ok) a.e++; acc.set(k, a);
  }
  const m = new Map();
  for(const [k,a] of acc) if(a.i >= 2) m.set(k, a.e/a.i);
  return m;
}
function debiles(n = 4){
  const acc = new Map();
  for(const e of S.hist){
    const q = PORID.get(e.id); if(!q) continue;
    const k = concepto(q), a = acc.get(k) || {i:0, e:0};
    a.i++; if(!e.ok) a.e++; acc.set(k, a);
  }
  return [...acc].filter(([,a]) => a.e > 0 && a.i >= 2)
    .map(([k,a]) => ({k, ...a, pct: Math.round(100*a.e/a.i)}))
    .sort((x,y) => y.pct - x.pct).slice(0, n);
}

/* ---------- la cola ----------
   Primero lo que fallaste (queda vencido al instante), despues lo vencido de
   los conceptos flojos, y al final tarjetas nuevas de esos mismos conceptos.
   Nunca adelanta una tarjeta que no vencio: eso romperia el espaciado. */
/* Reparto rotativo por dominio.
   Priorizar los puntos flojos, solo, llena el examen de un tema: medido, un
   concepto fallado se llevaba 7 de 10. Un examen asi no entrena el cambio de
   contexto, que es lo que pide un examen de cinco dominios.

   Asi que en vez de ordenar por prioridad y cortar, se reparte por turnos:
   se recorre dominio por dominio tomando su mejor candidata, y se vuelve a
   empezar. La prioridad decide QUIEN sale primero dentro de cada dominio; la
   rotacion garantiza que estan todos representados. Con diez lugares y cinco
   dominios salen ~2 de cada uno, siempre mezclado.

   El techo por concepto sigue vigente por si un dominio tiene un solo tema
   flojo y lo repetiria dentro de su propio turno. */
const MAX_CONCEPTO = 3;
function repartir(candidatos, cupo){
  if(cupo <= 0) return [];
  const porDom = new Map();
  for(const t of candidatos){
    const q = PORID.get(t.id); if(!q) continue;
    const d = q.dom || "?";
    if(!porDom.has(d)) porDom.set(d, []);
    porDom.get(d).push(t);          // llegan ya ordenados por prioridad
  }
  // Arrancar por el dominio con la candidata mas urgente, no siempre por el mismo.
  const doms = mezclar([...porDom.keys()]);   // no arrancar siempre por el mismo
  const elegidas = [], porC = {}, areasUsadas = new Set();
  let quedan = true;
  while(elegidas.length < cupo && quedan){
    quedan = false;
    for(const d of doms){
      if(elegidas.length >= cupo) break;
      const lista = porDom.get(d);
      // Dentro del turno de un dominio, preferir un area (capitulo) que todavia
      // no haya salido: "varios dominios" no alcanza si siempre es el mismo
      // capitulo de cada uno.
      let idx = lista.findIndex(t => {
        const q = PORID.get(t.id);
        return q && (porC[concepto(q)]||0) < MAX_CONCEPTO && !areasUsadas.has(area(q));
      });
      if(idx < 0) idx = lista.findIndex(t => {
        const q = PORID.get(t.id);
        return q && (porC[concepto(q)]||0) < MAX_CONCEPTO;
      });
      if(idx >= 0){
        const t = lista.splice(idx,1)[0], q = PORID.get(t.id);
        porC[concepto(q)] = (porC[concepto(q)]||0)+1;
        areasUsadas.add(area(q));
        elegidas.push(t); quedan = true;
      } else lista.length = 0;
      if(lista.length) quedan = true;
    }
  }
  // Si el techo por concepto dejo huecos, se afloja antes que entregar menos.
  if(elegidas.length < cupo)
    elegidas.push(...candidatos.filter(t => !elegidas.includes(t)).slice(0, cupo - elegidas.length));
  return elegidas;
}

function sesion(ahora = Date.now()){
  const deb = debilidad(), peso = q => deb.get(concepto(q)) ?? 0.25;
  const v = mezclar(Object.values(S.tarjetas).filter(t => {
    const q = PORID.get(t.id);
    return q && !t.rota && t.prox <= ahora && admitida(q);
  }));
  const reap = v.filter(t => t.reap);
  const repasos = v.filter(t => !t.reap && t.vistas > 0).sort((a,b) => {
    const pa = peso(PORID.get(a.id)), pb = peso(PORID.get(b.id));
    if(Math.abs(pa-pb) > 0.15) return pb - pa;
    return a.prox - b.prox;
  });
  // Entre tarjetas nuevas, primero las del libro: son las que tienen clave
  // oficial. Dentro de cada grupo, el peso decide y los empates ya vienen
  // mezclados.
  const nuevas = v.filter(t => t.vistas === 0).sort((a,b) => {
    const qa = PORID.get(a.id), qb = PORID.get(b.id);
    const fa = fuente(qa) === "lote" ? 1 : 0, fb = fuente(qb) === "lote" ? 1 : 0;
    if(fa !== fb) return fa - fb;
    return peso(qb) - peso(qa);
  });

  // Lo que fallaste entra siempre, pero tambien con techo: si fallaste ocho de
  // un mismo tema, no queremos las ocho el mismo dia.
  const cola = repartir(reap, POR_SESION);
  const cupoNuevas = Math.min(NUEVAS, nuevas.length, Math.max(0, POR_SESION - cola.length));
  cola.push(...repartir(repasos.filter(t => !cola.includes(t)), POR_SESION - cola.length - cupoNuevas));
  cola.push(...repartir(nuevas.filter(t => !cola.includes(t)), cupoNuevas));
  // El relleno TAMBIEN reparte por dominio. Antes tiraba las que sobraban en
  // crudo, y con el progreso vacio (sin repasos, cupo de nuevas agotado) eso
  // era la mayor parte del examen: volvia a concentrarse en pocos dominios.
  if(cola.length < POR_SESION)
    cola.push(...repartir([...repasos, ...nuevas, ...reap].filter(t => !cola.includes(t)),
      POR_SESION - cola.length));
  cola.reap = cola.filter(t => t.reap).length;
  cola.temas = new Set(cola.map(t => PORID.get(t.id)?.dom)).size;
  cola.adaptada = deb.size > 0;
  return cola;
}

/* ---------- que la IA arme el examen ----------
   Reparto deliberado: SM-2 decide QUE VENCIO (timing, que es donde su
   matematica es insuperable) y la IA elige CUALES de esas van hoy y en que
   orden. SM-2 razona con estadisticas por tarjeta y no ve relacion entre
   ellas; un modelo que lee los enunciados si puede juntar las que atacan la
   misma confusion.

   Todo lo que devuelve se valida contra el pool: un id que no exista o que no
   estuviera vencido se descarta. Si falla, queda el orden deterministico. */
async function armarConIA(){
  const deb = debilidad();
  const pool = Object.values(S.tarjetas)
    .filter(t => !t.rota && t.prox <= Date.now() && PORID.has(t.id))
    .slice(0, 60);
  if(pool.length <= POR_SESION) return null;

  const lista = pool.map(t => {
    const q = PORID.get(t.id);
    return `${t.id} | ${concepto(q)} | fallada ${t.lapsos}x | ${q.pregunta.slice(0,90)}`;
  }).join("\n");

  const errores = S.hist.filter(e => !e.ok).slice(-15).map(e => {
    const q = PORID.get(e.id); if(!q) return null;
    return `- [${concepto(q)}] eligió "${q.opciones[e.el]}" (correcta: "${q.opciones[q.correcta]}")`;
  }).filter(Boolean).join("\n");

  const flojos = [...deb].sort((a,b) => b[1]-a[1]).slice(0,5)
    .map(([k,v]) => `${k}: ${Math.round(v*100)}% de error`).join("; ");

  const r = await preguntar(
    `Armá el examen de hoy para alguien que estudia para la certificación ISC2 CC.\n\n` +
    `CANDIDATAS (id | concepto | veces fallada | enunciado):\n${lista}\n\n` +
    `SUS PUNTOS FLOJOS: ${flojos || "(sin datos)"}\n\n` +
    `ERRORES RECIENTES:\n${errores || "(ninguno)"}\n\n` +
    `Elegí EXACTAMENTE ${POR_SESION} ids de la lista y ordenalos. Criterio: priorizá las ` +
    `que atacan las confusiones que se ven en sus errores, y cuando dos preguntas ` +
    `contrastan conceptos que está mezclando, ponelas juntas.\n` +
    `OBLIGATORIO: el examen tiene que cubrir VARIOS dominios, no mas de ${MAX_CONCEPTO} ` +
    `preguntas del mismo concepto, y lo mas repartido posible entre los cinco dominios.\n` +
    `En "motivo" explicá en UNA oración, en español rioplatense tuteando, qué trabaja este examen.`,
    {tier:"default", schema:{type:"object", properties:{
      ids:{type:"array", items:{type:"string"}, minItems:POR_SESION, maxItems:POR_SESION},
      motivo:{type:"string"}}, required:["ids","motivo"]}});

  const validos = new Map(pool.map(t => [t.id, t]));
  const vistos = new Set();
  const elegidas = [];
  for(const id of (r.texto.ids || [])){
    const t = validos.get(id);
    if(t && !vistos.has(id)){ vistos.add(id); elegidas.push(t); }
  }
  if(elegidas.length < 3) return null;                 // devolvio cualquier cosa
  // Si la IA ignora el techo, se lo aplicamos igual: la regla no es negociable.
  const conTecho = repartir(elegidas, POR_SESION);
  elegidas.length = 0; elegidas.push(...conTecho);
  for(const t of conTecho) vistos.add(t.id);
  for(const t of pool){                                 // completar si quedo corto
    if(elegidas.length >= POR_SESION) break;
    if(!vistos.has(t.id)){ vistos.add(t.id); elegidas.push(t); }
  }
  return {cola: elegidas.slice(0, POR_SESION), motivo: r.texto.motivo || "", motor: r.motor,
          descartados: (r.texto.ids || []).length - elegidas.length};
}

function stats(){
  const ts = Object.values(S.tarjetas).filter(t => PORID.has(t.id)), h = S.hist;
  return {total:ts.length, vistas:ts.filter(t=>t.vistas>0).length,
    dominadas:ts.filter(t=>t.iv>=21).length,
    acierto: h.length ? Math.round(100*h.filter(e=>e.ok).length/h.length) : 0, racha:racha(),
    falsa: h.filter(e => !e.ok && e.seg).length,
    dudando: h.filter(e => e.ok && e.seg === false).length};
}
const distractor = (i, correcta) => i > correcta ? i-1 : i;

/* ---------- barajar las opciones ----------
   Si la respuesta correcta cae siempre en la misma letra, terminas recordando
   "era la C" en vez del concepto. Cada vez que volves a ver una pregunta, las
   opciones salen en otro orden.

   Lo delicado es que TODO lo que va indexado por opcion tiene que moverse con
   ellas: cual es la correcta y la explicacion de cada distractor. Y lo que se
   guarda en el historial tiene que ser el indice ORIGINAL, porque el
   diagnostico lee la pregunta sin barajar — si guardaramos el indice mostrado,
   le estariamos diciendo que elegiste una opcion que no elegiste. */
function _hash(str){
  let h = 2166136261 >>> 0;
  for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h;
}
function _rnd(semilla){
  let x = semilla >>> 0;
  return () => { x = (Math.imul(x, 1664525) + 1013904223) >>> 0; return x / 4294967296; };
}
function barajar(q, vuelta){
  const orden = [0,1,2,3], r = _rnd(_hash(String(q.id)) + vuelta * 7919);
  for(let i = 3; i > 0; i--){ const j = Math.floor(r()*(i+1)); [orden[i],orden[j]] = [orden[j],orden[i]]; }
  // Explicacion por opcion ORIGINAL (porque_incorrectas saltea la correcta).
  const expl = [];
  for(let o = 0; o < 4; o++)
    expl[o] = o === q.correcta ? null
      : (q.porque_incorrectas ? q.porque_incorrectas[o > q.correcta ? o-1 : o] : "");
  return {...q,
    opciones: orden.map(o => q.opciones[o]),
    correcta: orden.indexOf(q.correcta),
    porque_opcion: orden.map(o => expl[o]),
    _orden: orden};                       // _orden[mostrado] = original
}

const COD = {"Security Principles":"SEC","Security Governance":"GOV",
             "Identity and Access Management":"IAM","Networking and Cloud Security":"NET",
             "Security Operations and Incident Response":"OPS"};
const codigo = q => "CC-" + (COD[q.dom] || "GEN") + (q.obj ? "." + q.obj : "") + "-" +
  String(q.id).replace(/\D/g,"").padStart(4,"0").slice(-4);

/* Severidad al estilo CVSS sobre la tasa de error: el color dice cuanto
   importa, no adorna. */
const sev = pct => pct >= 60 ? 3 : pct >= 35 ? 2 : 1;

/* ---------- dominios del examen oficial ----------
   ISC2 pesa cada dominio distinto. Saber que acertas el 90% de algo que vale
   el 10% del examen no dice mucho; el numero que importa es el ponderado. */
function porDominio(){
  const acc = {};
  for(const d in DOMS) acc[d] = {i:0, ok:0, banco:0};
  for(const q of BANCO) if(acc[q.dom]) acc[q.dom].banco++;
  for(const e of S.hist){
    const q = PORID.get(e.id); if(!q || !acc[q.dom]) continue;
    acc[q.dom].i++; if(e.ok) acc[q.dom].ok++;
  }
  return acc;
}

/* Cuantas preguntas hay, y cuantas te quedan sin ver, por objetivo del temario.
   Es lo que decide que se repone cuando el banco se agota. */
function porObjetivo(){
  const acc = {};
  for(const o in OBJS) acc[o] = {banco:0, sinVer:0, i:0, ok:0};
  for(const q of BANCO){
    const a = acc[q.obj]; if(!a || !admitida(q)) continue;
    a.banco++;
    const t = S.tarjetas[q.id];
    if(t && !t.rota && t.vistas === 0) a.sinVer++;
  }
  for(const e of S.hist){
    const q = PORID.get(e.id), a = q && acc[q.obj];
    if(a){ a.i++; if(e.ok) a.ok++; }
  }
  return acc;
}

/* Preguntas admitidas que nunca viste: el combustible que queda. */
function sinVer(){
  let n = 0;
  for(const t of Object.values(S.tarjetas)){
    const q = PORID.get(t.id);
    if(q && !t.rota && t.vistas === 0 && admitida(q)) n++;
  }
  return n;
}

/* Que objetivos reponer primero: los que casi no tienen preguntas sin ver y,
   a igualdad, aquellos donde peor venis respondiendo. */
function objetivosFlacos(n = 2){
  const acc = porObjetivo();
  return Object.keys(OBJS)
    .map(o => ({o, ...acc[o], err: acc[o].i ? 1 - acc[o].ok/acc[o].i : 0.3}))
    .sort((a,b) => (a.sinVer - b.sinVer) || (b.err - a.err) || (a.banco - b.banco))
    .slice(0, n);
}

/* Estimacion de aprobado: acierto por dominio, promediado.
   Con el esquema anterior esto se ponderaba por el peso oficial de cada
   dominio. ISC2 no publica los pesos del esquema vigente, asi que DOMS los
   deja iguales y lo que se informa no es "% del examen cubierto" sino cuantos
   dominios tienen datos: un 85% sacado de dos dominios de cinco no dice nada,
   y decirlo asi es lo unico honesto que se puede hacer sin los pesos. */
function prediccion(min = 5){
  const acc = porDominio();
  let peso = 0, suma = 0, conDatos = 0;
  for(const d in DOMS){
    if(acc[d].i < min) continue;
    conDatos++; peso += DOMS[d]; suma += DOMS[d] * (acc[d].ok / acc[d].i);
  }
  if(!peso) return {cobertura:0, doms:0, total:Object.keys(DOMS).length};
  return {pct: Math.round(100*suma/peso), cobertura: peso, doms: conDatos,
          total: Object.keys(DOMS).length, acc};
}

let IA, GEMINI_MUERTO = false;

  if(S.gkey && !GEMINI_MUERTO) return true;
  return !!(await ia());
}

  if(IA === undefined) IA = await (window.claude?.use?.("sample") ?? Promise.resolve(null));

/* Texto de una respuesta REST de Gemini. La forma es steps[].content[].text
   sobre los steps de tipo model_output; en REST no viene ningun output_text. */
function textoGemini(r){
  return (r.steps || []).filter(s => s.type === "model_output")
    .flatMap(s => s.content || []).filter(c => c.type === "text")
    .map(c => c.text).join("").trim();

/* Gemini primero si cargaste tu clave; si el entorno bloquea la llamada a
   googleapis (pasa cuando la pagina corre dentro de claude.ai), se marca
   muerto y no se reintenta mas en esta sesion: sigue Claude. */
async function preguntar(prompt, {schema=null, tier="default"} = {}){
  // Gemini primero si cargaste tu clave. Si el entorno bloquea la salida hacia
  // googleapis (pasa dentro de claude.ai), se marca muerto y no se reintenta
  // en esta sesion: sigue Claude, que no necesita clave.
  if(S.gkey && !GEMINI_MUERTO){
    try{
      const body = {model:"gemini-3.1-flash-lite", input:prompt};
      if(schema) body.response_format = {type:"text", mime_type:"application/json", schema};
      const resp = await fetch("https://generativelanguage.googleapis.com/v1beta/interactions",
        {method:"POST", headers:{"Content-Type":"application/json","x-goog-api-key":S.gkey},
         body: JSON.stringify(body)});
      if(!resp.ok) throw new Error("HTTP " + resp.status);
      const txt = textoGemini(await resp.json());
      if(!txt) throw new Error("vacio");
      return {texto: schema ? JSON.parse(txt) : txt, motor:"Gemini"};
    }catch(e){
      if(e instanceof TypeError) GEMINI_MUERTO = true;   // red o CSP
    }
  }
  const sample = await ia();
  if(!sample) throw new Error("sin IA");
  if(schema){
    // sample.json no toma schema: la forma se pide en el prompt y el helper parsea.
    const r = await sample.json(prompt +
      "\n\nRespondé SOLO con un JSON que cumpla exactamente este esquema, sin texto alrededor:\n" +
      JSON.stringify(schema), {modelTier:tier});
    return {texto:r, motor:"Claude"};
  }
  const r = await sample(prompt, {modelTier:tier});
  return {texto:r.text, motor:"Claude"};
}

function ics(hora){
  const [h,m] = hora.split(":").map(Number);
  const ini = new Date(); ini.setHours(h, m, 0, 0);
  if(ini < new Date()) ini.setDate(ini.getDate()+1);
  const f = d => d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")
    +"T"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+"00";
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Madrid";
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Repaso ISC2 CC//ES","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT","UID:repaso-isc2-cc@"+location.hostname,
    "DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z",
    "DTSTART;TZID="+tz+":"+f(ini),"DURATION:PT10M","RRULE:FREQ=DAILY",
    "SUMMARY:Repaso ISC2 CC","DESCRIPTION:10 preguntas del temario.\\n"+location.href,
    "URL:"+location.href,
    "BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:Repaso ISC2 CC","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
}

/* Esquema de salida para cualquier tanda de preguntas generadas. */
const ESQ_P = n => ({type:"object", properties:{preguntas:{type:"array",
  minItems:n, maxItems:n, items:{type:"object", properties:{
    pregunta:{type:"string"},
    opciones:{type:"array", items:{type:"string"}, minItems:4, maxItems:4},
    correcta:{type:"integer", minimum:0, maximum:3},
    porque_correcta:{type:"string"},
    porque_incorrectas:{type:"array", items:{type:"string"}, minItems:3, maxItems:3},
    refuerzo:{type:"string"}
  }, required:["pregunta","opciones","correcta","porque_correcta","porque_incorrectas","refuerzo"]}}},
  required:["preguntas"]});

/* Tres preguntas oficiales del libro del mismo dominio como molde de estilo:
   una pregunta de redes no sirve de molde para una de gobernanza. */
function moldes(dom){
  const of = BASE.filter(q => q.oficial);
  return mezclar(of.filter(q => q.dom === dom)).slice(0,3)
    .concat(mezclar(of).slice(0,3)).slice(0,3)
    .map(q => `${q.pregunta}\n${q.opciones.map((o,i)=>`${"abcd"[i]}) ${o}`).join("\n")}` +
              `\nCorrecta: ${"abcd"[q.correcta]}`)
    .join("\n\n");
}

/* ---------- reposicion del banco ----------
   "A medida que se van acabando, ¿se van generando nuevas?" — si, aca.

   Mientras haya preguntas sin ver no se gasta ni una llamada. Cuando el banco
   se queda corto, lo que se repone no se elige al azar: salen los objetivos
   del temario oficial con menos preguntas sin ver y, a igualdad, aquellos
   donde peor venis.

   Lo que recibe el modelo es el texto del objetivo oficial de ISC2 mas tres
   preguntas reales del examen del libro del mismo dominio como molde. No hay
   banco oficial de preguntas publicado por ISC2 — lo unico legitimo con lo que
   anclar la generacion es el temario. */
const REPO_MIN = 15, REPO_AUTO = 7, REPO_OBJ = 2, REPO_N = 3;

async function generarPara(o, n = REPO_N){
  const info = OBJS[o];
  const citas = (FUENTES[info.area] || []).slice(0,2).map(c => `"${c}"`).join("\n");
  const yaHay = mezclar(BANCO.filter(q => q.obj === o)).slice(0,8)
    .map(q => "- " + q.pregunta).join("\n");
  const claves = mezclar(CONC[o] || []).slice(0,10)
    .map(c => `- ${c.q} → ${c.a}`).join("\n");
  const r = await preguntar(
    `Generá ${n} preguntas de opción múltiple para la certificación ISC2 CC.\n\n` +
    `OBJETIVO DEL TEMARIO OFICIAL (esquema vigente desde el 1-sep-2026). Las preguntas ` +
    `tienen que caer exactamente acá, no en un objetivo vecino:\n${o} ${info.texto}\n\n` +
    (citas ? `MATERIAL DEL LIBRO:\n${citas}\n\n` : "") +
    (claves ? `LO QUE EL EXAMEN PREGUNTA SOBRE ESTE OBJETIVO (pares hecho→respuesta de una guía ` +
      `de examen). Son hechos verificados: convertilos en preguntas de aplicación, no los ` +
      `copies tal cual:\n${claves}\n\n` : "") +
    `ESTILO DEL EXAMEN OFICIAL — imitalo: mismo registro, mismo largo de enunciado, mismo ` +
    `tipo de distractor. Estas son preguntas reales del examen del libro:\n${moldes(info.dom)}\n\n` +
    `YA EXISTEN estas, no las repitas:\n${yaHay || "(ninguna todavía)"}\n\n` +
    `Reglas: 4 opciones, una sola correcta. Cada distractor tiene que representar un ` +
    `malentendido real y concreto, no relleno. Las 4 opciones de largo parecido. ` +
    `Explicaciones en español rioplatense, tuteo con vos. Aplicación y análisis, no ` +
    `definiciones sueltas.`,
    {tier:"complex", schema: ESQ_P(n)});
  let k = 0;
  for(const q of (r.texto.preguntas || [])){
    if(!q.opciones || q.opciones.length !== 4) continue;
    const id = "o" + Date.now().toString(36) + (k++);
    S.generadas.push({...q, id, obj:o, dom:info.dom, area:info.area,
      concepto:info.area, seccion:info.area, dificultad:"dificil", generada:true});
    S.tarjetas[id] = nueva(id);
  }
  return {n:k, motor:r.motor};
}

/* ---------- conceptos clave ----------
   Repaso de treinta segundos, ordenado por los objetivos donde peor venis. No
   suma puntos ni entra en el examen: es otra forma de pasar por el material
   cuando no tenes ganas de hacer las diez preguntas. */
let concIdx = 0, concPool = null;
function conceptosPool(){
  const ob = porObjetivo();
  const orden = Object.keys(OBJS)
    .map(o => ({o, err: ob[o].i ? 1 - ob[o].ok/ob[o].i : 0.3}))
    .sort((a,b) => b.err - a.err)
    .map(x => x.o).filter(o => (CONC[o] || []).length);
  const pool = [];
  for(const o of orden) for(const c of mezclar(CONC[o])) pool.push({...c, obj:o});
  return pool.length ? pool : null;
}

function pintarConcepto(){
  const div = document.getElementById("conc"); if(!div) return;
  if(!concPool) concPool = conceptosPool();
  if(!concPool){ div.innerHTML = ""; return; }
  const c = concPool[concIdx % concPool.length];
  div.innerHTML = `
    <div class="flash">
      <div class="flash-obj"><span class="obj-n">${c.obj}</span>${esc(OBJS[c.obj].area)}</div>
      <div class="flash-q">${esc(c.q)}</div>
      <div class="flash-a hidden" id="flasha">${esc(c.a)}
        <span class="src">Exam Guide (Packt, 2026) · p. ${c.p}</span></div>
      <button class="ghost" id="flashv">Ver la respuesta</button>
    </div>
    <button class="ghost" id="flashn">Otro concepto</button>`;
  document.getElementById("flashv").addEventListener("click", ev => {
    document.getElementById("flasha").classList.remove("hidden");
    ev.target.remove();
  });
  document.getElementById("flashn").addEventListener("click", () => {
    concIdx++; pintarConcepto();
  });
}

function pintarRepo(){
  const div = document.getElementById("repo"); if(!div) return;
  const n = sinVer();
  if(n > REPO_MIN){
    div.innerHTML = `<p class="tiny" style="margin:12px 0 0">Quedan <strong>${n}</strong>
      preguntas que nunca viste. Cuando bajen de ${REPO_MIN} escribo más, apuntando a los
      objetivos que tengan menos.</p>`;
    return;
  }
  div.innerHTML = `<div class="aviso ${n ? "" : "malo"}" style="margin-top:12px">${n
      ? `Quedan <strong>${n}</strong> preguntas que nunca viste.`
      : `<strong>Viste todas las preguntas del banco.</strong>`}
    Puedo escribir más sobre los objetivos donde tenés menos.</div>
    <button class="ghost" id="repobtn" style="margin-top:8px">Generar preguntas nuevas</button>
    <div id="repoout"></div>`;
  const b = document.getElementById("repobtn");
  b.addEventListener("click", () => reponer(b));
  // Automatico solo cuando de verdad se acaba, y una vez por dia: sin esto una
  // clave del plan gratuito se queda sin cupo en una tarde.
  if(S.autorepo !== false && n <= REPO_AUTO && S.repoDia !== hoy()) reponer(b, true);
}

async function reponer(boton, auto = false){
  const out = document.getElementById("repoout"); if(!out) return;
  if(!(await hayIA())){
    out.innerHTML = `<p class="tiny">No hay motor de IA disponible acá. Cargá tu clave de
      Gemini más abajo y volvé a intentar.</p>`;
    return;
  }
  S.repoDia = hoy(); guardar();
  boton.disabled = true;
  boton.textContent = auto ? "Reponiendo el banco…" : "Generando…";
  const flacos = objetivosFlacos(REPO_OBJ);
  let total = 0, motor = "";
  for(const f of flacos){
    out.innerHTML = `<p class="tiny" style="margin:10px 0 0"><span class="spin"></span>
      escribiendo sobre <strong>${f.o} ${esc(OBJS[f.o].area)}</strong>…</p>`;
    try{ const r = await generarPara(f.o); total += r.n; motor = r.motor || motor; }
    catch(e){}
  }
  reindexar(); guardar();
  if(total){
    out.innerHTML = `<div class="aviso bien" style="margin-top:10px">${total} preguntas nuevas
      sobre ${flacos.map(f => esc(f.o + " " + OBJS[f.o].area)).join(" y ")}, escritas por
      ${esc(motor)}. Entran en el examen de hoy.</div>`;
    setTimeout(irHome, 1800);
  }else{
    out.innerHTML = `<p class="tiny">No pude generar preguntas ahora. Probá más tarde.</p>`;
    boton.disabled = false; boton.textContent = "Generar preguntas nuevas";
  }
}

/* ---------- preguntas nuevas generadas ----------
   Ancladas al libro: le pasamos las citas textuales del concepto y dos preguntas
   reales del examen oficial como referencia de estilo, para que lo que salga se
   parezca al examen que vas a rendir y no a una pregunta de trivia. */
async function profundizar(conc, boton){
  const out = document.getElementById("deepout");
  boton.disabled = true; boton.textContent = "Generando…";
  out.innerHTML = `<div class="blk ai" style="margin-top:12px"><div class="lbl">Preguntas nuevas</div>
    <span class="spin"></span> sobre ${esc(conc)}</div>`;

  const citas = (FUENTES[conc] || []).slice(0,3).map(c => `"${c}"`).join("\n");
  // El objetivo del temario al que pertenece el concepto: lo nuevo nace ya
  // clasificado, si no la cobertura por objetivo se desactualiza sola.
  const ref = BANCO.find(q => concepto(q) === conc) || {};
  const obj = ref.obj && OBJS[ref.obj] ? ref.obj : null;
  const dom = ref.dom;
  const ejemplos = moldes(dom);
  const claves = obj ? mezclar(CONC[obj] || []).slice(0,8)
    .map(c => `- ${c.q} → ${c.a}`).join("\n") : "";
  const yaHay = BANCO.filter(q => concepto(q) === conc).slice(0,6).map(q => "- " + q.pregunta).join("\n");

  try{
    const r = await preguntar(
      `Generá 3 preguntas de opción múltiple sobre "${conc}" para alguien que rinde la ` +
      `certificación ISC2 CC.\n\n` +
      (obj ? `OBJETIVO DEL TEMARIO OFICIAL al que tiene que pertenecer:\n${obj} ${OBJS[obj].texto}\n\n` : "") +
      `MATERIAL DEL LIBRO (basate en esto, no inventes hechos):\n${citas || "(sin citas)"}\n\n` +
      (claves ? `HECHOS QUE EL EXAMEN PREGUNTA SOBRE ESTE TEMA (convertilos en preguntas de ` +
        `aplicación, no los copies):\n${claves}\n\n` : "") +
      `ESTILO DEL EXAMEN OFICIAL — imitalo: mismo registro, mismo largo de enunciado, ` +
    `mismo tipo de distractor. Estas son preguntas reales del examen del libro:\n${ejemplos}\n\n` +
      `YA EXISTEN estas, no las repitas:\n${yaHay}\n\n` +
      `Reglas: 4 opciones, una sola correcta. Cada distractor tiene que representar un ` +
      `malentendido real y concreto, no relleno. Las 4 opciones de largo parecido. ` +
      `Explicaciones en español rioplatense, tuteo con vos. Que PROFUNDICEN: aplicación ` +
      `y análisis, no definiciones sueltas.`,
      {tier:"complex", schema: ESQ_P(3)});
    const datos = r.texto;
    let n = 0;
    for(const q of (datos.preguntas || [])){
      if(!q.opciones || q.opciones.length !== 4) continue;
      const id = "g" + Date.now().toString(36) + (n++);
      S.generadas.push({...q, id, concepto:conc, seccion:conc,
        obj, dom: ref.dom, area: obj ? OBJS[obj].area : conc,
        dificultad:"dificil", generada:true});
      S.tarjetas[id] = nueva(id);
    }
    reindexar(); guardar();
    out.innerHTML = `<div class="aviso bien" style="margin-top:12px">${n} preguntas nuevas sobre
      <strong>${esc(conc)}</strong>, escritas por ${r.motor}. Entran en el examen de hoy.</div>`;
    setTimeout(irHome, 1400);
  }catch(err){
    out.innerHTML = `<p class="tiny">No pude generar preguntas ahora. Probá más tarde.</p>`;
    boton.disabled = false; boton.textContent = "Profundizar en esto →";
  }
}

function pintarQ(){
  const t = cola[idx], base = PORID.get(t.id);
  // La vuelta cambia con las veces que la viste, asi el orden cambia cada vez.
  const q = qv = barajar(base, t.vistas + (modo === "simulacro" ? 101 : 0));
  const deb = debilidad().get(concepto(q));
  elegida = null; t0 = Date.now();
  app.innerHTML = `
    <div class="prog"><i style="width:${100*idx/cola.length}%"></i></div>
    <div class="qmeta">
      <span class="qid">${codigo(q)}</span>
      <span class="qn">${idx+1}/${cola.length}</span>
      <span class="clock" id="reloj"></span>
      ${q.oficial ? '<span class="chip of">del examen del libro</span>' : ""}
      ${q.corregida ? '<span class="chip g">corregida</span>'
        : q.generada ? '<span class="chip g">generada para vos</span>' : ""}
      ${t.reap ? '<span class="chip w">la fallaste</span>' :
        deb >= 0.4 ? '<span class="chip w">punto flojo</span>' : ""}
    </div>
    <div class="q">${esc(q.pregunta)}</div>
    <div class="opts" id="opts">${q.opciones.map((o,i) =>
      `<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`
    ).join("")}</div>
    <div id="fb"></div>`;
  document.getElementById("opts").addEventListener("click", ev => {
    const b = ev.target.closest(".opt");
    if(b && elegida === null) preguntarConfianza(+b.dataset.i);
  });
  arrancarReloj();
}

/* En el diario el reloj cuenta hacia arriba y es informativo. En el simulacro
   cuenta hacia atras desde las 2 horas del examen real, y al llegar a cero
   corta: administrar el tiempo es parte de lo que hay que entrenar. */
function arrancarReloj(){
  pararReloj();
  const el = () => document.getElementById("reloj");
  const tick = () => {
    const e = el(); if(!e) return pararReloj();
    if(modo === "simulacro"){
      const queda = SIM_MS - (Date.now() - simIni);
      e.textContent = fmt(queda);
      e.classList.toggle("urge", queda < 10*60*1000);
      if(queda <= 0){ pararReloj(); terminarSimulacro(); }
    } else {
      e.textContent = fmt(Date.now() - t0);
    }
  };
  tick(); relojId = setInterval(tick, 1000);
}

/* ---------- simulacro ----------
   Las 100 preguntas se reparten con los pesos oficiales de ISC2, no al azar
   uniforme: un simulacro que no respeta la proporcion del examen no te dice
   si aprobas. */
function arrancarSimulacro(){
  const porDom = {};
  for(const q of BANCO) if(admitida(q)) (porDom[q.dom] = porDom[q.dom] || []).push(q);
  const elegidas = [];
  for(const d in DOMS){
    const pool = (porDom[d] || []).slice().sort(() => Math.random() - 0.5);
    elegidas.push(...pool.slice(0, Math.round(SIM_N * DOMS[d] / 100)));
  }
  while(elegidas.length < SIM_N){
    const q = BANCO[Math.floor(Math.random()*BANCO.length)];
    if(!elegidas.includes(q)) elegidas.push(q);
  }
  cola = elegidas.slice(0, SIM_N).sort(() => Math.random() - 0.5).map(q => ({id:q.id, reap:0}));
  modo = "simulacro"; simIni = Date.now(); simResp = []; idx = 0;
  pintarQ();
}

function terminarSimulacro(){
  pararReloj();
  const ms = Math.min(Date.now() - simIni, SIM_MS);
  const acc = {}; for(const d in DOMS) acc[d] = {i:0, ok:0};
  let ok = 0;
  for(const r of simResp){
    const q = PORID.get(r.id); if(!q) continue;
    if(acc[q.dom]){ acc[q.dom].i++; if(r.ok) acc[q.dom].ok++; }
    if(r.ok) ok++;
  }
  let peso = 0, suma = 0;
  for(const d in DOMS) if(acc[d].i){ peso += DOMS[d]; suma += DOMS[d]*(acc[d].ok/acc[d].i); }
  const pond = peso ? Math.round(100*suma/peso) : 0;
  const pct = simResp.length ? Math.round(100*ok/simResp.length) : 0;
  S.simulacros.push({f:Date.now(), ms, pct, pond, n:simResp.length});
  guardar();

  const fallos = simResp.filter(r => !r.ok).slice(0, 20);
  modo = "diario";
  app.innerHTML = `
    <div class="panel" style="margin-top:0">
      <h2>Simulacro terminado</h2>
      <div class="gauge">
        <div class="n ${pond>=78?"si":pond>=UMBRAL*100?"mas":"no"}">${pond}%</div>
        <div class="s">ponderado por dominio · ${ok}/${simResp.length} correctas · ${fmt(ms)}</div>
      </div>
      <div class="dom">${Object.keys(DOMS).map(d => {
        const x = acc[d], p = x.i ? Math.round(100*x.ok/x.i) : 0;
        return `<div class="dom-row">
          <div class="dom-top"><span>${esc(d)}</span><span class="mono">${x.i?p+"%":"—"}</span></div>
          <div class="dual"><i style="width:${x.i?p:0}%"></i><b style="left:${UMBRAL*100}%"></b></div>
          <div class="dom-w">${x.ok}/${x.i} · vale ${DOMS[d]}% del examen</div></div>`;}).join("")}</div>
    </div>
    ${fallos.length ? `<div class="panel"><h2>Las que fallaste</h2>
      <p class="hint">Mostrando ${fallos.length} de ${simResp.length - ok}.</p>
      ${fallos.map(r => { const q = PORID.get(r.id); return `<div class="rev mal">
        <div class="qq">${esc(q.pregunta)}</div>
        <div class="aa">Elegiste: ${esc(q.opciones[r.el])}<br>
        Correcta: <strong>${esc(q.opciones[q.correcta])}</strong></div></div>`;}).join("")}
      </div>` : ""}
    <button class="cta" id="volver">Volver</button>`;
  document.getElementById("volver").addEventListener("click", () => { ultimo = null; irHome(); });
}

/* ---------- confianza ----------
   Se pregunta ANTES de revelar. Despues de ver "correcto" todo el mundo dice
   que lo sabia, y ahi el dato no vale nada.

   Acertar dudando y acertar sabiendo no son lo mismo: el primero es lo que se
   cae en un examen adaptativo. Y fallar estando seguro es peor que fallar
   dudando, porque es un concepto mal aprendido, no un hueco. */
function preguntarConfianza(i){
  if(modo === "simulacro") return responder(i, true);   // el examen real no pregunta
  document.querySelectorAll(".conf").forEach(e => e.remove());
  document.querySelectorAll(".opt").forEach(b => b.classList.remove("sel"));
  const btn = document.querySelector(`.opt[data-i="${i}"]`);
  btn.classList.add("sel");
  const box = document.createElement("div");
  box.className = "conf";
  box.innerHTML = `
    <button data-s="1">Seguro<span class="s">lo sé</span></button>
    <button data-s="0">Dudando<span class="s">me inclino</span></button>`;
  btn.after(box);
  box.addEventListener("click", ev => {
    const b = ev.target.closest("button"); if(!b) return;
    box.remove(); responder(i, b.dataset.s === "1");
  });
}

function responder(i, seguro){
  const t = cola[idx], q = qv || PORID.get(t.id);
  const orig = q._orden ? q._orden[i] : i;      // indice en el orden original
  elegida = i;

  // En simulacro no hay feedback: se registra y se pasa, como en el examen real.
  if(modo === "simulacro"){
    simResp.push({id:t.id, ok: i === q.correcta, el:orig});
    [...document.querySelectorAll(".opt")].forEach((b,j) => {
      b.disabled = true; if(j === i) b.classList.add("dim");
    });
    if(idx + 1 >= cola.length) return terminarSimulacro();
    idx++; setTimeout(pintarQ, 120); return;
  }

  const ok = i === q.correcta, ms = Date.now() - t0;
  // La confianza manda sobre el tiempo: un acierto dudando vuelve pronto, y un
  // error estando seguro se castiga mas fuerte que uno dudando.
  const cal = ok ? (seguro ? calidad(true, ms) : 3) : (seguro ? 1 : 2);
  const eraLapso = t.lapsos >= 1, eraReap = !!t.reap;
  let gano = 0;
  if(ok){
    aciertosSesion++;
    const base = eraReap ? PTS.recupero : PTS.acierto;
    gano = Math.round(base * multiplicador() * (seguro ? 1 : 0.5));
    S.pts += gano; ptsSesion += gano;
  }
  S.tarjetas[t.id] = revisar(t, cal);
  S.hist.push({id:t.id, f:Date.now(), cal, ok, ms, el:orig, seg:!!seguro});
  guardar(); pintarPts();

  [...document.querySelectorAll(".opt")].forEach((b,j) => {
    b.disabled = true; b.classList.add(j===q.correcta ? "ok" : j===i ? "bad" : "dim");
  });

  const fig = q.fig && FIGS[q.fig];
  const tieneExp = !!q.porque_correcta;
  const fb = document.getElementById("fb");
  fb.className = "fb";
  fb.innerHTML = `
    <div class="verdict">
      <span class="t ${ok?"ok":"bad"}">${
        ok ? (seguro ? "Correcto" : "Correcto, dudando") : (seguro ? "Incorrecto" : "Incorrecto")}</span>
      ${gano ? `<span class="gain">+${gano}${!seguro?" · mitad por dudar":eraReap?" · recuperada":""}</span>`
        : `<span class="gain cero">${seguro?"estabas seguro — vuelve pronto":"sin puntos"}</span>`}
    </div>
    ${(!ok && tieneExp) ? `<div class="blk err"><div class="lbl">Por qué lo que elegiste está mal</div>
      ${esc((q.porque_opcion ? q.porque_opcion[i] : q.porque_incorrectas[distractor(i,q.correcta)]) || "")}</div>` : ""}
    ${(!ok && !tieneExp) ? `<div class="blk err"><div class="lbl">La correcta era</div>
      ${esc(q.opciones[q.correcta])}</div>` : ""}
    <div id="det" class="${ok?"hidden":""}">
      ${tieneExp ? `<div class="blk" style="background:var(--sunk);margin-bottom:13px">
        <div class="lbl">Por qué la respuesta es correcta</div>${esc(q.porque_correcta)}</div>` : ""}
      ${(!ok && eraLapso && q.refuerzo) ? `<div class="blk ref" style="margin-bottom:13px">
        <div class="lbl">Ya fallaste esta antes — vamos por otro lado</div>${esc(q.refuerzo)}</div>` : ""}
      ${fig ? `<figure style="margin-bottom:13px">
        <img src="data:image/jpeg;base64,${fig.d}" alt="Figura del libro, página ${q.fig}" loading="lazy">
        <figcaption>${esc(fig.c || "Figura del libro")} · p. ${q.fig}</figcaption></figure>` : ""}
      ${q.cita_pdf ? `<div class="blk cite"><div class="lbl">En el material</div>
        <q>${esc(q.cita_pdf)}</q>
        <div class="src">${esc(q.seccion)}${q.pagina?" · p. "+q.pagina:""}</div></div>` : ""}
    </div>
    ${ok && (tieneExp || fig) ? '<button class="linkbtn" id="ver">Ver la explicación</button>' : ""}
    <div id="aiout"></div>
    <button class="ghost hidden" id="mas">${tieneExp ? "Explicámelo distinto" : "Explicame por qué"}</button>
    <button class="cta" id="next">${idx+1>=cola.length?"Terminar":"Siguiente"}</button>
    <button class="linkbtn tiny" id="rota" style="width:100%;text-align:center">Esta pregunta está mal</button>`;

  document.getElementById("ver")?.addEventListener("click", ev => {
    document.getElementById("det").classList.remove("hidden"); ev.target.remove();
  });
  document.getElementById("next").addEventListener("click", siguiente);
  document.getElementById("rota").addEventListener("click", () => reportar(q, t));
  /* Hay IA si tenes clave de Gemini O si esta vista puede usar Claude. Mirar
     solo a Claude escondia el boton justo en el caso de GitHub Pages, donde
     Gemini es el unico motor. */
  hayIA().then(si => {
    const b = document.getElementById("mas");
    if(!si || !b) return;
    b.classList.remove("hidden");
    b.addEventListener("click", () => explicar(null, q, i, b), {once:true});
  });
}

/* ---------- reportar y reescribir ----------
   Antes, reportar una pregunta la mataba: salia de rotacion y ese hueco del
   temario quedaba sin cubrir. Ahora el motivo va a la IA junto con la cita del
   libro, y vuelve corregida. La original queda fuera igual: si estaba mal, no
   la queremos de vuelta. */
function reportar(q, t){
  const cont = document.getElementById("fb");
  const caja = document.createElement("div");
  caja.className = "panel"; caja.style.marginTop = "14px";
  caja.innerHTML = `
    <h2>¿Qué tiene de malo?</h2>
    <p class="hint">Con el motivo, la IA la reescribe usando el material del libro.</p>
    <div class="simrow" style="flex-direction:column">
      <button class="ghost" data-m="La respuesta marcada como correcta no lo es">La respuesta correcta está mal</button>
      <button class="ghost" data-m="Hay mas de una opcion defendible como correcta">Hay más de una opción válida</button>
      <button class="ghost" data-m="El enunciado es confuso o ambiguo">Está mal redactada</button>
      <button class="ghost" data-m="">Sólo sacarla, sin reescribir</button>
    </div>
    <div id="repout"></div>`;
  cont.appendChild(caja);
  // El listener primero: si scrollIntoView falla (o no existe), los botones
  // tienen que seguir andando igual.
  caja.addEventListener("click", async ev => {
    const b = ev.target.closest("button[data-m]"); if(!b) return;
    S.tarjetas[t.id].rota = 1; guardar();
    if(!b.dataset.m) return siguiente();
    const out = document.getElementById("repout");
    caja.querySelectorAll("button").forEach(x => x.disabled = true);
    out.innerHTML = `<p class="tiny"><span class="spin"></span> reescribiéndola…</p>`;
    try{
      const r = await preguntar(
        `Esta pregunta de un examen de la certificacion ISC2 CC tiene un problema. ` +
        `Reescribila corrigiendolo.\n\n` +
        `PREGUNTA: ${q.pregunta}\n` +
        q.opciones.map((o,j) => `${"abcd"[j]}) ${o}`).join("\n") + `\n` +
        `Marcada como correcta: ${"abcd"[q.correcta]}\n\n` +
        `PROBLEMA REPORTADO: ${b.dataset.m}\n\n` +
        (q.cita_pdf ? `MATERIAL DEL LIBRO (la verdad esta aca):\n"${q.cita_pdf}"\n\n` : "") +
        `Mantené el mismo concepto evaluado, pero corregí el problema. Una sola ` +
        `opcion correcta, distractores que representen malentendidos reales, las 4 ` +
        `de largo parecido. Explicaciones en español rioplatense, tuteo con vos.`,
        {tier:"complex", schema:{type:"object", properties:{
          pregunta:{type:"string"},
          opciones:{type:"array", items:{type:"string"}, minItems:4, maxItems:4},
          correcta:{type:"integer", minimum:0, maximum:3},
          porque_correcta:{type:"string"},
          porque_incorrectas:{type:"array", items:{type:"string"}, minItems:3, maxItems:3},
          refuerzo:{type:"string"}},
          required:["pregunta","opciones","correcta","porque_correcta","porque_incorrectas","refuerzo"]}});
      const n = r.texto;
      if(!n.opciones || n.opciones.length !== 4) throw new Error("mal formada");
      const id = "r" + Date.now().toString(36);
      S.generadas.push({...n, id, concepto: concepto(q), seccion: q.seccion, dom: q.dom,
        obj: q.obj, area: q.area,
        cita_pdf: q.cita_pdf, pagina: q.pagina, fig: q.fig,
        dificultad: q.dificultad || "media", corregida: true});
      S.tarjetas[id] = nueva(id);
      reindexar(); guardar();
      out.innerHTML = `<div class="aviso bien" style="margin-top:10px">Corregida por
        ${r.motor}. La vieja quedó fuera y la nueva entra en rotación.</div>`;
      setTimeout(siguiente, 1600);
    }catch(e){
      out.innerHTML = `<p class="tiny">No se pudo reescribir, pero la saqué de rotación.</p>`;
      setTimeout(siguiente, 1400);
    }
  });
  try{ caja.scrollIntoView({behavior:"smooth", block:"nearest"}); }catch(e){}
}

async function explicar(_ignorado, q, elegido, boton){
  const out = document.getElementById("aiout");
  boton.disabled = true; boton.textContent = "Pensando…";
  out.innerHTML = `<div class="blk ai"><div class="lbl" id="ailbl">Explicación</div>
    <span id="aitxt"><span class="spin"></span></span></div>`;
  const span = document.getElementById("aitxt");
  try{
    const r = await preguntar(
      `Sos un tutor de ciberseguridad ayudando a alguien que rinde la ISC2 CC. ` +
      `Español rioplatense, tuteo con vos, directo y sin relleno.\n\n` +
      `Pregunta: ${q.pregunta}\nOpciones: ${q.opciones.map((o,j)=>`${"ABCD"[j]}) ${o}`).join("  ")}\n` +
      `Correcta: ${"ABCD"[q.correcta]}\n` +
      (elegido === q.correcta ? "Acerto.\n" : `Eligio: ${"ABCD"[elegido]}\n`) +
      (q.cita_pdf ? `Del libro: "${q.cita_pdf}"\n` : "") +
      (q.porque_correcta ? `Ya leyo: "${q.porque_correcta}"\nExplicale el concepto DE OTRA MANERA, ` +
        `con otra entrada al tema o un caso concreto. No repitas lo de arriba.\n`
        : `Explicale por que esa es la correcta y por que la que eligio no lo es.\n`) +
      `Maximo 4 oraciones, texto plano sin markdown.`, {tier:"quick"});
    span.textContent = r.texto;
    document.getElementById("ailbl").textContent = "Explicación · " + r.motor;
  }catch(err){
    out.innerHTML = `<div class="blk" style="background:var(--sunk)">No pude pedir la explicación ahora.</div>`;
  }
}

function siguiente(){
  pararReloj();
  if(idx+1 >= cola.length){
    if(aciertosSesion === cola.length && cola.length){ S.pts += PTS.sesion; ptsSesion += PTS.sesion; }
    ultimo = {n:cola.length, ok:aciertosSesion, pts:ptsSesion};
    guardar(); irHome();
  } else { idx++; pintarQ(); }
}

async function diagnostico(){
  const btn = document.getElementById("coach"), out = document.getElementById("coachout");
  btn.disabled = true; btn.textContent = "Analizando…";
  out.innerHTML = `<div class="blk ai" style="margin-top:12px"><div class="lbl" id="dlbl">Diagnóstico</div>
    <span id="dtxt"><span class="spin"></span></span></div>`;
  const span = document.getElementById("dtxt");
  const errores = S.hist.filter(e => !e.ok).slice(-25).map(e => {
    const q = PORID.get(e.id); if(!q) return null;
    const d = q.porque_incorrectas ? q.porque_incorrectas[distractor(e.el,q.correcta)] : "";
    return `- [${concepto(q)}] ${q.pregunta}\n  Eligio: "${q.opciones[e.el]}"` +
           (d ? `\n  Ese error significa: ${d}` : `\n  La correcta era: "${q.opciones[q.correcta]}"`);
  }).filter(Boolean).join("\n");
  try{
    const r = await preguntar(
      `Sos un tutor analizando a alguien que rinde la certificacion ISC2 CC.\n` +
      `Abajo estan sus errores recientes: que opcion eligio y que malentendido representa.\n\n` +
      `Inferi el PATRON detras de los errores, no los repitas. Si confunde dos ideas parecidas, ` +
      `deci cuales dos y como distinguirlas. Si no hay patron, deci eso en vez de inventar uno. ` +
      `Nada de elogios ni motivacion generica.\n` +
      `Espanol rioplatense, tuteo con vos. Maximo 6 oraciones, texto plano.\n\n` + errores,
      {tier:"default"});
    span.textContent = r.texto;
    document.getElementById("dlbl").textContent = "Diagnóstico · " + r.motor;
  }catch(err){ out.innerHTML = `<p class="tiny">No pude generar el diagnóstico ahora.</p>`; }
  btn.textContent = "Pedir un diagnóstico"; btn.disabled = false;
}

irHome();
</script>
