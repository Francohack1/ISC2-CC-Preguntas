<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Repaso CC">

<style>html{color-scheme:light dark}body{margin:0;font:14px system-ui}
img{max-width:100%}[hidden]{display:none!important}</style>
<title>Repaso ISC2 CC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Paleta derivada de IBM Carbon: es el sistema de las consolas de seguridad
   empresariales y combina con IBM Plex, que ya usamos. La severidad sigue la
   escala de CVSS y se aplica solo donde significa algo. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --raised:#f7f9fb; --sunk:#e8ecf1;
  --line:#d3dae1; --line2:#c1cad3;
  --ink:#111a20; --ink2:#3d4c57; --muted:#697883;
  --accent:#00767a; --accent-ink:#00767a; --accent-soft:#d7f2f1;
  --crit:#b3242c; --high:#9c4200; --med:#7a5c00; --low:#0f5bd6; --ok:#137a3d;
  --crit-soft:#fce4e5; --ok-soft:#dff2e5; --med-soft:#fbf0cf; --low-soft:#e2ecfd;
  --r:4px; --r2:8px; --maxw:600px;
  --grid:rgba(17,26,32,.045);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0f15; --surface:#111a22; --raised:#16212b; --sunk:#0e161d;
  --line:#21303c; --line2:#2d3f4d;
  --ink:#e3ecf2; --ink2:#b6c6d2; --muted:#7b93a3;
  --accent:#3ddbd9; --accent-ink:#3ddbd9; --accent-soft:#0c3436;
  --crit:#ff6b74; --high:#ff9d4d; --med:#e8c547; --low:#5b9cff; --ok:#52c97a;
  --crit-soft:#2b1215; --ok-soft:#0f2a19; --med-soft:#2a2310; --low-soft:#101f38;
  --grid:rgba(61,219,217,.055);
}}
:root[data-theme="dark"]{
  --bg:#0a0f15; --surface:#111a22; --raised:#16212b; --sunk:#0e161d;
  --line:#21303c; --line2:#2d3f4d;
  --ink:#e3ecf2; --ink2:#b6c6d2; --muted:#7b93a3;
  --accent:#3ddbd9; --accent-ink:#3ddbd9; --accent-soft:#0c3436;
  --crit:#ff6b74; --high:#ff9d4d; --med:#e8c547; --low:#5b9cff; --ok:#52c97a;
  --crit-soft:#2b1215; --ok-soft:#0f2a19; --med-soft:#2a2310; --low-soft:#101f38;
  --grid:rgba(61,219,217,.055);
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.55; margin:0;
  padding-block:0 48px; padding-inline:14px; -webkit-text-size-adjust:100%;
}
.wrap{max-width:var(--maxw); margin:0 auto}
h1,h2{margin:0; text-wrap:balance;
  font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  font-weight:700; letter-spacing:.005em}
button{font:inherit; cursor:pointer; border:none; background:none; color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
img{max-width:100%}

/* barra de estado */
header{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding-block:16px 14px; border-bottom:1px solid var(--line); margin-bottom:16px;
}
header h1{font-size:16px; text-transform:uppercase; letter-spacing:.09em}
header h1 span{color:var(--accent)}
.pts{display:flex; align-items:baseline; gap:5px;
  font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.pts .v{font-size:17px; font-weight:600; color:var(--accent)}
.pts .u{color:var(--muted); font-size:10px; letter-spacing:.12em; text-transform:uppercase}

/* superficies: el filete superior da la lectura de instrumento */
.panel,.rank,.hero,.stat{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
}
.panel{padding:16px; margin-top:12px; position:relative}
.panel::before{content:""; position:absolute; inset:-1px -1px auto -1px; height:2px;
  background:var(--line2); border-radius:var(--r) var(--r) 0 0}
.panel h2{font-size:13px; text-transform:uppercase; letter-spacing:.1em; margin-bottom:5px}
.panel .hint{color:var(--muted); font-size:13px; margin:0 0 14px; line-height:1.5}

.rank{padding:13px 15px; margin-bottom:10px}
.rank-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:8px}
.rank-n{font-family:"IBM Plex Sans Condensed",sans-serif; font-size:15px; font-weight:700;
  text-transform:uppercase; letter-spacing:.06em}
.rank-x{color:var(--muted); font-size:11.5px;
  font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.track{height:4px; background:var(--sunk); border-radius:2px; overflow:hidden}
.track i{display:block; height:100%; background:var(--accent); border-radius:2px; transition:width .4s ease}

/* hero con retícula: instrumento, no adorno */
.hero{
  padding:26px 20px; text-align:center; display:flex; flex-direction:column; gap:3px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px; background-position:center;
}
.hero .n{font-family:"IBM Plex Mono",monospace; font-size:54px; font-weight:600;
  line-height:1; color:var(--accent); letter-spacing:-.02em}
.hero .lbl{color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.11em}
.hero .why{color:var(--accent-ink); font-size:12.5px; margin-top:10px; line-height:1.45}

.cta{background:var(--accent); color:var(--bg); border-radius:var(--r); padding:15px;
  width:100%; font-weight:600; font-size:15px; margin-top:12px;
  text-transform:uppercase; letter-spacing:.07em}
.cta[disabled]{background:transparent; color:var(--muted); cursor:default; border:1px solid var(--line)}
.ghost{border:1px solid var(--line2); border-radius:var(--r); padding:12px; width:100%;
  font-weight:500; font-size:14px; color:var(--ink); background:var(--raised)}
.ghost:hover:not([disabled]){border-color:var(--accent)}
.ghost[disabled]{color:var(--muted); cursor:default; border-color:var(--line)}

.stats{display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin-top:12px}
.stat{padding:11px 13px}
.stat .v{font-family:"IBM Plex Mono",monospace; font-size:20px; font-weight:600;
  line-height:1.2; font-variant-numeric:tabular-nums}
.stat .k{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.07em; margin-top:1px}

/* puntos flojos con severidad tipo CVSS */
.weak{display:flex; flex-direction:column; gap:13px}
.weak-row{display:flex; flex-direction:column; gap:5px}
.weak-top{display:flex; justify-content:space-between; gap:10px; align-items:baseline}
.weak-name{font-size:14px; display:flex; align-items:center; gap:7px}
.sev{width:3px; height:13px; border-radius:1px; flex:none}
.sev.s3{background:var(--crit)} .sev.s2{background:var(--high)} .sev.s1{background:var(--med)}
.weak-num{color:var(--muted); font-size:11px; font-family:"IBM Plex Mono",monospace}
.bar{height:3px; background:var(--sunk); border-radius:2px; overflow:hidden}
.bar i{display:block; height:100%; border-radius:2px; background:var(--high)}
.bar i.s3{background:var(--crit)} .bar i.s2{background:var(--high)} .bar i.s1{background:var(--med)}
.deep{color:var(--accent-ink); font-size:12px; text-align:left; padding:3px 0 0;
  font-family:"IBM Plex Mono",monospace}

.aviso{border-radius:var(--r); padding:11px 13px; margin-bottom:12px; font-size:13.5px;
  border-left:3px solid var(--line2); background:var(--raised)}
.aviso.malo{background:var(--crit-soft); border-left-color:var(--crit); color:var(--crit)}
.aviso.bien{background:var(--ok-soft); border-left-color:var(--ok)}

.field{display:flex; gap:8px; align-items:center; margin-bottom:12px}
.field label{font-size:13.5px; color:var(--muted)}
select,.key{background:var(--sunk); color:var(--ink); border:1px solid var(--line2);
  border-radius:var(--r); padding:10px; font:inherit}
.key{width:100%; font-family:"IBM Plex Mono",monospace; font-size:13px}
.estado{display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:10px;
  font-family:"IBM Plex Mono",monospace}
.dot{width:7px; height:7px; border-radius:50%; flex:none}
.dot.on{background:var(--ok); box-shadow:0 0 0 3px var(--ok-soft)}
.dot.off{background:var(--muted)}

/* examen */
.prog{height:2px; background:var(--sunk); margin-bottom:16px}
.prog i{display:block; height:100%; background:var(--accent); transition:width .25s ease}
.qmeta{display:flex; gap:7px; align-items:center; flex-wrap:wrap; color:var(--muted);
  font-size:11px; margin-bottom:12px; font-family:"IBM Plex Mono",monospace}
.qid{color:var(--accent-ink); font-weight:600; letter-spacing:.04em}
.chip{border:1px solid var(--line2); border-radius:2px; padding:2px 7px; font-size:10px;
  letter-spacing:.09em; text-transform:uppercase; white-space:nowrap}
.chip.of{border-color:var(--med); color:var(--med)}
.chip.w{border-color:var(--crit); color:var(--crit)}
.chip.g{border-color:var(--accent); color:var(--accent-ink)}
.q{font-family:"IBM Plex Sans",sans-serif; font-size:20px; font-weight:500;
  line-height:1.45; margin-bottom:18px; color:var(--ink)}
.opts{display:flex; flex-direction:column; gap:7px}
.opt{display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%;
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--line2);
  border-radius:var(--r); padding:13px 14px; line-height:1.45; font-size:15px;
  transition:border-color .12s ease}
.opt:hover:not([disabled]){border-left-color:var(--accent)}
.opt .k{font-family:"IBM Plex Mono",monospace; color:var(--muted); font-size:12px;
  padding-top:3px; font-weight:600}
.opt.sel{border-left-color:var(--accent); background:var(--raised)}
.opt.ok{background:var(--ok-soft); border-color:var(--ok); border-left-color:var(--ok)}
.opt.bad{background:var(--crit-soft); border-color:var(--crit); border-left-color:var(--crit)}
.opt.dim{opacity:.4}
.opt.ok .k,.opt.bad .k{color:inherit}

/* confianza */
.conf{display:flex; gap:7px; margin-top:7px}
.conf button{flex:1; border:1px solid var(--line2); border-radius:var(--r); padding:11px 8px;
  font-size:13px; font-weight:500; background:var(--raised)}
.conf button .s{display:block; font-size:10px; color:var(--muted); text-transform:uppercase;
  letter-spacing:.07em; margin-top:2px; font-family:"IBM Plex Mono",monospace}
.conf button:hover{border-color:var(--accent)}

.fb{margin-top:16px; display:flex; flex-direction:column; gap:11px}
.verdict{display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding-bottom:10px; border-bottom:1px solid var(--line)}
.verdict .t{font-family:"IBM Plex Sans Condensed",sans-serif; font-size:16px; font-weight:700;
  text-transform:uppercase; letter-spacing:.09em}
.verdict .t.ok{color:var(--ok)} .verdict .t.bad{color:var(--crit)}
.gain{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:13px; color:var(--ok)}
.gain.cero{color:var(--muted)}
.blk{border-radius:var(--r); padding:13px; background:var(--raised); border-left:3px solid var(--line2)}
.blk.err{background:var(--crit-soft); border-left-color:var(--crit)}
.blk.ref{background:var(--med-soft); border-left-color:var(--med)}
.blk.cite{background:var(--sunk); border-left-color:var(--line2)}
.blk.ai{background:var(--accent-soft); border-left-color:var(--accent)}
.lbl{font-size:10px; letter-spacing:.11em; text-transform:uppercase; font-weight:600;
  color:var(--muted); margin-bottom:6px; font-family:"IBM Plex Mono",monospace}
.blk.err .lbl{color:var(--crit)} .blk.ref .lbl{color:var(--med)} .blk.ai .lbl{color:var(--accent-ink)}
.cite q{font-style:italic; quotes:'"' '"'; color:var(--ink2)}
.src{color:var(--muted); font-size:11px; margin-top:8px; font-family:"IBM Plex Mono",monospace}
figure{margin:0}
figure img{display:block; width:100%; border-radius:var(--r); background:#fff; border:1px solid var(--line2)}
figcaption{color:var(--muted); font-size:11.5px; margin-top:7px; line-height:1.4;
  font-family:"IBM Plex Mono",monospace}
.linkbtn{color:var(--accent-ink); font-size:13.5px; font-weight:500; padding:0; text-align:left}
.tiny{color:var(--muted); font-size:12px; text-align:center; margin-top:10px; line-height:1.5}

.flash{border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:var(--r); padding:13px; background:var(--raised); margin-bottom:8px}
.flash-obj{font-size:11.5px; color:var(--muted); margin-bottom:7px}
.flash-q{font-size:15px; font-weight:500; line-height:1.45; margin-bottom:10px}
.flash-a{font-size:14px; color:var(--ink2); line-height:1.5; margin-bottom:10px}
.flash-a .src{display:block; margin-top:6px; font-family:"IBM Plex Mono",monospace;
  font-size:11px; color:var(--muted)}
summary.sum{cursor:pointer; font-size:13px; color:var(--accent); font-weight:600;
  list-style:none; padding:2px 0}
summary.sum::-webkit-details-marker{display:none}
summary.sum::before{content:"\25b8  "}
details[open]>summary.sum::before{content:"\25be  "}
.obj-n{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted);
  margin-right:6px; letter-spacing:.02em}
/* dominios */
.dom{display:flex; flex-direction:column; gap:11px}
.dom-row{display:flex; flex-direction:column; gap:4px}
.dom-top{display:flex; justify-content:space-between; gap:10px; align-items:baseline; font-size:13.5px}
.dom-top .mono{font-size:12.5px}
.dom-w{color:var(--muted); font-size:10.5px; font-family:"IBM Plex Mono",monospace; letter-spacing:.02em}
.dual{height:5px; background:var(--sunk); border-radius:2px; position:relative; overflow:hidden}
.dual i{position:absolute; left:0; top:0; height:100%; border-radius:2px; background:var(--accent)}
.dual b{position:absolute; top:-2px; width:1px; height:9px; background:var(--ink); opacity:.45}
.gauge{text-align:center; padding:6px 0 12px}
.gauge .n{font-family:"IBM Plex Mono",monospace; font-size:48px; font-weight:600; line-height:1}
.gauge .n.si{color:var(--ok)} .gauge .n.no{color:var(--crit)} .gauge .n.mas{color:var(--med)}
.gauge .s{font-size:13px; color:var(--muted); margin-top:4px}

.clock{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-weight:600; color:var(--muted)}
.clock.urge{color:var(--crit)}
.simrow{display:flex; gap:7px; margin-top:8px}
.simrow>*{flex:1}
.rev{border:1px solid var(--line); border-left:3px solid var(--crit); border-radius:var(--r);
  padding:11px; margin-bottom:7px; background:var(--raised)}
.rev .qq{font-size:13.5px; font-weight:500; margin-bottom:5px}
.rev .aa{font-size:12.5px; color:var(--muted); line-height:1.5}

.hidden{display:none!important}
.spin{display:inline-block; width:11px; height:11px; border:2px solid var(--accent);
  border-right-color:transparent; border-radius:50%; animation:sp .7s linear infinite; vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>

    <h1>Repaso <span>ISC2&nbsp;CC</span></h1>

<script id="qdata" type="application/json">[{"id":"q0001","pregunta":"Tenés una empresa que implementó un firewall para filtrar el tráfico de red, pero aún sufre interrupciones constantes debido a ataques de denegación de servicio (DoS). ¿Qué principio de la tríada CIA estás fallando en garantizar principalmente?","opciones":["Confidencialidad","Integridad","Disponibilidad","Autenticidad"],"correcta":2,"porque_correcta":"La denegación de servicio impide que los usuarios accedan a sistemas y servicios, lo cual afecta directamente la capacidad de que la información esté accesible cuando se necesita.","porque_incorrectas":["La confidencialidad se enfoca en restringir el acceso a partes no autorizadas, no en el tiempo de actividad del sistema.","La integridad se refiere a que la información no sea alterada, algo distinto a si está disponible para ser usada.","La autenticidad es un concepto relacionado con verificar la identidad, no es un pilar fundamental de la tríada CIA."],"refuerzo":"La disponibilidad asegura que tus sistemas funcionen cuando vos los necesitás. Pensá en un sitio de compras online: si el servidor se cae, no importa qué tan seguro sea contra robos (confidencialidad) o que los precios sean correctos (integridad), el negocio no funciona porque no hay acceso. Es como una puerta blindada que no podés abrir ni con tu llave.","concepto":"Tríada CIA","seccion":"1 Security Concepts of Information Assurance","dom":"Security Principles","obj":"1.1","area":"Conceptos de ciberseguridad","dificultad":"facil","tipo":"aplicacion","cita_pdf":"Finally, threats of deletion or rendering inaccessible information and services affect availability and are collectively referred to as Denial.","pagina":20,"fig":20},{"id":"q0002","pregunta":"Si un atacante logra modificar los datos de una base de datos sin autorización, ¿qué principio de la seguridad de la información se vio comprometido?","opciones":["Confidencialidad","Integridad","Disponibilidad","Privacidad"],"correcta":1,"porque_correcta":"La integridad garantiza que la información se mantenga exacta y sin cambios, excepto por medios autorizados; la alteración directa rompe este principio.","porque_incorrectas":["La confidencialidad trata sobre quién puede ver la información, no sobre si la información ha sido cambiada.","La disponibilidad se ocupa de que los sistemas estén funcionando, no de si los datos contenidos en ellos fueron manipulados.","La privacidad es un concepto legal o de manejo de datos, pero la alteración técnica del dato es el fallo en la integridad."],"refuerzo":"Imaginá que alguien entra en tu cuenta bancaria y cambia el saldo de 1000 a 1. El banco sigue 'disponible' y el ladrón no necesariamente 'robó' información (confidencialidad), pero la exactitud de tu dinero se perdió. Eso es un fallo de integridad: la información dejó de ser veraz.","concepto":"Tríada CIA","seccion":"1 Security Concepts of Information Assurance","dom":"Security Principles","obj":"1.1","area":"Conceptos de ciberseguridad","dificultad":"facil","tipo":"aplicacion","cita_pdf":"Integrity - Means that information is always accurate, consistent, and unaltered (unless by authorized means).","pagina":19},{"id":"q0003","pregunta":"Una política de la empresa obliga a que todos los empleados realicen una capacitación anual sobre manejo de datos. ¿Qué tipo de control de seguridad se está aplicando?","opciones":["Control físico","Control técnico","Control administrativo","Control de infraestructura"],"correcta":2,"porque_correcta":"Las capacitaciones, políticas y procedimientos son medidas de gestión que guían las operaciones, clasificándose como controles administrativos.","porque_incorrectas":["Los controles físicos implican activos tangibles como guardias o cámaras de seguridad.","Los controles técnicos requieren mecanismos de software o hardware, como firewalls o cifrado.","La infraestructura es el activo a proteger, no un tipo de control de seguridad."],"refuerzo":"Los controles administrativos son las reglas del juego. No son una máquina (técnico) ni un candado (físico), sino la forma en que los humanos deben comportarse. Por ejemplo, exigir que cambies tu contraseña cada 90 días es una regla administrativa que obliga a un comportamiento seguro.","concepto":"Controles de seguridad","seccion":"1 Security Concepts of Information Assurance","dom":"Security Principles","obj":"1.1","area":"Conceptos de ciberseguridad","dificultad":"media","tipo":"aplicacion","cita_pdf":"However, it is also important to remember that other security controls are administrative, such as the establishment of policies, procedures, and training programs, are equally important.","pagina":19},{"id":"q0004","pregunta":"Si un empleado utiliza una tarjeta de acceso para ingresar al centro de datos, ¿qué tipo de control de seguridad está ejerciendo dicha tarjeta?","opciones":["Control técnico","Control administrativo","Control físico","Control de activos"],"correcta":2,"porque_correcta":"Las tarjetas de acceso, junto con cámaras y guardias, forman parte de las medidas destinadas a proteger las instalaciones físicas de accesos no autorizados.","porque_incorrectas":["Un control técnico suele ser algo como un firewall o un software antivirus, no un objeto físico de acceso al edificio.","El control administrativo es una norma o política, no el dispositivo físico de acceso.","El control de activos no es una categoría estándar de seguridad; los activos son lo que se protege."],"refuerzo":"Pensá en el control físico como aquello que toca el mundo real para detener a alguien. Si necesitás un objeto o una presencia para entrar a una habitación (como una llave o un guardia), estás operando en el plano de la seguridad física para impedir que alguien toque el hardware.","concepto":"Controles de seguridad","seccion":"1 Security Concepts of Information Assurance","dom":"Security Principles","obj":"1.1","area":"Conceptos de ciberseguridad","dificultad":"facil","tipo":"aplicacion","cita_pdf":"Physical security controls, such as security cameras, access cards, and security guards, help secure physical premises and prevent unauthorized access.","pagina":19},{"id":"q0005","pregunta":"La interdependencia de la tríada CIA implica que los pilares se refuerzan entre sí. ¿Por qué asegurar la integridad ayuda a la disponibilidad?","opciones":["Porque previene la divulgación de información confidencial.","Porque proteger la configuración del sistema evita errores que lo vuelvan inaccesible.","Porque asegura que solo personas autorizadas modifiquen los datos.","Porque limita el acceso a atacantes que buscan denegar el servicio."],"correcta":1,"porque_correcta":"La integridad de la configuración de un sistema es crítica; si la configuración es alterada (fallo de integridad), el sistema puede dejar de funcionar, afectando la disponibilidad.","porque_incorrectas":["Esto describe una relación entre integridad y confidencialidad, no integridad y disponibilidad.","Aunque es cierto, el enunciado pregunta cómo la integridad protege la disponibilidad, y esta opción es solo una parte del problema de acceso.","Esto previene el acceso no autorizado (confidencialidad), no la interrupción del servicio."],"refuerzo":"Imaginá que alguien cambia los archivos de configuración de tu servidor de correo (un fallo de integridad). El sistema sigue existiendo, pero no logra arrancar. Por eso, al mantener la configuración 'intacta', te asegurás de que el sistema siga vivo y disponible para los usuarios.","concepto":"Tríada CIA","seccion":"1 Security Concepts of Information Assurance","dom":"Security Principles","obj":"1.1","area":"Conceptos de ciberseguridad","dificultad":"dificil","tipo":"analisis","cita_pdf":"Ensuring integrity then assists, for example, in protecting the configuration of systems thereby ensuring their availability.","pagina":20,"fig":20},{"id":"q0006","pregunta":"Una empresa cifra sus datos en reposo para que, en caso de robo de los discos duros, la información sea ilegible. ¿Qué relación tiene esto con la tríada CIA?","opciones":["Garantiza la disponibilidad ante ataques físicos.","Asegura la integridad mediante el cifrado de datos.","Protege la confidencialidad frente a la divulgación no autorizada.","Establece una política administrativa de seguridad."],"correcta":2,"porque_correcta":"El cifrado impide que partes no autorizadas accedan al contenido, protegiendo así la confidencialidad de la información si el hardware físico es comprometido.","porque_incorrectas":["El cifrado de datos en reposo no ayuda a que el sistema sea más resistente a interrupciones o ataques de denegación de servicio.","El cifrado protege el acceso (confidencialidad), no necesariamente asegura que los datos sean correctos o no hayan sido alterados.","El cifrado es una herramienta técnica, no un proceso o norma administrativa."],"refuerzo":"La confidencialidad consiste en que el mensaje sea secreto. Si yo te envío una carta en código secreto y alguien la roba en el camino, esa persona tendrá la carta (la disponibilidad no cambió), pero no podrá leerla. El cifrado cumple esa misma función digital: el dato está ahí, pero es ilegible para el intruso.","concepto":"Tríada CIA","seccion":"1 Security Concepts of Information Assurance","dom":"Security Principles","obj":"1.1","area":"Conceptos de ciberseguridad","dificultad":"media","tipo":"analisis","cita_pdf":"Confidentiality - Means that information is accessible only to those authorized.","pagina":19},{"id":"q0007","pregunta":"¿Por qué un mismo activo de información puede requerir múltiples controles de seguridad superpuestos?","opciones":["Porque los controles técnicos son ineficientes por sí solos.","Porque los activos valiosos enfrentan diversos tipos de amenazas y vulnerabilidades.","Porque las políticas administrativas requieren duplicidad para ser efectivas.","Porque cada control de seguridad protege un único activo a la vez."],"correcta":1,"porque_correcta":"La protección adecuada implica identificar riesgos específicos, y dado que un activo puede enfrentar múltiples amenazas, se necesita una combinación de controles para reducir su susceptibilidad.","porque_incorrectas":["No es una cuestión de eficiencia, sino de la naturaleza multidimensional del riesgo.","La redundancia no es un requisito de las políticas administrativas; se busca eficacia, no duplicidad.","Esto es falso, ya que el documento menciona explícitamente que los controles pueden proteger múltiples activos simultáneamente."],"refuerzo":"Pensá en tu casa: no usás solo una cerradura. Usás una puerta sólida (físico), una alarma (técnico) y un seguro de hogar (administrativo). Cada uno ataca un frente distinto. Si el ladrón rompe la cerradura, la alarma suena; si la alarma falla, el seguro cubre la pérdida. Combinamos defensas porque el riesgo es complejo.","concepto":"Controles de seguridad","seccion":"1 Security Concepts of Information Assurance","dom":"Security Principles","obj":"1.1","area":"Conceptos de ciberseguridad","dificultad":"media","tipo":"analisis","cita_pdf":"Determining the most appropriate combination of security controls to protect assets requires systematically identifying the vulnerabilities to ensure that assets end up less susceptible to threats.","pagina":19},{"id":"q0008","pregunta":"Si clasificamos el PII y el PHI como tipos de datos, ¿qué los diferencia en el contexto de la protección de la información?","opciones":["El PII solo se refiere a datos financieros y el PHI a datos médicos.","El PHI proviene de dispositivos de salud y puede causar daño grave si se expone.","El PII es información pública y el PHI es información clasificada privada.","No hay diferencia, ambos son subconjuntos de datos confidenciales."],"correcta":1,"porque_correcta":"El documento define el PHI como información recolectada por dispositivos y proveedores de salud que, si se expone, implica daños considerables a los individuos.","porque_incorrectas":["El PII incluye cualquier atributo de identidad, no solo lo financiero, y el PHI es más específico que solo 'datos médicos'.","El PII no es necesariamente público, a menudo es privado, por lo que esta distinción es incorrecta.","Aunque ambos son confidenciales, el documento los distingue por su origen y el impacto potencial de su exposición."],"refuerzo":"El PII (Información de Identificación Personal) es cualquier cosa que diga quién sos (nombre, documento). El PHI (Información de Salud Personal) es un subconjunto más sensible que implica tu historial médico. El PHI es tratado con mayor rigor porque una filtración puede no solo revelar quién sos, sino también destruir tu salud o reputación médica.","concepto":"Clasificación de datos","seccion":"1 Security Concepts of Information Assurance","dom":"Security Principles","obj":"1.1","area":"Conceptos de ciberseguridad","dificultad":"media","tipo":"concepto","cita_pdf":"Personal health information (PHI) is data collected by healthcare devices and providers that, if exposed, can cause considerable harm to individuals.","pagina":25},{"id":"q0009","pregunta":"Un firewall, un software antivirus y el cifrado de datos son considerados controles técnicos. ¿Qué función principal comparten estos elementos?","opciones":["Garantizar que los empleados sigan políticas de seguridad.","Proteger sistemas de información y gestionar el acceso a datos.","Asegurar la disponibilidad física de los equipos de red.","Prevenir el acceso físico no autorizado a las instalaciones."],"correcta":1,"porque_correcta":"Los controles técnicos utilizan mecanismos de software y hardware específicamente para salvaguardar los sistemas y controlar quién o qué accede a la información.","porque_incorrectas":["Esa es la definición de controles administrativos, no técnicos.","La disponibilidad física depende de controles físicos, no de software como el antivirus o firewall.","Los controles físicos (como guardias) previenen el acceso físico; el software no puede bloquear físicamente a una persona."],"refuerzo":"Los controles técnicos son la parte 'digital' de la seguridad. Si el control administrativo te dice 'no entres ahí' y el físico te pone una reja, el control técnico es la pared de datos que, mediante algoritmos y reglas de red, decide qué paquete de información pasa y cuál se bloquea.","concepto":"Controles de seguridad","seccion":"1 Security Concepts of Information Assurance","dom":"Security Principles","obj":"1.1","area":"Conceptos de ciberseguridad","dificultad":"facil","tipo":"analisis","cita_pdf":"Technical security controls include mechanisms such as firewalls, encryption, and antivirus software that protect information systems and manage access to data.","pagina":19},{"id":"q0010","pregunta":"El documento establece que la 'Information Assurance' es la actividad de proteger información y sistemas frente a amenazas. Según esta premisa, ¿qué es un ejemplo de amenaza que compromete la disponibilidad?","opciones":["Una brecha de seguridad que expone datos privados.","La manipulación malintencionada de un registro contable.","La eliminación accidental de un servicio crítico de red.","Un usuario no autorizado viendo un documento sensible."],"correcta":2,"porque_correcta":"La eliminación o la interrupción de servicios (inaccessibilidad) se define como 'Denial' (denegación), que es el tipo de amenaza que afecta a la disponibilidad.","porque_incorrectas":["Esto representa la divulgación (disclosure), lo cual afecta la confidencialidad.","La alteración de registros es una amenaza a la integridad, no a la disponibilidad.","El acceso no autorizado afecta a la confidencialidad, no al hecho de que el sistema esté en línea."],"refuerzo":"La disponibilidad es el pilar que garantiza que el sistema 'esté ahí'. Cualquier evento que borre, esconda o tumbe el acceso (ya sea por accidente o malicia) es un ataque a la disponibilidad. Es la diferencia entre que alguien lea algo secreto (confidencialidad) y que ese algo desaparezca para todos.","concepto":"Tríada CIA","seccion":"1 Security Concepts of Information Assurance","dom":"Security Principles","obj":"1.1","area":"Conceptos de ciberseguridad","dificultad":"media","tipo":"aplicacion","cita_pdf":"Finally, threats of deletion or rendering inaccessible information and services affect availability and are collectively referred to as Denial.","pagina":20,"fig":20},{"id":"q0011","pregunta":"¿Por qué es fundamental que un ingeniero de ciberseguridad entienda cómo los empleados, procesos y tecnología funcionan juntos?","opciones":["Porque el hardware siempre es más vulnerable que los procesos humanos.","Porque los controles de seguridad deben integrarse en toda la infraestructura de la organización.","Porque solo la tecnología puede prevenir ataques de actores externos.","Porque los procesos administrativos son los únicos que realmente protegen los activos."],"correcta":1,"porque_correcta":"La seguridad de la información requiere una visión holística donde la infraestructura, los humanos y las normas operen de manera concertada para proteger los activos frente a eventos adversos.","porque_incorrectas":["El documento no afirma que el hardware sea más vulnerable; de hecho, enfatiza la importancia de los tres componentes (personas, procesos, tecnología).","Esta visión es demasiado limitada, ya que ignora el rol crucial de las personas y los procesos en la seguridad.","Los procesos administrativos son vitales, pero no son los 'únicos' que protegen los activos; la tecnología y el control físico también son fundamentales."],"refuerzo":"La seguridad no es solo un software instalado. Si tenés el mejor firewall (tecnología) pero tus empleados no saben identificar un phishing (personas) y no tienen protocolos claros (procesos), la seguridad fallará. La ciberseguridad es un sistema total: si una pieza falla, todo el sistema es vulnerable.","concepto":"Fundamentos de ciberseguridad","seccion":"1 Security Concepts of Information Assurance","dom":"Security Principles","obj":"1.1","area":"Conceptos de ciberseguridad","dificultad":"media","tipo":"analisis","cita_pdf":"In organizations, people, processes, and technology work in concert to create value. Technology is part of what we refer to as infrastructure, which can be both physical and digital.","pagina":14},{"id":"q0012","pregunta":"La tríada CIA representa las propiedades que pueden ser comprometidas por amenazas. ¿Qué tipo de amenaza corresponde específicamente a la integridad?","opciones":["Divulgación (Disclosure)","Alteración (Alteration)","Denegación (Denial)","Acceso no autorizado"],"correcta":1,"porque_correcta":"La integridad se ve disrupta cuando hay manipulación de datos o del sistema, fenómeno clasificado como amenaza de alteración.","porque_incorrectas":["La divulgación está asociada con la pérdida de confidencialidad.","La denegación está asociada con la pérdida de disponibilidad.","El acceso no autorizado es una causa de divulgación, impactando principalmente la confidencialidad."],"refuerzo":"La integridad tiene que ver con la 'verdad' de los datos. Si alguien altera un archivo sin permiso, el dato ya no es 'íntegro'. Por tanto, cualquier amenaza de alteración (cambiar, borrar parcialmente, corromper) busca destruir esa verdad del sistema.","concepto":"Tríada CIA","seccion":"1 Security Concepts of Information Assurance","dom":"Security Principles","obj":"1.1","area":"Conceptos de ciberseguridad","dificultad":"facil","tipo":"concepto","cita_pdf":"Unauthorized alteration, as a result of data or system manipulation, is another class of threat that can disrupt the integrity principle.","pagina":20,"fig":20},{"id":"q0013","pregunta":"Si un atacante realiza un ataque de 'divulgación' (disclosure), ¿cuál es el impacto directo en los principios de seguridad de la información?","opciones":["Se pierde la disponibilidad del sistema.","Se vulnera la confidencialidad de la información.","Se corrompe la integridad de los datos.","Se rompe el control administrativo establecido."],"correcta":1,"porque_correcta":"Una brecha de confidencialidad ocurre cuando información sensible es accedida por partes no autorizadas, lo que se denomina específicamente 'divulgación'.","porque_incorrectas":["La divulgación no implica necesariamente que el sistema deje de funcionar (disponibilidad).","La corrupción de datos se refiere a la integridad, no a la exposición de información.","La divulgación es un evento, no un fallo directo en la estructura de una política administrativa."],"refuerzo":"La confidencialidad es 'que solo lo vean los autorizados'. Cuando alguien no autorizado accede (divulgación), el secreto se pierde. No importa si los datos siguen siendo precisos o si el sistema funciona; el principio de confidencialidad ya fue vulnerado porque la información dejó de ser privada.","concepto":"Tríada CIA","seccion":"1 Security Concepts of Information Assurance","dom":"Security Principles","obj":"1.1","area":"Conceptos de ciberseguridad","dificultad":"media","tipo":"analisis","cita_pdf":"Indeed, a breach in confidentiality unauthorized access to sensitive information known as Disclosure.","pagina":20,"fig":20},{"id":"q0014","pregunta":"¿Por qué el proceso de identificación de vulnerabilidades es esencial antes de implementar controles de seguridad?","opciones":["Para reducir el costo de los activos físicos y digitales.","Para asegurar que los activos sean menos susceptibles a amenazas.","Para eliminar por completo todos los riesgos de la organización.","Para clasificar automáticamente los datos según su nivel de PHI."],"correcta":1,"porque_correcta":"Identificar sistemáticamente las vulnerabilidades permite seleccionar la combinación de controles más apropiada, logrando que los activos sean menos vulnerables frente a las amenazas detectadas.","porque_incorrectas":["La identificación de vulnerabilidades no tiene como fin reducir el costo, sino mejorar la postura de seguridad.","Es imposible eliminar 'por completo' todos los riesgos; el objetivo es gestionarlos y reducirlos, no borrarlos.","La identificación de vulnerabilidades es distinta a la clasificación de datos (como PHI)."],"refuerzo":"No podés proteger lo que no conocés. Si no sabés qué huecos tiene tu red (vulnerabilidades), vas a gastar plata en controles que no sirven. Identificar el riesgo primero te permite decir 'aquí hay una debilidad, por tanto, pondré este control específico'. Es como buscar ventanas abiertas antes de poner rejas.","concepto":"Gestión de riesgos","seccion":"1 Security Concepts of Information Assurance","dom":"Security Principles","obj":"1.1","area":"Conceptos de ciberseguridad","dificultad":"dificil","tipo":"analisis","cita_pdf":"Determining the most appropriate combination of security controls to protect assets requires systematically identifying the vulnerabilities to ensure that assets end up less susceptible to threats.","pagina":19},{"id":"q0015","pregunta":"La definición de 'Information Assurance' incluye proteger sistemas frente a eventos adversos. ¿Qué diferencia principal existe entre una vulnerabilidad y una amenaza?","opciones":["La amenaza es la debilidad y la vulnerabilidad es la causa del daño.","La vulnerabilidad es una falla o debilidad, mientras que la amenaza es la fuente de daño.","La amenaza es siempre digital y la vulnerabilidad es siempre física.","No existe diferencia, ambos términos son sinónimos en ciberseguridad."],"correcta":1,"porque_correcta":"El documento define las amenazas como fuentes de daño y, por el contexto de la gestión de controles, las vulnerabilidades representan los puntos débiles que pueden ser explotados por esas amenazas.","porque_incorrectas":["Esto invierte los conceptos: la vulnerabilidad es la debilidad, no la amenaza.","Tanto amenazas como vulnerabilidades pueden ser físicas o digitales; no es una distinción de naturaleza.","Los términos tienen significados técnicos distintos y específicos en el análisis de seguridad."],"refuerzo":"Pensá en un auto estacionado. El hecho de que no tenga alarma es una vulnerabilidad (debilidad). El ladrón que pasa por ahí buscando autos es la amenaza (fuente de daño). La amenaza explota la vulnerabilidad para lograr su objetivo. Sin la debilidad, la amenaza no podría hacer daño.","concepto":"Fundamentos de ciberseguridad","seccion":"1 Security Concepts of Information Assurance","dom":"Security Principles","obj":"1.1","area":"Conceptos de ciberseguridad","dificultad":"dificil","tipo":"concepto","cita_pdf":"of the vulnerabilities that can potentially impact an organization's assets and how to protect them from threats.","pagina":19},{"id":"q0016","pregunta":"Si un activo crítico de tu empresa sufre una actualización de software, ¿quién debería ser el responsable principal de gestionar los riesgos asociados a este cambio?","opciones":["El equipo técnico que realizó la actualización de software.","El propietario del activo según el inventario actualizado.","El departamento de auditoría de seguridad informática.","El comité ejecutivo encargado de la tolerancia al riesgo."],"correcta":1,"porque_correcta":"La responsabilidad de gestionar los riesgos recae directamente en quienes poseen los activos, ya que ellos supervisan el mantenimiento y las actualizaciones de sus inventarios.","porque_incorrectas":["Confunde la ejecución técnica con la responsabilidad de gestión de riesgos sobre el activo.","Asume que la auditoría debe gestionar riesgos operativos, lo cual excede su función de control.","Equivoca la supervisión estratégica de alto nivel con la gestión directa del riesgo del activo."],"refuerzo":"Imaginá que sos dueño de un servidor que procesa pagos. Aunque un técnico instale un parche, vos sos quien sabe qué datos maneja y qué impacto tendría una caída. Gestionar el riesgo no es 'arreglar', sino entender el valor de lo que protegés y tomar decisiones sobre su seguridad. El propietario es el puente entre el activo y la estrategia de protección.","concepto":"Responsabilidad de riesgos","seccion":"2 Risk Management","dom":"Security Principles","obj":"1.2","area":"Gestión de riesgo","dificultad":"media","tipo":"aplicacion","cita_pdf":"The owners of the assets are the ones responsible for keeping the inventories up to date and are\noften these asset owners who are responsible for managing the associated risks (becoming the risk\nowners).","pagina":34},{"id":"q0017","pregunta":"Tenés que elegir entre un análisis cuantitativo o uno cualitativo para priorizar riesgos. ¿Cuál es el factor determinante si necesitás medir pérdidas financieras exactas?","opciones":["La disponibilidad de datos históricos de incidentes.","El uso de métodos basados en datos numéricos o estadísticos.","La urgencia de presentar un plan de tratamiento al dueño.","El nivel de experiencia del equipo en evaluaciones subjetivas."],"correcta":1,"porque_correcta":"El análisis cuantitativo se define específicamente por el empleo de datos numéricos o estadísticos para obtener resultados medibles, lo cual permite calcular valores como la ALE.","porque_incorrectas":["Aunque útil, la disponibilidad no define el tipo de análisis, solo su viabilidad.","La urgencia es un factor de gestión, no un criterio técnico para elegir el método de medición.","La subjetividad es propia del análisis cualitativo, pero no es el criterio técnico para optar por lo cuantitativo."],"refuerzo":"El análisis cuantitativo es como hacer una contabilidad de riesgos: ponés números (probabilidad de ocurrencia, costo de recuperación) para obtener una cifra final (la pérdida esperada). Si necesitás decir 'vamos a perder 50 mil dólares', necesitás datos duros. Es un enfoque preciso frente a un enfoque cualitativo que se basa en clasificaciones como 'bajo, medio o alto'.","concepto":"Análisis cuantitativo","seccion":"2 Risk Management","dom":"Security Principles","obj":"1.2","area":"Gestión de riesgo","dificultad":"facil","tipo":"analisis","cita_pdf":"Quantitative risk analysis employs numerical or statistical data to yield measurable results, such as\nprobabilities, costs, or potential losses.","pagina":34},{"id":"q0018","pregunta":"Después de implementar controles de seguridad en un sistema, queda un nivel de riesgo. ¿Cómo denominarías técnicamente a este riesgo remanente?","opciones":["Riesgo aceptado tras la evaluación.","Riesgo residual del tratamiento.","Riesgo mitigado por controles.","Riesgo tolerado por la empresa."],"correcta":1,"porque_correcta":"El riesgo que persiste después de que la organización ha aplicado medidas de tratamiento o mitigación se clasifica formalmente como riesgo residual.","porque_incorrectas":["El riesgo aceptado es una decisión de gestión, no necesariamente el remanente técnico.","El riesgo mitigado es el resultado de la acción, pero no es el término técnico para lo que queda.","El riesgo tolerado es un marco de referencia organizacional, no el riesgo específico post-control."],"refuerzo":"Imaginá que ponés una alarma en tu casa y una cerradura reforzada. Aún así, un ladrón podría entrar rompiendo una ventana. Ese riesgo que queda, por más que hayas gastado dinero en seguridad, es el 'riesgo residual'. Siempre hay algo que no se puede eliminar por completo y debe ser reconocido.","concepto":"Riesgo residual","seccion":"2 Risk Management","dom":"Security Principles","obj":"1.2","area":"Gestión de riesgo","dificultad":"facil","tipo":"concepto","cita_pdf":"Residual risk is the amount of risk that remains after an organization has implemented security controls or other risk mitigation treatment measures.","pagina":42},{"id":"q0019","pregunta":"En un proceso de evaluación de riesgos, ¿por qué es crítico que el inventario de activos esté permanentemente actualizado?","opciones":["Para facilitar la auditoría externa de los activos.","Para asegurar que la identificación de riesgos sea efectiva.","Para que el departamento financiero calcule el valor anual.","Para cumplir con las normas de gestión de proveedores."],"correcta":1,"porque_correcta":"La identificación de riesgos depende directamente de saber qué activos tiene la empresa, ya que cada activo tiene vulnerabilidades y amenazas específicas asociadas.","porque_incorrectas":["La auditoría es un fin derivado, pero el objetivo central es la gestión de riesgos interna.","Aunque el cálculo financiero es importante, la identificación de riesgos requiere una visión integral del activo, no solo monetaria.","La relación con proveedores es solo una parte pequeña del inventario, no la razón principal de toda la evaluación de riesgos."],"refuerzo":"Si no sabés que tenés un servidor nuevo en el sótano, ¿cómo vas a saber qué riesgos tiene? La gestión de riesgos empieza por saber qué estás protegiendo. Si tu lista de activos está desactualizada, estás analizando riesgos sobre una base incompleta, dejando áreas ciegas en tu seguridad.","concepto":"Identificación de riesgos","seccion":"2 Risk Management","dom":"Security Principles","obj":"1.2","area":"Gestión de riesgo","dificultad":"media","tipo":"analisis","cita_pdf":"Since different assets are susceptible to specific risks, effective risk identification depends\non accurately tracking the assets an organization owns.","pagina":33,"fig":33},{"id":"q0020","pregunta":"Tu organización está decidiendo qué riesgos tratar primero. ¿Qué concepto define el límite máximo de riesgo que la empresa puede asumir para lograr sus objetivos?","opciones":["Tolerancia al riesgo.","Apetito de riesgo.","Priorización de riesgos.","Evaluación de severidad."],"correcta":1,"porque_correcta":"El apetito de riesgo representa el total o la cantidad global de riesgo que una organización está dispuesta a aceptar para perseguir sus metas de negocio.","porque_incorrectas":["La tolerancia es el nivel específico para áreas o actividades, no el límite global.","La priorización es el ordenamiento posterior, no el umbral de aceptación.","La evaluación de severidad es una métrica de impacto, no una definición de política de riesgo."],"refuerzo":"El 'apetito' es cuánto riesgo querés 'comer' como organización para crecer. Por ejemplo, una startup tecnológica tiene un apetito alto para innovar rápido, mientras que un banco tiene uno muy bajo. Es la cultura de riesgo que define la estrategia global antes de mirar caso por caso.","concepto":"Apetito de riesgo","seccion":"2 Risk Management","dom":"Security Principles","obj":"1.2","area":"Gestión de riesgo","dificultad":"media","tipo":"concepto","cita_pdf":"Risk appetite is the total amount of risk an organization is willing to accept in\npursuit of its business goals.","pagina":38},{"id":"q0021","pregunta":"Al analizar la efectividad de los controles, ¿qué papel cumple la 'sensibilidad al tiempo' en la evaluación de riesgos?","opciones":["Establece cuándo deben auditarse los controles.","Ayuda a estimar el nivel de impacto de un riesgo.","Define el presupuesto anual para nuevos controles.","Determina la frecuencia con la que los dueños se reúnen."],"correcta":1,"porque_correcta":"El análisis de riesgos debe considerar factores como la sensibilidad temporal para comprender mejor qué impacto tendría la materialización de un riesgo sobre las operaciones y activos.","porque_incorrectas":["La auditoría es un evento posterior, mientras que el análisis de riesgo ocurre durante la evaluación.","El presupuesto es una decisión de tratamiento, no un factor de análisis de impacto.","La reunión de dueños es un proceso de comunicación, no un componente técnico del análisis de riesgo."],"refuerzo":"Pensá en un sistema de trading automático. Si se cae durante un segundo, perdés millones. La 'sensibilidad al tiempo' es vital ahí. En otros sistemas, una caída de una hora puede ser irrelevante. El análisis de impacto necesita saber no solo qué pasa si falla, sino qué tan crítico es el 'cuándo' falla.","concepto":"Análisis de riesgos","seccion":"2 Risk Management","dom":"Security Principles","obj":"1.2","area":"Gestión de riesgo","dificultad":"dificil","tipo":"analisis","cita_pdf":"This analysis should also consider factors such as time sensitivity and the effectiveness of existing\ncontrols.","pagina":34},{"id":"q0022","pregunta":"Si un riesgo identificado no puede ser eliminado completamente mediante controles técnicos, ¿qué documento es indispensable para que los propietarios aprueben el curso de acción?","opciones":["Plan de tratamiento de riesgos.","Inventario de activos actualizado.","Reporte de probabilidad e impacto.","Matriz de riesgo organizacional."],"correcta":0,"porque_correcta":"El plan de tratamiento de riesgos es el documento formal que detalla las estrategias elegidas y requiere la aprobación de los dueños para asegurar su alineación con la tolerancia al riesgo.","porque_incorrectas":["El inventario es la base para identificar, pero no el documento de decisión de tratamiento.","El reporte es informativo, no es el plan de acción ejecutiva que requiere firma/aprobación.","La matriz es una herramienta de priorización, no el documento final de compromiso de tratamiento."],"refuerzo":"El plan de tratamiento es tu hoja de ruta. No solo lista qué vas a hacer, sino que oficializa quién es responsable y confirma que la estrategia elegida (aceptar, transferir, etc.) cumple con las reglas de la empresa. Es el contrato que firmás para manejar lo que no pudiste eliminar.","concepto":"Plan de tratamiento","seccion":"2 Risk Management","dom":"Security Principles","obj":"1.2","area":"Gestión de riesgo","dificultad":"media","tipo":"aplicacion","cita_pdf":"After selecting the treatment strategies and a range of risk mitigation options for each identified\nrisk, the organization must develop a risk treatment plan. This formal document requires the\napproval of the risk owners","pagina":40},{"id":"q0023","pregunta":"Al diseñar el plan de tratamiento de riesgos, ¿qué advertencia fundamental sobre los controles de seguridad debemos tener presente para el examen?","opciones":["Los controles siempre reducen el riesgo residual.","El tratamiento puede introducir nuevos riesgos.","La transferencia es la estrategia más barata.","El costo del control nunca debe superar el impacto."],"correcta":1,"porque_correcta":"Es crucial reconocer que la implementación de medidas de tratamiento no es neutral; a menudo, estas acciones pueden generar vulnerabilidades nuevas o alterar la naturaleza de los riesgos existentes.","porque_incorrectas":["Los controles no siempre son efectivos y a veces pueden fallar o complicar la operación.","La transferencia no siempre es la más barata, depende del riesgo y del seguro o contrato.","Aunque el costo/beneficio es clave, el texto subraya la aparición de riesgos secundarios como una advertencia crítica para el examen."],"refuerzo":"Instalar un firewall muy complejo para proteger un servidor puede, por error de configuración, dejar un puerto abierto o hacer que el sistema sea más lento y propenso a errores humanos. Siempre que agregás una pieza de seguridad, estás cambiando el tablero. No es un beneficio puro; tiene efectos colaterales.","concepto":"Tratamiento de riesgos","seccion":"2 Risk Management","dom":"Security Principles","obj":"1.2","area":"Gestión de riesgo","dificultad":"dificil","tipo":"analisis","cita_pdf":"Be aware of this as it may come up in the exam.\nAfter selecting the treatment strategies and a range of risk mitigation options for each identified\nrisk, the organization must develop a risk treatment plan.","pagina":40},{"id":"q0024","pregunta":"Si un gerente necesita priorizar qué riesgos abordar, ¿qué herramienta le permitiría combinar impacto y probabilidad de forma visual?","opciones":["El inventario de activos.","La matriz de riesgo.","El cálculo de ALE.","El plan de tratamiento."],"correcta":1,"porque_correcta":"La matriz de riesgo es la herramienta estándar utilizada para determinar el nivel de riesgo combinando los valores estimados de impacto y probabilidad.","porque_incorrectas":["El inventario identifica lo que tenés, no mide la severidad de sus amenazas.","El cálculo de ALE es un dato único, no una visualización para priorizar múltiples riesgos.","El plan de tratamiento es el resultado de la priorización, no la herramienta para realizarla."],"refuerzo":"Imaginá un tablero de ajedrez donde el eje vertical es el impacto y el horizontal la probabilidad. Cada riesgo se ubica en un cuadrante. Esto permite que, de un vistazo, sepas qué riesgos son críticos (alto impacto, alta probabilidad) y cuáles podés ignorar por ahora. Es la forma más clara de comunicar prioridades.","concepto":"Priorización de riesgos","seccion":"2 Risk Management","dom":"Security Principles","obj":"1.2","area":"Gestión de riesgo","dificultad":"facil","tipo":"aplicacion","cita_pdf":"A risk matrix is a commonly used tool to determine the level of risk based on the\nestimated values of impact, and likelihood","pagina":42},{"id":"q0025","pregunta":"¿Por qué la comunicación clara de los resultados de la evaluación es vital para los dueños de los riesgos?","opciones":["Para que puedan cumplir con sus responsabilidades de monitoreo.","Para asegurar que el presupuesto de seguridad se apruebe.","Para que los auditores externos validen el proceso.","Para reducir el apetito de riesgo de la organización."],"correcta":0,"porque_correcta":"La comunicación efectiva permite a los dueños de riesgos tomar acciones concretas, monitorear el estado y asegurar que se cumplan las políticas, evitando una gestión ineficaz por falta de claridad.","porque_incorrectas":["La comunicación informa la gestión, pero no es la responsable directa de la aprobación presupuestaria.","El auditor valida el proceso, pero el dueño del riesgo gestiona, no audita.","El apetito de riesgo es una decisión de alto nivel que no cambia solo por comunicar resultados operativos."],"refuerzo":"Si el dueño de un activo no sabe qué riesgo corre, no va a hacer nada para protegerlo. La comunicación no es solo 'pasar un reporte', es lograr que la persona responsable entienda qué está en juego y actúe en consecuencia. Si el dueño no comprende el riesgo, la seguridad falla desde arriba.","concepto":"Comunicación de riesgos","seccion":"2 Risk Management","dom":"Security Principles","obj":"1.2","area":"Gestión de riesgo","dificultad":"media","tipo":"analisis","cita_pdf":"The results of the risk assessment, the risk treatment plan, and any residual risks must be\nclearly communicated to the risk owners to enable them to effectively carry out their\nresponsibilities.","pagina":41},{"id":"q0026","pregunta":"Cuando se define la 'tolerancia al riesgo', ¿qué aspecto específico caracteriza este concepto en comparación con el apetito de riesgo?","opciones":["Se refiere al impacto financiero global esperado.","Se limita a las áreas específicas o actividades de negocio.","Representa el nivel de riesgo tras implementar controles.","Establece la meta de reducción de riesgos de la empresa."],"correcta":1,"porque_correcta":"La tolerancia al riesgo es el nivel específico de riesgo que se acepta en áreas o actividades concretas, siempre operando bajo el paraguas del apetito de riesgo general.","porque_incorrectas":["El impacto financiero global es más cercano al concepto de apetito de riesgo.","El riesgo tras controles es el riesgo residual, no la tolerancia.","La reducción de riesgos es un objetivo de tratamiento, no una medida de tolerancia."],"refuerzo":"El 'apetito' es la política general (ej. 'somos conservadores'). La 'tolerancia' es la excepción o el margen en un área puntual (ej. 'aunque somos conservadores, toleramos un poco más de riesgo en la división de nuevos productos para ganar mercado'). Es el ajuste fino de la política global a la realidad de cada sector.","concepto":"Tolerancia al riesgo","seccion":"2 Risk Management","dom":"Security Principles","obj":"1.2","area":"Gestión de riesgo","dificultad":"dificil","tipo":"concepto","cita_pdf":"Risk tolerance is the specific level of risk an organization is willing to accept in\nbusiness areas or activities (while remaining within its broader risk appetite).","pagina":38},{"id":"q0027","pregunta":"Si un activo no aparece en el inventario, ¿qué impacto tiene esto en el proceso de gestión de riesgos?","opciones":["El riesgo se clasifica automáticamente como bajo.","La identificación de riesgos se vuelve incompleta.","El propietario del activo queda eximido de responsabilidad.","Se reduce la necesidad de realizar un análisis cuantitativo."],"correcta":1,"porque_correcta":"Al depender el proceso de identificación de un inventario preciso, si un activo falta, las vulnerabilidades y amenazas asociadas a él no serán identificadas, invalidando la gestión para ese elemento.","porque_incorrectas":["El hecho de que no esté en el inventario no cambia su nivel de riesgo, solo hace que sea invisible para la gestión.","La responsabilidad del dueño persiste independientemente de si el activo está bien inventariado o no.","La omisión de un activo complica el análisis, pero no lo vuelve innecesario o más fácil; simplemente es ineficaz."],"refuerzo":"Es como intentar asegurar una casa pero olvidarse de mencionar que tiene un sótano lleno de mercadería valiosa. Como no lo mencionaste, el seguro (o tu gestión) no lo cubre. Si el activo no está en el mapa, está totalmente desprotegido ante cualquier amenaza.","concepto":"Identificación de riesgos","seccion":"2 Risk Management","dom":"Security Principles","obj":"1.2","area":"Gestión de riesgo","dificultad":"media","tipo":"analisis","cita_pdf":"Since different assets are susceptible to specific risks, effective risk identification depends\non accurately tracking the assets an organization owns.","pagina":33,"fig":33},{"id":"q0028","pregunta":"Al estimar el impacto en un análisis cuantitativo, ¿qué componente es fundamental para calcular la ALE?","opciones":["La suma del valor de todos los activos de la organización.","Las estimaciones de probabilidad y nivel de impacto.","El presupuesto disponible para implementar controles.","La frecuencia histórica de auditorías internas."],"correcta":1,"porque_correcta":"La ALE (Annual Loss Expectancy) se calcula basándose en estimaciones tanto del impacto como de la probabilidad de ocurrencia del riesgo.","porque_incorrectas":["El valor total de activos es irrelevante para la ALE de un riesgo individual.","El presupuesto es una variable posterior de decisión, no un insumo de cálculo de pérdida esperada.","Las auditorías no forman parte del cálculo matemático de una pérdida anual esperada."],"refuerzo":"ALE es el costo que esperás tener por un riesgo en un año. Para eso multiplicás cuánto daño hace (impacto) por qué tan probable es que ocurra (probabilidad). Si algo cuesta 1000 y pasa 1 vez cada 10 años, tu ALE es 100 por año. Es una fórmula matemática de previsión.","concepto":"Análisis cuantitativo","seccion":"2 Risk Management","dom":"Security Principles","obj":"1.2","area":"Gestión de riesgo","dificultad":"facil","tipo":"concepto","cita_pdf":"The key measure in quantitative analysis is the Annual Loss Expectancy (ALE), which is calculated\nbased on estimates of both impact and likelihood.","pagina":34},{"id":"q0029","pregunta":"Durante la etapa de 'Risk Assessment', ¿cuáles son los pasos fundamentales que debés seguir según el proceso descrito?","opciones":["Identificación, análisis y evaluación.","Mitigación, transferencia y aceptación.","Inventario, presupuesto y comunicación.","Monitoreo, tratamiento y reporte."],"correcta":0,"porque_correcta":"El proceso de evaluación de riesgos se compone específicamente de tres pasos: identificación de riesgos, análisis de riesgos y evaluación de riesgos.","porque_incorrectas":["Esas son estrategias de tratamiento, una fase posterior a la evaluación.","Estos elementos forman parte del soporte y gestión, pero no definen los pasos del assessment.","Son actividades de seguimiento, no los pasos constitutivos de la fase de assessment."],"refuerzo":"El 'Assessment' es el diagnóstico médico. Primero identificás qué síntomas tenés (identificación), después analizás qué tan graves son (análisis) y al final los evaluás para saber qué tratar primero (evaluación). Solo después de este diagnóstico pasás al 'tratamiento' (el remedio).","concepto":"Proceso de riesgo","seccion":"2 Risk Management","dom":"Security Principles","obj":"1.2","area":"Gestión de riesgo","dificultad":"facil","tipo":"concepto","cita_pdf":"In the phase of risk assessment, we consider the three individual steps of risk assessment: risk\nidentification; risk analysis (which can be qualitative or quantitative); and risk evaluation.","pagina":33,"fig":33},{"id":"q0030","pregunta":"Si tenés que aplicar una estrategia de tratamiento que implique aceptar el riesgo, ¿qué es fundamental que entiendas sobre esta decisión?","opciones":["Que el riesgo ha sido transferido a un tercero.","Que la organización decide no tomar ninguna acción.","Que se ha validado que el riesgo está dentro de los niveles aceptables.","Que se debe incrementar el presupuesto para mitigarlo posteriormente."],"correcta":2,"porque_correcta":"Aceptar el riesgo es una decisión consciente donde se determina que el riesgo actual, dado su nivel, está dentro de los límites de tolerancia o apetito de la empresa, y por tanto, no requiere mitigación activa.","porque_incorrectas":["La aceptación es lo opuesto a la transferencia; el riesgo sigue siendo interno.","No es inacción por omisión, sino una decisión informada de no tratarlo activamente.","Aceptar un riesgo implica justamente que no se necesita gastar recursos para mitigarlo, ya que se considera tolerable."],"refuerzo":"Aceptar un riesgo es como decidir no comprar un seguro para una bicicleta vieja: sabés que te la pueden robar y aceptás esa posibilidad porque el costo del seguro es mayor que el valor de la bicicleta. Es una decisión de negocios, no pereza.","concepto":"Tratamiento de riesgos","seccion":"2 Risk Management","dom":"Security Principles","obj":"1.2","area":"Gestión de riesgo","dificultad":"media","tipo":"analisis","cita_pdf":"Risk evaluation prioritizes risks based on their severity to determine which risks\nshould be addressed first.","pagina":42},{"id":"q0031","pregunta":"Si tenés que proteger un servidor crítico que no puede ser parcheado inmediatamente, ¿qué tipo de control aplicarías para mitigar el riesgo?","opciones":["Un control correctivo para restaurar el sistema tras el ataque.","Un control preventivo para bloquear el tráfico de red.","Un control compensatorio para añadir seguridad adicional mientras el parche no está disponible.","Un control administrativo para definir nuevas normas de acceso."],"correcta":2,"porque_correcta":"Los controles compensatorios se utilizan específicamente como medidas alternativas cuando el control primario, como un parche de seguridad, no puede implementarse por limitaciones técnicas o operativas.","porque_incorrectas":["Un control correctivo solo actúa tras la ocurrencia del incidente, no mitiga la vulnerabilidad previa.","Aunque es preventivo, la situación describe la imposibilidad de aplicar el parche primario, haciendo que el enfoque sea buscar una alternativa (compensación).","El control administrativo guía el proceso, pero no brinda la protección técnica necesaria para el sistema expuesto."],"refuerzo":"Imaginá que tenés una ventana rota y no podés arreglarla hoy. Poner una madera fuerte es una medida compensatoria: no es la ventana original (el parche), pero evita que alguien entre hasta que llegue el técnico. En IT, si no podés parchear un sistema, aislás el servidor o aumentás la supervisión para evitar que la falla sea explotada.","concepto":"Controles compensatorios","seccion":"3 Understanding Security Controls","dom":"Security Principles","obj":"1.4","area":"Tipos de control","dificultad":"dificil","tipo":"aplicacion","cita_pdf":"and monitoring if regular patching (primary control) isn't possible for a critical system.","pagina":52},{"id":"q0032","pregunta":"Un firewall está configurado para bloquear accesos no autorizados y también registra dichos intentos. ¿Cómo clasificás este dispositivo según su función?","opciones":["Como un control exclusivamente preventivo.","Como un control tanto preventivo como detective.","Como un control técnico y administrativo a la vez.","Como un control correctivo y disuasorio."],"correcta":1,"porque_correcta":"Los controles pueden cumplir múltiples funciones; el firewall bloquea (previene) y registra (detecta), demostrando que una misma tecnología puede operar de formas distintas simultáneamente.","porque_incorrectas":["Ignora la capacidad del firewall para registrar eventos, que es una función de detección.","El firewall es un control técnico, pero no es administrativo; la clasificación es por función, no por categoría.","No es correctivo porque no repara ni restaura tras un incidente, y su función principal no es el efecto disuasorio."],"refuerzo":"Pensá en un guardia de seguridad en la puerta. Si impide el paso a quien no tiene credencial, está previniendo. Si además anota quién intentó entrar sin permiso en una libreta, está detectando. Un firewall hace lo mismo: detiene el tráfico indebido (prevención) y deja una huella en el log para que el administrador sepa qué pasó (detección).","concepto":"Funciones de los controles","seccion":"3 Understanding Security Controls","dom":"Security Principles","obj":"1.4","area":"Tipos de control","dificultad":"media","tipo":"analisis","cita_pdf":"Sometimes a control can have more than one function. For example, a firewall can both block unauthorized access to a system (preventive function) and log unauthorized access attempts (detective function).","pagina":51},{"id":"q0033","pregunta":"Tenés una red que usa reconocimiento facial para el acceso físico a edificios y para el inicio de sesión en equipos. ¿Qué demuestra este caso sobre los controles?","opciones":["Que los controles físicos siempre requieren hardware avanzado.","Que las categorías de control dependen únicamente del software utilizado.","Que una misma tecnología puede ser un control físico o técnico.","Que el reconocimiento facial es exclusivamente un control técnico."],"correcta":2,"porque_correcta":"El documento señala que ciertas tecnologías son versátiles; el reconocimiento facial, al aplicarse en distintas interfaces (lector de puerta vs. software de PC), cambia de categoría entre físico y técnico.","porque_incorrectas":["El documento no limita los controles físicos a hardware avanzado, se refiere a la ubicación y propósito del control.","La categoría no depende del software, sino del mecanismo de acción y el objetivo de protección.","Es un error considerar que el reconocimiento facial es solo técnico, ya que al controlar el acceso a una instalación, se categoriza como físico."],"refuerzo":"Recordá que la categoría del control depende de *dónde* y *cómo* actúa. Un sensor de huella digital en la puerta de entrada es un control físico porque gestiona el acceso al espacio. Ese mismo sensor conectado al teclado de tu laptop es un control técnico porque protege el acceso al sistema operativo.","concepto":"Versatilidad de los controles","seccion":"3 Understanding Security Controls","dom":"Security Principles","obj":"1.4","area":"Tipos de control","dificultad":"media","tipo":"analisis","cita_pdf":"Note that some technologies can be used in either physical and technical controls. For example, face recognition can be used to gain access to a building in the form of a biometric reader (physical control) or to log into a computer (technical control).","pagina":49},{"id":"q0034","pregunta":"Para mejorar la seguridad, decidís implementar un sistema de cámaras y, al mismo tiempo, realizar auditorías de seguridad periódicas. ¿Cuál es el propósito común de ambos según su función?","opciones":["Ambos actúan como controles preventivos.","Ambos funcionan como controles detectivos.","Ambos son controles administrativos.","Ambos son controles correctivos."],"correcta":1,"porque_correcta":"Tanto las cámaras de seguridad como las auditorías tienen como objetivo identificar situaciones o brechas, lo que las clasifica funcionalmente como controles detectivos.","porque_incorrectas":["Las cámaras no impiden físicamente el ingreso, y las auditorías revisan el pasado, por lo que no son preventivas.","Aunque las auditorías son administrativas, las cámaras son físicas, por lo que la clasificación por categoría no es el punto común.","Ninguno de los dos tiene como fin primario la corrección automática tras un incidente."],"refuerzo":"Un control detective es como un sistema de alarma: no detiene al ladrón en el momento (eso sería preventivo), pero te avisa que algo está ocurriendo o que alguien rompió una norma. Si las cámaras graban y la auditoría detecta una falta de cumplimiento, ambos te están informando sobre un evento necesario de analizar.","concepto":"Funciones de los controles","seccion":"3 Understanding Security Controls","dom":"Security Principles","obj":"1.4","area":"Tipos de control","dificultad":"media","tipo":"aplicacion","cita_pdf":"Detective | Security cameras | Log analysis tools | Regular security audits","pagina":53},{"id":"q0035","pregunta":"Un complejo de oficinas utiliza molinetes y personal de seguridad para verificar la entrada. ¿A qué categoría de control pertenecen principalmente los molinetes?","opciones":["Administrativos.","Técnicos.","Físicos.","Operativos."],"correcta":2,"porque_correcta":"Los molinetes actúan sobre el acceso físico a las instalaciones y son clasificados como controles físicos por su mecanismo de acción.","porque_incorrectas":["Los controles administrativos son políticas o entrenamientos, no dispositivos de restricción física.","Los controles técnicos suelen ser firewalls o encriptación, no dispositivos de entrada física.","Operativo no es una de las tres categorías principales discutidas en el capítulo (físico, técnico, administrativo)."],"refuerzo":"Los controles físicos son aquellos que podés tocar o que actúan sobre el entorno material, como un cerrojo, una cámara o una valla. Los molinetes, al igual que los candados o cámaras, cumplen la función de restringir el movimiento de personas en el espacio real.","concepto":"Categorías de seguridad","seccion":"3 Understanding Security Controls","dom":"Security Principles","obj":"1.4","area":"Tipos de control","dificultad":"facil","tipo":"concepto","cita_pdf":"Physical controls such as turnstiles, mantraps, cameras, and locks address facility access and surveillance.","pagina":46},{"id":"q0036","pregunta":"Tu empresa implementa una política de onboarding para nuevos empleados y un procedimiento estándar. ¿Qué tipo de control se está aplicando aquí?","opciones":["Controles técnicos preventivos.","Controles administrativos de dirección.","Controles físicos correctivos.","Controles administrativos detectivos."],"correcta":1,"porque_correcta":"Las políticas de onboarding y los procedimientos estándar son directrices que guían el comportamiento de las personas, siendo clasificados como controles administrativos de tipo directivo.","porque_incorrectas":["No son técnicos porque no involucran software o hardware de protección.","No son físicos ni correctivos, ya que no actúan sobre instalaciones ni restauran daños.","Son directivos porque establecen cómo deben hacerse las cosas, no detectivos que buscan errores o incidentes."],"refuerzo":"Los controles directivos le dicen a la gente qué debe hacer. Pensemos en un cartel que dice 'Solo personal autorizado' o en un manual que detalla los pasos para configurar una contraseña; están dirigiendo la conducta del usuario hacia un objetivo seguro.","concepto":"Controles administrativos","seccion":"3 Understanding Security Controls","dom":"Security Principles","obj":"1.4","area":"Tipos de control","dificultad":"facil","tipo":"concepto","cita_pdf":"Directive | Sign in door: Authorized Personnel only | File storage policies | Standard Operating Procedures","pagina":53},{"id":"q0037","pregunta":"Al diseñar un sistema de seguridad, ¿por qué es fundamental superponer controles físicos, técnicos y administrativos?","opciones":["Para cumplir con todas las normativas internacionales de auditoría.","Para reducir el costo operativo al usar múltiples soluciones simples.","Para que las debilidades de un control sean cubiertas por otros.","Para simplificar la gestión del personal de TI de la empresa."],"correcta":2,"porque_correcta":"La estrategia de capas asegura que si una medida falla (por ejemplo, alguien burla un candado), otras medidas (técnicas o administrativas) puedan mitigar el impacto, creando una defensa robusta.","porque_incorrectas":["El propósito es la seguridad y protección de activos, no solo cumplir con auditorías.","Usar múltiples controles a menudo aumenta la complejidad y los costos, no los reduce.","La superposición aumenta la complejidad operativa, el objetivo es la resiliencia ante fallos."],"refuerzo":"Imaginá que tenés una caja fuerte. El cerrojo es físico, el código es técnico y la regla de no anotar el código en un post-it es administrativa. Si el cerrojo falla, el código protege; si alguien descubre el código, la política administrativa evita que lo encuentre escrito. Eso es defensa en profundidad.","concepto":"Defensa en profundidad","seccion":"3 Understanding Security Controls","dom":"Security Principles","obj":"1.4","area":"Tipos de control","dificultad":"media","tipo":"analisis","cita_pdf":"Strong security relies on layering all three classes so weaknesses in one are covered by the others.","pagina":46},{"id":"q0038","pregunta":"Un honeypot, a menudo utilizado para atraer atacantes y monitorear su comportamiento, ¿qué función cumple?","opciones":["Disuasoria.","Correctiva.","Compensatoria.","Preventiva."],"correcta":0,"porque_correcta":"Los honeypots se clasifican como controles disuasorios porque su presencia puede engañar al atacante y desviar su atención de los sistemas productivos hacia un entorno controlado.","porque_incorrectas":["No es correctivo, pues no revierte daños causados al sistema principal.","No es compensatorio, ya que no sustituye un control de seguridad necesario para la operación.","No es preventivo, ya que el atacante ya está interactuando con el sistema para que el honeypot funcione."],"refuerzo":"Imaginá un señuelo en un juego. Al poner algo que parece valioso pero es falso, lográs que el adversario pierda tiempo y recursos intentando atacar eso en lugar de atacar tus datos reales. Esa distracción desanima a los atacantes, cumpliendo una función de disuasión.","concepto":"Controles disuasorios","seccion":"3 Understanding Security Controls","dom":"Security Principles","obj":"1.4","area":"Tipos de control","dificultad":"dificil","tipo":"analisis","cita_pdf":"Deterrent | Barbed wire fences | Honeypots | Complex password policies","pagina":53},{"id":"q0039","pregunta":"Cuál de los siguientes ejemplos es una medida administrativa diseñada para gestionar el acceso de los empleados?","opciones":["Un firewall perimetral que filtra tráfico.","Un lector de tarjetas magnéticas en la puerta.","Una política de creación de cuentas de usuario.","Una cámara IP con detección de movimiento."],"correcta":2,"porque_correcta":"Las políticas de gestión de cuentas son directrices o normas que dictan los procedimientos para los empleados, situándose claramente dentro de los controles administrativos.","porque_incorrectas":["El firewall es un control técnico de red.","El lector de tarjetas es un control físico de acceso.","La cámara es un control físico de vigilancia."],"refuerzo":"Recordá que los controles administrativos son 'orientados a personas'. Si un control es una regla escrita, un plan, un chequeo de antecedentes o una política de empresa, estás hablando de un control administrativo que guía el comportamiento humano.","concepto":"Controles administrativos","seccion":"3 Understanding Security Controls","dom":"Security Principles","obj":"1.4","area":"Tipos de control","dificultad":"facil","tipo":"concepto","cita_pdf":"Administrative controls, also known as managerial controls or procedural controls, are people-oriented directives built around standards and guidelines","pagina":50},{"id":"q0040","pregunta":"Un sistema de respaldo automático que restaura archivos ante una pérdida de datos, ¿qué función cumple?","opciones":["Preventiva.","Correctiva.","Detectiva.","Compensatoria."],"correcta":1,"porque_correcta":"La restauración de sistemas tras un incidente es la definición funcional de un control correctivo, diseñado para devolver el entorno a un estado operativo seguro.","porque_incorrectas":["La prevención evita que el incidente ocurra, pero el respaldo solo actúa después de la pérdida de datos.","La detección identifica el evento, pero el respaldo realiza la acción de recuperar.","La compensación es una alternativa cuando un control principal no es factible, no es lo mismo que la recuperación de datos."],"refuerzo":"Los controles correctivos son los que usamos después de un incendio o una falla. Si un sistema cae o pierde datos, el respaldo actúa como la herramienta que corrige el problema y devuelve la funcionalidad perdida, similar a un extintor que 'corrige' el desastre de un fuego.","concepto":"Funciones de los controles","seccion":"3 Understanding Security Controls","dom":"Security Principles","obj":"1.4","area":"Tipos de control","dificultad":"media","tipo":"aplicacion","cita_pdf":"Corrective | Fire suppression systems | Automated system restores points | Disaster Recovery Plan","pagina":53},{"id":"q0041","pregunta":"En una organización, ¿por qué es necesario distinguir entre las categorías de NIST y las categorías presentadas en el capítulo?","opciones":["Porque el NIST utiliza solo categorías técnicas y no físicas.","Porque las categorías del NIST no mapean directamente con las del capítulo.","Porque el NIST ha desaconsejado el uso de controles físicos.","Porque el capítulo solo se enfoca en controles administrativos."],"correcta":1,"porque_correcta":"El texto explícitamente aclara que, aunque el NIST y este material utilizan términos similares, no existe una correspondencia exacta entre sus esquemas de clasifica
