ión administrativa; la 'detección' es el acto de observar la anomalía en el momento.","El guardia no tiene el rol técnico de mantenimiento de sistemas de TI o de cámaras; eso es una función técnica.","La configuración de reglas es una tarea de gestión centralizada de sistemas, no una función operativa de un guardia frente a una entrada."],"refuerzo":"El guardia no es una máquina que solo mira. Cuando alguien intenta una 'ingeniería social' (por ejemplo, decir que olvidó su credencial), el guardia está ahí para detectar que eso no cuadra con el protocolo. Su ojo humano detecta el 'comportamiento' (duda, prisa, lenguaje corporal) que un sistema electrónico no puede ver. La detección es ese paso crítico antes de que ocurra una brecha mayor.","concepto":"Rol guardias seguridad","seccion":"10 Physical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"media","tipo":"aplicacion","cita_pdf":"As detectors, they actively monitor for suspicious behavior or security breaches. Their deterrent effect comes from their visible presence, which often prevents potential intruders from attempting unauthorized access.","pagina":140},{"id":"q0137","pregunta":"¿Qué efecto tiene la presencia visible de un guardia de seguridad sobre los posibles intrusos?","opciones":["Provoca que los intrusos busquen métodos más sofisticados para saltarse las cámaras.","Actúa como un elemento de disuasión que reduce la intención de realizar accesos no autorizados.","Obliga a los intrusos a identificarse antes de realizar cualquier intento de acceso.","Aumenta la velocidad de respuesta del sistema de alarmas ante intrusiones detectadas."],"correcta":1,"porque_correcta":"La visibilidad del guardia funciona como una barrera psicológica que desalienta a los intrusos, reduciendo la probabilidad de intentos de acceso.","porque_incorrectas":["Es un efecto secundario no deseado, no el propósito o efecto primario definido por la presencia del guardia.","El guardia no obliga al intruso a identificarse; el intruso intentará no ser visto, y si es visto por el guardia, el intento probablemente cesará por la disuasión.","La presencia del guardia no acelera electrónicamente la respuesta de una alarma; son sistemas de naturaleza distinta."],"refuerzo":"Seguro viste alguna vez un cartel que dice 'Área vigilada'. El efecto es similar. El delincuente busca el camino de menor resistencia. Si ve un guardia, sabe que el riesgo de ser atrapado sube, que el 'costo' de su intento es alto. Por eso decide no intentarlo. La seguridad física no es solo atrapar al ladrón, es hacer que el ladrón crea que no vale la pena ni empezar.","concepto":"Rol guardias seguridad","seccion":"10 Physical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"facil","tipo":"concepto","cita_pdf":"Their deterrent effect comes from their visible presence, which often prevents potential intruders from attempting unauthorized access.","pagina":140},{"id":"q0138","pregunta":"Para proteger áreas de trabajo de forma integral, ¿qué combinación de medidas se considera una buena práctica para minimizar la exposición de información?","opciones":["Puertas bloqueadas, equipos bloqueados, limpieza de escritorio y destrucción de documentos.","Cámaras de seguridad en cada cubículo y sistemas de autenticación biométrica.","Registro de visitantes y uso exclusivo de sistemas de vigilancia por video.","Instalación de vallas perimetrales y control estricto de acceso de vehículos."],"correcta":0,"porque_correcta":"La protección de las áreas de trabajo implica medidas directas sobre los espacios, equipos y la información que allí reside, como el bloqueo físico y políticas de manejo de documentos.","porque_incorrectas":["Poner cámaras en cada cubículo suele ser excesivo, intrusivo y no resuelve la seguridad de los activos de trabajo que se encuentran en el escritorio.","El registro de visitantes es importante para el perímetro, pero no es la medida central para proteger lo que ocurre específicamente en el escritorio de un empleado.","Las vallas perimetrales protegen el edificio, pero no hacen nada por la seguridad de la información dentro del área de trabajo específica del empleado."],"refuerzo":"Si pensás en un área de trabajo, tu mayor amenaza no siempre es un tipo que rompe una ventana; a veces es el descuido. Dejaste un reporte confidencial arriba de la mesa y te fuiste. El bloqueo de equipos, la trituradora y la política de mesa limpia son tus mejores aliados aquí. La seguridad de 'área de trabajo' es, en última instancia, seguridad de la información física.","concepto":"Perimetros de seguridad","seccion":"10 Physical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"media","tipo":"aplicacion","cita_pdf":"Security measures include physical controls such as door and equipment locks, policies promoting a clean desk environment to minimize sensitive information exposure, and secure management of printers and document disposal through shredding.","pagina":133},{"id":"q0139","pregunta":"¿Por qué es crucial establecer reglas claras sobre quién puede autorizar el acceso de visitantes a una organización?","opciones":["Para que los visitantes no tengan que seguir los protocolos de los guardias de seguridad.","Para prevenir el acceso no autorizado mediante la definición de responsables claros.","Para delegar la responsabilidad legal de los incidentes exclusivamente en el visitante.","Para acelerar el registro de los visitantes que no están en la lista de personal."],"correcta":1,"porque_correcta":"Definir quién autoriza el acceso permite mantener el control y asegurar que nadie ingrese sin una validación legítima, evitando puntos ciegos en la seguridad.","porque_incorrectas":["Al contrario: las reglas aseguran que el visitante SÍ siga los protocolos, no que los evite.","La responsabilidad legal no se delega simplemente mediante una autorización; los protocolos son para la protección organizacional.","Definir responsables no acelera el registro; en todo caso, puede hacerlo más riguroso o lento, pero más seguro."],"refuerzo":"Imaginá que cualquiera en la oficina pudiera dejar entrar a alguien. Un extraño entra, dice que viene a una reunión y el guardia lo deja pasar. ¿A quién buscaba? No sé. Definir que solo ciertos supervisores autorizan es ponerle un 'dueño' al visitante. Si algo sale mal, sabés exactamente quién fue responsable de autorizar ese acceso.","concepto":"Gestión de visitantes","seccion":"10 Physical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"media","tipo":"analisis","cita_pdf":"These rules define who can authorize visitor access, establish proper visitor behavior inside the facility, such as areas visitors can enter, and the need for mandatory escorts. Clear procedures prevent unauthorized access.","pagina":136},{"id":"q0140","pregunta":"En el contexto de la gestión de visitantes, ¿qué rol juega el uso de escotas (escorts) obligatorias?","opciones":["Garantizar que el visitante tenga una experiencia turística agradable dentro de la empresa.","Asegurar que el visitante no se desplace a áreas restringidas sin supervisión.","Eliminar la necesidad de verificar la identidad del visitante en la entrada.","Reducir el tiempo necesario para completar los trámites de registro en el ingreso."],"correcta":1,"porque_correcta":"El escolta actúa como una barrera de control en movimiento, limitando los lugares a los que un visitante puede acceder dentro de la empresa.","porque_incorrectas":["La seguridad no se basa en la experiencia del visitante; esta opción es una distracción funcionalmente irrelevante.","El escolta complementa el registro, no lo reemplaza; la verificación de identidad es siempre necesaria.","Tener un escolta puede aumentar el tiempo total de la visita; no es una medida pensada para ganar velocidad administrativa."],"refuerzo":"Aunque registres al visitante en la entrada, eso no te garantiza qué hace adentro. Podría 'perderse' en un pasillo y llegar a la sala de servidores. El escolta es una medida física de supervisión continua: donde va el visitante, va alguien que sabe qué áreas son seguras y qué áreas son zonas prohibidas. Es la forma de aplicar el 'principio de privilegio mínimo' en el mundo físico.","concepto":"Gestión de visitantes","seccion":"10 Physical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"facil","tipo":"concepto","cita_pdf":"These rules define who can authorize visitor access, establish proper visitor behavior inside the facility, such as areas visitors can enter, and the need for mandatory escorts.","pagina":136},{"id":"q0141","pregunta":"¿Qué ventaja tiene la capacidad de 'delay' (retardo) que ofrecen los guardias de seguridad en comparación con un sistema puramente pasivo?","opciones":["Permite detener físicamente al intruso para ganar tiempo hasta que llegue una respuesta adicional.","Permite que el intruso se sienta intimidado y abandone la intención antes de entrar.","Permite almacenar las pruebas del incidente para un análisis forense posterior.","Permite que la organización reduzca los costos de personal contratado en el turno noche."],"correcta":0,"porque_correcta":"El delay es la acción física de entorpecer el avance del intruso, lo cual es vital para dar tiempo a que lleguen los equipos de respuesta.","porque_incorrectas":["La intimidación es la función de 'deterrence' (disuasión), no de 'delay'.","El almacenamiento de pruebas es el objetivo de los logs y CCTV, no la función física de retardo.","El retardo no tiene relación con el ahorro de costos; es una función operativa de seguridad, no una decisión de presupuesto."],"refuerzo":"El 'delay' es como el tiempo que tarda alguien en romper una pared frente a una puerta abierta. Un guardia no siempre puede ganar una pelea, pero puede bloquear el camino o cerrar una puerta reforzada, ganando esos minutos valiosos. Mientras el intruso pierde tiempo tratando de pasar al guardia, el personal de emergencia (o la policía) va en camino. Es la diferencia entre un incidente contenido y un desastre total.","concepto":"Rol guardias seguridad","seccion":"10 Physical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"dificil","tipo":"analisis","cita_pdf":"If an incident occurs, guards can physically intervene, delaying intruders and providing crucial time for additional security responses.","pagina":140},{"id":"q0142","pregunta":"¿Por qué el procedimiento de registro en hojas de firmas es parte integral de la seguridad de visitantes?","opciones":["Porque sirve como prueba legal de que el visitante aceptó las políticas de propiedad intelectual.","Porque documenta quién ingresa y en qué momento, proporcionando un registro necesario para la auditoría.","Porque reemplaza a la verificación de identificación oficial mediante fotos.","Porque permite que los empleados autorizados se registren automáticamente sin pasar por recepción."],"correcta":1,"porque_correcta":"La hoja de registro provee una pista de auditoría física esencial: tener un registro exacto de quién, cuándo y por qué estuvo alguien en el edificio es fundamental para la rendición de cuentas.","porque_incorrectas":["El registro de firma no garantiza la aceptación de políticas legales complejas como la propiedad intelectual.","El registro es un paso *adicional* a la verificación de identidad, nunca un reemplazo.","El registro de visitantes es para visitantes; los empleados deben estar bajo otro control, como sus badges de acceso personal."],"refuerzo":"Si hoy desaparece una laptop de una oficina y no tenés un registro de firmas en recepción, ¿cómo sabés quién estuvo cerca? El registro en papel es una herramienta de 'accountability'. Aunque suene antiguo, es la base de la evidencia física. Si alguien miente sobre su visita, ese registro es la prueba de que estuvo en la instalación cuando no debía.","concepto":"Gestión de visitantes","seccion":"10 Physical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"facil","tipo":"aplicacion","cita_pdf":"the receptionist or guard registers the visit on a sign-in sheet to record who enters the building and when. The visitor is allowed access only after these steps have been completed.","pagina":136},{"id":"q0143","pregunta":"Tenés que implementar un modelo de control de acceso en una empresa con alta rotación de personal y una estructura jerárquica muy rígida. ¿Qué modelo elegirías para minimizar el error humano en la administración?","opciones":["Discretionary Access Control (DAC)","Role-Based Access Control (RBAC)","Mandatory Access Control (MAC)","Identity-Based Access Control (IBAC)"],"correcta":1,"porque_correcta":"RBAC simplifica la administración al asignar permisos a roles funcionales en lugar de a individuos, lo que es ideal para entornos organizacionales estables.","porque_incorrectas":["Confusión con la flexibilidad del modelo DAC, que es ineficiente para gestionar altas y bajas masivas de personal.","Confusión con la rigidez extrema de MAC, que aunque es seguro, no está diseñado para simplificar la administración de roles organizacionales.","Error terminológico al proponer un modelo no definido en el texto para la gestión de roles."],"refuerzo":"Imaginate que cada vez que entra un empleado nuevo tenés que configurar cien carpetas distintas. En RBAC, simplemente lo agregás al grupo de 'Contabilidad' y hereda automáticamente todos los permisos necesarios. Es como darle una llave maestra que abre solo las puertas de su sector, en lugar de darle cien llaves individuales.","concepto":"Modelos de control acceso","seccion":"11 Logical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"media","tipo":"aplicacion","cita_pdf":"RBAC assigns permissions to roles based on job functions. Users inherit access rights through role membership, which simplifies administration at scale.","pagina":147,"fig":147},{"id":"q0144","pregunta":"Si un desarrollador crea un archivo con información confidencial y decide compartirlo con alguien no autorizado por error, ¿qué característica del modelo DAC permitió esta brecha?","opciones":["La centralización de la autoridad en el administrador del sistema.","La herencia automática de permisos basada en roles organizacionales.","La flexibilidad otorgada al propietario para gestionar sus activos.","La aplicación obligatoria de etiquetas de seguridad en los archivos."],"correcta":2,"porque_correcta":"DAC delega el control en el propietario del objeto, lo que otorga flexibilidad pero elimina la capacidad de la organización para evitar que este comparta información sensible.","porque_incorrectas":["Equivocación sobre la estructura de control, ya que en DAC el propietario, no el administrador, decide.","Error al confundir DAC con RBAC, el cual no basa sus decisiones en el dueño del archivo.","Confusión con el modelo MAC, donde el usuario no tiene capacidad de decisión sobre las etiquetas de seguridad."],"refuerzo":"El modelo DAC funciona como un documento compartido donde vos sos el dueño y podés darle acceso a quien quieras. Si te equivocás al escribir el mail de la persona, le diste acceso a alguien externo. El sistema confía en tu criterio como dueño, pero si te equivocás, no hay una política central que te detenga.","concepto":"Discretionary Access Control (DAC)","seccion":"11 Logical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"facil","tipo":"analisis","cita_pdf":"Indeed, since users have significant control over their assets, there is a potential risk of accidental","pagina":148},{"id":"q0145","pregunta":"En un entorno de máxima seguridad, se requiere que las decisiones de acceso estén centralizadas y no puedan ser alteradas por los usuarios. ¿Qué modelo se alinea mejor con esta necesidad?","opciones":["Mandatory Access Control (MAC)","Discretionary Access Control (DAC)","Role-Based Access Control (RBAC)","Policy-Based Access Control (PBAC)"],"correcta":0,"porque_correcta":"MAC es el modelo diseñado para entornos altamente seguros donde una autoridad central dicta las reglas mediante etiquetas, impidiendo la intervención del usuario.","porque_incorrectas":["Confusión con la naturaleza abierta de DAC, donde los usuarios tienen discreción sobre sus objetos.","Confusión con la gestión basada en funciones de RBAC, la cual es útil para la administración pero no garantiza la restricción total sobre etiquetas.","Error al seleccionar un modelo de acceso dinámico (PBAC) que no cumple con el requisito de 'autoridad central estricta' mencionado en el texto."],"refuerzo":"MAC es como un búnker militar: el guardia en la puerta (la autoridad central) tiene una lista estricta y nadie, ni siquiera el dueño del archivo, puede decidir dejar entrar a alguien fuera de esa lista. Las etiquetas son como el nivel de secreto de cada persona y documento; si no coinciden, no hay vuelta que darle.","concepto":"Mandatory Access Control (MAC)","seccion":"11 Logical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"media","tipo":"concepto","cita_pdf":"MAC centralizes decisions under a strict policy authority using labels and clearances. Users cannot override the predefined rules.","pagina":147,"fig":147},{"id":"q0146","pregunta":"Tu organización está adoptando PBAC (Policy-Based Access Control) para su entorno en la nube. ¿Qué ventaja operativa principal ofrece este enfoque sobre el RBAC tradicional?","opciones":["La simplificación de la administración mediante roles fijos y permanentes.","La capacidad de ajustar permisos según condiciones dinámicas y contextuales.","La eliminación de la necesidad de monitorear accesos en tiempo real.","La centralización de todas las identidades en un único directorio corporativo."],"correcta":1,"porque_correcta":"PBAC permite adaptar permisos basándose en el contexto (hora, dispositivo, ubicación), superando las limitaciones de roles estáticos del RBAC.","porque_incorrectas":["Esta es precisamente la característica del RBAC, no del PBAC.","El monitoreo sigue siendo una necesidad independiente del modelo de acceso.","Aunque los directorios son útiles, no son la diferencia fundamental que aporta PBAC respecto a la lógica de decisión de acceso."],"refuerzo":"Mientras que RBAC es como 'tengo el rol de analista, así que entro', PBAC dice 'tengo el rol de analista, pero solo si entro desde una computadora de la oficina y antes de las 5 de la tarde'. Es una capa de inteligencia extra que analiza el 'cómo' y 'dónde', no solo el 'quién'.","concepto":"Policy-Based Access Control (PBAC)","seccion":"11 Logical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"dificil","tipo":"analisis","cita_pdf":"PBAC enables policies that reflect specific conditions. For example, finance analysts may only be allowed to approve invoices during business hours, from managed devices, in approved regions, and for amounts typically up to €10,000.","pagina":148},{"id":"q0147","pregunta":"Si detectás que los usuarios están acumulando más privilegios de los necesarios a lo largo del tiempo, ¿qué acción es fundamental según las prácticas de control lógico?","opciones":["Migrar todo el sistema al modelo Mandatory Access Control (MAC).","Implementar un proceso de monitoreo continuo para detectar anomalías.","Eliminar la capacidad de los usuarios para gestionar sus propios activos.","Reemplazar el directorio central por una solución de Single Sign-On (SSO)."],"correcta":1,"porque_correcta":"El monitoreo continuo es la respuesta directa a la acumulación de privilegios, permitiendo detectar riesgos de abuso o exposición de datos.","porque_incorrectas":["Cambiar el modelo no soluciona el problema de la configuración o gestión de privilegios, es una medida demasiado drástica.","Esto es una restricción de DAC, no una solución para la acumulación de permisos excesivos.","SSO mejora la experiencia del usuario, pero no corrige el exceso de privilegios acumulados."],"refuerzo":"Los permisos son como los cables en un servidor: si no los revisás, con el tiempo se vuelven una maraña de cosas que ya no sabés ni para qué sirven. Si no hacés un chequeo periódico (monitoreo), terminás con gente con acceso a lugares que ya no necesitan, abriendo la puerta a posibles incidentes.","concepto":"Monitoreo de acceso lógico","seccion":"11 Logical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"media","tipo":"aplicacion","cita_pdf":"For this reason, logical access must be continuously monitored to detect anomalies, prevent abuse, and maintain compliance.","pagina":147,"fig":147},{"id":"q0148","pregunta":"Un analista de ciberseguridad sostiene que el Single Sign-On (SSO) compromete la seguridad al facilitar demasiado el acceso. ¿Por qué este argumento es erróneo según los conceptos de gestión de identidad?","opciones":["Porque el SSO garantiza que cada sistema tenga credenciales diferentes para mayor seguridad.","Porque el SSO permite una auditoría más sencilla de los logs al unificar la identidad.","Porque el SSO mejora la productividad sin comprometer los protocolos de seguridad.","Porque el SSO elimina por completo la necesidad de procesos de autenticación."],"correcta":2,"porque_correcta":"El SSO busca equilibrar la eficiencia (productividad) con la seguridad, al centralizar la autenticación sin degradar los estándares de control.","porque_incorrectas":["Falso; el SSO precisamente busca unificar las credenciales, no diversificarlas.","Aunque el SSO centraliza, su beneficio principal citado es el balance productividad/seguridad, no la auditoría en sí.","El SSO no elimina la autenticación; al contrario, la gestiona de forma única y segura."],"refuerzo":"Imaginá tener 20 llaves para 20 puertas de tu casa: el SSO es como tener una tarjeta magnética única que abre todo de forma segura. No estás debilitando la seguridad de las puertas, estás simplificando el acceso para que no pierdas tiempo ni te estreses, manteniendo el control centralizado.","concepto":"Single Sign-On (SSO)","seccion":"11 Logical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"media","tipo":"analisis","cita_pdf":"Single Sign-On (SSO) technology improves the user experience by enabling seamless access to multiple systems with a single authentication event, increasing productivity without compromising security.","pagina":160},{"id":"q0149","pregunta":"Ante una investigación forense tras un incidente de seguridad, ¿qué elemento es indispensable para reconstruir la actividad del usuario?","opciones":["El modelo de control de acceso configurado (DAC o MAC).","Los registros detallados de los logs de acceso al sistema.","La configuración de los servicios de directorio centralizados.","La política de Federated Identity Management (FIM)."],"correcta":1,"porque_correcta":"Los logs son los que documentan qué ocurrió, quién lo hizo y cuándo, permitiendo la trazabilidad necesaria en investigaciones.","porque_incorrectas":["El modelo indica quién puede acceder, pero no registra históricamente qué hizo alguien en el pasado.","Aunque son útiles, el directorio gestiona identidades y permisos, no registra la actividad detallada (logs).","FIM es para compartir identidades entre dominios, no es la fuente primaria de registros de actividad."],"refuerzo":"Si pasa algo malo, los logs son como las cámaras de seguridad en un pasillo: no impiden que alguien entre, pero te dicen exactamente quién estuvo ahí, a qué hora y qué tocó. Sin eso, estás tratando de resolver un misterio sin ninguna evidencia.","concepto":"Logical access logging","seccion":"11 Logical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"facil","tipo":"aplicacion","cita_pdf":"These logs are essential for detecting threats, ensuring compliance, and supporting forensic investigations.","pagina":160},{"id":"q0150","pregunta":"¿Cuál es la principal limitación que se menciona sobre el uso de DAC en sistemas operativos modernos?","opciones":["La dificultad para configurar los permisos básicos por parte del dueño.","El riesgo de compartir información con usuarios no autorizados por error.","La falta de escalabilidad en entornos con más de cien usuarios.","La imposibilidad técnica de implementar el modelo en Windows o Linux."],"correcta":1,"porque_correcta":"DAC delega el control en el usuario, lo que crea un punto ciego donde el usuario puede cometer errores humanos que exponen información.","porque_incorrectas":["Al contrario, la flexibilidad hace que sea muy sencillo asignar permisos.","Si bien es menos eficiente, su problema fundamental es el riesgo de mala configuración por parte del usuario, no la cantidad de usuarios en sí.","DAC es el modelo por defecto en los sistemas operativos mencionados en el texto."],"refuerzo":"DAC es como ser el dueño de una casa y tener la potestad de dejar entrar a quien quieras. Es genial si sos cuidadoso, pero si tenés muchos objetos de valor y a veces te olvidás a quién le diste copia de la llave, es un riesgo enorme que no podés controlar centralizadamente.","concepto":"Discretionary Access Control (DAC)","seccion":"11 Logical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"media","tipo":"analisis","cita_pdf":"However, it is important to note that the flexibility of DAC can also be a potential security concern. For example, it enables the owner to share the newly created file containing confidential information with unauthorized users.","pagina":148},{"id":"q0151","pregunta":"Al diseñar un sistema de monitoreo, ¿por qué es crítico que la recolección de logs sea centralizada y estandarizada?","opciones":["Para reducir el costo de almacenamiento de los registros en la nube.","Para que los usuarios puedan auditar sus propios registros fácilmente.","Para evitar que temas de seguridad importantes se pasen por alto.","Para cumplir con los estándares de diseño de los sistemas operativos."],"correcta":2,"porque_correcta":"El crecimiento de sistemas hace imposible el monitoreo manual y disperso; la centralización permite analizar datos a gran escala para identificar amenazas a tiempo.","porque_incorrectas":["El costo no es el factor de seguridad principal mencionado; la clave es detectar amenazas.","Los logs se recopilan para el control de seguridad y cumplimiento, no para que el usuario se auto-audite.","Aunque la estandarización ayuda, el objetivo último es la capacidad de detectar problemas, no el cumplimiento de una arquitectura de OS."],"refuerzo":"Imaginá tener 50 libros de registros en distintos idiomas y lugares de la oficina. Es imposible saber qué está pasando. Centralizar y estandarizar es como traducirlos todos y ponerlos en una sola biblioteca; así podés ver patrones de ataque que de otra forma serían invisibles.","concepto":"Monitoreo de acceso lógico","seccion":"11 Logical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"dificil","tipo":"analisis","cita_pdf":"Without a clear way to gather and analyze this logical access information, important security issues can easily be overlooked within everyday activities.","pagina":156},{"id":"q0152","pregunta":"¿Qué define principalmente la capacidad de un modelo DAC para gestionar recursos?","opciones":["El conjunto de roles predefinidos por la organización.","Las etiquetas de seguridad asignadas por un administrador central.","La autoridad del dueño del objeto para conceder o revocar permisos.","Las condiciones contextuales del acceso, como hora o dispositivo."],"correcta":2,"porque_correcta":"El término 'discrecional' proviene de la capacidad del dueño de decidir el destino y acceso de sus propios activos.","porque_incorrectas":["Esto es característico de RBAC, no de DAC.","Esto es característico de MAC, el cual limita la discreción del usuario.","Esto es característico de modelos basados en políticas dinámicas como PBAC."],"refuerzo":"Cuando sos dueño de un archivo en DAC, vos tenés la última palabra. Si decidís que tu compañero vea tu informe, el sistema simplemente lo permite. Sos el juez y parte de quién entra a tus recursos, a diferencia de otros modelos donde el sistema decide por vos.","concepto":"Discretionary Access Control (DAC)","seccion":"11 Logical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"facil","tipo":"concepto","cita_pdf":"As the term \"discretionary\" suggests, Discretionary Access Control (DAC) refers to the idea that the owner of the object is typically its creator, and as the owner, can decide what can be done with it.","pagina":148},{"id":"q0153","pregunta":"Si un empleado cambia de departamento y mantiene accesos de su rol anterior además de los nuevos, ¿qué concepto de control lógico falló?","opciones":["La segregación de funciones.","La gestión de privilegios excesivos.","La autenticación federada.","El monitoreo de logs del sistema."],"correcta":1,"porque_correcta":"La acumulación de permisos (privilegios excesivos) es un riesgo común que debe ser detectado para prevenir el uso indebido.","porque_incorrectas":["Aunque es un riesgo, el problema específico descrito es la acumulación de permisos, no necesariamente una falla en la segregación (aunque esté relacionada).","La federación es un mecanismo de gestión, no un concepto de falla de acceso.","El monitoreo detecta la falla, pero la falla en sí es la gestión de privilegios excesivos."],"refuerzo":"Es como si al cambiar de trabajo te quedaras con las llaves de tu oficina anterior. Con el tiempo, tenés un llavero gigante con acceso a media empresa. Ese exceso de privilegios es un riesgo: si te roban el llavero (o tu cuenta), el atacante tiene mucho más acceso del que debería.","concepto":"Gestión de privilegios excesivos","seccion":"11 Logical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"media","tipo":"aplicacion","cita_pdf":"Users may accumulate more permissions than necessary, often due to configuration errors or evolving job roles. Such excess privileges increase the risk of misuse or data exposure.","pagina":147,"fig":147},{"id":"q0154","pregunta":"El uso de servicios de directorio es clave en la gestión de identidad. ¿Cuál es su rol principal?","opciones":["Limitar el acceso a los recursos mediante etiquetas de seguridad.","Proporcionar un punto centralizado para gestionar identidades.","Registrar cada interacción del usuario para auditoría forense.","Permitir la colaboración entre organizaciones distintas sin fricción."],"correcta":1,"porque_correcta":"Los servicios de directorio centralizan la gestión, permitiendo un control único sobre quién es quién y qué puede hacer.","porque_incorrectas":["Eso es parte de MAC, no de un servicio de directorio.","La auditoría es función de los logs, no del servicio de directorio como tal.","Esa es la función de FIM (Federated Identity Management)."],"refuerzo":"El directorio es como la libreta de contactos central de toda la empresa. En lugar de que cada sistema tenga su propia lista de usuarios, todos preguntan al directorio: '¿Este usuario es real? ¿Tiene permiso?'. Eso garantiza consistencia y un punto único de control.","concepto":"Identity management technologies","seccion":"11 Logical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"facil","tipo":"concepto","cita_pdf":"Identity management technologies such as directory services, which play a central role in centralized user management by providing a single point of control for user identities and permissions.","pagina":160},{"id":"q0155","pregunta":"¿Por qué el Federated Identity Management (FIM) es necesario en entornos de colaboración organizacional?","opciones":["Porque permite que los usuarios se autentiquen de forma segura a través de dominios organizacionales.","Porque elimina la necesidad de monitorear logs en las organizaciones participantes.","Porque centraliza los permisos de todas las organizaciones en un solo servidor.","Porque obliga a todas las organizaciones a usar el mismo sistema de archivos."],"correcta":0,"porque_correcta":"FIM facilita la colaboración al permitir que la identidad se valide a través de distintos dominios, manteniendo los protocolos de seguridad.","porque_incorrectas":["FIM no elimina el monitoreo; la seguridad sigue requiriendo logs.","No centraliza todo, permite federar identidades; cada organización mantiene su autonomía.","No es necesario unificar sistemas de archivos para federar identidades."],"refuerzo":"Imaginá que tu credencial de socio de un club también te sirviera para entrar a otros clubes amigos sin hacerte socio de nuevo. Eso es FIM: confío en que el otro club validó tu identidad, así que te dejo pasar sin pedirte más datos.","concepto":"Identity management technologies","seccion":"11 Logical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"media","tipo":"analisis","cita_pdf":"Federated Identity Management (FIM) facilitates secure access across organizational domains, enabling collaboration while ensuring that security protocols are maintained.","pagina":160},{"id":"q0156","pregunta":"Un sistema genera registros donde documenta el acceso a aplicaciones, bases de datos y archivos. ¿Qué nombre recibe este mecanismo en seguridad?","opciones":["Logical access logging.","Mandatory Access Control.","Identity management technology.","Discretionary Access Control."],"correcta":0,"porque_correcta":"El registro de eventos y acceso a recursos es, por definición, el propósito del 'logical access logging'.","porque_incorrectas":["Confusión con un modelo de control de acceso, no con un registro de actividad.","Confusión con la tecnología de gestión de identidad.","Confusión con un modelo de control de acceso basado en el dueño."],"refuerzo":"Cuando hacés un log, estás dejando un rastro de papel. Cada vez que alguien entra a la base de datos o abre un archivo, se anota. Ese registro es lo que te permite tener una historia clara de qué está pasando en tu sistema en lugar de ciegas.","concepto":"Logical access logging","seccion":"11 Logical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"facil","tipo":"concepto","cita_pdf":"A log is a record of events or actions generated by a system, application, or device that documents its activity over time.","pagina":156},{"id":"q0157","pregunta":"Al implementar controles de acceso, ¿cuál es el problema de no tener un método escalable para determinar quién accede a qué?","opciones":["Que el sistema se vuelve más lento al procesar los permisos.","Que se pierde la capacidad de decidir eficientemente sobre el acceso a gran escala.","Que aumenta el consumo de recursos de red por autenticaciones repetidas.","Que los logs de acceso dejan de ser legibles para el software de análisis."],"correcta":1,"porque_correcta":"Los modelos de control de acceso están diseñados para simplificar las decisiones. Sin un método escalable, la gestión manual se vuelve inmanejable.","porque_incorrectas":["El problema no es la lentitud del sistema, sino la imposibilidad de administrar los permisos.","Si bien la autenticación puede consumir recursos, el problema de fondo al no tener un modelo escalable es la lógica de administración de acceso.","El problema no es la legibilidad de los logs, sino la falta de una estructura clara para el acceso."],"refuerzo":"Si tenés una casa con mil habitaciones, no podés ir probando puerta por puerta cuál tenés que abrir. Necesitás un mapa o un sistema de llaves maestras (modelo escalable). Sin eso, pasás más tiempo buscando cómo entrar que trabajando en lo que tenés que hacer.","concepto":"Modelos de control acceso","seccion":"11 Logical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"media","tipo":"analisis","cita_pdf":"Handling thousands of access requests requires a scalable method of determining who can access what and what actions they can perform. Access-control models are rule frameworks","pagina":147,"fig":147},{"id":"q0158","pregunta":"¿Por qué un administrador de red elegiría implementar un switch en lugar de un hub en una oficina pequeña para conectar diversas computadoras?","opciones":["Porque el switch puede extender el alcance físico de la señal mucho más lejos que un hub.","Porque el switch es más inteligente y envía los datos solo al dispositivo destino en lugar de difundirlos a todos.","Porque el hub es exclusivamente para conexiones inalámbricas, mientras que el switch permite conexiones cableadas.","Porque el switch permite que múltiples dispositivos compartan una única dirección pública mediante NAT."],"correcta":1,"porque_correcta":"La principal diferencia funcional radica en la gestión del tráfico; el switch optimiza la red al dirigir los paquetes únicamente al destinatario, reduciendo el ruido innecesario comparado con la difusión general del hub.","porque_incorrectas":["Confunde la función del switch con la de un repetidor, cuyo objetivo principal es regenerar señales para vencer limitaciones de distancia.","Atribuye erróneamente la capacidad de conectividad inalámbrica solo al hub, ignorando que ambos son dispositivos de infraestructura principalmente cableada.","Confunde la función de conmutación de datos con la capacidad de enrutamiento y traducción de direcciones (NAT) propia de un router."],"refuerzo":"Imaginá un aula donde un profesor grita la respuesta a todos los alumnos (hub) frente a uno que le susurra el mensaje solo a quien preguntó (switch). El switch evita la sobrecarga de datos en la red. Si tenés diez computadoras en un switch, cada una solo recibe el tráfico destinado a ella, aumentando la eficiencia y velocidad percibida de la red local.","concepto":"Dispositivos de red","seccion":"12 Networking","dom":"Networking and Cloud Security","obj":"4.1","area":"Seguridad de red","dificultad":"media","tipo":"analisis","cita_pdf":"A switch is more intelligent than a hub (sometimes called an \"intelligent hub\") that routes data only to the specific device for which it is intended, instead of broadcasting incoming data to all connected devices.","pagina":169},{"id":"q0159","pregunta":"Si un dispositivo solicita una página web, ¿qué función principal cumple el proxy server durante este intercambio?","opciones":["Actúa como un puente entre la red interna y el router para cifrar los paquetes de datos.","Intercepta la solicitud, la reenvía al destino en nombre del cliente y oculta la identidad del usuario.","Regenera la señal de la solicitud para que pueda viajar a través de una red de área amplia (WAN).","Examina la dirección IP del dispositivo para determinar la ruta más eficiente hacia el servidor web."],"correcta":1,"porque_correcta":"El proxy actúa como intermediario a nivel de aplicación, gestionando el contenido y ocultando la procedencia real de la solicitud ante el servidor externo, lo cual proporciona anonimato.","porque_incorrectas":["Asume que la función de un proxy es el cifrado, cuando esa es una tarea característica de protocolos de seguridad o VPNs.","Confunde la función de solicitud de un proxy con la capacidad de regeneración de señal que poseen los repetidores.","Atribuye al proxy la labor de enrutamiento basada en direcciones IP, que es el rol específico de un router."],"refuerzo":"Pensá en un agente de viajes que compra un pasaje por vos: el hotel sabe que el agente hizo la reserva, pero no conoce quién se hospedará realmente. El proxy hace lo mismo al navegar por internet. Esto protege tu identidad y permite que las empresas controlen qué sitios web pueden visitar sus empleados, al actuar como un filtro centralizado.","concepto":"Proxy y seguridad","seccion":"12 Networking","dom":"Networking and Cloud Security","obj":"4.1","area":"Seguridad de red","dificultad":"media","tipo":"aplicacion","cita_pdf":"In this process, the proxy hides information about the user's identity and activities. External websites and services see the proxy as the origin of the request rather than the individual device, providing privacy and helping to reduce tracking based on user behavior.","pagina":170},{"id":"q0160","pregunta":"En una arquitectura de red, ¿cómo se diferencia conceptualmente un endpoint de un dispositivo de red como un router?","opciones":["El endpoint es el único que posee una dirección IP, mientras que el router utiliza direcciones MAC para su comunicación.","El endpoint es el destino o iniciador de los servicios, mientras que el router facilita la interconexión entre redes.","El router solo gestiona servicios internos, mientras que el endpoint gestiona el tráfico entre diferentes redes.","El endpoint almacena recursos compartidos, mientras que el router es el encargado exclusivo de la seguridad perimetral."],"correcta":1,"porque_correcta":"La distinción clave es la función: los endpoints (computadoras, smartphones) consumen o inician servicios, mientras que los routers facilitan el transporte del tráfico a través de diferentes redes.","porque_incorrectas":["Equivoca los roles de direccionamiento, ya que ambos dispositivos utilizan direcciones lógicas y físicas para operar.","Invierte los roles funcionales, describiendo incorrectamente al router como una herramienta para servicios locales y al endpoint como un gestor de redes.","Limita incorrectamente las capacidades del endpoint al almacenamiento y le asigna al router una función de seguridad exclusiva que es compartida con firewalls."],"refuerzo":"Imaginá el sistema postal: las casas donde viven las personas son los 'endpoints' donde se originan o reciben las cartas. Las rutas y los centros de clasificación son los 'dispositivos de red' que aseguran que la carta llegue de una ciudad a otra. Los endpoints son el punto final; los dispositivos de red son la infraestructura de soporte.","concepto":"Componentes de red","seccion":"12 Networking","dom":"Networking and Cloud Security","obj":"4.1","area":"Seguridad de red","dificultad":"media","tipo":"analisis","cita_pdf":"Endpoints are addressable devices connected to a network that initiate the communication or are the final destination receiving it. Another way to understand endpoints is to see them as directly offering or consuming network services; this is distinct from network devices such as routers, switches and hubs, which primarily facilitate communication.","pagina":168},{"id":"q0161","pregunta":"¿Qué ventaja principal ofrece la implementación de NAT en un router para una red doméstica?","opciones":["Permite cifrar automáticamente todo el tráfico que sale hacia internet para mayor privacidad.","Posibilita que múltiples dispositivos internos compartan una única dirección IP pública.","Aumenta la velocidad de transferencia de datos eliminando la necesidad de paquetes IP.","Segmenta la red local en subredes aisladas para evitar el acceso no autorizado de usuarios."],"correcta":1,"porque_correcta":"NAT optimiza el uso de direcciones públicas al permitir que muchos dispositivos de una LAN utilicen una sola dirección hacia el exterior, lo cual es esencial dada la escasez de direcciones IPv4.","porque_incorrectas":["Asume que NAT es una función de seguridad o privacidad, cuando su objetivo es el mapeo de direcciones.","Malentiende el funcionamiento de NAT, creyendo que mejora la velocidad o modifica la estructura básica de los paquetes.","Confunde la función de NAT con la segmentación de red o el control de acceso, que son tareas del firewall o VLANs."],"refuerzo":"Imaginate que toda una oficina tiene un solo número de teléfono principal. Cuando llamas, una recepcionista (NAT) te conecta con la extensión correcta. NAT hace que todos tus dispositivos (celulares, tablets) parezcan ser uno solo ante el mundo exterior, simplificando la gestión y el uso de las limitadas direcciones IP públicas disponibles.","concepto":"NAT y Routers","seccion":"12 Networking","dom":"Networking and Cloud Security","obj":"4.1","area":"Seguridad de red","dificultad":"facil","tipo":"aplicacion","cita_pdf":"NAT allows multiple devices within an internal network to share a single public address. It works by replacing the","pagina":169},{"id":"q0162","pregunta":"Si tenés una empresa que necesita conectar oficinas en tres ciudades distintas, ¿qué combinación de redes es la más adecuada para su infraestructura global?","opciones":["Interconectar cada oficina como un HAN independiente mediante conexiones de fibra óptica locales.","Utilizar una WAN para vincular múltiples LANs de las distintas ciudades entre sí.","Crear un MAN en cada oficina para asegurar que el tráfico interno sea privado y veloz.","Configurar cada sucursal como un LAN, pero solo permitir comunicación a través de un switch."],"correcta":1,"porque_correcta":"Las WAN están diseñadas específicamente para conectar redes geográficamente dispersas (ciudades, países) que contienen sus propias LANs locales.","porque_incorrectas":["Un HAN es para un domicilio único y no tiene el alcance necesario para conectar sucursales en distintas ciudades.","El MAN es para entornos metropolitanos y no es suficiente para interconectar múltiples ciudades geográficamente distantes.","El switch permite conectar dispositivos dentro de una LAN, pero no tiene la capacidad de interconectar ciudades a través de grandes distancias."],"refuerzo":"Pensá en las jerarquías: un HAN es tu casa, un LAN es tu oficina, un MAN es tu ciudad, y una WAN es la infraestructura que conecta todo lo anterior a nivel mundial. Para unir tres oficinas en distintas ciudades, necesitás una WAN porque permite cubrir esas largas distancias usando tecnología de telecomunicaciones.","concepto":"Tipos de redes","seccion":"12 Networking","dom":"Networking and Cloud Security","obj":"4.1","area":"Seguridad de red","dificultad":"media","tipo":"aplicacion","cita_pdf":"A Wide Area Network (WAN) spans large geographic areas, connecting multiple LANs and MANS across cities, countries, or even continents.","pagina":175},{"id":"q0163","pregunta":"Ante una necesidad de extender el alcance de una red Wi-Fi en un edificio donde la señal llega débil a algunas habitaciones, ¿qué dispositivo es el más indicado?","opciones":["Un router, para procesar las direcciones y filtrar el tráfico entre la red y los dispositivos.","Un switch, para duplicar la señal y permitir más conexiones físicas en las habitaciones lejanas.","Un repetidor, para regenerar y amplificar la señal existente y superar limitaciones de distancia.","Un proxy, para monitorear el tráfico desde las habitaciones lejanas y mejorar su seguridad."],"correcta":2,"porque_correcta":"El repetidor tiene la función específica de extender el alcance físico mediante la amplificación o regeneración de la señal que se debilita con la distancia.","porque_incorrectas":["El router enruta tráfico entre redes, pero no es la herramienta estándar para simplemente amplificar señal Wi-Fi ya existente en un área local.","El switch no repite señales inalámbricas; es un dispositivo para gestión de tráfico basado en direcciones en redes cableadas.","El proxy gestiona solicitudes a nivel de aplicación, no tiene capacidad alguna para mejorar la potencia de una señal física de red."],"refuerzo":"Imaginá que estás gritando un mensaje a alguien que está muy lejos y no te escucha. Un repetidor es como una persona intermedia que vuelve a gritar tu mensaje con la misma fuerza para que llegue al destino. Se usa para vencer las barreras físicas que atenúan la intensidad de la señal.","concepto":"Dispositivos de red","seccion":"12 Networking","dom":"Networking and Cloud Security","obj":"4.1","area":"Seguridad de red","dificultad":"facil","tipo":"aplicacion","cita_pdf":"Repeaters are similar to hubs in that they repeat on one end the messages they get from the other. While hubs are more used to connect multiple devices, repeaters aim at extending the reach of communications by regenerating and amplifying signals to overcome distance limitations of cables or wireless connections.","pagina":169},{"id":"q0164","pregunta":"¿Qué diferencia fundamental justifica que el Internet sea clasificado como una WAN y no como una LAN?","opciones":["La cantidad de protocolos de comunicación que utiliza para asegurar la transferencia de datos.","Su capacidad de conectar millones de redes menores a través de una cobertura global.","El uso exclusivo de infraestructura cableada de alta velocidad en lugar de enlaces inalámbricos.","La implementación obligatoria de firewalls para proteger todos los dispositivos conectados."],"correcta":1,"porque_correcta":"La definición de WAN se basa en su escala geográfica y su capacidad de interconectar múltiples redes (como LANs y MANs) a gran escala, siendo Internet el máximo exponente de esto.","porque_incorrectas":["Aunque el uso de protocolos es vital, todas las redes usan protocolos; no es el factor que determina su clasificación como WAN.","El Internet usa tanto cables como enlaces inalámbricos, por lo que la infraestructura física no es el determinante.","La seguridad mediante firewalls es necesaria en cualquier red, no solo en la WAN, por lo que no es un factor diferenciador."],"refuerzo":"Una LAN es como una oficina privada; una WAN es como la red global de carreteras que une todas las ciudades del mundo. El Internet no es solo una red, es un 'sistema de sistemas' que conecta redes pequeñas en diferentes partes del mundo, superando cualquier límite geográfico propio de una LAN.","concepto":"Tipos de redes","seccion":"12 Networking","dom":"Networking and Cloud Security","obj":"4.1","area":"Seguridad de red","dificultad":"dificil","tipo":"analisis","cita_pdf":"The Internet itself is the largest and best-known example of a WAN, connecting millions of networks worldwide and enabling global communication and data sharing.","pagina":175},{"id":"q0165","pregunta":"En el contexto de la gestión de una red, ¿cuál es la ventaja de utilizar un firewall sobre un switch?","opciones":["El firewall permite conectar múltiples dispositivos mediante cables, mientras que el switch los gestiona inalámbricamente.","El firewall aplica reglas para filtrar tráfico y proteger la red, mientras que el switch solo conmuta paquetes.","El firewall prioriza el enrutamiento eficiente entre redes, mientras que el switch se encarga de la traducción de direcciones.","El firewall mejora la velocidad de transmisión, mientras que el switch es el encargado de la autenticación de usuarios."],"correcta":1,"porque_correcta":"El firewall es una herramienta de seguridad que inspecciona el tráfico, mientras que el switch es puramente un dispositivo de interconexión y conmutación de datos.","porque_incorrectas":["Invierte los roles de medio de conexión; los switches no son dispositivos de gestión inalámbrica y los firewalls no son para conectividad básica.","Confunde la función de seguridad del firewall con el enrutamiento y la NAT, que corresponden a los routers.","Atribuye al firewall funciones de rendimiento y al switch funciones de seguridad que no le corresponden, malinterpretando la jerarquía de red."],"refuerzo":"El switch es como un cartero que entrega paquetes a la casa correcta según la dirección; el firewall es como un guardia de seguridad que revisa quién entra y qué trae en su mochila antes de dejarlo pasar. Si querés proteger tu red, necesitas al guardia, no al cartero.","concepto":"Seguridad de red","seccion":"12 Networking","dom":"Networking and Cloud Security","obj":"4.1","area":"Seguridad de red","dificultad":"media","tipo":"analisis","cita_pdf":"Firewall: Monitors and filters traffic based on predefined rules. Protects internal networks from internal and external threats.","pagina":172},{"id":"q0166","pregunta":"¿Qué aspecto de los protocolos de comunicación es más relevante para asegurar que una laptop y un servidor puedan entenderse a pesar de ser de marcas diferentes?","opciones":["El uso del mismo sistema operativo en ambos equipos para procesar los datos recibidos.","La implementación de reglas estandarizadas que aseguren una comunicación confiable.","Que ambos dispositivos estén conectados mediante cables del mismo fabricante.","La capacidad de los dispositivos para cambiar su arquitectura de hardware durante la conexión."],"correcta":1,"porque_correcta":"Los protocolos son un lenguaje común que estandariza las reglas de comunicación, permitiendo interoperabilidad entre hardware y software diverso.","porque_incorrectas":["No es necesario tener el mismo sistema operativo; los protocolos existen precisamente para que sistemas distintos se entiendan.","La marca o el fabricante del cable es irrelevante para la lógica de los protocolos de red.","Los protocolos no modifican el hardware, sino que establecen la lógica de intercambio de datos sobre cualquier arquitectura existente."],"refuerzo":"Pensá en el idioma: no importa si una persona es argentina y la otra japonesa, si ambas hablan inglés, pueden entenderse. Los protocolos son como ese idioma común: definen cómo se formatean y envían los mensajes para que cualquier computadora pueda interpretar correctamente la información recibida.","concepto":"Protocolos de red","seccion":"12 Networking","dom":"Networking and Cloud Security","obj":"4.1","area":"Seguridad de red","dificultad":"facil","tipo":"concepto","cita_pdf":"Protocols establish standardized rules that ensure that computers can understand each other and reliably transfer data regardless of differences in design, manufacturer, or software.","pagina":168},{"id":"q0167","pregunta":"Si un dispositivo en una red local necesita enviar un mensaje a un sitio web en Internet, ¿cuál es el proceso lógico que realiza el router?","opciones":["Cifra el mensaje, lo envía al switch y espera la confirmación de entrega del servidor.","Examina la dirección de destino, decide la ruta más eficiente y reenvía el paquete.","Autentica al usuario en el servidor proxy antes de permitir la salida de datos.","Convierte los datos en señales eléctricas y asegura que se envíen a todos los dispositivos."],"correcta":1,"porque_correcta":"La responsabilidad central del router es examinar la dirección IP de destino (paquete) y determinar el camino adecuado para reenviarlo (packet forwarding) hacia otra red.","porque_incorrectas":["El router no es inherentemente un dispositivo de cifrado, ni el switch es el destino final de un paquete externo.","La autenticación en un proxy es un proceso separado y opcional, no es la función fundamental de enrutamiento.","El router no envía datos a todos los dispositivos; ese es el comportamiento de un hub y sería ineficiente para el tráfico de internet."],"refuerzo":"El router es como un empleado de correo que analiza el código postal de cada carta. No abre la carta (cifrado), solo mira la dirección y, basándose en el mapa, decide si el camión debe ir por la ruta del norte o del sur para llegar más rápido.","concepto":"Routers","seccion":"12 Networking","dom":"Networking and Cloud Security","obj":"4.1","area":"Seguridad de red","dificultad":"media","tipo":"analisis","cita_pdf":"When a device, such as a laptop, sends a message to another network-like when accessing a website-the router examines the destination address, determines the best available route, and forwards the message.","pagina":169},{"id":"q0168","pregunta":"¿En qué se diferencia un Home Area Network (HAN) de un Local Area Network (LAN) según la descripción del documento?","opciones":["El HAN es exclusivamente inalámbrico, mientras que el LAN permite tanto conexiones cableadas como inalámbricas.","El HAN está limitado a un entorno residencial y dispositivos domésticos, mientras que el LAN es más amplio.","El HAN es gestionado por el proveedor de servicios, mientras que el LAN es gestionado por el usuario.","El HAN es un tipo de WAN pequeña, mientras que el LAN es una infraestructura de alcance metropolitano."],"correcta":1,"porque_correcta":"El HAN está diseñado para el entorno del hogar (dispositivos smart, automatización), mientras que el LAN tiene un alcance más amplio (campus, oficina, edificio).","porque_incorrectas":["Tanto LAN como HAN pueden ser cableados o inalámbricos, por lo que la distinción no está en el medio de conexión.","Ambos tipos suelen ser gestionados por el individuo o la organización local, no necesariamente por el ISP.","La clasificación de WAN o MAN no aplica a ninguno de los dos; ambos son redes de menor alcance."],"refuerzo":"Imaginá que el HAN es el circuito de luces y sensores de tu casa (domótica). El LAN es toda la red de computadoras y servidores de tu oficina. Aunque funcionan parecido, la escala y el propósito de los dispositivos que conectan (heladeras inteligentes vs. servidores de datos) los diferencia.","concepto":"Tipos de redes","seccion":"12 Networking","dom":"Networking and Cloud Security","obj":"4.1","area":"Seguridad de red","dificultad":"media","tipo":"analisis","cita_pdf":"A home area network (HAN) connects devices within a single residence, such as laptops, tablets, smartphones, smart appliances, home automation systems, and smart meters.","pagina":174,"fig":174},{"id":"q0169","pregunta":"Si un router falla en una red pequeña, ¿por qué los dispositivos de la red local (LAN) perderían acceso a Internet?","opciones":["Porque el router es el único encargado de dirigir el tráfico entre redes diferentes.","Porque el router provee la dirección MAC necesaria para que los servidores reconozcan los dispositivos.","Porque el router actúa como un servidor de archivos que mantiene la conexión con la red exterior.","Porque el router es quien traduce las señales inalámbricas en impulsos eléctricos para la WAN."],"correcta":0,"porque_correcta":"El router es el componente fundamental que conecta la red local con redes externas; sin él, no existe un camino para el tráfico hacia Internet.","porque_incorrectas":["La dirección MAC es una propiedad física del dispositivo; el router no la 'provee' para la autenticación externa.","Un servidor de archivos tiene un propósito distinto; el router no almacena recursos, solo los transporta.","La conversión de señales es tarea de módems o interfaces de red; el router gestiona la lógica de rutas, no la física de las señales."],"refuerzo":"El router es la puerta de salida de tu casa. Si la puerta está bloqueada, aunque dentro de tu casa puedas moverte libremente (LAN), no podés salir al mundo exterior (Internet). El router es el único punto de contacto lógico para que tus paquetes de datos crucen a otras redes.","concepto":"Routers","seccion":"12 Networking","dom":"Networking and Cloud Security","obj":"4.1","area":"Seguridad de red","dificultad":"dificil","tipo":"analisis","cita_pdf":"A router is a networking device that directs traffic between different networks, ensuring that messages find the most efficient path to their destinations.","pagina":169},{"id":"q0170","pregunta":"¿Por qué se clasifica a un switch como un dispositivo de red y no como un endpoint?","opciones":["Porque los endpoints inician o reciben servicios, mientras que el switch solo facilita la comunicación.","Porque el switch tiene una mayor capacidad de almacenamiento de recursos que cualquier endpoint.","Porque el switch es el encargado de proteger la red contra amenazas externas e internas.","Porque el switch es el componente principal de una WAN, a diferencia de los endpoints."],"correcta":0,"porque_correcta":"Los endpoints son los dispositivos que actúan como origen o fin de la comunicación; los dispositivos como el switch son el medio que permite que dicha comunicación ocurra.","porque_incorrectas":["Los endpoints son dispositivos terminales, no están diseñados primordialmente para el almacenamiento masivo o servicios de red.","La seguridad es función de firewalls, no de los switches; estos últimos no filtran tráfico por políticas de seguridad.","El switch se utiliza principalmente en LANs; no es la pieza fundamental de una WAN, que depende de routers y otros dispositivos."],"refuerzo":"Imaginá una red como una oficina. Las computadoras de los empleados son los endpoints, donde se hace el trabajo. Los switches son los pasillos y escaleras que permiten que la gente camine de un lado a otro. Los pasillos no hacen el trabajo, pero sin ellos, nadie llegaría a su escritorio.","concepto":"Componentes de red","seccion":"12 Networking","dom":"Networking and Cloud Security","obj":"4.1","area":"Seguridad de red","dificultad":"media","tipo":"analisis","cita_pdf":"Endpoints are addressable devices connected to a network that initiate the communication or are the final destination receiving it. Another way to understand endpoints is to see them as directly offering or consuming network services; this is distinct from network devices such as routers, switches and hubs, which primarily facilitate communication.","pagina":168},{"id":"q0171","pregunta":"¿Qué impacto tendría la sustitución de un switch por un hub en una red local con mucho tráfico de datos?","opciones":["La red se volvería más segura al procesar el tráfico en el nivel de aplicación.","La red se volvería más rápida porque los datos se enviarían a todos los destinos simultáneamente.","La eficiencia de la red disminuiría drásticamente debido a la saturación por difusión de datos.","El tráfico de red se volvería más organizado al clasificar los paquetes por su dirección IP."],"correcta":2,"porque_correcta":"Al difundir (broadcast) todos los paquetes a cada dispositivo conectado, el hub genera un tráfico innecesario que satura el ancho de banda, reduciendo la eficiencia general.","porque_incorrectas":["Un hub no tiene ninguna capacidad de seguridad ni de gestión de tráfico a nivel de aplicación.","Enviar datos a todos los destinos no aumenta la velocidad; de hecho, provoca colisiones y esperas.","El hub no clasifica paquetes; esa es la tarea del router, la cual el hub no puede realizar ni entender."],"refuerzo":"Si en una reunión todos intentan hablar al mismo tiempo, nadie se entiende. El hub hace eso al enviar los datos a todo el mundo. El switch, en cambio, espera a que el destinatario esté disponible para enviarle el mensaje a él solo, evitando el caos y permitiendo que todos trabajen en paz.","concepto":"Dispositivos de red","seccion":"12 Networking","dom":"Networking and Cloud Security","obj":"4.1","area":"Seguridad de red","dificultad":"facil","tipo":"analisis","cita_pdf":"A switch is more intelligent than a hub (sometimes called an \"intelligent hub\") that routes data only to the specific device for which it is intended, instead of broadcasting incoming data to all connected devices.","pagina":169},{"id":"q0172","pregunta":"Considerando las clasificaciones de red, ¿cuál es el propósito fundamental de una MAN?","opciones":["Interconectar múltiples LANs dentro de una ciudad o campus de gran tamaño.","Proporcionar una red inalámbrica segura para el uso de dispositivos domésticos (IoT).","Conectar redes de diferentes países a través de infraestructura de fibra óptica global.","Gestionar el tráfico entre los servidores de una sola empresa a nivel internacional."],"correcta":0,"porque_correcta":"La MAN llena el vacío entre una LAN y una WAN, conectando diversas LANs en un entorno urbano o metropolitano.","porque_incorrectas":["La seguridad de dispositivos IoT en el hogar es el rol de un HAN.","La interconexión mundial de redes es la función específica de una WAN.","La gestión de servidores internacionales implica una infraestructura WAN, no una red de ámbito metropolitano."],"refuerzo":"Pensá en tu casa (HAN), luego en tu edificio (LAN), luego en tu ciudad (MAN) y finalmente en el país o mundo (WAN). La MAN es el puente necesario cuando una empresa tiene oficinas separadas por varios kilómetros dentro de la misma ciudad.","concepto":"Tipos de redes","seccion":"12 Networking","dom":"Networking and Cloud Security","obj":"4.1","area":"Seguridad de red","dificultad":"media","tipo":"analisis","cita_pdf":"A Metropolitan Area Network (MAN) connects multiple LANs in a city or large campus environment.","pagina":174,"fig":174},{"id":"q0173","pregunta":"Si detectás que una comunicación entre un usuario y un banco está siendo alterada en tiempo real mediante la inyección de cargas útiles maliciosas, ¿ante qué tipo de amenaza específica te encontrás?","opciones":["Un ataque pasivo de tipo on-path","Un ataque activo de tipo on-path","Una técnica de spoofing de IP de red","Un ataque DoS de denegación de servicio"],"correcta":1,"porque_correcta":"El documento define claramente que cuando el atacante no solo escucha, sino que modifica los datos interceptados (como inyectar payloads), se clasifica como un ataque activo.","porque_incorrectas":["Confundís la observación silenciosa de tráfico (pasivo) con la manipulación directa de datos (activo).","Aunque el on-path puede usar spoofing, la acción de inyectar datos es la definición de ataque activo, no la técnica de suplantación en sí.","El DoS busca agotar recursos para indisponibilizar el sistema, no alterar el contenido de las comunicaciones en curso."],"refuerzo":"Imaginate que alguien escucha una carta tuya: es una intrusión, pero el mensaje no cambia. Ahora, imaginate que esa persona abre el sobre, cambia el número de cuenta de destino y lo vuelve a cerrar; eso es una manipulación activa. En redes, los ataques 'on-path' activos hacen exactamente eso: modifican el flujo de datos para redirigir dinero o instalar malware, a diferencia de los pasivos que solo espían.","concepto":"Ataques on-path","seccion":"13 Network Threats and Attacks","dom":"Security Operations and Incident Response","obj":"5.2","area":"Operaciones y monitoreo","dificultad":"media","tipo":"aplicacion","cita_pdf":"Active On-Path Attacks are those where the attacker modifies the intercepted data. For example, they might inject malicious payloads, alter transaction details to redirect funds, or send fraudulent messages.","pagina":239,"fig":239},{"id":"q0174","pregunta":"Un servidor web sufre una caída repentina tras recibir miles de peticiones simultáneas, impidiendo el acceso a los usuarios legítimos. ¿Qué principio de seguridad se vio afectado principalmente?","opciones":["La integridad de los datos almacenados","La confidencialidad de la información privada","La disponibilidad de los servicios del sistema","La autenticidad de las peticiones de red"],"correcta":2,"porque_correcta":"El ataque descrito es un DoS, cuyo objetivo central es inundar un sistema para agotar sus recursos y hacerlo inaccesible, impactando directamente en la disponibilidad.","porque_incorrectas":["La integridad se refiere a que los datos no sean alterados, no a que el sistema esté encendido.","La confidencialidad trata sobre evitar el acceso no autorizado, no sobre la operatividad del servicio.","La autenticidad trata sobre verificar la identidad, no sobre la capacidad de respuesta ante carga de tráfico."],"refuerzo":"Pensá en la disponibilidad como la capacidad de entrar a un negocio: si la puerta está bloqueada por gente que no compra, el negocio no está disponible para los clientes reales. Los ataques de denegación de servicio (DoS) atacan el pilar de la 'disponibilidad', buscando que el sistema se vuelva tan lento o colapse tanto que nadie pueda usarlo, sin importar quién sea el usuario.","concepto":"Principios de ciberseguridad","seccion":"13 Network Threats and Attacks","dom":"Security Operations and Incident Response","obj":"5.2","area":"Operaciones y monitoreo","dificultad":"facil","tipo":"analisis","cita_pdf":"This type of attack targets \"availability,\" one of the three core principles of cybersecurity","pagina":240},{"id":"q0175","pregunta":"Si un atacante se sitúa entre vos y el sitio web de tu banco para observar credenciales sin que vos notes nada, ¿por qué se clasifica como un ataque 'pasivo'?","opciones":["Porque el atacante no modifica el flujo original de datos","Porque el ataque solo se realiza desde fuera de la red","Porque requiere una conexión física con el dispositivo","Porque el atacante no intenta robar información sensible"],"correcta":0,"porque_correcta":"La pasividad en los ataques on-path se define por la ausencia de alteración en la información interceptada, permitiendo que el tráfico siga su curso sin sospechas.","porque_incorrectas":["La ubicación lógica o física no determina si el ataque es activo o pasivo, sino la manipulación de los datos.","No es necesaria una conexión física; la posición lógica en la red es suficiente para interceptar.","El objetivo del ataque pasivo sí es robar credenciales; lo que no hace es alterar los datos en el proceso."],"refuerzo":"Imaginá a alguien mirando por la ventana de tu casa. No está entrando a robar muebles ni rompiendo nada, solo está observando lo que hacés. Eso es un ataque pasivo: la recolección de información sin alterar el entorno ni el mensaje, lo que lo hace mucho más difícil de detectar que alguien que entra a cambiar cosas de lugar.","concepto":"Ataques on-path","seccion":"13 Network Threats and Attacks","dom":"Security Operations and Incident Response","obj":"5.2","area":"Operaciones y monitoreo","dificultad":"media","tipo":"concepto","cita_pdf":"Passive On-Path Attacks are those where the attacker listens to the communication to gather sensitive information, such as login credentials, financial data, or personal information, without altering the data.","pagina":239,"fig":239},{"id":"q0176","pregunta":"Ante una situación donde un atacante utiliza engaños sociales en una conversación frente a frente para obtener datos que vos no deberías revelar, ¿a qué técnica se está enfrentando la organización?","opciones":["Phishing remoto mediante correo electrónico","Técnicas de suplantación de identidad (spoofing)","Elicitación para extracción de información","Ingeniería social mediante ataques de red"],"correcta":2,"porque_correcta":"La definición técnica para este tipo de interacción social destinada a extraer información mediante la manipulación del diálogo es 'elicitación'.","porque_incorrectas":["El phishing es digital y remoto; la pregunta especifica una conversación frente a frente.","El spoofing implica suplantar una identidad, no necesariamente extraer información mediante conversación.","Aunque es parte de la ingeniería social, la pregunta pide la técnica específica detallada en el texto para estas conversaciones, que es la elicitación."],"refuerzo":"La elicitación es como una 'pesca' de información. El atacante actúa como si fuera curioso o tuviera dudas para que vos sientas la necesidad de explicarle cosas que, en realidad, son confidenciales. No es una suplantación, es aprovechar tu disposición a ser amable o servicial para que vos mismo sueltes datos sin darte cuenta.","concepto":"Ingeniería social","seccion":"13 Network Threats and Attacks","dom":"Security Operations and Incident Response","obj":"5.2","area":"Operaciones y monitoreo","dificultad":"media","tipo":"aplicacion","cita_pdf":"Elicitation refers to subtle, face-to-face conversations designed to extract sensitive information without the target's knowledge.","pagina":238},{"id":"q0177","pregunta":"Un atacante utiliza una dirección IP falsa para hacerse pasar por otro dispositivo dentro de la red. ¿Qué objetivo principal busca al emplear esta táctica de spoofing?","opciones":["Ocultar el uso de software malicioso en el origen","Ganar la confianza del sistema o de la víctima","Aumentar el ancho de banda del ataque de red","Evitar el cifrado de las comunicaciones actuales"],"correcta":1,"porque_correcta":"El spoofing, en cualquiera de sus formas, busca explotar la confianza del receptor haciéndole creer que el origen es legítimo, facilitando el acceso o el engaño.","porque_incorrectas":["Aunque puede ayudar a ocultarse, el objetivo del spoofing es la suplantación para engañar, no la ocultación del malware en sí mismo.","El spoofing no aumenta la capacidad de red; es una técnica de engaño para el protocolo IP.","El spoofing no es una herramienta para romper el cifrado; de hecho, a menudo se usa como paso previo para ataques más complejos, pero no invalida el cifrado."],"refuerzo":"El spoofing es el equivalente digital a usar un uniforme falso para entrar a un edificio restringido. El guardia (el sistema) te deja pasar porque tu apariencia (la IP o el email) parece legítima. No busca cambiar la estructura del edificio, sino engañar al portero para ganar acceso o confianza.","concepto":"Spoofing","seccion":"13 Network Threats and Attacks","dom":"Security Operations and Incident Response","obj":"5.2","area":"Operaciones y monitoreo","dificultad":"facil","tipo":"analisis","cita_pdf":"Spoofing is a technique in which an attacker impersonates a legitimate person, organization, or system, to gain trust and deceive users or devices into believing that a communication is legitimate.","pagina":238},{"id":"q0178","pregunta":"¿Por qué el documento sugiere que una defensa fuerte no debería intentar ser 'todo a la vez' ni invulnerable en un solo punto?","opciones":["Porque los atacantes pueden detectar debilidades en sistemas demasiado complejos","Porque la verdadera fortaleza radica en capas múltiples de protección","Porque es más costoso implementar una única solución de seguridad","Porque los atacantes siempre evitan los sistemas con múltiples capas"],"correcta":1,"porque_correcta":"El texto enfatiza que la seguridad no viene de una tecnología única, sino de una cultura de múltiples capas que hace el ataque costoso y lento para el adversario.","porque_incorrectas":["La complejidad no es el factor que desaconseja la protección total, sino la ineficacia de confiar en una sola defensa.","El costo es una consideración, pero no es la razón fundamental por la que el documento aboga por las capas de seguridad.","Los atacantes no evitan capas múltiples; las capas múltiples sirven para detenerlos o detectarlos incluso si una parte de la defensa falla."],"refuerzo":"Pensá en un castillo: si solo tenés un muro muy grueso, una vez que alguien lo rompe, el castillo está perdido. En cambio, si tenés un foso, luego una muralla, y luego soldados dentro, el atacante tiene que esforzarse en cada etapa. La seguridad por capas busca que, si fallás en un punto, el atacante igual se encuentre con otro obstáculo, haciendo que el esfuerzo sea demasiado alto.","concepto":"Estrategias de defensa","seccion":"13 Network Threats and Attacks","dom":"Security Operations and Incident Response","obj":"5.2","area":"Operaciones y monitoreo","dificultad":"media","tipo":"analisis","cita_pdf":"Instead, it should be strong, with many layers of protection. Indeed, the main goal is to make any possible attack so hard, expensive, and slow that enemies are stopped or found long before they can do what they want.","pagina":265},{"id":"q0179","pregunta":"Un atacante utiliza un email que parece provenir de tu banco para solicitarte datos personales. ¿Qué característica común de las amenazas describe este ejemplo?","opciones":["La explotación de vulnerabilidades técnicas en el navegador","La utilización de la ingeniería social como vector principal","La manipulación de la confianza del usuario mediante spoofing","La ejecución de un ataque activo de tipo on-path"],"correcta":2,"porque_correcta":"El ejemplo describe una suplantación de identidad (spoofing) donde se explota la confianza del receptor al usar una fuente aparentemente legítima para engañar.","porque_incorrectas":["El ejemplo trata sobre el correo y la suplantación, no sobre explotar un bug en un software específico.","Aunque involucra ingeniería social, el documento categoriza específicamente esta técnica de email falso bajo spoofing por su objetivo de suplantación.","Un ataque on-path activo requiere estar en el medio de la comunicación, no es el caso de un simple email fraudulento."],"refuerzo":"Cuando alguien te manda un email que parece de tu banco (o tu proveedor de internet), está practicando el 'spoofing' de email. El atacante no está en tu red ni está alterando tus paquetes; simplemente está fingiendo ser alguien de confianza para que vos, por tu cuenta, le entregues los datos. Se basa en que vos confíes en el remitente.","concepto":"Spoofing","seccion":"13 Network Threats and Attacks","dom":"Security Operations and Incident Response","obj":"5.2","area":"Operaciones y monitoreo","dificultad":"media","tipo":"aplicacion","cita_pdf":"Each type exploits the trust of the recipient by masquerading as a legitimate source. Below are some common types of spoofing: Email spoofing allows an attacker to forge the sender's email address, making a fraudulent email appear to","pagina":238},{"id":"q0180","pregunta":"¿Qué aspecto fundamental debe comprender un profesional de ciberseguridad para anticipar y neutralizar amenazas de manera proactiva?","opciones":["La lista completa de todas las herramientas de hacking existentes","Las tácticas, objetivos y mecánicas que usan los atacantes","La capacidad de predecir el momento exacto del ataque","La automatización total de todas las respuestas de seguridad"],"correcta":1,"porque_correcta":"El documento resalta que entender la mecánica de los sistemas y las tácticas de los atacantes es crítico para la defensa proactiva y la gestión de riesgos.","porque_incorrectas":["Es imposible conocer todas las herramientas, que cambian constantemente; el foco debe estar en los principios y tácticas.","Predecir el momento es imposible; el enfoque es la preparación y el diseño de controles, no la predicción temporal.","La automatización es útil, pero el documento enfatiza el conocimiento y la cultura de seguridad, no solo herramientas automáticas."],"refuerzo":"No sirve de nada tener el mejor antivirus si no entendés qué está haciendo el atacante. Imaginalo como un médico: no puede curar solo viendo el síntoma, tiene que entender qué virus o bacteria está causando la enfermedad. En ciberseguridad, entender la táctica del atacante te permite poner el candado donde realmente importa, en lugar de intentar cerrar todo.","concepto":"Estrategias de defensa","seccion":"13 Network Threats and Attacks","dom":"Security Operations and Incident Response","obj":"5.2","area":"Operaciones y monitoreo","dificultad":"facil","tipo":"analisis","cita_pdf":"To effectively counter these threats, cybersecurity professionals must understand the mechanics of network systems and the tactics that attackers use to exploit them.","pagina":213},{"id":"q0181","pregunta":"¿Cuál es la relación principal entre el spoofing y los ataques on-path según el texto?","opciones":["El spoofing es siempre la fase final de un ataque on-path","El spoofing es una técnica común para facilitar los ataques on-path","El spoofing y los ataques on-path son nombres distintos para la misma técnica","Los ataques on-path son necesarios para ejecutar cualquier tipo de spoofing"],"correcta":1,"porque_correcta":"El documento menciona que los ataques on-path a menudo resultan de ataques de spoofing exitosos, ya que el spoofing permite al atacante posicionarse o suplantar identidades confiables.","porque_incorrectas":["No es el final; suele ser el comienzo o un habilitador para posicionarse.","Son técnicas distintas; una suplanta identidades (spoofing) y la otra intercepta tráfico (on-path).","El spoofing puede hacerse sin estar en el medio (por ejemplo, en un ema
