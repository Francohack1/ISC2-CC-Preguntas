do exclusivamente por la gerencia.","Porque los números de contacto deben ser aprobados por una entidad gubernamental externa."],"correcta":1,"porque_correcta":"Ante una interrupción, el contacto principal podría no estar disponible; tener redundancia en personas y medios es vital para garantizar la activación del plan.","porque_incorrectas":["La ubicación geográfica es irrelevante si la comunicación funciona, no es un requisito de diseño del BCP.","El BCP no es una responsabilidad exclusiva de la gerencia; requiere un equipo multidisciplinario bien definido.","No existe una normativa que obligue a que el gobierno valide los números de contacto del personal de una empresa privada."],"refuerzo":"Si el líder de tu equipo BCP tiene el celular apagado o está de vacaciones, ¿tu plan se detiene? La redundancia no es solo para servidores, es para personas. Debés tener un 'Plan B' para contactar a alguien si el principal no responde, usando distintos canales como teléfono, radio o mensajería.","concepto":"Componentes del BCP","seccion":"7 Business Continuity Planning","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"facil","tipo":"analisis","cita_pdf":"List of BCP team members, including multiple compensating contact methods and backup members.","pagina":97},{"id":"q0091","pregunta":"El Business Impact Analysis (BIA) es clave antes de escribir el BCP. ¿Qué define fundamentalmente a un BIA?","opciones":["El proceso técnico de configurar copias de seguridad para sistemas críticos.","Un análisis sistemático para evaluar los efectos de la interrupción en operaciones clave.","La lista de tareas que el equipo debe completar tras detectarse una falla.","Una auditoría financiera sobre los costos incurridos durante una caída de red."],"correcta":1,"porque_correcta":"El BIA se centra en evaluar el impacto (cuánto duele y qué tan grave es) sobre las operaciones críticas antes de intentar remediarlas.","porque_incorrectas":["El BIA no configura copias de seguridad; esa es una acción técnica posterior basada en sus resultados.","La lista de tareas (procedimientos) es parte del plan BCP, no del análisis de impacto previo.","El BIA evalúa impacto operativo y estratégico, no se limita a un recuento de costos financieros post-evento."],"refuerzo":"Antes de decidir cómo arreglar un auto averiado (el BCP), necesitás saber si el motor está fundido o si solo falta nafta (el BIA). El BIA es el diagnóstico que determina qué partes de la empresa son vitales y qué pasa si dejan de funcionar. Sin este diagnóstico, no podés priorizar qué arreglar primero.","concepto":"Business Impact Analysis","seccion":"7 Business Continuity Planning","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"facil","tipo":"concepto","cita_pdf":"A systematic process to evaluate the potential effects of an interruption to critical business operations","pagina":100},{"id":"q0092","pregunta":"Estás analizando la efectividad de una prueba tipo 'Parallel Test'. ¿Qué garantiza este enfoque en comparación con otros métodos?","opciones":["Que todos los datos del sistema principal se borran permanentemente al finalizar.","Que el sistema de respaldo puede operar eficientemente sin afectar la producción principal.","Que el personal de TI no necesita entrenamiento adicional para ejecutar el respaldo.","Que se detiene la producción real para verificar la integridad de los datos de backup."],"correcta":1,"porque_correcta":"El 'Parallel Test' permite comprobar la funcionalidad del sistema de respaldo mientras el principal sigue operando, asegurando una transición suave sin interrumpir la continuidad.","porque_incorrectas":["Borrar datos permanentemente destruiría la redundancia, lo cual es opuesto al objetivo de continuidad.","Esta prueba no elimina la necesidad de entrenamiento; de hecho, es una oportunidad para practicar.","La prueba en paralelo es precisamente para evitar detener la producción; si se detuviera, sería una prueba de corte (cutover) o falla."],"refuerzo":"Imaginá que tenés un generador eléctrico de respaldo. Una prueba en paralelo es encenderlo y ver si sostiene la carga de las luces mientras la red eléctrica principal sigue conectada. Si funciona, sabés que en un corte real la transición será invisible. No tenés que apagar la luz para probar que el generador funciona.","concepto":"Pruebas y validación BCP","seccion":"7 Business Continuity Planning","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"media","tipo":"analisis","cita_pdf":"Parallel Test involves running a subset of systems or processes in parallel with the primary production environment. The goal is to verify that the backup or redundant systems can operate correctly and efficiently without disrupting the main operations.","pagina":99},{"id":"q0093","pregunta":"La gerencia te pregunta qué incluye el BCP además de los procedimientos de respuesta. Según el texto, ¿qué elemento debe acompañar a la activación del plan?","opciones":["Los criterios que definen cuándo se debe activar oficialmente el plan.","Un presupuesto detallado de los gastos legales derivados del desastre.","El historial completo de auditorías de los últimos cinco años.","Una lista de proveedores que compiten en el mismo sector que la empresa."],"correcta":0,"porque_correcta":"El BCP debe especificar claramente los umbrales o situaciones (criterios) que disparan el plan para evitar activaciones erróneas o tardías.","porque_incorrectas":["El BCP no se centra en presupuestos legales, sino en la operativa.","El historial de auditorías es un registro de cumplimiento, no una parte operativa del BCP.","Tener una lista de competidores es irrelevante para la continuidad del negocio propio."],"refuerzo":"Si tenés una alarma contra incendios, no suena por cualquier humo; tiene un sensor calibrado (criterio). El BCP funciona igual: necesitás reglas claras sobre qué evento justifica gastar recursos en activar el plan, para no movilizar a toda la organización por una falla menor que se soluciona sola.","concepto":"Componentes del BCP","seccion":"7 Business Continuity Planning","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"facil","tipo":"concepto","cita_pdf":"The BCP must include the criteria that triggers its activation. These criteria are a list of","pagina":98},{"id":"q0094","pregunta":"Durante una auditoría de continuidad, encontrás que el BCP no se ha actualizado tras la migración de sistemas a la nube hace un año. ¿Qué fase del ciclo de vida del BCP se omitió o falló?","opciones":["La fase de Plan Development and Design.","La fase de Project and Scope planning.","La fase de Maintenance and Updating.","La fase de Information Gathering and Analysis."],"correcta":2,"porque_correcta":"La fase de mantenimiento y actualización es la responsable de asegurar que el plan refleje el entorno actual, incluyendo cambios tecnológicos como la migración a la nube.","porque_incorrectas":["El desarrollo y diseño ocurre al crear el plan, no necesariamente ante cambios evolutivos posteriores.","La planificación de alcance define qué se hará, pero no gestiona la evolución continua post-implementación.","La recolección de información es una fase previa; si el plan ya existía, el fallo está en no mantenerlo actualizado."],"refuerzo":"El BCP no es una foto, es una película. Si instalás un nuevo sistema (como la nube), tenés que volver al 'archivo' del plan y editarlo. Si no lo hacés, estás usando un manual de un sistema que ya no existe. La fase de mantenimiento es la que evita que tu plan se convierta en una pieza de museo.","concepto":"Ciclo de vida BCP","seccion":"7 Business Continuity Planning","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"media","tipo":"analisis","cita_pdf":"Maintenance and Updating | Continuously review and update the BCP to adapt to the business environment, new disruptions.","pagina":97},{"id":"q0095","pregunta":"Un banco decide realizar una prueba de continuidad para sus transacciones. Si el BCP requiere que un gerente específico tome control durante el desastre, ¿qué debe asegurar el BCP en su estructura?","opciones":["Que todos los empleados conozcan la contraseña maestra del gerente.","La designación clara de autoridad para los gerentes durante el evento.","Que se eliminen todas las jerarquías para acelerar la toma de decisiones.","La aprobación automática de cualquier transacción pendiente de validación."],"correcta":1,"porque_correcta":"El BCP debe definir explícitamente quién tiene la autoridad para tomar decisiones críticas, evitando vacíos de poder durante la crisis.","porque_incorrectas":["Compartir contraseñas maestras es un riesgo grave que invalida la seguridad del sistema.","Eliminar jerarquías en una crisis suele causar caos; se necesita una estructura clara de mando.","La aprobación automática sin control es un riesgo de fraude financiero inaceptable incluso en emergencias."],"refuerzo":"En una crisis, el caos es el peor enemigo. Si el edificio se está quemando, no podés ponerte a votar qué hacer. Necesitás que alguien diga: 'Vos hacés esto, vos hacés lo otro'. El BCP establece esa jerarquía de antemano para que todos sepan quién tiene la última palabra cuando las cosas se ponen difíciles.","concepto":"Componentes del BCP","seccion":"7 Business Continuity Planning","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"media","tipo":"aplicacion","cita_pdf":"Designation of authority for specific managers during such an event","pagina":97},{"id":"q0096","pregunta":"¿Qué aspecto de la ciberseguridad es el principal motor para que los profesionales del área deban dominar el ciclo de vida del BCP?","opciones":["La optimización de los costos de almacenamiento en la nube.","La necesidad de mantener la integridad y disponibilidad de sistemas esenciales.","El cumplimiento de las normativas de confidencialidad para clientes bancarios.","La reducción de tiempos de respuesta en el soporte técnico al usuario final."],"correcta":1,"porque_correcta":"Como profesionales de seguridad, el foco principal es asegurar que los sistemas críticos no solo sean seguros, sino que sigan funcionando (disponibilidad) cuando la empresa los necesita.","porque_incorrectas":["Los costos de almacenamiento son una gestión administrativa, no el propósito central de la continuidad.","La confidencialidad es vital, pero el BCP se enfoca específicamente en que el negocio pueda 'seguir operando' (disponibilidad).","El soporte al usuario es operativo y secundario frente a la supervivencia de los sistemas esenciales de la empresa."],"refuerzo":"Imaginá un sitio web de e-commerce. Si es muy seguro pero está caído, no sirve de nada. Vos, como profesional de seguridad, cuidás que la puerta tenga llave (integridad), pero también tenés que asegurar que si la puerta se rompe, el negocio pueda seguir vendiendo. Eso es disponibilidad.","concepto":"Importancia del BCP","seccion":"7 Business Continuity Planning","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"dificil","tipo":"analisis","cita_pdf":"Since cybersecurity professionals play a critical role in maintaining the integrity and availability of essential systems, they must understand the key metrics and the lifecycle behind the development and maintenance of a BCP.","pagina":93},{"id":"q0097","pregunta":"Cuando definís el alcance del BCP en la primera fase del ciclo de vida, ¿qué información esencial estás intentando consolidar?","opciones":["Los nombres de los empleados que serán despedidos tras una interrupción.","Los objetivos del plan, los recursos disponibles y los hitos temporales.","La lista de todas las herramientas de software a descartar por inseguras.","Las especificaciones técnicas de los servidores de backup a comprar."],"correcta":1,"porque_correcta":"La fase de planificación establece el marco de trabajo (qué buscamos, qué tenemos y cuánto tardaremos), esencial para cualquier proyecto de continuidad.","porque_incorrectas":["El BCP es para mantener la continuidad, no gestiona despidos ni recursos humanos de esa forma.","El BCP no es una lista de eliminación de software, sino de protección de procesos.","La compra de equipos es un detalle de implementación, no el objetivo estratégico del alcance inicial."],"refuerzo":"Antes de empezar cualquier viaje, tenés que definir: ¿a dónde voy?, ¿qué coche tengo? y ¿cuánta nafta me alcanza? Si no definís los objetivos (qué procesos proteger), los recursos y las fechas, el proyecto del BCP se dispersa y nunca llega a ser operativo.","concepto":"Ciclo de vida BCP","seccion":"7 Business Continuity Planning","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"media","tipo":"aplicacion","cita_pdf":"A document that outlines the objectives and scope of the BCP, identifies key stakeholders, determines available resources, and establishes timelines.","pagina":97},{"id":"q0098","pregunta":"En el contexto de la continuidad de negocio, ¿por qué es fundamental identificar las 'funciones esenciales' de la organización?","opciones":["Para recortar personal en departamentos que no generan ingresos directos.","Porque permiten priorizar qué procesos deben mantenerse operativos durante un desastre.","Para cumplir con el requerimiento de tener una lista de activos actualizada.","Porque facilitan la negociación con proveedores de servicios de terceros."],"correcta":1,"porque_correcta":"No todos los procesos tienen la misma importancia. El BCP debe proteger lo crítico primero para asegurar que el negocio sobreviva, lo cual se determina mediante la identificación de funciones esenciales.","porque_incorrectas":["El BCP no tiene como fin el recorte de personal, sino la resiliencia operativa.","La lista de activos es un inventario, el BCP requiere saber cuáles de esos activos son necesarios para la continuidad.","La negociación con proveedores es importante, pero no es el fin último de identificar funciones esenciales."],"refuerzo":"Si tenés que evacuar tu casa, primero agarrás el pasaporte y los medicamentos, no las revistas. Las 'funciones esenciales' son eso para la empresa: los procesos que, si se detienen, matan al negocio. El BCP es el plan para salvar lo que realmente importa primero.","concepto":"Importancia del BCP","seccion":"7 Business Continuity Planning","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"facil","tipo":"analisis","cita_pdf":"comprehensive assessment of the organization to identify essential services-those functions that are critical","pagina":93},{"id":"q0099","pregunta":"¿Qué rol juegan los call trees en un plan de continuidad bien diseñado?","opciones":["Automatizar el cierre de sesiones de usuario ante un evento de seguridad.","Alertar al personal que el BCP ha sido activado y está en efecto.","Proporcionar una lista de números de emergencia de la policía local.","Verificar la integridad de las bases de datos tras un desastre técnico."],"correcta":1,"porque_correcta":"Los sistemas de notificación y call trees son los mecanismos para comunicar eficientemente al equipo que la situación ha cambiado y que deben seguir los procedimientos del BCP.","porque_incorrectas":["Cerrar sesiones es una tarea técnica de IT, no un propósito de un árbol de llamadas.","Los números de emergencia son parte del plan, pero los call trees son para uso interno del equipo.","La integridad de bases de datos se verifica mediante auditorías o checksums, no mediante árboles de llamadas."],"refuerzo":"El 'árbol de llamadas' es una cadena de comunicación. Juan llama a Ana y Beto; Ana llama a Carla; Beto llama a Diego. Es una estructura diseñada para que, en minutos, todo el mundo sepa que el plan empezó, sin que el líder tenga que llamar a cien personas una por una.","concepto":"Componentes del BCP","seccion":"7 Business Continuity Planning","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"facil","tipo":"concepto","cita_pdf":"Emergency notification systems and call trees to alert personnel that the BCP is in effect","pagina":97},{"id":"q0100","pregunta":"Tenés que entrenar al personal como parte de la fase de implementación. ¿Cuál es el objetivo de esta capacitación en el BCP?","opciones":["Asegurar que cada empleado entienda sus roles específicos durante una interrupción.","Enseñar al personal nuevas técnicas de programación para mejorar los backups.","Capacitar a los empleados para actuar como soporte técnico de nivel 1.","Evaluar la eficiencia del personal en sus tareas habituales del día a día."],"correcta":0,"porque_correcta":"La implementación incluye preparar a las personas para que, cuando el plan se ejecute, sepan exactamente qué hacer, eliminando dudas y errores de coordinación.","porque_incorrectas":["El entrenamiento del BCP no busca mejorar habilidades técnicas generales como programación.","El BCP no es una capacitación para soporte técnico, es para manejo de crisis.","La evaluación de eficiencia diaria es una revisión de desempeño, no tiene que ver con la preparación ante desastres."],"refuerzo":"Podés tener el mejor plan del mundo, pero si el operador no sabe qué tecla tocar o quién debe liderar su equipo durante un fallo, el plan fracasa. La capacitación es para que, ante la crisis, el empleado actúe por instinto entrenado y no tenga que perder tiempo leyendo el manual.","concepto":"Ciclo de vida BCP","seccion":"7 Business Continuity Planning","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"media","tipo":"aplicacion","cita_pdf":"Allocating of resources, assigning roles and responsibilities, training staff, and integrating the BCP into daily operations.","pagina":97},{"id":"q0101","pregunta":"Si un banco sufre un corte en los sistemas de comunicación, ¿qué implica la 'Business Continuity' en ese escenario?","opciones":["Que el banco deja de operar hasta que se restaure la comunicación original.","Que se asegura que las funciones esenciales, como transacciones, continúen a un nivel aceptable.","Que todos los sistemas secundarios se apagan para priorizar la seguridad del edificio.","Que se notifica inmediatamente a todos los reguladores gubernamentales del país."],"correcta":1,"porque_correcta":"La continuidad de negocio no trata de evitar el desastre a toda costa, sino de garantizar que, a pesar de él, las funciones críticas sigan funcionando al nivel predefinido.","porque_incorrectas":["Detener la operación contradice el concepto mismo de continuidad de negocio.","Apagar sistemas secundarios puede ser parte de un plan de emergencia, pero no garantiza la continuidad operativa.","Notificar a los reguladores es un paso administrativo, pero no hace que las funciones de negocio sigan operando por sí mismas."],"refuerzo":"Continuidad no significa 'nada cambia'. Significa 'pese a que esto falló, sigo vendiendo/operando'. Imaginate un hospital que pierde la conexión a internet; su continuidad significa seguir atendiendo pacientes con registros en papel hasta que vuelva la red. El negocio no muere, se adapta.","concepto":"Importancia del BCP","seccion":"7 Business Continuity Planning","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"dificil","tipo":"analisis","cita_pdf":"DEFINITION Business continuity (BC) is the process by which an organization's operation plans for and responds to disruptions may hamper operations, ensuring that essential business functions continue at an acceptable, predefined level.","pagina":94},{"id":"q0102","pregunta":"Si un empleado de tu organización debe realizar una tarea técnica sumamente compleja durante un evento de desastre, ¿cuál de los siguientes documentos del DRP debería consultar para asegurar que no se omita ningún paso crítico?","opciones":["El resumen ejecutivo del plan","Los planes específicos del departamento","Las guías técnicas detalladas","Las listas de verificación específicas"],"correcta":3,"porque_correcta":"Las listas de verificación (checklists) están diseñadas precisamente para estructurar acciones complejas y garantizar que ningún paso sea omitido por el responsable.","porque_incorrectas":["El resumen ejecutivo se enfoca en una visión general para la gerencia, no en tareas técnicas.","Los planes departamentales definen responsabilidades generales, no pasos para tareas técnicas complejas.","Las guías técnicas ofrecen procedimientos, pero no garantizan la estructura de control paso a paso que provee una lista de verificación."],"refuerzo":"Imaginate que estás siguiendo una receta de cocina muy complicada: una lista de ingredientes no es lo mismo que una lista de control. La lista de control (checklist) es lo que evitá que te olvides de precalentar el horno o de agregar un ingrediente esencial en el momento justo, estructurando la ejecución de tareas críticas.","concepto":"Documentación de soporte DRP","seccion":"8 Disaster Recovery Plan","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"facil","tipo":"aplicacion","cita_pdf":"Specific checklists for certain individuals: who perform complex actions during the DRP and require a highly structured approach. To ensure that no steps are missed in highly complex tasks, checklists are created for individuals responsible for these actions.","pagina":104},{"id":"q0103","pregunta":"Después de desarrollar un DRP, ¿por qué es fundamental realizar pruebas periódicas aunque el plan parezca completo y bien diseñado?","opciones":["Para validar que los costos operativos sean mínimos","Para identificar debilidades y errores antes de una emergencia","Para asegurar que el personal nuevo conozca el plan técnico","Para cumplir estrictamente con auditorías externas anuales"],"correcta":1,"porque_correcta":"La realización de pruebas permite detectar omisiones o fallas en los procedimientos de recuperación antes de que se produzca un incidente real donde el fallo sería crítico.","porque_incorrectas":["El objetivo principal es la efectividad de la respuesta, no la optimización de costos en ese momento.","Aunque entrena al personal, ese es un subproducto del objetivo de identificar errores y brechas en el plan.","El cumplimiento es importante, pero el propósito operativo del DRP es garantizar la resiliencia, no solo pasar una auditoría."],"refuerzo":"Pensá en un simulacro de incendio: no lo hacés porque esperás que el edificio se queme mañana, sino para ver si las puertas de emergencia abren bien o si la gente sabe por dónde salir. Sin el simulacro, podrías descubrir que una puerta está bloqueada justo cuando más la necesitás.","concepto":"Importancia del testing DRP","seccion":"8 Disaster Recovery Plan","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"media","tipo":"analisis","cita_pdf":"Regular testing allows organizations to identify weaknesses and errors before they can cause real damage. In addition, testing helps prepare and train the organization's staff and personnel to effectively perform their assigned emergency tasks.","pagina":109},{"id":"q0104","pregunta":"Si tu organización necesita una solución de alta disponibilidad con dos instalaciones idénticas operando simultáneamente con datos en vivo, ¿qué tipo de sitio de recuperación deberías implementar?","opciones":["Un sitio espejo (Mirrored site)","Un sitio caliente (Hot site)","Un sitio templado (Warm site)","Un sitio frío (Cold site)"],"correcta":0,"porque_correcta":"El sitio espejo (o redundante) se define precisamente por mantener instalaciones idénticas operando en tiempo real.","porque_incorrectas":["El sitio caliente implica estar equipado, pero no necesariamente ser idéntico y operar en paralelo con datos en vivo.","El sitio templado requiere configuración adicional tras el desastre para estar operativo.","El sitio frío carece de equipamiento y requiere una configuración desde cero, lo que implica mayores tiempos de recuperación."],"refuerzo":"Imaginate que tenés dos espejos que reflejan exactamente lo mismo al mismo tiempo. Si uno se rompe, el otro ya tiene la imagen completa ahí. Así funciona un sitio espejo: ambos centros de datos procesan lo mismo, por lo que el cambio es instantáneo.","concepto":"Tipos de sitios recuperación","seccion":"8 Disaster Recovery Plan","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"facil","tipo":"concepto","cita_pdf":"Mirrored sites, also known as redundant sites, are a high availability disaster recovery solution where two identical facilities are fully equipped and operational simultaneously.","pagina":109},{"id":"q0105","pregunta":"Un auditor observa que el DRP de tu empresa cuenta con guías técnicas pero carece de listas de verificación. Basado en el documento, ¿qué riesgo operacional principal estás corriendo?","opciones":["Que los ejecutivos no comprendan el alcance del plan","Que se omitan pasos cruciales durante tareas complejas","Que no se definan los responsables por departamento","Que los sistemas no se sincronicen con el sitio alterno"],"correcta":1,"porque_correcta":"La falta de listas de verificación elimina la estructura necesaria para tareas complejas, lo que aumenta la probabilidad de omitir pasos vitales durante una crisis.","porque_incorrectas":["El resumen ejecutivo es lo que asegura que la alta dirección entienda el plan, no las listas de verificación.","Los responsables se definen en los planes específicos del departamento, no en las listas de verificación.","La sincronización técnica se aborda mediante guías y estrategias de replicación, no mediante listas de verificación paso a paso."],"refuerzo":"Las listas de verificación actúan como una red de seguridad cognitiva. Si tenés una guía técnica de 50 páginas, es muy fácil distraerse y saltarse una línea; la lista de verificación te obliga a confirmar cada punto, eliminando el error humano por descuido.","concepto":"Documentación de soporte DRP","seccion":"8 Disaster Recovery Plan","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"dificil","tipo":"analisis","cita_pdf":"To ensure that no steps are missed in highly complex tasks, checklists are created for individuals responsible for these actions.","pagina":104},{"id":"q0106","pregunta":"Al diseñar el DRP, decidís incluir un documento para los miembros ejecutivos de la organización. Según el texto, ¿qué información debe priorizarse en este resumen ejecutivo?","opciones":["Los pasos detallados para la configuración de hardware","La lista de contactos de todos los técnicos del departamento","Los objetivos a alcanzar para cada proceso de negocio","El costo detallado de mantener el sitio alternativo"],"correcta":2,"porque_correcta":"El resumen ejecutivo se centra en una visión de alto nivel que detalla qué objetivos deben cumplirse para cada proceso de negocio durante la recuperación.","porque_incorrectas":["Los pasos detallados de hardware pertenecen a las guías técnicas.","La lista de contactos es parte de los planes específicos por departamento.","El costo operativo es una métrica de gestión, pero no es el objetivo fundamental que detalla el resumen ejecutivo del DRP."],"refuerzo":"Imaginá que sos el CEO; no te importa qué cable enchufar primero, te importa saber qué procesos críticos deben estar andando para que la empresa no pierda plata. Ese es el rol del resumen ejecutivo: enfocar a los líderes en los resultados de negocio, no en los cables.","concepto":"Documentación de soporte DRP","seccion":"8 Disaster Recovery Plan","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"media","tipo":"concepto","cita_pdf":"Executive summary: provides a high-level overview of the plan for the executive members of the organization. It states the objectives that must be achieved for each business process within the organization.","pagina":104},{"id":"q0107","pregunta":"Tenés un sitio de recuperación que requiere instalación y configuración de equipos tras un desastre. ¿Qué desventaja competitiva enfrenta esta opción en comparación con un sitio caliente o espejo?","opciones":["Aumenta la probabilidad de incumplir los objetivos de tiempo de recuperación","Incrementa innecesariamente los costos de licencias de software","Dificulta la actualización de las guías técnicas del DRP","Requiere más personal capacitado para la ejecución"],"correcta":0,"porque_correcta":"Al requerir tareas de instalación y configuración de equipos, el tiempo necesario para estar operativo es mayor, lo que pone en riesgo el cumplimiento de los RTO (Recovery Time Objectives).","porque_incorrectas":["El costo suele ser menor comparado con sitios calientes, no mayor.","Las actualizaciones de guías son independientes del sitio físico elegido.","El personal requerido suele ser similar; el problema no es la capacidad del personal sino el tiempo que toma el proceso."],"refuerzo":"Es como intentar cocinar una cena: si ya tenés todo listo (sitio caliente), sirves rápido. Si tenés que ir a comprar los ingredientes y armar la cocina primero (sitio templado/frío), el tiempo pasa y tus clientes están esperando. Eso es lo que pasa con los objetivos de recuperación.","concepto":"Estrategias de recuperación sitios","seccion":"8 Disaster Recovery Plan","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"media","tipo":"analisis","cita_pdf":"middle ground, suitable for organizations with specialized hardware, but carries risks in meeting recovery time objectives due to the need for equipment installation and configuration.","pagina":109},{"id":"q0108","pregunta":"Después de un desastre, el DRP es activado. ¿Cuál de los siguientes elementos es fundamental para guiar las acciones del personal de un departamento específico?","opciones":["Un sitio de recuperación configurado remotamente","Una referencia a la guía técnica del departamento","El resumen ejecutivo completo de la organización","Una copia de las políticas de ciberseguridad corporativa"],"correcta":1,"porque_correcta":"Los planes específicos de cada departamento deben incluir la lista de personal responsable y una referencia a su guía técnica para guiar su actuación.","porque_incorrectas":["El sitio remoto es infraestructura, no una guía para las acciones del personal.","El resumen ejecutivo es para los líderes, no para guiar a los operarios de un departamento específico.","Las políticas de seguridad son generales y no contienen las instrucciones de recuperación departamentales necesarias en ese momento."],"refuerzo":"Cada equipo tiene sus herramientas y formas de trabajar. Cuando suena la alarma, cada área necesita sus propias instrucciones (como un mapa de su propio territorio) y no una instrucción genérica para toda la empresa que no entiende sus detalles técnicos particulares.","concepto":"Documentación de soporte DRP","seccion":"8 Disaster Recovery Plan","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"media","tipo":"aplicacion","cita_pdf":"Department-specific plans: similar to the executive summary, but department-specific. It may also include a list of department personnel responsible for carrying out the DRP and a reference to the department's technical guidance.","pagina":104},{"id":"q0109","pregunta":"Al actualizar un DRP después de una prueba, ¿por qué es común realizar cambios en los documentos de soporte técnicos?","opciones":["Porque las pruebas suelen revelar que el hardware quedó obsoleto","Porque el personal tiende a cambiar sus responsabilidades","Porque las pruebas verifican la precisión y posibles brechas en los procedimientos","Porque los objetivos de negocio deben alinearse con la nueva infraestructura"],"correcta":2,"porque_correcta":"Las pruebas exponen errores en los procedimientos escritos; al descubrirlos, es necesario actualizar las guías técnicas para que reflejen la realidad operativa.","porque_incorrectas":["El hardware puede quedar obsoleto, pero el foco del texto es la actualización por errores de procedimiento descubiertos durante el test.","El cambio de personal es administrativo, mientras que la actualización del DRP se centra en las guías técnicas del proceso.","La alineación de objetivos de negocio es una planificación previa, no el resultado directo de probar la ejecución técnica."],"refuerzo":"Una prueba es una auditoría de la realidad. Si escribiste que debías presionar el botón rojo para recuperar datos pero en la práctica el botón ya no está, la prueba te muestra que tu 'manual' está mal escrito. Por eso, post-prueba, es vital ajustar los manuales.","concepto":"Importancia del testing DRP","seccion":"8 Disaster Recovery Plan","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"media","tipo":"analisis","cita_pdf":"Since the DRP includes extensive technical documentation, testing also provides an ideal opportunity to update technical guides and","pagina":109},{"id":"q0110","pregunta":"En el contexto de la recuperación ante desastres, ¿cuál es la causa principal por la que los ciberprofesionales son responsables del DRP?","opciones":["Deben asegurar la disponibilidad de sistemas y datos","Deben gestionar el presupuesto de los sitios de recuperación","Deben coordinar la comunicación con los empleados","Deben asegurar que no haya incidentes de seguridad"],"correcta":0,"porque_correcta":"El rol fundamental de los profesionales de ciberseguridad en el DRP es garantizar la continuidad de la disponibilidad de sistemas y datos ante cualquier interrupción.","porque_incorrectas":["El presupuesto es una responsabilidad de la gerencia, no específicamente de los ciberprofesionales técnicos.","La comunicación interna suele recaer en recursos humanos o gestión de crisis, no en los responsables técnicos del DRP.","El objetivo es mitigar riesgos, no 'asegurar' que no habrá incidentes, lo cual es imposible."],"refuerzo":"La ciberseguridad no es solo poner una contraseña; es que el sistema esté disponible cuando lo necesitás. Si el sistema está 'seguro' pero nadie puede entrar porque no hay un DRP, entonces falló la disponibilidad, que es una pata fundamental de la tríada de seguridad.","concepto":"Rol del profesional ciberseguridad","seccion":"8 Disaster Recovery Plan","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"media","tipo":"concepto","cita_pdf":"Cybersecurity professionals play a crucial role in designing, improving, and testing the DRP, as they are typically responsible for ensuring the availability of systems and data.","pagina":103},{"id":"q0111","pregunta":"Si tenés que elegir un método de prueba para verificar tu DRP que involucre a toda la fuerza laboral y sea una reconstrucción completa de los procedimientos, ¿qué método seleccionarías?","opciones":["Ejercicios de mesa (Tabletop exercises)","Simulacros de escala completa (Full-scale drills)","Pruebas paralelas (Parallel testing)","Revisiones de documentos (Document reviews)"],"correcta":1,"porque_correcta":"Los simulacros de escala completa (drills) son los que permiten una re-enactuación total de los procedimientos de continuidad involucrando a gran parte del personal.","porque_incorrectas":["Los ejercicios de mesa son discusiones teóricas, no reconstrucciones completas en el lugar.","Las pruebas paralelas se centran en verificar sistemas operativos en sitios secundarios, no en la actividad de todo el personal.","Las revisiones son métodos estáticos y no involucran la acción de la fuerza laboral."],"refuerzo":"Un simulacro de escala completa es como el estreno de una obra de teatro: todos los actores están en el escenario haciendo sus partes. Es la única forma de ver si el libreto (tu DRP) funciona realmente cuando todos actúan a la vez.","concepto":"Tipos de testing DRP","seccion":"8 Disaster Recovery Plan","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"dificil","tipo":"aplicacion","cita_pdf":"Simulations are full re-enactments of business continuity procedures and can involve most, if not all, of your workforce.","pagina":102},{"id":"q0112","pregunta":"El documento menciona varios métodos de backup. ¿Cuál de los siguientes es una de las 4 estrategias principales descritas?","opciones":["Backup en la nube (Cloud backup)","Backup incremental","Backup de red (Network backup)","Backup espejo (Mirror backup)"],"correcta":1,"porque_correcta":"El backup incremental es una de las 4 estrategias principales citadas explícitamente en el resumen del documento.","porque_incorrectas":["La nube es un medio, no una de las 4 estrategias de método mencionadas.","El backup de red describe la ubicación o medio, no el método de copia.","El backup espejo no figura en la lista de las 4 estrategias principales (Full, Differential, Incremental, Snapshots)."],"refuerzo":"Los métodos de backup se diferencian por cuánto datos mueven y cuánto tardan en recuperarse. El incremental solo copia lo que cambió desde el último backup, siendo más rápido en ejecución pero requiriendo más pasos para reconstruir todo el historial.","concepto":"Estrategias de backup","seccion":"8 Disaster Recovery Plan","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"facil","tipo":"concepto","cita_pdf":"There are 4 main strategies for backup methods: Full, Differential, Incremental, and Snapshots.","pagina":111},{"id":"q0113","pregunta":"Cuando se produce una interrupción causada por un evento natural, el protocolo de recuperación debe activarse siguiendo un plan preaprobado. ¿Cómo se denomina técnicamente este plan?","opciones":["Protocolo de Continuidad de Negocio (BCP)","Plan de Recuperación ante Desastres (DRP)","Plan de Respuesta a Incidentes (IRP)","Protocolo de Restauración de Datos (DRP-S)"],"correcta":1,"porque_correcta":"El documento identifica explícitamente al plan preaprobado que sigue al protocolo de recuperación como el Disaster Recovery Plan (DRP).","porque_incorrectas":["El BCP es un plan más amplio de continuidad, pero el DRP es el nombre específico del documento de recuperación de sistemas.","El IRP se centra en la contención de incidentes de seguridad, no necesariamente en la recuperación de desastres totales.","El término DRP-S no existe como estándar de referencia en este documento."],"refuerzo":"Pensá en el DRP como tu manual de instrucciones para 'reconstruir'. Si tu casa sufre un desastre, el DRP es el plano arquitectónico que te dice exactamente qué pared levantar primero para que la estructura sea habitable de nuevo.","concepto":"Definición DRP","seccion":"8 Disaster Recovery Plan","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"facil","tipo":"concepto","cita_pdf":"The disaster recovery protocol should follow a pre-approved plan known as the Disaster Recovery Plan (DRP).","pagina":103},{"id":"q0114","pregunta":"Un sitio de recuperación se describe como una 'solución de nivel medio' para organizaciones con hardware especializado. ¿Por qué el documento sugiere que esta opción tiene riesgos asociados?","opciones":["Porque el hardware especializado es muy difícil de transportar y configurar","Porque los tiempos de recuperación pueden verse afectados","Porque requiere que el personal esté permanentemente en el sitio","Porque el costo de mantenimiento es superior al de un sitio caliente"],"correcta":1,"porque_correcta":"Esta solución, aunque adecuada para hardware especializado, depende de la instalación y configuración de equipos, lo cual introduce retrasos que ponen en riesgo los objetivos de tiempo de recuperación (RTO).","porque_incorrectas":["El problema no es la dificultad técnica, sino el tiempo que se consume en esa tarea.","El personal no tiene que estar ahí permanentemente, lo cual es justamente una diferencia con los sitios calientes.","El costo es generalmente más bajo, por eso es una solución de 'nivel medio' frente al sitio caliente o espejo."],"refuerzo":"Cuando tenés equipos muy específicos, no los podés tener prendidos y duplicados en todos lados por el costo. Pero al dejarlos 'a medio armar', el riesgo es que el tiempo que tardás en dejar todo operativo sea tan largo que la empresa pierda su ventana crítica de recuperación.","concepto":"Estrategias de recuperación sitios","seccion":"8 Disaster Recovery Plan","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"dificil","tipo":"analisis","cita_pdf":"middle ground, suitable for organizations with specialized hardware, but carries risks in meeting recovery time objectives due to the need for equipment installation and configuration.","pagina":109},{"id":"q0115","pregunta":"Al diseñar un DRP, ¿qué rol cumplen las guías técnicas, como el documento que explica la configuración de maquinaria en una planta de manufactura?","opciones":["Describir la estrategia de backups que usará el departamento","Ofrecer procedimientos paso a paso para configurar sistemas","Definir las responsabilidades del personal ante el desastre","Establecer los objetivos de alto nivel para los ejecutivos"],"correcta":1,"porque_correcta":"Las guías técnicas se definen específicamente por ofrecer procedimientos paso a paso para la configuración de la infraestructura y sistemas.","porque_incorrectas":["La estrategia de backups suele estar en los planes generales o técnicos de datos, no es el foco de la guía técnica de configuración.","La definición de responsabilidades se hace en los planes departamentales.","Los objetivos de alto nivel corresponden al resumen ejecutivo."],"refuerzo":"Una guía técnica es un manual de taller. Si tenés una máquina compleja, no querés que la persona sepa 'qué' debe hacer, querés que sepa 'cómo' conectarla, qué voltajes usar y qué botones apretar, paso a paso.","concepto":"Documentación de soporte DRP","seccion":"8 Disaster Recovery Plan","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"media","tipo":"concepto","cita_pdf":"Technical guides: offer step-by-step procedures for configuring systems within the infrastructure. An example of a technical guide is a document with the instructions for setting up machinery in a manufacturing facility.","pagina":104},{"id":"q0116","pregunta":"Al realizar una prueba de tipo 'walkthrough' (recorrido) para validar el DRP, ¿qué acción concreta realiza el personal?","opciones":["Ejecutan verbalmente los pasos de recuperación estipulados","Simulan el desastre completo involucrando a toda la empresa","Discuten teóricamente las vulnerabilidades del plan","Reemplazan los sistemas dañados por servidores de respaldo"],"correcta":0,"porque_correcta":"Los walkthroughs son ejercicios donde se lleva a cabo el recorrido de los pasos de recuperación de manera verbal, asegurando que todos entiendan el proceso sin ejecutarlo físicamente.","porque_incorrectas":["La simulación completa es un simulacro, no un walkthrough.","La discusión teórica es un ejercicio de mesa, que suele ser menos estructurado que un walkthrough.","El reemplazo físico es una acción de recuperación real o un full-drill, no un recorrido verbal."],"refuerzo":"Imaginate que estás haciendo un walkthrough de tu casa: caminás de una habitación a otra diciendo en voz alta 'acá cierro la ventana', 'acá prendo la luz'. No estás realmente cerrando nada, pero al decirlo en voz alta validás si el proceso tiene sentido lógico.","concepto":"Tipos de testing DRP","seccion":"8 Disaster Recovery Plan","dom":"Security Governance","obj":"2.2","area":"Redundancia, continuidad y recuperación","dificultad":"dificil","tipo":"aplicacion","cita_pdf":"Walkthroughs verbally carry out specific recovery steps stipulated in the business Continuity plan.","pagina":102},{"id":"q0117","pregunta":"Si un administrador de sistemas quiere aplicar el principio de 'Two-Person Control' para una operación crítica, ¿qué acción debería configurar en el sistema?","opciones":["Requerir que dos administradores distintos autoricen la ejecución de la acción.","Limitar el acceso a la cuenta solo durante el horario laboral estándar.","Dividir las responsabilidades entre dos departamentos diferentes del área IT.","Asegurar que el usuario tenga los permisos mínimos necesarios para la tarea."],"correcta":0,"porque_correcta":"El control de dos personas requiere explícitamente la intervención de dos individuos autorizados para completar una sola acción sensible, actuando como un mecanismo de supervisión.","porque_incorrectas":["Confunde el control de dos personas con la segregación de funciones, que es un concepto distinto.","Confunde el control de dos personas con una política de horario, lo cual no asegura la supervisión de la acción.","Confunde el control de dos personas con el principio de menor privilegio, que trata sobre la cantidad de permisos y no sobre la supervisión necesaria."],"refuerzo":"El 'Two-Person Control' es como el uso de dos llaves físicas para abrir una caja fuerte de alta seguridad donde ninguna persona tiene el control total. Imaginá que para lanzar un misil o realizar una transferencia millonaria, el sistema bloquea la acción hasta que una segunda persona ingresa su código de aprobación. Este mecanismo previene errores humanos graves o actos malintencionados al obligar a una verificación cruzada antes de que el cambio se haga efectivo.","concepto":"Two-Person Control","seccion":"9 Access Control","dom":"Identity and Access Management","obj":"3.1","area":"Ciclo de vida de identidades","dificultad":"media","tipo":"aplicacion","cita_pdf":"Two-person control takes this a step further by requiring the involvement of two authorized individuals to complete a single sensitive action.","pagina":125},{"id":"q0118","pregunta":"Si una empresa decide implementar una política donde el personal de TI tiene prohibido acceder a los registros financieros, ¿qué componente del control de acceso está configurando?","opciones":["Reglas que definen las condiciones de acceso entre sujetos y objetos.","Procesos de autenticación para verificar la identidad del personal.","Mecanismos de rendición de cuentas para auditar las acciones pasadas.","Protocolos de gestión de identidades para centralizar los privilegios."],"correcta":0,"porque_correcta":"Las reglas son las condiciones específicas que determinan si un sujeto tiene permiso para acceder a un objeto determinado, permitiendo o denegando la solicitud.","porque_incorrectas":["Confunde la definición de la política (regla) con el paso previo de identificar quién es la persona.","Confunde la restricción de acceso (regla) con la auditoría posterior al evento.","Confunde la configuración de permisos específicos con la gestión centralizada de identidades."],"refuerzo":"Las reglas actúan como el 'filtro' lógico en el sistema. Imaginalo como una lista de control en la puerta de un evento: 'Los invitados (sujetos) solo pueden entrar a la sala VIP (objeto) si tienen pulsera dorada (condición/regla)'. La regla no es la pulsera ni el invitado, sino la lógica que relaciona a ambos.","concepto":"Reglas de Acceso","seccion":"9 Access Control","dom":"Identity and Access Management","obj":"3.1","area":"Ciclo de vida de identidades","dificultad":"media","tipo":"aplicacion","cita_pdf":"The rules define the conditions under which a subject may access an object. They allow or deny a subject's request for an object by comparing attributes of the subject and the object.","pagina":116},{"id":"q0119","pregunta":"¿Cómo contribuye el principio de 'Need-to-Know' a la seguridad de la información?","opciones":["Asegurando que los empleados accedan solo a los recursos necesarios para sus funciones.","Exigiendo la firma de dos personas para modificar configuraciones críticas.","Verificando la identidad del usuario a través de múltiples factores de autenticación.","Documentando cada acceso realizado por los usuarios para facilitar futuras auditorías."],"correcta":0,"porque_correcta":"El principio de necesidad de saber limita los privilegios de los usuarios exclusivamente a lo requerido para sus funciones laborales, reduciendo el riesgo de exposición innecesaria.","porque_incorrectas":["Confunde el principio de necesidad de saber con el control de dos personas, que es otro principio operativo.","Confunde el concepto con la autenticación multifactor, que verifica la identidad pero no restringe el acceso al recurso.","Confunde el principio con la fase de accountability o rendición de cuentas."],"refuerzo":"Imaginá que en una oficina todos los archivos están en una estantería central. El principio de 'need-to-know' establece que el contador solo puede tomar la carpeta de impuestos, y el de recursos humanos solo la de contratos. Si alguien no tiene una razón laboral legítima para ver un documento, el sistema no le otorga acceso, aunque sea un empleado de la empresa.","concepto":"Need-to-Know","seccion":"9 Access Control","dom":"Identity and Access Management","obj":"3.1","area":"Ciclo de vida de identidades","dificultad":"media","tipo":"analisis","cita_pdf":"The need-to-know principle ensures that access to resources is granted only to those who need it to perform specific business functions.","pagina":125},{"id":"q0120","pregunta":"Un sistema de control de acceso falló al permitir que un usuario modifique datos que no le corresponden, a pesar de que el usuario estaba correctamente identificado. ¿Qué fase del control de acceso falló?","opciones":["Authorization.","Authentication.","Identification.","Accountability."],"correcta":0,"porque_correcta":"La autorización es la fase en la que se comprueba si el usuario tiene permiso para realizar una acción específica sobre un objeto, lo cual ocurrió incorrectamente en este caso.","porque_incorrectas":["El usuario ya estaba identificado, por lo tanto la autenticación (verificación de identidad) no fue el fallo principal.","El usuario fue identificado correctamente, por lo que la fase inicial no falló.","El fallo ocurrió durante el acceso, no durante el proceso posterior de registrar o auditar la actividad."],"refuerzo":"Podés saber perfectamente quién es alguien (autenticación), pero eso no significa que tenga permiso para hacer todo. Si un usuario se identifica correctamente ante el sistema, la fase de autorización debe filtrar qué acciones puede realizar. Fallar aquí significa que el sistema no 'revisó' si esa persona tenía los derechos legales para esa acción específica.","concepto":"Fases de Acceso","seccion":"9 Access Control","dom":"Identity and Access Management","obj":"3.1","area":"Ciclo de vida de identidades","dificultad":"dificil","tipo":"analisis","cita_pdf":"A control access system first identifies the subject, then verifies their permission to access the resource, and finally manages","pagina":116},{"id":"q0121","pregunta":"¿Qué aspecto de la triada de seguridad (CIA) se protege directamente mediante la segregación de funciones?","opciones":["Integridad, al prevenir que un solo individuo realice cambios no autorizados.","Confidencialidad, al ocultar información técnica a los usuarios no privilegiados.","Disponibilidad, al asegurar que varios usuarios puedan realizar la misma tarea.","Autenticidad, al confirmar la identidad de quien realiza cada paso del proceso."],"correcta":0,"porque_correcta":"La segregación de funciones reduce el riesgo de abuso al separar responsabilidades, evitando que alguien pueda modificar datos o procesos críticos sin supervisión, manteniendo la exactitud de los datos.","porque_incorrectas":["Aunque puede afectar la confidencialidad, su objetivo principal al separar roles es el control de procesos y la prevención de errores o fraudes en la integridad.","La segregación no busca redundancia, sino control, por lo que no garantiza disponibilidad.","La segregación de funciones se enfoca en los privilegios y responsabilidades, no en la validación de la identidad."],"refuerzo":"La segregación de funciones es como evitar que la misma persona que compra la materia prima sea también quien aprueba la factura y hace el pago. Al dividir el proceso en partes, es mucho más difícil manipular el sistema sin que alguien más se dé cuenta, asegurando que la información sea exacta y confiable (integridad).","concepto":"Segregation of Duties","seccion":"9 Access Control","dom":"Identity and Access Management","obj":"3.1","area":"Ciclo de vida de identidades","dificultad":"media","tipo":"analisis","cita_pdf":"This enforcement can be achieved either statically, by clearly defining conflicting roles that cannot be assigned to the same person, or dynamically, by enforcing controls at the time of access.","pagina":125},{"id":"q0122","pregunta":"En el contexto de los componentes del control de acceso, ¿qué ejemplo calificaría como un 'sujeto' en un entorno de red?","opciones":["Un script que consulta una base de datos para extraer métricas de rendimiento.","Un archivo de configuración que almacena credenciales de acceso al servidor.","Un perímetro físico que protege el acceso a los racks de servidores.","Un sistema de auditoría que registra los intentos fallidos de inicio de sesión."],"correcta":0,"porque_correcta":"Un sujeto es cualquier entidad activa, incluyendo procesos o scripts, que inicia una solicitud para acceder a un recurso.","porque_incorrectas":["El archivo de configuración es un recurso pasivo que se consulta, por lo tanto es un objeto.","Un perímetro físico es una barrera o parte del entorno del objeto, no el actor que inicia la solicitud.","El sistema de auditoría actúa como un mecanismo de gestión de acceso, no como el sujeto que solicita el recurso."],"refuerzo":"Cualquier cosa que 'haga' algo en el sistema —un usuario, un programa, un bot— es un sujeto. Si el elemento simplemente 'está ahí' para ser leído, modificado o utilizado (como un archivo o base de datos), es un objeto. Un script es un sujeto porque es un pedazo de código activo que toma la iniciativa de pedir información.","concepto":"Sujetos y Objetos","seccion":"9 Access Control","dom":"Identity and Access Management","obj":"3.1","area":"Ciclo de vida de identidades","dificultad":"facil","tipo":"aplicacion","cita_pdf":"A subject is a user, process, or device (e.g., a workstation or smartphone, or a database query) that initiates a request to access resources or services","pagina":115,"fig":115},{"id":"q0123","pregunta":"Cuando hablamos de 'Accountability' en las cuatro fases del control de acceso, ¿a qué nos referimos?","opciones":["Al registro y seguimiento de las acciones realizadas por los sujetos.","A la validación de que el sujeto es quien dice ser.","A la definición de permisos según las reglas del sistema.","A la restricción de privilegios basándose en necesidades de negocio."],"correcta":0,"porque_correcta":"La rendición de cuentas (accountability) implica trazar las acciones de vuelta a un sujeto para asegurar que sea responsable de lo que hace.","porque_incorrectas":["La validación del sujeto corresponde a la fase de autenticación.","La definición de permisos es la fase de autorización.","La restricción de privilegios es una aplicación de principios como el menor privilegio o necesidad de saber."],"refuerzo":"La rendición de cuentas es lo que permite responder a la pregunta '¿quién hizo esto?'. Sin esta fase, podrías tener seguridad, pero no podrías auditar errores o incidentes. Es el registro o log de actividad que vincula una acción específica con un usuario concreto en un momento determinado.","concepto":"Fases de Acceso","seccion":"9 Access Control","dom":"Identity and Access Management","obj":"3.1","area":"Ciclo de vida de identidades","dificultad":"facil","tipo":"concepto","cita_pdf":"We describe the four essential phases of access control: identification, authentication, authorization, and accountability","pagina":126},{"id":"q0124","pregunta":"¿Qué ocurre si una organización ignora la segregación de funciones al asignar privilegios administrativos?","opciones":["Un administrador único podría otorgar permisos elevados sin supervisión externa.","El sistema sería menos eficiente debido a la falta de automatización de roles.","La autenticación multifactor se volvería ineficaz ante ataques externos.","La disponibilidad de los servicios críticos disminuiría drásticamente."],"correcta":0,"porque_correcta":"La falta de segregación de funciones permite que un solo individuo controle procesos críticos, lo que aumenta el riesgo de uso indebido sin supervisión.","porque_incorrectas":["La segregación de funciones no impacta directamente en la eficiencia de la automatización.","La segregación no está vinculada a la efectividad de la autenticación.","La disponibilidad no es el objetivo principal del control de funciones, sino la integridad y el control de riesgos."],"refuerzo":"Cuando una sola persona tiene todos los permisos (crear cuentas, aprobar gastos, borrar logs), se elimina cualquier red de seguridad. Si esa persona comete un error grave o decide actuar maliciosamente, nadie puede detenerla. La segregación de funciones es el diseño organizacional que obliga a que 'varios ojos' miren las operaciones importantes.","concepto":"Segregation of Duties","seccion":"9 Access Control","dom":"Identity and Access Management","obj":"3.1","area":"Ciclo de vida de identidades","dificultad":"media","tipo":"analisis","cita_pdf":"This ensures that no single administrator can grant high-level access without oversight. This collaborative mechanism is particularly useful in scenarios where the potential consequences of a single unauthorized action... are too high to leave to a single individual.","pagina":125},{"id":"q0125","pregunta":"En un sistema que utiliza un modelo de 'privilegio mínimo', ¿cuál es la configuración de seguridad correcta para un nuevo usuario?","opciones":["Asignar inicialmente solo los permisos estrictamente necesarios para su función.","Otorgar acceso total temporalmente para que el usuario explore el sistema.","Proveer acceso a todos los recursos del departamento para evitar bloqueos.","Asignar permisos basados en los privilegios de un colega del mismo puesto."],"correcta":0,"porque_correcta":"El principio de menor privilegio establece que los sujetos deben tener solo los derechos mínimos necesarios para completar sus tareas, reduciendo el área de superficie de ataque.","porque_incorrectas":["Dar acceso total es lo opuesto a la seguridad, creando vulnerabilidades innecesarias.","Asignar acceso total a recursos de un departamento es ineficiente y contraviene el principio de necesidad de saber.","Copiar privilegios de un colega suele arrastrar permisos innecesarios (privilegios acumulados), ignorando las necesidades específicas del nuevo usuario."],"refuerzo":"El menor privilegio es como darle a un empleado solo las llaves de las puertas que realmente tiene que abrir, y no una llave maestra de todo el edificio. Si el usuario no necesita acceder a la base de datos financiera para hacer su trabajo, esa puerta debe permanecer cerrada para él, minimizando riesgos si su cuenta es comprometida.","concepto":"Menor Privilegio","seccion":"9 Access Control","dom":"Identity and Access Management","obj":"3.1","area":"Ciclo de vida de identidades","dificultad":"media","tipo":"aplicacion","cita_pdf":"These principles guide the assignment of privileges to users and objects to minimize the potential risk of privilege abuse.","pagina":126},{"id":"q0126","pregunta":"Al diseñar un sistema de control de acceso, ¿por qué los objetos se consideran 'pasivos'?","opciones":["Porque no generan peticiones de acceso ni inician acciones por sí mismos.","Porque almacenan la información pero no poseen reglas de seguridad propias.","Porque dependen de la autenticación previa para mostrar su contenido al usuario.","Porque solo pueden ser accedidos por un sujeto a la vez."],"correcta":0,"porque_correcta":"Los objetos son entidades pasivas ya que su función es contener o recibir información, esperando que un sujeto inicie la interacción.","porque_incorrectas":["Si bien es cierto que no tienen reglas propias (el sistema las tiene), eso no es lo que los define como pasivos; lo es su incapacidad de iniciar la petición.","La autenticación es una fase de control de acceso y no la razón de la pasividad del objeto.","El acceso concurrente a un objeto es posible, así que esto no es un criterio válido de pasividad."],"refuerzo":"Imaginá una base de datos. Por sí misma, no hace nada; no va a buscar a nadie, no inicia conexiones, simplemente espera a que un usuario o proceso (sujeto) le pregunte algo. Esa falta de 'intención' o iniciativa es lo que los expertos llaman 'pasivo'. Los objetos están a la espera de ser gestionados.","concepto":"Sujetos y Objetos","seccion":"9 Access Control","dom":"Identity and Access Management","obj":"3.1","area":"Ciclo de vida de identidades","dificultad":"facil","tipo":"analisis","cita_pdf":"Objects do not initiate actions or requests on their own and are therefore referred to as \"passive\".","pagina":116},{"id":"q0127","pregunta":"¿Qué diferencia sustancial existe entre 'Segregation of Duties' y 'Two-Person Control' según lo analizado en el texto?","opciones":["La segregación separa roles permanentemente, mientras el control de dos personas requiere colaboración en una acción puntual.","El control de dos personas es un método estático, mientras que la segregación de funciones siempre es un control dinámico.","La segregación de funciones protege datos financieros, mientras que el control de dos personas protege activos físicos.","El control de dos personas requiere que ambos individuos tengan los mismos permisos, mientras que la segregación requiere permisos distintos."],"correcta":0,"porque_correcta":"La segregación de funciones se enfoca en dividir privilegios de forma estática o dinámica para evitar concentrar poder, mientras que el control de dos personas es un mecanismo colaborativo específico para una acción sensible.","porque_incorrectas":["Es al revés: la segregación puede ser estática o dinámica, pero el control de dos personas es, por definición, un control dinámico de colaboración.","Ambos principios se aplican tanto a datos como a activos físicos o virtuales según la necesidad del negocio.","El control de dos personas no requiere que tengan los mismos permisos, sino que ambos estén autorizados para realizar esa tarea específica en ese momento."],"refuerzo":"La segregación es un diseño de estructura (quién tiene qué rol), mientras que el control de dos personas es una regla de operación (cómo se hace esta tarea específica). Podés tener segregación de funciones sin necesidad de dos personas, pero el control de dos personas es, en esencia, un refuerzo adicional donde no alcanza con un solo rol.","concepto":"Control y Segregación","seccion":"9 Access Control","dom":"Identity and Access Management","obj":"3.1","area":"Ciclo de vida de identidades","dificultad":"dificil","tipo":"analisis","cita_pdf":"While segregation of duties focuses on separating roles and privileges to prevent a single individual from having too much control, two-person control takes this a step further by requiring the involvement of two authorized individuals to complete a single sensitive action.","pagina":125},{"id":"q0128","pregunta":"Un sistema de control de acceso protege la 'Integridad' de los datos al:","opciones":["Evitar cambios no autorizados, garantizando la exactitud de la información.","Asegurar que los datos estén disponibles solo para usuarios con permiso.","Garantizar que el acceso sea rápido y eficiente para todo el personal.","Prevenir la divulgación de información sensible a individuos externos."],"correcta":0,"porque_correcta":"La integridad mantiene los datos precisos y consistentes impidiendo que personas no autorizadas realicen modificaciones no permitidas.","porque_incorrectas":["Esto describe la disponibilidad, no la integridad.","La eficiencia es una métrica de rendimiento, no un componente de seguridad de la triada CIA.","Esto describe la confidencialidad."],"refuerzo":"Integridad es sinónimo de confiabilidad. Si tenés una lista de precios, la integridad asegura que el precio no cambie a menos que alguien autorizado y con permiso específico lo haga. Si cualquiera pudiera entrar y modificar un número, la información dejaría de ser útil porque ya no podés confiar en su exactitud.","concepto":"Triada CIA","seccion":"9 Access Control","dom":"Identity and Access Management","obj":"3.1","area":"Ciclo de vida de identidades","dificultad":"facil","tipo":"concepto","cita_pdf":"Integrity is maintained by preventing unauthorized changes to data, thereby preserving its accuracy and consistency.","pagina":114},{"id":"q0129","pregunta":"En un entorno de Privileged Access Management (PAM), ¿qué comportamiento sería una mala práctica al gestionar cuentas administrativas?","opciones":["Permitir el uso de una cuenta administrativa compartida por múltiples usuarios sin control adicional.","Utilizar un sistema para auditar el uso de las cuentas de alto nivel periódicamente.","Limitar el tiempo de sesión de las cuentas con privilegios elevados.","Implementar autenticación multifactor para cualquier acceso a cuentas críticas."],"correcta":0,"porque_correcta":"Las cuentas compartidas dificultan la rendición de cuentas, ya que es imposible saber qué sujeto específico realizó una acción, violando principios fundamentales de acceso seguro.","porque_incorrectas":["Auditar es una práctica excelente para la fase de accountability.","Limitar el tiempo de sesión es una medida de mitigación de riesgos estándar en PAM.","La autenticación multifactor es una medida recomendada y altamente efectiva en la gestión de privilegios."],"refuerzo":"Las cuentas compartidas son un agujero negro de seguridad. Si 10 personas comparten la contraseña de 'admin', cuando alguien borra una base de datos, nadie puede determinar quién fue realmente. El PAM existe precisamente para evitar esto, dando a cada usuario una identidad única y auditada, incluso cuando necesitan privilegios administrativos.","concepto":"Privileged Access Management","seccion":"9 Access Control","dom":"Identity and Access Management","obj":"3.1","area":"Ciclo de vida de identidades","dificultad":"media","tipo":"aplicacion","cita_pdf":"We also cover different account types, such as user, privileged, guest, shared, and service accounts, with an emphasis on Privileged Access Management (PAM) for securing privileged accounts.","pagina":126},{"id":"q0130","pregunta":"Una empresa utiliza el principio de necesidad de saber (Need-to-Know). Si un empleado cambia de rol en la empresa, ¿cuál es el paso de seguridad más crítico que debe realizarse?","opciones":["Revisar y ajustar sus privilegios de acceso para adecuarlos exclusivamente a sus nuevas funciones.","Mantener sus accesos anteriores por si necesita ayuda en sus tareas pasadas.","Otorgarle nuevos permisos además de los antiguos para asegurar que no pierda productividad.","Limitar su acceso a la red interna para proteger los recursos que utilizaba anteriormente."],"correcta":0,"porque_correcta":"Dado que el principio de necesidad de saber limita el acceso a lo estrictamente necesario para la función actual, el acceso antiguo que ya no se requiere debe ser retirado inmediatamente.","porque_incorrectas":["Mantener accesos antiguos viola el principio del menor privilegio y acumula riesgos.","Otorgar permisos acumulativos sin limpiar los anteriores contradice el principio de Need-to-Know.","Limitar el acceso a la red interna no soluciona el exceso de privilegios sobre los recursos específicos, que es el punto central del Need-to-Know."],"refuerzo":"Es común ver 'acumulación de privilegios' cuando alguien cambia de puesto, donde mantiene acceso a todo lo que tenía antes más lo que necesita ahora. Esto es un error. En seguridad, cada vez que tu rol cambia, tu 'necesidad de saber' cambia. La limpieza de permisos antiguos es fundamental para mantener el sistema seguro y cumplir con el principio de menor privilegio.","concepto":"Need-to-Know","seccion":"9 Access Control","dom":"Identity and Access Management","obj":"3.1","area":"Ciclo de vida de identidades","dificultad":"media","tipo":"aplicacion","cita_pdf":"The need-to-know principle ensures that access to resources is granted only to those who need it to perform specific business functions.","pagina":125},{"id":"q0131","pregunta":"Al diseñar los protocolos para visitantes, ¿cuál es la razón principal para exigir un procedimiento estricto de identificación y registro?","opciones":["Para eliminar por completo la necesidad de escotas físicas dentro de las instalaciones.","Para generar una base de datos de marketing con la información personal de los visitantes.","Para gestionar eficazmente a quienes no figuran en la lista de personal autorizado.","Para que los sistemas de vigilancia biométrica puedan pre-cargar los datos del visitante automáticamente."],"correcta":2,"porque_correcta":"La gestión de visitantes es el filtro necesario para quienes carecen de credenciales permanentes, permitiendo controlar quién entra y con qué propósito.","porque_incorrectas":["Es al revés: muchas veces el protocolo exige el registro precisamente para definir la necesidad de un escolta.","La seguridad no se diseña con fines de marketing; esta opción confunde el objetivo de control con fines comerciales ajenos.","La biometría requiere registro previo y específico; el registro manual no 'pre-carga' necesariamente un sistema biométrico de manera universal."],"refuerzo":"Imaginá que tenés un edificio lleno de empleados con acceso por tarjeta. ¿Qué pasa con el repartidor o el entrevistado? No tienen tarjeta. Si no tenés un proceso de registro (nombre, empresa, a quién visita), perdiste la visibilidad. Ese registro es el 'ancla' que te permite saber, si hay un incidente, quién estuvo en el edificio y bajo qué responsabilidad. Es una medida básica de accountability.","concepto":"Gestión de visitantes","seccion":"10 Physical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"facil","tipo":"concepto","cita_pdf":"Sign-in and photo-ID verification helps manage visitors who are not on the authorized personnel list. The organization must establish control procedures for visitors.","pagina":136},{"id":"q0132","pregunta":"En un entorno de alta seguridad donde se requiere auditar quién entró a una sala, ¿por qué es recomendable usar sistemas de insignias (badges) electrónicos?","opciones":["Porque garantizan que los intrusos no puedan copiar las señales de radiofrecuencia de la insignia.","Porque permiten una gestión centralizada y crean registros de acceso automáticos.","Porque eliminan totalmente la necesidad de contratar guardias de seguridad en las entradas.","Porque son el único método capaz de verificar la identidad física del portador sin fallos."],"correcta":1,"porque_correcta":"La ventaja técnica de los sistemas electrónicos radica en la automatización del log (registro) y la centralización, facilitando la auditoría de seguridad.","porque_incorrectas":["Es falso: los sistemas de tarjetas pueden ser clonados o ser objeto de ataques de radiofrecuencia si no están bien protegidos.","No eliminan la necesidad de guardias; los sistemas deben correlacionarse con otros controles (como guardias o alarmas) para una seguridad integral.","No son infalibles; una insignia puede ser robada y usada por otra persona, por lo que no verifican la identidad con la certeza de un biométrico."],"refuerzo":"Imaginá tener que revisar un libro de papel al final del mes para ver quién entró a la sala de servidores. Sería una pesadilla de datos. Un sistema electrónico hace eso solo: 'Juan entró a las 14:05, puerta Sur'. Además, si Juan pierde su insignia, la das de baja desde tu PC sin cambiar la cerradura. Esa capacidad de gestión centralizada es lo que los hace indispensables en organizaciones grandes.","concepto":"Sistemas de insignias","seccion":"10 Physical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"facil","tipo":"aplicacion","cita_pdf":"Electronic badge systems simplify facility access control enabling centralized authorization management and automatic log creation.","pagina":142},{"id":"q0133","pregunta":"Cuando una organización define perimetros de seguridad, ¿cómo clasificarías la estrategia de implementar medidas en los 'Work Area Perimeters'?","opciones":["Como una medida de control de acceso para disuadir, detectar y retrasar a intrusos externos antes de llegar al edificio.","Como una estrategia de protección de activos críticos dentro del edificio, incluyendo oficinas y zonas de uso diario.","Como la capa final de seguridad que reemplaza a los controles de perímetro exterior e interior.","Como un procedimiento exclusivamente dedicado a gestionar la disposición final de documentos confidenciales."],"correcta":1,"porque_correcta":"Los perímetros de área de trabajo se enfocan en proteger los espacios donde ocurre la actividad diaria (oficinas, salas), minimizando la exposición de información sensible en el entorno de trabajo.","porque_incorrectas":["Confunde el área de trabajo con el perímetro de seguridad externo: las medidas de 'disuadir, detectar y retrasar' son más propias de perímetros exteriores.","Es incorrecto jerárquicamente: no reemplaza a los otros perímetros, sino que es una capa adicional de defensa dentro de la estructura de seguridad.","Si bien incluye la gestión de documentos, es una parte de una estrategia más amplia que involucra bloqueos, políticas de escritorio limpio y controles de acceso personal/visitante; no se limita a la trituración de papel."],"refuerzo":"Pensá en las capas de una cebolla. El perímetro exterior es la cerca del estacionamiento; el interior es la puerta principal; el 'Work Area' es la puerta de tu departamento u oficina. Es donde pasás el día trabajando. Aquí la seguridad se vuelve más sutil: políticas de 'escritorio limpio', cerraduras en cajones o gestión de impresoras. No evitás que entren al edificio, evitás que vean información confidencial en tu mesa cuando te levantás.","concepto":"Perimetros de seguridad","seccion":"10 Physical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"media","tipo":"analisis","cita_pdf":"Protecting work area perimeters is essential to maintaining organizational security, as these spaces, including offices, meeting rooms, and common areas, are used for daily activity. Security measures include physical controls such as door and equipment locks, policies promoting a clean desk environment","pagina":133},{"id":"q0134","pregunta":"¿Qué elemento permite la correlación de múltiples controles para mejorar la visibilidad de los eventos de acceso en una instalación?","opciones":["La integración de guardias de seguridad, logs de acceso, cámaras y sistemas de alarma.","El uso exclusivo de biometría, ya que centraliza toda la información de entrada.","La implementación de una política de escritorio limpio y la destrucción de documentos.","La instalación de una valla perimetral alrededor del edificio principal."],"correcta":0,"porque_correcta":"La seguridad física efectiva requiere que el profesional de ciberseguridad combine diversas capas (guardias, logs, cámaras, alarmas) para tener una visión completa.","porque_incorrectas":["La biometría es solo un método de autenticación; por sí sola no correlaciona eventos como lo hace un sistema de seguridad integrado.","La política de escritorio limpio protege la información interna pero no ayuda a correlacionar eventos de acceso o monitorear intrusiones en la instalación.","Una valla perimetral es un control físico, pero es una medida estática y no proporciona por sí sola el registro o la correlación de eventos necesaria para la auditoría."],"refuerzo":"Imaginá que suena una alarma de puerta abierta. ¿Alguien entró? Mirás el log de la tarjeta: no hay registro. Mirás la cámara: ves a alguien forzando la puerta. El guardia llega y detecta el incidente. Si tenés estos sistemas separados, nunca sabés qué pasó. Al correlacionarlos, tenés una historia completa. La seguridad robusta nunca depende de un solo control, sino de cómo 'hablan' entre ellos para darte un panorama claro.","concepto":"Correlación de controles","seccion":"10 Physical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"media","tipo":"analisis","cita_pdf":"Therefore, cybersecurity professionals should correlate several physical access controls, such as security guards, access logs, security cameras, and alarm systems, to better monitor physical access control.","pagina":140},{"id":"q0135","pregunta":"¿Por qué los sistemas biométricos son considerados una forma avanzada de control de acceso respecto a los sistemas basados en tarjetas?","opciones":["Porque permiten una gestión de logs más sencilla para los administradores de red.","Porque utilizan características únicas imposibles de transferir o falsificar fácilmente.","Porque eliminan la necesidad de tener personal de seguridad monitoreando las entradas.","Porque ofrecen una mejor velocidad de procesamiento de visitantes desconocidos."],"correcta":1,"porque_correcta":"La superioridad de la biometría radica en que vincula el acceso a algo inherente a la persona (físico), eliminando el riesgo de que el medio de acceso sea prestado o robado.","porque_incorrectas":["La gestión de logs no es necesariamente más sencilla; de hecho, puede ser más compleja técnicamente debido al manejo de datos sensibles.","La biometría no reemplaza al personal de seguridad; siempre es necesaria una supervisión, especialmente ante fallos del sistema.","La biometría suele ser más lenta en el procesamiento de nuevos usuarios (que deben registrar sus datos) comparado con una tarjeta o un documento de identidad."],"refuerzo":"Pensá en la diferencia entre tener una llave de tu casa y ser 'tú' la llave. Si alguien te roba la llave, entra. Si alguien te roba la huella... bueno, es mucho más difícil. La biometría asegura que *vos* estuviste ahí. Por eso, en zonas de alta seguridad, no alcanza con tener una credencial; necesitas algo que sea parte de tu identidad física, lo cual es inalterable y no se puede 'prestar' a un amigo para que entre en tu lugar.","concepto":"Sistemas biométricos","seccion":"10 Physical Access Controls","dom":"Identity and Access Management","obj":"3.2","area":"Control de acceso lógico","dificultad":"media","tipo":"concepto","cita_pdf":"Biometric systems verify identity through unique physical characteristics of individuals, such as fingerprints or facial recognition, that cannot be easily transferred or forged.","pagina":143},{"id":"q0136","pregunta":"Si un guardia de seguridad está monitoreando un ingreso, ¿cuál es su función principal como detector de incidentes?","opciones":["Crear un registro detallado en el log de acceso cada vez que se abre la puerta principal.","Identificar comportamientos sospechosos o brechas de seguridad en tiempo real.","Gestionar el mantenimiento preventivo de las cámaras de video vigilancia (CCTV).","Configurar las reglas de acceso centralizado para el personal autorizado."],"correcta":1,"porque_correcta":"La función del guardia como detector es la observación activa para identificar anomalías o comportamientos no permitidos mientras ocurren.","porque_incorrectas":["Aunque el guardia mantiene logs, eso es una func
